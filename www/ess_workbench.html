<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESS Workbench</title>
    
    <!-- Google Fonts - JetBrains Mono for code, IBM Plex Sans for UI -->
    <link href="/fonts/fonts.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/ess_workbench.css">
    <link rel="stylesheet" href="css/DGTableViewer.css">
    <link rel="stylesheet" href="css/ess_workbench_registry.css">
    <link rel="stylesheet" href="css/ess_statemap.css">
    <link rel="stylesheet" href="css/ess_scriptsbrowser.css">
    <style>
     /* Libs sidebar divider */
     .scripts-sidebar-divider {
         padding: 8px 12px 4px;
         margin-top: 4px;
         border-top: 1px solid var(--wb-border, #333);
     }
     .scripts-sidebar-divider-label {
         font-size: 10px;
         font-weight: 600;
         text-transform: uppercase;
         letter-spacing: 0.05em;
         color: var(--wb-text-muted, #888);
     }

     /* Lib items — subtler than system scripts */
     .script-item.lib-item {
         padding: 4px 12px 4px 16px;
         font-size: 11px;
         opacity: 0.7;
     }
     .script-item.lib-item:hover {
         opacity: 1;
     }
     .script-item.lib-item.active {
         opacity: 1;
     }
     .lib-name {
         flex: 1;
         min-width: 0;
         overflow: hidden;
         text-overflow: ellipsis;
         white-space: nowrap;
     }
     .lib-version {
         font-size: 9px;
         color: var(--wb-text-muted, #666);
         background: var(--wb-bg-hover, rgba(255,255,255,0.05));
         padding: 1px 5px;
         border-radius: 3px;
         flex-shrink: 0;
     }
     .script-item.lib-item.active .lib-version {
         color: var(--wb-accent, #6ea4e0);
         background: rgba(110, 164, 224, 0.1);
     }
    </style>
</head>
<body>
    <div class="workbench-container">
        <!-- Top Navigation Bar -->
        <header class="workbench-header">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
                        <line x1="12" y1="22" x2="12" y2="15.5"></line>
                        <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
                    </svg>
                </div>
                <span class="brand-text">ESS Workbench</span>
            </div>
            
            <nav class="header-tabs">
                <button class="tab-btn active" data-tab="dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    Dashboard
                </button>
                <button class="tab-btn" data-tab="statemap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="6" cy="5" r="2.5"></circle>
                        <circle cx="18" cy="12" r="2.5"></circle>
                        <circle cx="6" cy="19" r="2.5"></circle>
                        <path d="M8.5 5h5a2 2 0 0 1 2 2v2.5"></path>
                        <path d="M15.5 14.5V17a2 2 0 0 1-2 2h-5"></path>
                    </svg>
                    State Map
                </button>
                <button class="tab-btn" data-tab="loaders">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="3" y1="15" x2="21" y2="15"></line>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                    Loaders
                </button>
                <button class="tab-btn" data-tab="scripts">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    Scripts
                </button>
            </nav>
            
            <div class="header-right">
                <!-- User selector -->
                <div class="header-user">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <select id="user-select">
                        <option value="">Select user...</option>
                    </select>
                </div>
                
                <div class="connection-indicator" id="connection-indicator">
                    <span class="indicator-dot"></span>
                    <span class="indicator-text">Disconnected</span>
                </div>
                <div class="mesh-selector" id="mesh-selector"></div>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="workbench-main">
            <!-- Dashboard Tab -->
            <div class="tab-content active" id="tab-dashboard">
                <!-- Configuration Hero -->
                <div class="config-hero">
                    <div class="config-identity">
                        <span class="config-project" id="cfg-project">—</span>
                        <span class="config-sep">/</span>
                        <span class="config-system" id="cfg-system">—</span>
                        <span class="config-sep">/</span>
                        <span class="config-protocol" id="cfg-protocol">—</span>
                    </div>
                    <div class="config-details">
                        <div class="config-detail">
                            <span class="config-detail-label">Variant</span>
                            <span class="config-detail-value" id="cfg-variant">—</span>
                        </div>
                        <div class="config-detail">
                            <span class="config-detail-label">Subject</span>
                            <span class="config-detail-value" id="cfg-subject">—</span>
                        </div>
                        <div class="config-detail">
                            <span class="config-detail-label">Version</span>
                            <span class="config-detail-value config-version" id="cfg-version">—</span>
                        </div>
                    </div>
                </div>

                <!-- System/Protocol Navigator -->
                <div class="dashboard-navigator" id="dashboard-navigator">
                    <div class="dashboard-nav-columns">
                        <div class="dash-column">
                            <div class="dash-column-header">
                                <span class="dash-column-title">Systems</span>
                            </div>
                            <div class="dash-systems-list"></div>
                        </div>
                        <div class="dash-column">
                            <div class="dash-column-header">
                                <span class="dash-column-title dash-protocols-header-text">Protocols</span>
                            </div>
                            <div class="dash-protocols-list"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- State Map Tab -->
            <div class="tab-content" id="tab-statemap">
                <div class="statemap-layout">
                    <div class="statemap-canvas" id="statemap-canvas">
                        <svg id="statemap-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                        <div class="statemap-empty" id="statemap-empty">No system loaded</div>
                    </div>
                    <div class="statemap-divider" id="statemap-divider" title="Drag to resize"></div>
                    <aside class="statemap-side" id="statemap-side">
                        <div class="statemap-hero" id="statemap-hero">—</div>
                        <div class="statemap-chips" id="statemap-chips"></div>
                        <div id="statemap-live"></div>
                        <div class="statemap-detail" id="statemap-detail"></div>
                        <div class="statemap-trail" id="statemap-trail"></div>
                    </aside>
                </div>
            </div>

            <!-- Variants Tab -->
            <div class="tab-content" id="tab-loaders">
                <div class="loaders-editor">
                    <!-- Mini Hero -->
                    <div class="tab-hero">
                        <div class="tab-hero-identity">
                            <span class="tab-hero-project" id="loaders-hero-project">—</span>
                            <span class="tab-hero-sep">/</span>
                            <span class="tab-hero-system" id="loaders-hero-system">—</span>
                            <span class="tab-hero-sep">/</span>
                            <span class="tab-hero-protocol" id="loaders-hero-protocol">—</span>
                        </div>
                    </div>

                    <!-- Toolbar -->
                    <div class="loaders-toolbar">
                        <div class="loaders-toolbar-left">
                            <div class="loaders-selector">
                                <label class="loaders-selector-label">Loader:</label>
                                <select id="loader-select" class="loader-select">
                                    <option value="">— select loader —</option>
                                </select>
                            </div>
                            <button class="btn btn-sm" id="loader-run-btn" disabled>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                Run
                            </button>
                            <span class="loaders-run-status" id="loader-run-status"></span>
                        </div>
                    </div>

                    <!-- Args + result table -->
                    <div class="loaders-split loaders-split-lab">
                        <!-- Results Panel (Right) -->
                        <div class="loaders-result-panel">
                            <!-- Arguments -->
                            <div class="loaders-args-panel" id="loader-args-panel">
                                <div class="loaders-args-header">
                                    <span class="loaders-args-title">Arguments</span>
                                    <button class="btn btn-xs" id="loader-args-reset-btn" title="Reset to defaults">Reset</button>
                                </div>
                                <div class="loaders-args-body" id="loader-args-body">
                                    <div class="loaders-args-empty">Select a loader to see its arguments</div>
                                </div>
                            </div>

                            <!-- Table Viewer -->
                            <div class="loaders-table-panel">
                                <div class="loaders-table-header">
                                    <span class="loaders-table-title">stimdg</span>
                                    <span class="loaders-table-info" id="loader-table-info"></span>
                                </div>
                                <div class="loaders-table-body" id="loader-table-container">
                                    <div class="loaders-table-empty">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="3" y1="9" x2="21" y2="9"></line>
                                            <line x1="9" y1="3" x2="9" y2="21"></line>
                                        </svg>
                                        <span>Run a loader to see the trial table</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Console -->
                    <div class="loaders-console" id="loader-console">
                        <div class="loaders-console-header">
                            <span class="loaders-console-title">Console</span>
                            <span class="loaders-console-count" id="loader-error-count"></span>
                            <div class="loaders-console-actions">
                                <button class="btn btn-xs" id="loader-console-clear-btn">Clear</button>
                            </div>
                        </div>
                        <div class="loaders-console-body" id="loader-console-output"></div>
                    </div>
                </div>
            </div>

            <!-- Scripts Tab -->
            <!-- Scripts Tab (read-only browser: source, history, diffs) -->
            <div class="tab-content" id="tab-scripts">
                <div class="sb-layout">
                    <nav class="sb-files" id="sb-files"></nav>
                    <div class="sb-main">
                        <div class="sb-toolbar">
                            <span class="sb-filename" id="sb-filename">—</span>
                            <span class="sb-dirty-note" id="sb-dirty-note" hidden
                                  title="This file differs from its last-synced base — see the Sync modal to push">unpushed changes</span>
                            <div class="sb-view-switch">
                                <button class="btn btn-sm sb-view-btn active" data-view="source" id="sb-view-source">Source</button>
                                <button class="btn btn-sm sb-view-btn" data-view="diff" id="sb-view-diff"
                                        title="Unified diff of the local file against the cloud copy">Local vs cloud</button>
                            </div>
                        </div>
                        <div class="sb-content">
                            <div id="sb-editor"></div>
                            <div id="sb-diffpane" class="sb-diffpane" hidden></div>
                            <div id="sb-placeholder" class="sb-placeholder" hidden></div>
                        </div>
                    </div>
                    <div class="sb-divider" id="sb-divider" title="Drag to resize"></div>
                    <aside class="sb-history" id="sb-history-pane">
                        <div class="sb-history-title">History <span class="sb-history-sub">(cloud versions)</span></div>
                        <div id="sb-history"></div>
                    </aside>
                </div>
            </div>

        </main>
        
        <!-- Footer Status Bar -->
        <footer class="workbench-footer">
            <div class="footer-left">
                <span class="footer-item" id="snapshot-time">Last updated: --</span>
            </div>
            <div class="footer-center">
                <span class="footer-item registry-status" id="registry-status">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
                    </svg>
                    <span>Registry: —</span>
                </span>
            </div>
            <div class="footer-right">
                <span class="footer-item">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span id="clock">--:--:--</span>
                </span>
            </div>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script src="js/TclParser.js"></script>
    <script src="js/TclFormatter.js"></script>
    <script src="js/TclLinter.js"></script>
    <script src="js/TclEditor.js"></script>
    <script src="js/ws_manager.js"></script>
    <script src="js/DatapointManager.js"></script>
    <script src="js/DGTableViewer.js"></script>
    <script src="js/ess_workbench.js"></script>
    <script src="js/ess_overlay_plugin.js"></script>
    <script src="js/ess_statemap_plugin.js"></script>
    <script src="js/ess_scriptsbrowser_plugin.js"></script>
    <script src="js/ess_dashboard_plugin.js"></script>
</body>
</html>
