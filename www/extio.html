<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extio boxes</title>
<link rel="stylesheet" href="css/page_nav.css">
<style>
  :root {
    --bg: #16181d; --card: #21252c; --card-edge: #2e343d; --ink: #e8eaed;
    --muted: #9aa3af; --faint: #6b7280; --green: #4ade80; --blue: #60a5fa;
    --amber: #fbbf24; --red: #f87171; --off: #3a4048;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 22px;
           border-bottom: 1px solid var(--card-edge); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header a { color: var(--faint); text-decoration: none; font-size: 12px; }
  header a:hover { color: var(--muted); }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               background: var(--off); margin-right: 6px; }
  #conn.ok .dot { background: var(--green); }
  #conn.bad .dot { background: var(--red); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
          gap: 16px; padding: 20px; }
  #empty { color: var(--faint); padding: 60px 24px; text-align: center; }
  #empty code { color: var(--muted); }

  .box { background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px;
         padding: 14px 16px; }
  .box.offline { opacity: 0.45; }
  .box .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .box .name { font-size: 16px; font-weight: 600; }
  .live { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .live.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 9px; background: var(--off);
          color: var(--muted); white-space: nowrap; }
  .chip.eth { background: #14351f; color: var(--green); }
  .chip.usb { background: #17293f; color: var(--blue); }
  .chip.wdg { background: #3f1d1d; color: var(--red); }
  .obs { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 8px;
         border-radius: 9px; background: var(--off); color: var(--faint); transition: all 120ms; }
  .obs.on { background: #14351f; color: var(--green); box-shadow: 0 0 8px rgba(74,222,128,0.5); }
  .meta { color: var(--faint); font-size: 12px; margin-top: 4px;
          font-variant-numeric: tabular-nums; }
  .meta b { color: var(--muted); font-weight: 500; }
  .meta .mono, .name + .mono { font-family: ui-monospace, Menlo, monospace; }
  .desc { color: var(--muted); font-size: 12px; margin-top: 3px; font-style: italic; }

  .sect { margin-top: 12px; }
  .sect .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
               color: var(--faint); margin-bottom: 6px; }
  .dis { display: flex; gap: 10px; flex-wrap: wrap; }
  .di { text-align: center; width: 64px; }   /* FIXED width: growing counts must not reflow the row */
  .di .btn { width: 44px; height: 44px; border-radius: 50%; background: var(--off);
             border: 2px solid var(--card-edge); margin: 0 auto;
             transition: background 60ms, box-shadow 60ms; }
  .di .btn.on { background: var(--green); border-color: var(--green);
                box-shadow: 0 0 14px rgba(74, 222, 128, 0.55); }
  .di .pin { font-size: 11px; color: var(--muted); margin-top: 4px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .di .pin.lbl { color: var(--ink); font-weight: 600; }
  .di .cnt { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dos { display: flex; gap: 10px; flex-wrap: wrap; }
  .do { text-align: center; }
  .do .led { width: 20px; height: 20px; border-radius: 4px; background: var(--off);
             border: 1px solid var(--card-edge); margin: 0 auto; }
  .do .led.on { background: var(--amber); border-color: var(--amber);
                box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
  .do .pin { font-size: 10px; color: var(--faint); margin-top: 3px;
             max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .do .pin.lbl { color: var(--muted); font-weight: 600; }
  .ain { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 3px; }
  .ain .ch { color: var(--faint); width: 34px; }
  .ain .bar { flex: 1; height: 8px; background: var(--off); border-radius: 4px; overflow: hidden; }
  .ain .fill { height: 100%; background: var(--blue); width: 0%; }
  .ain .val { color: var(--muted); width: 56px; text-align: right;
              font-family: ui-monospace, Menlo, monospace; }
  .grp { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .grp .gname { color: var(--faint); font-size: 12px; min-width: 64px; }
  .grp .gval { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted);
               padding: 1px 9px; border-radius: 6px; background: var(--off); }
  .grp .gval.on { background: #14351f; color: var(--green); }
  .grp .gage { color: var(--faint); font-size: 11px; }
#cfgbar { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#8d95a8; }
#cfgbar select, #cfgbar button { background:#141720; color:#dfe3ec; border:1px solid #38405a;
       border-radius:5px; padding:2px 7px; font:inherit; font-size:12px; }
#cfgbar button { cursor:pointer; }
#cfgbar button:hover { border-color:#5aa9e6; }
</style>
</head>
<body>
<header>
  <h1>extio boxes</h1>
  <div id="page-nav-container"></div>
  <span id="cfgbar" hidden>
    <label for="cfgsel">configure</label>
    <select id="cfgsel"></select>
    <button id="cfggo" type="button">open</button>
  </span>
  <span id="conn"><span class="dot"></span><span id="conn-msg">connecting</span></span>
</header>
<div id="grid"></div>
<div id="empty">no boxes seen yet — waiting for <code>extio/*/state/*</code> datapoints</div>

<script src="js/ws_manager.js"></script>
<script src="js/DatapointManager.js"></script>
<script src="js/PageNav.js"></script>
<script src="js/extio_silk.js"></script>
<script src="js/extio_ain.js"></script>
<script>
'use strict';

PageNav.init('page-nav-container', 'extio');   /* family nav: jump to any ESS page */

const boxes = new Map();      // name -> model
const fetched = new Set();    // keys already one-shot fetched at startup
let dirty = new Set();        // box names needing re-render
let conn = null, dp = null;

function boxModel(name) {
    let b = boxes.get(name);
    if (!b) {
        b = { name, ident: {}, di: new Map(), dout: new Map(), ain: new Map(),
              labels: new Map(), desc: '', groups: new Map(), aingrp: new Map(),
              pinsIn: null, pinsOut: null,   /* announced active sets; null = old fw -> derive from di/do */
              inObs: null, obsPin: -1, syncPin: -1,           /* obs mirror + TTL sync input */
              syncSource: null, syncTransport: null, syncRate: null, syncAt: 0,
              battery: null, uptimeUs: null, uptimeAt: 0, wd: null, wdAt: 0,
              connects: null, connectLast: null,   /* host-counted announce bursts */
              lastSeen: 0, ready: false };
        boxes.set(name, b);
    }
    return b;
}

function groupModel(b, gname) {
    let g = b.groups.get(gname);
    if (!g) { g = { val: 0, pins: [] }; b.groups.set(gname, g); }
    return g;
}

/* decode a group bitmask to its labels (bit i = i-th member pin, ascending --
 * matches the box's dserv_pins_str contract), joined; "center" when none set.
 * Self-contained: uses the box's own announced pins + labels, no extioconf. */
function decodeGroup(g, labels) {
    if (!g.pins.length) return null;
    const on = [];
    g.pins.forEach((pin, i) => {
        if ((g.val >> i) & 1) on.push(labels.get(pin) || ('p' + pin));
    });
    return on.length ? on.join('_') : 'center';
}

/* extio/<name>/state/<leaf> -> update the box model.
 * extio/<name>/host/<leaf> is the HOST's voice about the same box
 * (extioconf's connect counter) -- routed here too, but never counted as
 * box liveness: only the box's own state/* traffic proves it alive. */
function onExtio(msg) {
    const m = /^extio\/([^/]+)\/(state|host)\/(.+)$/.exec(msg.name);
    if (!m) return;
    const b = boxModel(m[1]);
    const leaf = m[3];
    let v = msg.data !== undefined ? msg.data : msg.value;
    /* box string datapoints carry a trailing C NUL (dserv_msg_string sends
     * strlen+1); cut at it, else Number("14\0") -> NaN corrupts pins/in etc. */
    if (typeof v === 'string') v = v.split('\x00')[0];
    const num = typeof v === 'number' ? v : parseFloat(v);
    if (m[2] === 'host') {
        if (leaf === 'connects') b.connects = num;
        else if (leaf === 'connect_last') b.connectLast = String(v);
        dirty.add(b.name);
        scheduleRender();
        return;
    }
    b.lastSeen = Date.now();

    let mm;
    if ((mm = /^di\/(\d+)$/.exec(leaf))) {
        const pin = +mm[1];
        const cur = b.di.get(pin) || { v: 0, count: 0 };
        if (b.ready && num === 1 && cur.v === 0) cur.count++;   /* live press */
        cur.v = num;
        b.di.set(pin, cur);
    } else if ((mm = /^do\/(\d+)$/.exec(leaf))) {
        b.dout.set(+mm[1], num);
    } else if ((mm = /^ain\/group\/([^/]+)\/chans$/.exec(leaf))) {
        /* manifest tombstone: chans == "" frees the name (the box cannot
         * delete the retained data block, so it disowns it) -> drop ours */
        if (String(v) === '') b.aingrp.delete(mm[1]);
    } else if ((mm = /^ain\/([^/]+)$/.exec(leaf)) && Array.isArray(v)) {
        /* analog GROUP block (state/ain/<label>, DSERV_BYTE -> byte array):
         * decode the self-describing header + newest scan. Checked BEFORE the
         * numeric branch -- a label can be digit-only, but a block is always
         * an array and a legacy per-channel sample never is. */
        const blk = ExtioAinBlock.decode(v);
        if (blk) b.aingrp.set(mm[1], { ...blk, at: Date.now() });
    } else if ((mm = /^ain\/(\d+)$/.exec(leaf))) {
        b.ain.set(+mm[1], num);   /* legacy per-channel samples (RP2350 fw) */
    } else if ((mm = /^label\/(\d+)$/.exec(leaf))) {
        const s = String(v);
        if (s) b.labels.set(+mm[1], s); else b.labels.delete(+mm[1]);   /* "" clears */
    } else if (leaf === 'desc') {
        b.desc = String(v);
    } else if (leaf === 'pins/in') {
        b.pinsIn = String(v).split(',').filter(s => s.length).map(Number);
    } else if (leaf === 'pins/out') {
        b.pinsOut = String(v).split(',').filter(s => s.length).map(Number);
    } else if ((mm = /^group\/([^/]+)\/pins$/.exec(leaf))) {
        groupModel(b, mm[1]).pins = String(v).split(',').filter(s => s.length).map(Number);
    } else if ((mm = /^group\/([^/]+)$/.exec(leaf))) {   /* the bitmask event/seed */
        groupModel(b, mm[1]).val = num;
    } else if (leaf === 'in_obs') {
        b.inObs = num;
    } else if (leaf === 'obs_pin') {
        /* dserv serializes DSERV_INT unsigned: the firmware's -1 "off"
         * sentinel arrives as 4294967295, which would otherwise pass the
         * `>= 0` checks below and caption a nonexistent pin */
        b.obsPin = num >= 0x80000000 ? num - 0x100000000 : num;
    } else if (leaf === 'sync_pin') {
        b.syncPin = num >= 0x80000000 ? num - 0x100000000 : num;
    } else if (leaf === 'sync/source') {
        b.syncSource = String(v); b.syncAt = Date.now();   /* raw offset_us is epoch-huge: useless to show */
    } else if (leaf === 'sync/transport_us') {
        b.syncTransport = num; b.syncAt = Date.now();
    } else if (leaf === 'sync/rate_ppb') {
        b.syncRate = num;
    } else if (leaf === 'uptime_us') {
        b.uptimeUs = num; b.uptimeAt = Date.now();
    } else if (leaf === 'watchdog') {
        /* VALUE = seconds since boot (firmware adds missed beats back in);
         * with its arrival time this anchors "up since" -- see upParts(). */
        b.wd = num; b.wdAt = Date.now();
    } else if (leaf === 'battery') {
        b.battery = num;
    } else if (leaf === 'transport' || leaf === 'boot' || leaf === 'fw' ||
               leaf === 'fw_ver' || leaf === 'ip' || leaf === 'dserv' ||
               leaf === 'board') {
        b.ident[leaf] = String(v);
    }
    /* watchdog/link/timer/sync raw parts: liveness only (lastSeen above) */
    dirty.add(b.name);
    scheduleRender();
}

/* ---- rendering ---- */
let renderQueued = false;
function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
}

function esc(s) {
    return String(s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtAge(ms) {
    if (ms < 2000) return 'now';
    const s = Math.floor(ms / 1000);
    if (s < 120) return s + 's ago';
    const mns = Math.floor(s / 60);
    return (mns < 120 ? mns + 'm' : Math.floor(mns / 60) + 'h') + ' ago';
}

function fmtUptime(us) {
    if (us == null) return '?';
    const s = Math.floor(us / 1e6);
    if (s < 90) return s + 's';
    const mn = Math.floor(s / 60);
    if (mn < 120) return mn + 'm';
    const h = Math.floor(mn / 60);
    return h < 48 ? h + 'h' : Math.floor(h / 24) + 'd';
}

/* "up since" anchor. state/watchdog's VALUE is seconds-since-boot by firmware
 * contract (extio-zephyr main.c adds missed beats back in, precisely so this
 * stays true across stalls), published at 1 Hz -- so boot instant = arrival
 * time minus value, and a live box's displayed uptime advances between
 * messages. uptime_us (pico/BLE firmware) is the fallback anchor: published
 * once at announce, extrapolated the same way from when it arrived.
 *
 * This is the fix for "up" reading like a perpetual fresh reboot: the page
 * used to display uptime_us alone, which the Zephyr boxes never publish at
 * all and the pico boxes freeze at announce time. A silent box now freezes
 * at its last report -- that number means "was up", and the card already
 * dims and shows `seen` for exactly that case. */
function upParts(b, alive) {
    let usAt, at;
    if (b.wd != null)            { usAt = b.wd * 1e6;  at = b.wdAt; }
    else if (b.uptimeUs != null) { usAt = b.uptimeUs;  at = b.uptimeAt || b.lastSeen; }
    else return null;
    const us = usAt + (alive ? (Date.now() - at) * 1000 : 0);
    const boot = new Date(at - usAt / 1000);
    return { us, bootStr: boot.toLocaleString([], { month: 'short', day: 'numeric',
                                                    hour: '2-digit', minute: '2-digit' }) };
}

/* Link into the configurator for THIS box, carrying ?host / ?ssl through.
 * Without forwarding them a fleet page pointed at a remote rig would open a
 * configurator pointed at the local one -- and it would look like it worked,
 * right up until you edited the wrong box's pins.
 *
 * OPENS IN A NEW TAB. This page is the thing you leave up during an experiment
 * -- live DI, chord groups, liveness -- so navigating away from it to change a
 * debounce is the wrong trade: you lose sight of the rig at exactly the moment
 * you are changing it. rel=noopener because target=_blank without it hands the
 * opened page a handle back to this one. */
function cfgHref(name) {
    const q = new URLSearchParams();
    const cur = new URLSearchParams(location.search);
    if (cur.get('host')) q.set('host', cur.get('host'));
    if (cur.get('ssl') !== null) q.set('ssl', cur.get('ssl'));
    q.set('box', name);
    return 'extio-config.html?' + q.toString();
}

function cardHtml(b) {
    const age = Date.now() - b.lastSeen;
    const alive = age < 4000;
    const id = b.ident;
    const up = upParts(b, alive);
    const upStr = up
        ? `<span title="since ${up.bootStr}${alive ? '' : ' — box silent, this is its last report'}">${fmtUptime(up.us)}</span>`
        : '?';
    /* Silkscreen names (Arduino Dn/Ak) for this board, or null. Caption for an
     * UNLABELLED pin prefers the silkscreen -- that is the string printed next
     * to the physical pin someone is probing -- and the tooltip always carries
     * the numeric id, which is what every command and datapoint speaks. */
    const sk = ExtioSilk.of(id.board);
    const xchip = id.transport
        ? `<span class="chip ${id.transport === 'usb' ? 'usb' : 'eth'}">${esc(id.transport)}</span>` : '';
    const bchip = id.boot
        ? `<span class="chip ${id.boot === 'watchdog' ? 'wdg' : ''}">boot: ${esc(id.boot)}</span>` : '';
    /* fw_ver is what MCUboot ACTUALLY booted; fw is compiled in and cannot change
     * when an OTA lands, so a box updated overnight would still show its old
     * number here. Prefer fw_ver, fall back to fw for pre-MCUboot firmware. */
    const fwv = id.fw_ver || id.fw;
    const fw = fwv ? `<span class="chip" title="${id.fw_ver ? 'running image (MCUboot)' : 'build-time constant'}">${esc(fwv)}</span>` : '';
    const ip = (id.ip && id.ip !== '0.0.0.0') ? `<span class="meta mono">${esc(id.ip)}</span>` : '';

    /* render EXACTLY the box's active pins when it announces them (pins/in|out);
     * fall back to whatever di/do datapoints exist for pre-manifest firmware.
     * The announced set drops a turned-off pin even though its last di/do value
     * lingers retained in dserv. */
    const inPins  = b.pinsIn  || [...b.di.keys()].sort((a, c) => a - c);
    const outPins = b.pinsOut || [...b.dout.keys()].sort((a, c) => a - c);

    let di = '';
    if (inPins.length) {
        di = '<div class="sect"><div class="lbl">inputs</div><div class="dis">' +
            inPins.map(pin => {
                const d = b.di.get(pin) || { v: 0, count: 0 };
                const lbl = b.labels.get(pin);
                const silk = sk && sk.pin(pin);
                const cap = lbl ? esc(lbl) : (silk || 'di ' + pin);
                const ttl = [lbl && esc(lbl), 'di ' + pin, silk].filter(Boolean).join(' · ');
                return `<div class="di"><div class="btn ${d.v ? 'on' : ''}"></div>` +
                       `<div class="pin${lbl ? ' lbl' : ''}" title="${ttl}">${cap}</div>` +
                       `<div class="cnt" title="${d.count} press${d.count === 1 ? '' : 'es'}">&times;${d.count}</div></div>`;
            }).join('') + '</div></div>';
    }
    let dout = '';
    if (outPins.length) {
        dout = '<div class="sect"><div class="lbl">outputs</div><div class="dos">' +
            outPins.map(pin => {
                const lbl = b.labels.get(pin);
                const silk = sk && sk.pin(pin);
                const cap = lbl ? esc(lbl) : (silk || 'do ' + pin);
                const ttl = [lbl && esc(lbl), 'do ' + pin, silk].filter(Boolean).join(' · ');
                return `<div class="do"><div class="led ${b.dout.get(pin) ? 'on' : ''}"></div>` +
                       `<div class="pin${lbl ? ' lbl' : ''}" title="${ttl}">${cap}</div></div>`;
            }).join('') + '</div></div>';
    }
    let groups = '';
    /* skip tombstoned groups (newer firmware frees a name by announcing
     * pins == "" once, because dserv retains the old keys forever) */
    const liveGroups = [...b.groups.keys()].filter(gn => b.groups.get(gn).pins.length).sort();
    if (liveGroups.length) {
        groups = '<div class="sect"><div class="lbl">groups</div>' +
            liveGroups.map(gn => {
                const dec = decodeGroup(b.groups.get(gn), b.labels);
                const active = dec && dec !== 'center';
                return `<div class="grp"><span class="gname">${esc(gn)}</span>` +
                       `<span class="gval${active ? ' on' : ''}">${esc(dec || '—')}</span></div>`;
            }).join('') + '</div>';
    }
    /* analog groups: newest scan per channel from the self-describing blocks
     * (state/ain/<label>) -- the ONLY way analog leaves a Zephyr box, so
     * without this section analog activity was simply invisible here. The
     * age is the last BLOCK's age: for an on-change group that is time since
     * the value last moved past its deadband, not staleness. */
    let aingrps = '';
    if (b.aingrp.size) {
        aingrps = '<div class="sect"><div class="lbl">analog groups</div>' +
            [...b.aingrp.keys()].sort().map(gn => {
                const g = b.aingrp.get(gn);
                const rate = g.count > 1 && g.interval_us
                    ? `${Math.round(1e6 / g.interval_us)} Hz ×${g.count}${g.avg ? ' avg' : ''}`
                    : 'on-change';
                const rows = g.chans.map((ch, i) => {
                    const val = g.last[i];
                    const cap = (sk && sk.ain && sk.ain(ch)) || ('ch ' + ch);
                    const pct = Math.max(0, Math.min(100, ((val + 32768) / 65535) * 100));
                    return `<div class="ain"><span class="ch" title="ain ch ${ch}">${cap}</span>` +
                           `<div class="bar"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>` +
                           `<span class="val">${val}</span></div>`;
                }).join('');
                return `<div class="grp"><span class="gname">${esc(gn)}</span>` +
                       `<span class="gval">${rate}</span>` +
                       `<span class="gage">${fmtAge(Date.now() - g.at)}</span></div>` + rows;
            }).join('') + '</div>';
    }
    let ain = '';
    if (b.ain.size) {
        ain = '<div class="sect"><div class="lbl">analog</div>' +
            [...b.ain.keys()].sort((a, c) => a - c).map(ch => {
                const v = b.ain.get(ch);
                const silk = sk && sk.ain ? sk.ain(ch) : null;
                const pct = Math.max(0, Math.min(100, ((v + 32768) / 65535) * 100));
                return `<div class="ain"><span class="ch" title="ain ch ${ch}">${silk || 'ain ' + ch}</span>` +
                       `<div class="bar"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>` +
                       `<span class="val">${v}</span></div>`;
            }).join('') + '</div>';
    }
    /* sync: show what's meaningful (source hw/sw, transport delay, drift) --
     * NOT the raw offset_us, which is dserv-epoch minus box-uptime = a huge
     * number with no human meaning. */
    let sync = '';
    if (b.syncSource) {
        const parts = [b.syncSource];
        if (b.syncTransport != null) parts.push(b.syncTransport + 'µs');
        if (b.syncRate != null) parts.push((b.syncRate / 1000).toFixed(0) + 'ppm');
        const ssilk = sk && b.syncPin >= 0 ? sk.pin(b.syncPin) : null;
        const stip = b.syncPin >= 0 ? `TTL sync input on pin ${b.syncPin}${ssilk ? ` (${ssilk})` : ''}`
                   : b.syncSource === 'hw' ? 'hardware-synced' : 'software-synced (frame arrival)';
        sync = ` · <b title="${stip}">sync</b> ${parts.join(' ')} (${fmtAge(Date.now() - b.syncAt)})`;
    }
    const bat = b.battery != null ? ` · <b>batt</b> ${b.battery}%` : '';
    /* host-counted uplink connects since THIS dserv started: a steady box
     * reads #1; anything higher after the first hour is reconnect churn
     * (box reboot, cable/PHY event, peer-not-draining cycle, or an
     * operator cmd/announce). The count survives box vanish/return but
     * resets with dserv -- which is the right baseline for "is the link
     * churning while the host sits stable?" */
    const connSeg = b.connects != null
        ? ` · <b title="uplink connects seen by this dserv (announce bursts); >1 = reconnects since dserv start${b.connectLast ? ', last at ' + esc(b.connectLast) : ''}">conn</b> ` +
          `<span${b.connects > 1 ? ' style="color:var(--red)"' : ''}>#${b.connects}` +
          `${b.connectLast && b.connects > 1 ? ' @' + esc(b.connectLast) : ''}</span>`
        : '';
    const target = id.dserv
        ? ` · <b>&rarr; dserv</b> <span class="mono">${esc(id.dserv)}</span>` : '';

    /* obs indicator: pulses with the box's OWN received obs periods (honest --
     * only lights when THIS box is getting edges). Tooltip names the mirror pin. */
    const osilk = sk && b.obsPin >= 0 ? sk.pin(b.obsPin) : null;
    const obs = b.inObs != null
        ? `<span class="obs ${b.inObs ? 'on' : ''}" title="${b.obsPin >= 0 ? 'obs mirror on pin ' + b.obsPin + (osilk ? ` (${osilk})` : '') : 'obs tracking'}">obs</span>`
        : '';
    const desc = b.desc ? `<div class="desc">${esc(b.desc)}</div>` : '';

    return `<div class="title"><span class="live ${alive ? 'on' : ''}"></span>` +
           `<span class="name">${esc(b.name)}</span>${obs}${xchip}${fw}${bchip}${ip}` +
           `</div>` + desc +
           `<div class="meta"><b>up</b> ${upStr} · <b>seen</b> ${fmtAge(age)}${connSeg}${target}${sync}${bat}</div>` +
           di + groups + dout + aingrps + ain;
}

function render() {
    const grid = document.getElementById('grid');
    document.getElementById('empty').style.display = boxes.size ? 'none' : '';
    for (const name of [...boxes.keys()].sort()) {
        let el = document.getElementById('box-' + name);
        if (!el) {
            el = document.createElement('div');
            el.id = 'box-' + name;
            grid.appendChild(el);
            dirty.add(name);
        }
        const b = boxes.get(name);
        const alive = Date.now() - b.lastSeen < 4000;
        el.className = 'box' + (alive ? '' : ' offline');
        if (dirty.has(name)) {
            /* ONLY REPLACE WHEN THE MARKUP ACTUALLY CHANGED.
             *
             * onExtio marks a box dirty on EVERY datapoint, including the
             * once-a-second watchdog, so this used to rebuild the card's
             * innerHTML about once a second even when nothing visible moved. A
             * click needs mousedown AND mouseup on the same element, so
             * anything clickable inside the card -- the `configure` link -- had
             * a one-second window that kept being reset underneath the pointer.
             * It presents as a link that "sometimes does not take", which reads
             * as flakiness rather than as the DOM being replaced mid-press.
             *
             * This is cheap because a steady box produces IDENTICAL markup
             * between ticks: `seen` reads "now" under 2 s and `up` is bucketed
             * to minutes past 90 s, so neither churns; di/do only change on real
             * edges. cardHtml() is recomputed either way -- it is a string
             * build, not a layout -- and only the DOM write is skipped. */
            const html = cardHtml(b);
            if (html !== b.lastHtml) { el.innerHTML = html; b.lastHtml = html; }
        }
    }
    dirty = new Set();
    syncCfgBar();
}

/* The configure control lives in the HEADER, not in the cards.
 *
 * Cards are pure mirrors of datapoints -- they are rebuilt whenever a value
 * moves, which for a live box is about once a second. Anything clickable inside
 * them therefore has a one-second window that keeps being reset under the
 * pointer, because a click needs mousedown AND mouseup on the SAME element.
 * That is fixable by memoising the markup (and it still is, below), but it
 * makes every future card change quietly load-bearing: add one more live field
 * and the buttons start missing again, for reasons nobody will connect.
 *
 * Keeping the cards read-only removes the class of bug instead of managing it.
 * The header does not participate in the datapoint render loop at all, and the
 * picker below is rebuilt only when the SET OF BOXES changes -- not when their
 * values do -- so the control a person is aiming at simply never moves. */
let cfgNames = '';
function syncCfgBar() {
    const names = [...boxes.keys()].sort();
    const key = names.join(',');
    if (key === cfgNames) return;              /* box list unchanged -- leave it alone */
    cfgNames = key;
    const bar = document.getElementById('cfgbar');
    const sel = document.getElementById('cfgsel');
    bar.hidden = names.length === 0;
    const keep = sel.value;
    sel.innerHTML = names.map(n => `<option${n === keep ? ' selected' : ''}>${esc(n)}</option>`).join('');
}

/* refresh ages + liveness once a second even without updates */
setInterval(() => { for (const n of boxes.keys()) dirty.add(n); scheduleRender(); }, 1000);

/* after the initial burst of one-shot gets settles, live presses start counting */
function markReadySoon() {
    setTimeout(() => { for (const b of boxes.values()) b.ready = true; }, 1500);
}

function setConn(ok, msg) {
    const el = document.getElementById('conn');
    el.className = ok === null ? '' : ok ? 'ok' : 'bad';
    document.getElementById('conn-msg').textContent = msg;
}

function initCfgBar() {
    document.getElementById('cfggo').addEventListener('click', () => {
        const n = document.getElementById('cfgsel').value;
        if (n) window.open(cfgHref(n), '_blank', 'noopener');
    });
}

async function init() {
    initCfgBar();
    /* ?host=<host[:port]> -> watch a different rig's dserv (default: the one
     * serving this page), ?ssl=1|0 when the page and dserv protocols differ --
     * the standard three lines (www/CLAUDE.md). ssl was missing here, so the
     * zero-deploy dev loop (http://localhost:8090 against a wss dserv) sat on
     * "connecting" forever while extio-config.html connected fine. */
    const qs = new URLSearchParams(location.search);
    const qsHost = qs.get('host'), qsSsl = qs.get('ssl');
    conn = new DservConnection({
        subprocess: 'ess',
        dservHost: qsHost || null,
        forceSecure: qsSsl !== null ? qsSsl === '1' : undefined,
        onStatus: (st, msg) => setConn(st === 'connected' ? true : st === 'connecting' ? null : false, st),
    });
    try {
        await conn.connect();
    } catch (e) {
        setConn(false, 'connection failed');
        return;
    }
    setConn(true, 'connected');

    dp = new DatapointManager(conn, { autoGetKeys: false });
    dp.subscribe('extio/*', onExtio);          /* live stream, all boxes */

    /* @keys is PUSHED by dserv on every key add/remove (set_key_dpoint), so this
     * fires live: seed retained values for new keys, and PRUNE boxes whose keys
     * were cleared (dservClear / cleanup) -- offline boxes keep their dim card
     * as long as their keys remain; cleared boxes disappear. */
    dp.on('keys:update', ({ keys }) => {
        const present = new Set();
        for (const k of keys) {
            /* host/ = extioconf's per-box voice (connect counter): seed it too,
             * else the count only appears after the NEXT live announce */
            const m = /^extio\/([^/]+)\/(?:state|host)\//.exec(k);
            if (!m) continue;
            present.add(m[1]);
            if (!fetched.has(k)) {
                fetched.add(k);
                dp.sendGet(k);
            }
        }
        for (const name of [...boxes.keys()])
            if (!present.has(name)) {
                boxes.delete(name);
                const el = document.getElementById('box-' + name);
                if (el) el.remove();
            }
        document.getElementById('empty').style.display = boxes.size ? 'none' : '';
        markReadySoon();
    });
    dp.refreshKeys();
}

init();
</script>
</body>
</html>
