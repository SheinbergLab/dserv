<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extio boxes</title>
<link rel="stylesheet" href="css/page_nav.css">
<style>
  :root {
    --bg: #16181d; --card: #21252c; --card-edge: #2e343d; --ink: #e8eaed;
    --muted: #9aa3af; --faint: #6b7280; --green: #4ade80; --blue: #60a5fa;
    --amber: #fbbf24; --red: #f87171; --off: #3a4048;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 22px;
           border-bottom: 1px solid var(--card-edge); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header a { color: var(--faint); text-decoration: none; font-size: 12px; }
  header a:hover { color: var(--muted); }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               background: var(--off); margin-right: 6px; }
  #conn.ok .dot { background: var(--green); }
  #conn.bad .dot { background: var(--red); }
  /* Host-side PTP health. Sits AFTER #conn in the DOM on purpose: #conn owns the
     `margin-left:auto` that pushes the right-hand group over, and moving that
     onto a chip that is `hidden` on any non-PTP host would collapse the header
     layout on exactly those hosts. */
  #ptp { margin-left: 10px; cursor: default; }
  #ptp.ok   { background: #14351f; color: var(--green); }
  #ptp.warn { background: #3a2c10; color: var(--amber); }
  #ptp.bad  { background: #3f1d1d; color: var(--red); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
          gap: 16px; padding: 20px; }
  #empty { color: var(--faint); padding: 60px 24px; text-align: center; }
  #empty code { color: var(--muted); }

  .box { background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px;
         padding: 14px 16px; }
  /* Ghost the CONTENT of a silent card, never the card itself. `opacity` on
   * .box establishes one compositing group for the whole subtree, and a child's
   * opacity is relative WITHIN that group -- so `.forget { opacity: 1 }` could
   * not have undone it. The only control on a dead card was rendered at 45%
   * along with the corpse it sits in.
   *
   * Dimming each part separately leaves `forget` outside every dimmed group, at
   * full strength: on an offline card it is the one thing that still looks
   * clickable, which is exactly what it is. */
  .box.offline > *:not(.title)          { opacity: 0.45; }
  .box.offline .title > *:not(.forget)  { opacity: 0.45; }
  .box.offline .forget { color: var(--ink); border-color: var(--muted); }
  /* Offered only on a silent card: a live box has nothing to forget, and the
   * control would read as "remove this box" rather than "remove this record". */
  /* margin-left:auto, NOT float:right -- .title is display:flex and a float is
   * IGNORED on a flex item, so the button simply wrapped onto its own line
   * under the box name. Combined with --faint on a dark card it read as a
   * stray label rather than a control, and was reported as "no forget button"
   * on a card that was in fact rendering one. */
  .box .forget { margin-left: auto; font-size: 11px; padding: 1px 8px;
                 border-radius: 6px; border: 1px solid var(--muted);
                 background: transparent; color: var(--muted); cursor: pointer;
                 white-space: nowrap; }
  .box .forget:hover { color: var(--red); border-color: var(--red); }
  /* Unconfirmed trial image: the one state where any reset silently loses an
   * update, so it gets the loudest treatment a card can carry. */
  .trialbar { margin: 7px 0 2px; padding: 6px 9px; border: 1px solid #7a3a36;
              border-radius: 7px; background: #3a1f15; color: #ffb4a8;
              font-size: 12px; display: flex; align-items: center; gap: 9px;
              flex-wrap: wrap; }
  .trialbar button { background: #7a3a36; color: #fff; border: 0; border-radius: 5px;
                     padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .trialbar button:hover { filter: brightness(1.25); }
  .box .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .box .name { font-size: 16px; font-weight: 600; }
  .live { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .live.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 9px; background: var(--off);
          color: var(--muted); white-space: nowrap; }
  .chip.eth { background: #14351f; color: var(--green); }
  .chip.usb { background: #17293f; color: var(--blue); }
  .chip.wdg { background: #3f1d1d; color: var(--red); }
  .chip.lead { background: #3a2c10; color: #e8b34b; }
  /* ---- discovery panel (extio/discovered) ---- */
  #disco { margin: 0 24px 18px; }
  #disco h2 { font-size: 12px; font-weight: 600; color: var(--muted);
              text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  #disco .drow { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
                 background: var(--card); border: 1px solid var(--card-edge);
                 border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  #disco .dip { font-family: ui-monospace, Menlo, monospace; }
  #disco .dmeta { color: var(--faint); font-size: 12px; margin-left: auto;
                  text-align: right; }
  /* free = actionable, spoken-for = deliberately quiet, stranded = the alarm */
  #disco .chip.free  { background: #14351f; color: var(--green); }
  #disco .chip.mine  { background: var(--off); color: var(--muted); }
  #disco .chip.other { background: var(--off); color: var(--faint); }
  #disco .chip.lost  { background: #3f1d1d; color: var(--red); }
  #disco .drow.other { opacity: .6; }
  #disco button { font-size: 11px; padding: 2px 9px; border-radius: 6px;
                  border: 1px solid var(--card-edge); background: var(--off);
                  color: var(--ink); cursor: pointer; }
  #disco button:hover:not(:disabled) { border-color: var(--muted); }
  #disco button:disabled { opacity: .4; cursor: default; }
  #disco button.adopt { border-color: #2b6b3f; color: var(--green); }
  .obs { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 8px;
         border-radius: 9px; background: var(--off); color: var(--faint); transition: all 120ms; }
  .obs.on { background: #14351f; color: var(--green); box-shadow: 0 0 8px rgba(74,222,128,0.5); }
  .meta { color: var(--faint); font-size: 12px; margin-top: 4px;
          font-variant-numeric: tabular-nums; }
  .meta b { color: var(--muted); font-weight: 500; }
  /* An unanchored box is not a degraded box -- it refuses scheduled actions
     outright -- so it must not read like just another grey status word. */
  .meta .unsync { color: var(--red); font-weight: 600; }
  .meta .mono, .name + .mono { font-family: ui-monospace, Menlo, monospace; }
  .desc { color: var(--muted); font-size: 12px; margin-top: 3px; font-style: italic; }

  .sect { margin-top: 12px; }
  .sect .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
               color: var(--faint); margin-bottom: 6px; }
  .dis { display: flex; gap: 10px; flex-wrap: wrap; }
  .di { text-align: center; width: 64px; }   /* FIXED width: growing counts must not reflow the row */
  .di .btn { width: 44px; height: 44px; border-radius: 50%; background: var(--off);
             border: 2px solid var(--card-edge); margin: 0 auto;
             transition: background 60ms, box-shadow 60ms; }
  .di .btn.on { background: var(--green); border-color: var(--green);
                box-shadow: 0 0 14px rgba(74, 222, 128, 0.55); }
  .di .pin { font-size: 11px; color: var(--muted); margin-top: 4px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .di .pin.lbl { color: var(--ink); font-weight: 600; }
  .di .cnt { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dos { display: flex; gap: 10px; flex-wrap: wrap; }
  .do { text-align: center; }
  .do .led { width: 20px; height: 20px; border-radius: 4px; background: var(--off);
             border: 1px solid var(--card-edge); margin: 0 auto; }
  .do .led.on { background: var(--amber); border-color: var(--amber);
                box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
  .do .pin { font-size: 10px; color: var(--faint); margin-top: 3px;
             max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .do .pin.lbl { color: var(--muted); font-weight: 600; }
  .ain { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 3px; }
  .ain .ch { color: var(--faint); width: 34px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ain .ch.lbl { color: var(--ink); font-weight: 600; }
  .sect.ainlbl .ain .ch { width: 92px; }
  .ain .bar { flex: 1; height: 8px; background: var(--off); border-radius: 4px; overflow: hidden; }
  .ain .fill { height: 100%; background: var(--blue); width: 0%; }
  .ain .val { color: var(--muted); width: 56px; text-align: right;
              font-family: ui-monospace, Menlo, monospace; }
  .grp { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .grp .gname { color: var(--faint); font-size: 12px; min-width: 64px; }
  .grp .gval { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted);
               padding: 1px 9px; border-radius: 6px; background: var(--off); }
  .grp .gval.on { background: #14351f; color: var(--green); }
  .grp .gage { color: var(--faint); font-size: 11px; }
#cfgbar { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#8d95a8; }
#cfgbar select, #cfgbar button { background:#141720; color:#dfe3ec; border:1px solid #38405a;
       border-radius:5px; padding:2px 7px; font:inherit; font-size:12px; }
#cfgbar button { cursor:pointer; }
#cfgbar button:hover { border-color:#5aa9e6; }
</style>
</head>
<body>
<header>
  <h1>extio boxes</h1>
  <div id="page-nav-container"></div>
  <span id="cfgbar" hidden>
    <label for="cfgsel">configure</label>
    <select id="cfgsel"></select>
    <button id="cfggo" type="button">open</button>
    <button id="cfgforget" type="button" hidden
            title="drop this box's retained datapoints. It reappears if it publishes again.">forget</button>
  </span>
  <span id="conn"><span class="dot"></span><span id="conn-msg">connecting</span></span>
  <span id="ptp" class="chip" hidden></span>
</header>
<div id="disco" hidden></div>
<div id="grid"></div>
<div id="empty">no attached boxes</div>

<script src="js/ws_manager.js"></script>
<script src="js/DatapointManager.js"></script>
<script src="js/PageNav.js"></script>
<script src="js/extio_silk.js"></script>
<script src="js/extio_ain.js"></script>
<script>
'use strict';

PageNav.init('page-nav-container', 'extio');   /* family nav: jump to any ESS page */

const boxes = new Map();      // name -> model
const fetched = new Set();    // keys already one-shot fetched at startup
let dirty = new Set();        // box names needing re-render
let conn = null, dp = null;

function boxModel(name) {
    let b = boxes.get(name);
    if (!b) {
        b = { name, ident: {}, di: new Map(), dout: new Map(), ain: new Map(),
              labels: new Map(), ainLabels: new Map(),   /* pin -> name, ain ch -> name */
              desc: '', groups: new Map(), aingrp: new Map(),
              pinsIn: null, pinsOut: null,   /* announced active sets; null = old fw -> derive from di/do */
              inObs: null, obsPin: -1, syncPin: -1,           /* obs mirror + TTL sync input */
              syncSource: null, syncTransport: null, syncRate: null, syncAt: 0,
              battery: null, uptimeUs: null, uptimeAt: 0, wd: null, wdAt: 0,
              connects: null, connectLast: null,   /* host-counted announce bursts */
              lastSeen: 0, ready: false };
        boxes.set(name, b);
    }
    return b;
}

function groupModel(b, gname) {
    let g = b.groups.get(gname);
    if (!g) { g = { val: 0, pins: [] }; b.groups.set(gname, g); }
    return g;
}

/* decode a group bitmask to its labels (bit i = i-th member pin, ascending --
 * matches the box's dserv_pins_str contract), joined; "center" when none set.
 * Self-contained: uses the box's own announced pins + labels, no extioconf. */
function decodeGroup(g, labels) {
    if (!g.pins.length) return null;
    const on = [];
    g.pins.forEach((pin, i) => {
        if ((g.val >> i) & 1) on.push(labels.get(pin) || ('p' + pin));
    });
    return on.length ? on.join('_') : 'center';
}

/* extio/<name>/state/<leaf> -> update the box model.
 * extio/<name>/host/<leaf> is the HOST's voice about the same box
 * (extioconf's connect counter) -- routed here too, but never counted as
 * box liveness: only the box's own state/* traffic proves it alive. */
/* Boxes heard on the LAN but not necessarily adopted -- the whole point being
 * that an UNADOPTED box never registers, so it appears in no extio/<name>/*
 * namespace and is invisible to everything else on this page. */
let discovered = [];

function onDiscovered(msg) {
    let v = msg.data !== undefined ? msg.data : msg.value;
    if (typeof v === 'string') v = v.split('\x00')[0];
    try { discovered = JSON.parse(v) || []; } catch (e) { discovered = []; }
    renderDisco();
}

function onExtio(msg) {
    /* Checked FIRST: this leaf has two segments, so the per-box regex below
     * rejects it and it would otherwise be dropped on the floor. */
    if (msg.name === 'extio/discovered') { onDiscovered(msg); return; }

    /* Rename tombstone (extio/renamed = "<old> <new>"): extio_rename purged
     * the old identity server-side, but deletions are never pushed -- without
     * this the old card lingers here forever as a phantom offline box. The
     * card's DOM node must go too: render() only ever ADDS nodes. The new
     * name's card builds itself from the burst. Retained-value safe: deleting
     * an unknown name is a no-op. */
    if (msg.name === 'extio/renamed') {
        let tv = msg.data !== undefined ? msg.data : msg.value;
        if (typeof tv === 'string') tv = tv.split('\x00')[0];
        const [oldName] = String(tv || '').trim().split(/\s+/);
        if (oldName && boxes.delete(oldName)) {
            const el = document.getElementById('box-' + oldName);
            if (el) el.remove();
            scheduleRender();
        }
        return;
    }

    const m = /^extio\/([^/]+)\/(state|host)\/(.+)$/.exec(msg.name);
    if (!m) return;
    const b = boxModel(m[1]);
    const leaf = m[3];
    let v = msg.data !== undefined ? msg.data : msg.value;
    /* box string datapoints carry a trailing C NUL (dserv_msg_string sends
     * strlen+1); cut at it, else Number("14\0") -> NaN corrupts pins/in etc. */
    if (typeof v === 'string') v = v.split('\x00')[0];
    const num = typeof v === 'number' ? v : parseFloat(v);
    if (m[2] === 'host') {
        if (leaf === 'connects') b.connects = num;
        else if (leaf === 'connect_last') b.connectLast = String(v);
        dirty.add(b.name);
        scheduleRender();
        return;
    }
    b.lastSeen = Date.now();

    let mm;
    if ((mm = /^di\/(\d+)$/.exec(leaf))) {
        const pin = +mm[1];
        const cur = b.di.get(pin) || { v: 0, count: 0 };
        if (b.ready && num === 1 && cur.v === 0) cur.count++;   /* live press */
        cur.v = num;
        b.di.set(pin, cur);
    } else if ((mm = /^do\/(\d+)$/.exec(leaf))) {
        b.dout.set(+mm[1], num);
    } else if ((mm = /^ain\/group\/([^/]+)\/chans$/.exec(leaf))) {
        /* manifest tombstone: chans == "" frees the name (the box cannot
         * delete the retained data block, so it disowns it) -> drop ours */
        if (String(v) === '') b.aingrp.delete(mm[1]);
    } else if ((mm = /^ain\/label\/(\d+)$/.exec(leaf))) {
        /* per-CHANNEL analog label, the analog twin of label/<pin> below. Two
         * slashes deep, so it cannot be confused with the group-block leaf
         * `ain/<name>` -- that pattern is single-segment. */
        const s = String(v);
        if (s) b.ainLabels.set(+mm[1], s); else b.ainLabels.delete(+mm[1]);
    } else if ((mm = /^ain\/([^/]+)$/.exec(leaf)) && Array.isArray(v)) {
        /* analog GROUP block (state/ain/<label>, DSERV_BYTE -> byte array):
         * decode the self-describing header + newest scan. Checked BEFORE the
         * numeric branch -- a label can be digit-only, but a block is always
         * an array and a legacy per-channel sample never is. */
        const blk = ExtioAinBlock.decode(v);
        if (blk) b.aingrp.set(mm[1], { ...blk, at: Date.now() });
    } else if ((mm = /^ain\/(\d+)$/.exec(leaf))) {
        b.ain.set(+mm[1], num);   /* legacy per-channel samples (RP2350 fw) */
    } else if ((mm = /^label\/(\d+)$/.exec(leaf))) {
        const s = String(v);
        if (s) b.labels.set(+mm[1], s); else b.labels.delete(+mm[1]);   /* "" clears */
    } else if (leaf === 'desc') {
        b.desc = String(v);
    } else if (leaf === 'pins/in') {
        b.pinsIn = String(v).split(',').filter(s => s.length).map(Number);
    } else if (leaf === 'pins/out') {
        b.pinsOut = String(v).split(',').filter(s => s.length).map(Number);
    } else if ((mm = /^group\/([^/]+)\/pins$/.exec(leaf))) {
        groupModel(b, mm[1]).pins = String(v).split(',').filter(s => s.length).map(Number);
    } else if ((mm = /^group\/([^/]+)$/.exec(leaf))) {   /* the bitmask event/seed */
        groupModel(b, mm[1]).val = num;
    } else if (leaf === 'in_obs') {
        b.inObs = num;
    } else if (leaf === 'obs_pin') {
        /* dserv serializes DSERV_INT unsigned: the firmware's -1 "off"
         * sentinel arrives as 4294967295, which would otherwise pass the
         * `>= 0` checks below and caption a nonexistent pin */
        b.obsPin = num >= 0x80000000 ? num - 0x100000000 : num;
    } else if (leaf === 'sync_pin') {
        b.syncPin = num >= 0x80000000 ? num - 0x100000000 : num;
    } else if (leaf === 'sync/source') {
        b.syncSource = String(v); b.syncAt = Date.now();   /* raw offset_us is epoch-huge: useless to show */
    } else if (leaf === 'sync/transport_us') {
        b.syncTransport = num; b.syncAt = Date.now();
    } else if (leaf === 'sync/rate_ppb') {
        b.syncRate = num;
    } else if (leaf === 'uptime_us') {
        b.uptimeUs = num; b.uptimeAt = Date.now();
    } else if (leaf === 'watchdog') {
        /* VALUE = seconds since boot (firmware adds missed beats back in);
         * with its arrival time this anchors "up since" -- see upParts(). */
        b.wd = num; b.wdAt = Date.now();
    } else if (leaf === 'battery') {
        b.battery = num;
    } else if (leaf === 'transport' || leaf === 'boot' || leaf === 'fw' ||
               leaf === 'fw_ver' || leaf === 'ip' || leaf === 'dserv' ||
               leaf === 'board' || leaf === 'pins/silk' || leaf === 'ain/silk') {
        b.ident[leaf] = String(v);
    } else if (leaf === 'obs_leader') {
        b.obsLeader = num == 1;      /* +31: announced obs-onset authority */
    } else if (leaf === 'ota/trial') {
        /* Standing 1 Hz signal from fw >= +61 while an update is unconfirmed
         * (earlier firmware announced it once per connect, in a burst allowed
         * to drop frames -- which is how a trial could sit invisible). */
        b.trial = num == 1;
    }
    /* watchdog/link/timer/sync raw parts: liveness only (lastSeen above) */
    dirty.add(b.name);
    scheduleRender();
}

/* ---- rendering ---- */
let renderQueued = false;
function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    /* rAF DOES NOT FIRE IN A HIDDEN TAB, and renderQueued latches until its
     * callback clears it -- so a single missed frame wedges the page
     * permanently: every later scheduleRender() returns immediately and
     * nothing on screen updates again, including the 1 Hz tick. Seen live as a
     * populated `boxes` model with zero cards in the DOM. The timeout is a
     * backstop; whichever arrives first clears the flag and the other becomes
     * a no-op. */
    const run = () => { if (!renderQueued) return; renderQueued = false; render(); };
    requestAnimationFrame(run);
    setTimeout(run, 1000);
}

function esc(s) {
    return String(s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtAge(ms) {
    if (ms < 2000) return 'now';
    const s = Math.floor(ms / 1000);
    if (s < 120) return s + 's ago';
    const mns = Math.floor(s / 60);
    return (mns < 120 ? mns + 'm' : Math.floor(mns / 60) + 'h') + ' ago';
}

function fmtUptime(us) {
    if (us == null) return '?';
    const s = Math.floor(us / 1e6);
    if (s < 90) return s + 's';
    const mn = Math.floor(s / 60);
    if (mn < 120) return mn + 'm';
    const h = Math.floor(mn / 60);
    return h < 48 ? h + 'h' : Math.floor(h / 24) + 'd';
}

/* "up since" anchor. state/watchdog's VALUE is seconds-since-boot by firmware
 * contract (extio-zephyr main.c adds missed beats back in, precisely so this
 * stays true across stalls), published at 1 Hz -- so boot instant = arrival
 * time minus value, and a live box's displayed uptime advances between
 * messages. uptime_us (pico/BLE firmware) is the fallback anchor: published
 * once at announce, extrapolated the same way from when it arrived.
 *
 * This is the fix for "up" reading like a perpetual fresh reboot: the page
 * used to display uptime_us alone, which the Zephyr boxes never publish at
 * all and the pico boxes freeze at announce time. A silent box now freezes
 * at its last report -- that number means "was up", and the card already
 * dims and shows `seen` for exactly that case. */
function upParts(b, alive) {
    let usAt, at;
    if (b.wd != null)            { usAt = b.wd * 1e6;  at = b.wdAt; }
    else if (b.uptimeUs != null) { usAt = b.uptimeUs;  at = b.uptimeAt || b.lastSeen; }
    else return null;
    const us = usAt + (alive ? (Date.now() - at) * 1000 : 0);
    const boot = new Date(at - usAt / 1000);
    return { us, bootStr: boot.toLocaleString([], { month: 'short', day: 'numeric',
                                                    hour: '2-digit', minute: '2-digit' }) };
}

/* Link into the configurator for THIS box, carrying ?host / ?ssl through.
 * Without forwarding them a fleet page pointed at a remote rig would open a
 * configurator pointed at the local one -- and it would look like it worked,
 * right up until you edited the wrong box's pins.
 *
 * OPENS IN A NEW TAB. This page is the thing you leave up during an experiment
 * -- live DI, chord groups, liveness -- so navigating away from it to change a
 * debounce is the wrong trade: you lose sight of the rig at exactly the moment
 * you are changing it. rel=noopener because target=_blank without it hands the
 * opened page a handle back to this one. */
function cfgHref(name) {
    const q = new URLSearchParams();
    const cur = new URLSearchParams(location.search);
    if (cur.get('host')) q.set('host', cur.get('host'));
    if (cur.get('ssl') !== null) q.set('ssl', cur.get('ssl'));
    q.set('box', name);
    return 'extio-config.html?' + q.toString();
}

function cardHtml(b) {
    const age = Date.now() - b.lastSeen;
    const alive = age < 4000;
    const id = b.ident;
    const up = upParts(b, alive);
    const upStr = up
        ? `<span title="since ${up.bootStr}${alive ? '' : ' — box silent, this is its last report'}">${fmtUptime(up.us)}</span>`
        : '?';
    /* Silkscreen names (Arduino Dn/Ak) for this board, or null. Caption for an
     * UNLABELLED pin prefers the silkscreen -- that is the string printed next
     * to the physical pin someone is probing -- and the tooltip always carries
     * the numeric id, which is what every command and datapoint speaks. */
    /* Announced silk wins over the host-side table -- the board states what is
     * printed on it; see extio_silk.js. */
    const sk = ExtioSilk.fromBox(id.board, id['pins/silk'], id['ain/silk']);
    const xchip = id.transport
        ? `<span class="chip ${id.transport === 'usb' ? 'usb' : 'eth'}">${esc(id.transport)}</span>` : '';
    const bchip = id.boot
        ? `<span class="chip ${id.boot === 'watchdog' ? 'wdg' : ''}">boot: ${esc(id.boot)}</span>` : '';
    /* +31: the announced obs-onset authority -- the box a paradigm's
     * `obs_schedule_bind auto` will resolve. One per rig by contract. */
    const lchip = b.obsLeader
        ? `<span class="chip lead" title="announced obs leader: owns the obs line and emits BEGINOBS (actual-stamped onset); obs_schedule_bind auto resolves this box">obs leader</span>` : '';
    /* fw_ver is what MCUboot ACTUALLY booted; fw is compiled in and cannot change
     * when an OTA lands, so a box updated overnight would still show its old
     * number here. Prefer fw_ver, fall back to fw for pre-MCUboot firmware. */
    const fwv = id.fw_ver || id.fw;
    const fw = fwv ? `<span class="chip" title="${id.fw_ver ? 'running image (MCUboot)' : 'build-time constant'}">${esc(fwv)}</span>` : '';
    const ip = (id.ip && id.ip !== '0.0.0.0') ? `<span class="meta mono">${esc(id.ip)}</span>` : '';

    /* FORGET, on silent cards only.
     *
     * dserv retains datapoints and never deletes them when the thing they
     * describe goes away, so a box that is unplugged leaves a full set behind
     * and its card persists indefinitely -- dimmed, but still claiming pins,
     * groups and an obs role that no longer exist anywhere. The dimming says
     * "not talking"; it cannot say "gone for good", because nothing can: a box
     * that is silent because someone tripped over the cable and one that has
     * been retired look identical from here.
     *
     * So this is a JUDGEMENT the operator makes, not one the page infers. No
     * timeout auto-clears a card -- a box quiet for an hour during a rebuild
     * must still be there when you come back. If it turns out the box is
     * merely unplugged, it reappears the moment it publishes again, so the
     * action is cheap to get wrong in that direction and destroys nothing.
     *
     * NOT offered while alive: a live box has nothing stale about it, and the
     * button would read as "remove this box" rather than "remove this record".
     */
    const forget = alive ? ''
        : `<button class="forget" title="drop this box's retained datapoints. It reappears if it publishes again."
                   onclick="forgetBox('${esc(b.name)}')">forget</button>`;

    /* render EXACTLY the box's active pins when it announces them (pins/in|out);
     * fall back to whatever di/do datapoints exist for pre-manifest firmware.
     * The announced set drops a turned-off pin even though its last di/do value
     * lingers retained in dserv. */
    const inPins  = b.pinsIn  || [...b.di.keys()].sort((a, c) => a - c);
    const outPins = b.pinsOut || [...b.dout.keys()].sort((a, c) => a - c);

    let di = '';
    if (inPins.length) {
        di = '<div class="sect"><div class="lbl">inputs</div><div class="dis">' +
            inPins.map(pin => {
                const d = b.di.get(pin) || { v: 0, count: 0 };
                const lbl = b.labels.get(pin);
                const silk = sk && sk.pin(pin);
                const cap = lbl ? esc(lbl) : (silk || 'di ' + pin);
                const ttl = [lbl && esc(lbl), 'di ' + pin, silk].filter(Boolean).join(' · ');
                return `<div class="di"><div class="btn ${d.v ? 'on' : ''}"></div>` +
                       `<div class="pin${lbl ? ' lbl' : ''}" title="${ttl}">${cap}</div>` +
                       `<div class="cnt" title="${d.count} press${d.count === 1 ? '' : 'es'}">&times;${d.count}</div></div>`;
            }).join('') + '</div></div>';
    }
    let dout = '';
    if (outPins.length) {
        dout = '<div class="sect"><div class="lbl">outputs</div><div class="dos">' +
            outPins.map(pin => {
                const lbl = b.labels.get(pin);
                const silk = sk && sk.pin(pin);
                const cap = lbl ? esc(lbl) : (silk || 'do ' + pin);
                const ttl = [lbl && esc(lbl), 'do ' + pin, silk].filter(Boolean).join(' · ');
                return `<div class="do"><div class="led ${b.dout.get(pin) ? 'on' : ''}"></div>` +
                       `<div class="pin${lbl ? ' lbl' : ''}" title="${ttl}">${cap}</div></div>`;
            }).join('') + '</div></div>';
    }
    let groups = '';
    /* skip tombstoned groups (newer firmware frees a name by announcing
     * pins == "" once, because dserv retains the old keys forever) */
    const liveGroups = [...b.groups.keys()].filter(gn => b.groups.get(gn).pins.length).sort();
    if (liveGroups.length) {
        groups = '<div class="sect"><div class="lbl">groups</div>' +
            liveGroups.map(gn => {
                const dec = decodeGroup(b.groups.get(gn), b.labels);
                const active = dec && dec !== 'center';
                return `<div class="grp"><span class="gname">${esc(gn)}</span>` +
                       `<span class="gval${active ? ' on' : ''}">${esc(dec || '—')}</span></div>`;
            }).join('') + '</div>';
    }
    /* analog groups: newest scan per channel from the self-describing blocks
     * (state/ain/<label>) -- the ONLY way analog leaves a Zephyr box, so
     * without this section analog activity was simply invisible here. The
     * age is the last BLOCK's age: for an on-change group that is time since
     * the value last moved past its deadband, not staleness. */
    let aingrps = '';
    if (b.aingrp.size) {
        /* The caption column is a FIXED width so the bars line up down the
         * card. A name needs more room than "ch 3", so widen the column for
         * the whole section as soon as any channel here carries one -- widening
         * only the labelled rows would ragged the bars, which is the thing the
         * fixed width exists to prevent. */
        const anyLbl = [...b.aingrp.values()]
              .some(g => g.chans.some(ch => b.ainLabels.get(ch)));
        aingrps = `<div class="sect${anyLbl ? ' ainlbl' : ''}"><div class="lbl">analog groups</div>` +
            [...b.aingrp.keys()].sort().map(gn => {
                const g = b.aingrp.get(gn);
                /* MODE COMES FROM interval_us, NOT FROM count. The firmware
                 * sets interval_us to exactly 0 for an on-change block and to
                 * decimate*base_period for a continuous one, so it is the only
                 * field that states the mode; count is the BATCH size and says
                 * nothing about it. Testing `count > 1` conflated batch=1 with
                 * on-change, so a continuous group publishing one scan per
                 * block -- which is what an eye feed wants, and what the rig
                 * switched to on 2026-08-06 to stop discarding samples -- was
                 * labelled "on-change" while streaming at 250 Hz. */
                const rate = g.interval_us
                    ? `${Math.round(1e6 / g.interval_us)} Hz` +
                      `${g.count > 1 ? ` ×${g.count}` : ''}${g.avg ? ' avg' : ''}`
                    : 'on-change';
                const rows = g.chans.map((ch, i) => {
                    const val = g.last[i];
                    /* Same precedence as a digital pin: the name the RIG gave
                     * this signal wins over the board's silkscreen, which wins
                     * over the bare channel number. The title keeps all three,
                     * so a labelled row still tells you which wire it is. */
                    const lbl = b.ainLabels.get(ch);
                    const silk = sk && sk.ain && sk.ain(ch);
                    const cap = lbl ? esc(lbl) : (silk || 'ch ' + ch);
                    const ttl = [lbl && esc(lbl), 'ain ch ' + ch, silk].filter(Boolean).join(' · ');
                    const pct = Math.max(0, Math.min(100, ((val + 32768) / 65535) * 100));
                    return `<div class="ain"><span class="ch${lbl ? ' lbl' : ''}" title="${ttl}">${cap}</span>` +
                           `<div class="bar"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>` +
                           `<span class="val">${val}</span></div>`;
                }).join('');
                return `<div class="grp"><span class="gname">${esc(gn)}</span>` +
                       `<span class="gval">${rate}</span>` +
                       `<span class="gage">${fmtAge(Date.now() - g.at)}</span></div>` + rows;
            }).join('') + '</div>';
    }
    let ain = '';
    if (b.ain.size) {
        ain = '<div class="sect"><div class="lbl">analog</div>' +
            [...b.ain.keys()].sort((a, c) => a - c).map(ch => {
                const v = b.ain.get(ch);
                const silk = sk && sk.ain ? sk.ain(ch) : null;
                const pct = Math.max(0, Math.min(100, ((v + 32768) / 65535) * 100));
                return `<div class="ain"><span class="ch" title="ain ch ${ch}">${silk || 'ain ' + ch}</span>` +
                       `<div class="bar"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>` +
                       `<span class="val">${v}</span></div>`;
            }).join('') + '</div>';
    }
    /* sync: show what's meaningful (source hw/sw, transport delay, drift) --
     * NOT the raw offset_us, which is dserv-epoch minus box-uptime = a huge
     * number with no human meaning. */
    let sync = '';
    if (b.syncSource) {
        /* "none" IS THE ONE VALUE THAT MEANS TROUBLE. The box publishes hw / sw /
         * ptp while it is on dserv's timeline and "none" when it is not
         * (extio-zephyr main.c: `ptp_offset_valid ? "ptp" : "none"`), and an
         * unanchored box does not degrade -- it REFUSES every at_abs.
         *
         * It used to render in the same grey as a healthy "sync ptp", so a box
         * that could not schedule anything looked identical to a working one at a
         * glance. That is precisely how 2026-08-09 went: this page showed the box
         * as fine, which made dserv not being paired with it a surprise. The
         * header chip counts anchored/boxes; this line says WHICH box. */
        const unsynced = b.syncSource === 'none';
        /* Transport delay and drift are measurements from when the box WAS
         * anchored. Showing "NOT ANCHORED 47µs 12ppm" dresses a dead anchor in
         * healthy-looking numbers -- the same retained-value trap this page
         * exists to defeat. */
        const parts = unsynced ? ['NOT ANCHORED'] : [b.syncSource];
        if (!unsynced && b.syncTransport != null) parts.push(b.syncTransport + 'µs');
        if (!unsynced && b.syncRate != null) parts.push((b.syncRate / 1000).toFixed(0) + 'ppm');
        const ssilk = sk && b.syncPin >= 0 ? sk.pin(b.syncPin) : null;
        /* The old ternary special-cased only 'hw', so EVERY other value -- "none"
         * included -- claimed "software-synced (frame arrival)". A tooltip that
         * confidently describes an unanchored box as synced is worse than no
         * tooltip: it answers the question you came to ask, wrongly. */
        const stip =
              unsynced ? `NOT anchored to dserv's timeline: this box refuses scheduled `
                       + `(at_abs) actions. An anchor never survives a box reboot or `
                       + `reflash; ptpconf re-pushes on connect and on every sweep, so this `
                       + `should clear within seconds — if it does not, check the PTP chip.`
            : b.syncPin >= 0        ? `TTL sync input on pin ${b.syncPin}${ssilk ? ` (${ssilk})` : ''}`
            : b.syncSource === 'hw'  ? 'hardware-synced'
            : b.syncSource === 'ptp' ? `anchored via PTP (the box's own 1588 clock plus the `
                                     + `dserv epoch offset ptpconf pushed it)`
                                     : 'software-synced (frame arrival)';
        const val = unsynced ? `<span class="unsync">${parts.join(' ')}</span>` : parts.join(' ');
        sync = ` · <b title="${esc(stip)}">sync</b> ${val} (${fmtAge(Date.now() - b.syncAt)})`;
    }
    const bat = b.battery != null ? ` · <b>batt</b> ${b.battery}%` : '';
    /* host-counted uplink connects since THIS dserv started: a steady box
     * reads #1; anything higher after the first hour is reconnect churn
     * (box reboot, cable/PHY event, peer-not-draining cycle, or an
     * operator cmd/announce). The count survives box vanish/return but
     * resets with dserv -- which is the right baseline for "is the link
     * churning while the host sits stable?" */
    const connSeg = b.connects != null
        ? ` · <b title="uplink connects seen by this dserv (announce bursts); >1 = reconnects since dserv start${b.connectLast ? ', last at ' + esc(b.connectLast) : ''}">conn</b> ` +
          `<span${b.connects > 1 ? ' style="color:var(--red)"' : ''}>#${b.connects}` +
          `${b.connectLast && b.connects > 1 ? ' @' + esc(b.connectLast) : ''}</span>`
        : '';
    const target = id.dserv
        ? ` · <b>&rarr; dserv</b> <span class="mono">${esc(id.dserv)}</span>` : '';

    /* obs indicator: pulses with the box's OWN received obs periods (honest --
     * only lights when THIS box is getting edges). Tooltip names the mirror pin. */
    const osilk = sk && b.obsPin >= 0 ? sk.pin(b.obsPin) : null;
    const obs = b.inObs != null
        ? `<span class="obs ${b.inObs ? 'on' : ''}" title="${b.obsPin >= 0 ? 'obs mirror on pin ' + b.obsPin + (osilk ? ` (${osilk})` : '') : 'obs tracking'}">obs</span>`
        : '';
    const desc = b.desc ? `<div class="desc">${esc(b.desc)}</div>` : '';

    /* Between arm and confirm ANY reset silently reverts the update -- the one
     * state a fleet page must never let sit invisible. Mirrors the box's own
     * state/ota/trial. Confirm rides extio_ota_confirm, the same request-layer
     * path the lifecycle and the CLI (dservctl extio "extio_ota_confirm <box>")
     * use; the box publishes trial=0 on success and the bar clears itself. */
    const trial = b.trial
        ? `<div class="trialbar"><b>TRIAL — unconfirmed.</b> ${esc(fwv || '?')} reverts on any reset.` +
          `<button title='Make the running image permanent (extio_ota_confirm ${esc(b.name)})'` +
          ` onclick="confirmTrial('${esc(b.name)}')">Confirm — keep it</button></div>`
        : '';

    return `<div class="title"><span class="live ${alive ? 'on' : ''}"></span>` +
           `<span class="name">${esc(b.name)}</span>${obs}${xchip}${fw}${bchip}${lchip}${ip}${forget}` +
           `</div>` + trial + desc +
           `<div class="meta"><b>up</b> ${upStr} · <b>seen</b> ${fmtAge(age)}${connSeg}${target}${sync}${bat}</div>` +
           di + groups + dout + aingrps + ain;
}

async function confirmTrial(name) {
    try {
        alert(String(await conn.send(`extio_ota_confirm ${name}`, 'extio')));
    } catch (e) {
        alert('confirm failed: ' + e.message);
    }
}

/* ---- THE THREE OWNERSHIP STATES ----
 *
 * Every dserv on this subnet now hears every box, so "is this box available"
 * is no longer a yes/no. Three answers, and conflating any two of them causes a
 * different kind of damage:
 *
 *   free        target 0.0.0.0 -- no dserv has claimed it. Adoptable.
 *   mine        its target IS us. Nothing to do; shown so the list is complete
 *               and you can see the box is where you think it is.
 *   spoken for  its target is a DIFFERENT dserv on this LAN. Adopting it would
 *               silently steal it out of a running rig, so no action is offered
 *               here at all. This is the state a naive "adopt" button gets
 *               wrong, and the one where getting it wrong hurts someone else.
 *
 * `mine` is decided in the C module against the address that actually reaches
 * that box (extiodisc.c `via`), not against a hostname -- dserv is multi-homed
 * and a name resolves to whichever interface it feels like.
 *
 * STRANDED is a separate axis, not a fourth state: a box can be stranded and
 * still be ours, or stranded and someone else's. It means the box has a target
 * it has been unable to reach for over 30 s (the module holds a grace period so
 * routine dserv restarts, which drop the link for a few seconds, do not raise
 * an alarm during ordinary work).
 */
/* Adoption is a WRITE, on a page that is otherwise a read-only mirror -- so it
 * confirms first. The thing worth confirming is not "are you sure" but WHICH
 * address the box will be told to use: `via` is the address that reaches this
 * dserv FROM THAT BOX, and on a multi-homed host it is not the one a person
 * would have typed. Showing it is what makes the action checkable. */
async function adoptBox(ip, name, via) {
  if (!via) { alert('no route to that box from here — cannot adopt'); return; }
  if (!confirm(`Adopt "${name}" (${ip})?\n\n`
             + `It will be told to connect to ${via}.\n`
             + `obs mode is set to mirror (leader is rig-specific wiring).\n\n`
             + `Not saved to the box's flash — it returns to its previous `
             + `owner on reboot until you save it from its config page.`)) return;
  try {
    const r = await conn.send(`extio_adopt ${ip} ${name} ${via}`, 'extio');
    console.log('adopt:', r);
  } catch (e) { alert(`adopt failed: ${e.message || e}`); }
}

/* Forget: drop a silent box's retained datapoints so its card stops claiming
 * hardware that is not there. extio_clear is the same call extioconf uses after
 * a rename, and it removes RECORDS, not configuration -- nothing on the box
 * changes, and if it is merely unplugged it repopulates the moment it is back.
 * That asymmetry is why this needs no undo. */
async function forgetBox(name) {
  if (!confirm(`Forget "${name}"?\n\n`
             + `Drops the datapoints it left behind on this dserv, so its card `
             + `goes away.\n\nNothing on the box changes. If it is still out `
             + `there it reappears as soon as it publishes again.`)) return;
  try {
    const r = await conn.send(`extio_clear ${name}`, 'extio');
    console.log('forget:', r);
    /* Remove the CARD, not just the model entry. The keys:update prune already
     * does both when a box's keys vanish -- but it iterates over `boxes`, so
     * deleting the model entry here first means that prune never sees this box
     * and its element is left behind, a card with nothing whatsoever behind it.
     * Doing both here makes the later prune a harmless no-op. */
    boxes.delete(name);
    const el = document.getElementById('box-' + name);
    if (el) el.remove();
    scheduleRender();
  } catch (e) { alert(`forget failed: ${e.message || e}`); }
}

/* Release has two strengths and they are NOT the same act, so they confirm
 * differently. Plain release frees our connect-back slot: the box keeps
 * pointing at us and reconnects, but another dserv can now reach it -- the
 * handshake half that lets a healthy box be handed over at all. `free` also
 * clears the target, so the box belongs to nobody. */
async function releaseBox(ip, name, toPool) {
  const msg = toPool
    ? `Release "${name}" (${ip}) to the pool?\n\nIts dserv target is cleared, `
      + `so it stops talking to us and ANY dserv on this network can adopt it.`
    : `Release "${name}" (${ip})?\n\nFrees its connect-back slot so another `
      + `dserv can take it. It stays pointed at us until someone does.`;
  if (!confirm(msg)) return;
  try {
    const r = await conn.send(`extio_release ${ip} ${name} ${toPool ? 1 : 0}`, 'extio');
    console.log('release:', r);
  } catch (e) { alert(`release failed: ${e.message || e}`); }
}

function renderDisco() {
    const el = document.getElementById('disco');
    if (!el) return;
    if (!discovered.length) { el.hidden = true; el.innerHTML = ''; return; }

    const ago = ms => ms >= 60000 ? Math.floor(ms / 60000) + 'm'
                                  : Math.round(ms / 1000) + 's';

    const rows = discovered.map(d => {
        const free  = !d.configured;
        const mine  = !!d.mine;
        const state = free ? 'free' : mine ? 'mine' : 'other';
        const label = free ? 'unclaimed' : mine ? 'this dserv' : 'another dserv';

        /* An adopted box keeps beaconing, so `target` is what tells you WHOSE
         * it is. Showing it on every configured row is what makes "spoken for"
         * checkable rather than something you take on trust. */
        const tgt = d.configured ? `<span class="chip ${state}">${esc(label)}</span>` +
                                   `<span class="dmeta">&rarr; ${esc(d.target)}</span>`
                                 : `<span class="chip free">${esc(label)}</span>`;

        /* Health only where the box reports it (v2). A v1 box omits link
         * entirely and its silence must not be drawn as a verdict. */
        /* Occupied slot, wrong occupant. Distinct from stranded -- the box
         * reports link:up, so nothing else on this page would show a problem,
         * and the box that owns it on paper cannot reach it. */
        const held = d.heldByOther
            ? `<span class="chip lost" title="connect-back slot is held by ${esc(d.peer || '?')}, not by its configured dserv — usually an adoption whose previous owner never released it">held by ${esc(d.peer || '?')}</span>`
            : '';

        const lost = d.stranded
            ? `<span class="chip lost" title="${d.ever
                 ? 'reached this target before, and cannot now'
                 : 'has never reached this target -- wrong address or subnet'}">${
                 d.ever ? 'lost dserv' : 'never reached'} ${ago(d.down_ms || 0)}</span>`
            : '';

        /* ACTIONS follow ownership, and the omissions are the point.
         *
         * free / stranded -> Adopt. Both are reachable: the box's single
         *   connect-back slot is empty, which is exactly what `link:down`
         *   reports. Adopting is what that slot being free MEANS.
         *
         * mine -> Release: clears the target AND frees the slot, in that order.
         *   The firmware makes a healthy box unreachable to anyone else, so we
         *   are the only party who CAN let go of it -- release is an obligation
         *   of ownership, not a courtesy.
         *
         *   ONE BUTTON, NOT TWO. A slot-only release used to sit beside this
         *   one and it was a trap: freeing the slot while the box still points
         *   at us achieves nothing, because the box's own registration watchdog
         *   re-registers with its CONFIGURED dserv within ~5 s and we reclaim
         *   the slot before anyone else can take it. Measured on the rig --
         *   peer went to 0.0.0.0 and back to the original owner within seconds,
         *   and the waiting adopter lost the race every time. It read as the
         *   hand-over action and could never perform one. The to_pool=0 path
         *   remains in extio_release for a box whose target is already
         *   elsewhere; it is simply not a button.
         *
         * spoken for (and healthy) -> NOTHING. Not a disabled button: there is
         *   no action to offer. Its owner holds the slot, so an adopt would
         *   fail at the socket even if we tried, and the failure everyone
         *   actually fears -- stealing a box out of a running rig -- is
         *   prevented in firmware rather than by this omission. Showing a
         *   greyed control would imply we could if we insisted.
         */
        const act = (free || d.stranded)
            ? `<button class="adopt" onclick="adoptBox('${esc(d.ip)}','${esc(d.name)}','${esc(d.via)}')">adopt</button>`
            : mine
              ? `<button onclick="releaseBox('${esc(d.ip)}','${esc(d.name)}',1)"
                         title="clear this box's dserv target and free its connect-back slot, so any dserv on this network can adopt it">release</button>`
              : '';

        return `<div class="drow ${state === 'other' ? 'other' : ''}">
          <span class="dip">${esc(d.ip)}</span>
          <b>${esc(d.name || '?')}</b>
          <span class="chip">${esc(d.board || '?')}</span>
          ${tgt}${held}${lost}${act ? `<span style="margin-left:10px">${act}</span>` : ''}
        </div>`;
    }).join('');

    const html = `<h2>on this network</h2>${rows}`;
    if (html !== el.dataset.last) { el.innerHTML = html; el.dataset.last = html; }
    el.hidden = false;
}

function render() {
    const grid = document.getElementById('grid');
    document.getElementById('empty').style.display = boxes.size ? 'none' : '';
    for (const name of [...boxes.keys()].sort()) {
        let el = document.getElementById('box-' + name);
        if (!el) {
            el = document.createElement('div');
            el.id = 'box-' + name;
            grid.appendChild(el);
            dirty.add(name);
        }
        const b = boxes.get(name);
        const alive = Date.now() - b.lastSeen < 4000;
        el.className = 'box' + (alive ? '' : ' offline');
        if (dirty.has(name)) {
            /* ONLY REPLACE WHEN THE MARKUP ACTUALLY CHANGED.
             *
             * onExtio marks a box dirty on EVERY datapoint, including the
             * once-a-second watchdog, so this used to rebuild the card's
             * innerHTML about once a second even when nothing visible moved. A
             * click needs mousedown AND mouseup on the same element, so
             * anything clickable inside the card -- the `configure` link -- had
             * a one-second window that kept being reset underneath the pointer.
             * It presents as a link that "sometimes does not take", which reads
             * as flakiness rather than as the DOM being replaced mid-press.
             *
             * This is cheap because a steady box produces IDENTICAL markup
             * between ticks: `seen` reads "now" under 2 s and `up` is bucketed
             * to minutes past 90 s, so neither churns; di/do only change on real
             * edges. cardHtml() is recomputed either way -- it is a string
             * build, not a layout -- and only the DOM write is skipped. */
            const html = cardHtml(b);
            if (html !== b.lastHtml) { el.innerHTML = html; b.lastHtml = html; }
        }
    }
    dirty = new Set();
    /* Liveness drives this, and liveness changes with the CLOCK, not with the
     * box list -- so it belongs on the per-second render pass. Wiring it only
     * to the picker's rebuild meant the button stayed hidden after a box went
     * quiet, which is the exact moment it becomes the only useful control. */
    syncCfgForget();
    syncCfgBar();
}

/* The configure control lives in the HEADER, not in the cards.
 *
 * Cards are pure mirrors of datapoints -- they are rebuilt whenever a value
 * moves, which for a live box is about once a second. Anything clickable inside
 * them therefore has a one-second window that keeps being reset under the
 * pointer, because a click needs mousedown AND mouseup on the SAME element.
 * That is fixable by memoising the markup (and it still is, below), but it
 * makes every future card change quietly load-bearing: add one more live field
 * and the buttons start missing again, for reasons nobody will connect.
 *
 * Keeping the cards read-only removes the class of bug instead of managing it.
 * The header does not participate in the datapoint render loop at all, and the
 * picker below is rebuilt only when the SET OF BOXES changes -- not when their
 * values do -- so the control a person is aiming at simply never moves. */
let cfgNames = '';
function syncCfgBar() {
    const names = [...boxes.keys()].sort();
    const key = names.join(',');
    if (key === cfgNames) return;              /* box list unchanged -- leave it alone */
    cfgNames = key;
    const bar = document.getElementById('cfgbar');
    const sel = document.getElementById('cfgsel');
    bar.hidden = names.length === 0;
    const keep = sel.value;
    sel.innerHTML = names.map(n => `<option${n === keep ? ' selected' : ''}>${esc(n)}</option>`).join('');
    syncCfgForget();          /* liveness may have flipped since the last pass */
}

/* ---- host-side PTP health ----
 *
 * The per-box rows already show `sync <source> <transport> <ppm>` -- whether
 * THAT box is on dserv's timeline. What no box row can show is the AGGREGATE,
 * and the aggregate is where the interesting failure lives:
 *
 *     ptp/anchored < ptp/boxes   =   a LIVE box is not anchored
 *
 * config/ptpconf.tcl publishes those two together, from the same box list at
 * the same instant, specifically so something can compare them (they used to be
 * published at different times and could disagree for five minutes purely from
 * staleness). Until now the only consumer was rig_check -- so on 2026-08-09 the
 * numbers were sitting there, correct, and nobody looked. A chip you cannot help
 * seeing is the entire point; a page you have to remember to open would have
 * failed the same way.
 *
 * Ages here use LOCAL arrival time, like everything else on this page -- see
 * js/clock_skew.js for why this page deliberately does not age against
 * msg.timestamp. */
const ptp = { seen: false, at: 0, boxes: null, anchored: null,
              error: '', periodS: 300, dUs: null };

/* Kept SEPARATE from ptp, because it has a different source and a different
 * lifetime. system/clock_* comes from the dserv core (dserv.cpp
 * publishClockHealth), not from the ptp subprocess, so it exists on every host
 * -- including the ones with no PHC, where dsconf.tcl never starts ptpconf at
 * all. Those are exactly the hosts most likely to have a bad clock (no PHC
 * usually means no RTC either), which is why this must not hang off ptp.seen. */
const clk = { error: '', skewUs: null };

function onSystemClock(msg) {
    let v = msg.data !== undefined ? msg.data : msg.value;
    if (typeof v === 'string') v = v.split('\x00')[0];
    if (msg.name === 'system/clock_error')        clk.error  = String(v);
    else if (msg.name === 'system/clock_skew_us') clk.skewUs = Number(v);
    else return;
    renderPtp();
}

/* Microseconds spanning nine orders of magnitude -- a healthy clock skew is
 * single-digit µs, a broken one is hours -- so the unit has to follow the value. */
function fmtUs(us) {
    const a = Math.abs(us);
    if (a < 1000)    return `${us} µs`;
    if (a < 1000000) return `${(us / 1000).toFixed(1)} ms`;
    if (a < 90000000) return `${(us / 1e6).toFixed(2)} s`;
    return fmtAge(a / 1000).replace(' ago', '');
}

function onPtp(msg) {
    const m = /^ptp\/(.+)$/.exec(msg.name);
    if (!m) return;
    let v = msg.data !== undefined ? msg.data : msg.value;
    if (typeof v === 'string') v = v.split('\x00')[0];      /* trailing C NUL */

    /* ANY ptp/* leaf proves the subprocess is alive, so freshness is stamped
     * before the switch -- ptp/stdout and the diagnostic leaves are just as good
     * evidence as the ones drawn. */
    ptp.seen = true;
    ptp.at = Date.now();
    switch (m[1]) {
      case 'boxes':        ptp.boxes = Number(v); break;
      case 'anchored':     ptp.anchored = Number(v); break;
      case 'error':        ptp.error = String(v); break;
      case 'period_s':     ptp.periodS = Number(v) || 300; break;
      case 'd_us':         ptp.dUs = Number(v); break;
      default: return;                                       /* freshness only */
    }
    renderPtp();
}

function renderPtp() {
    const el = document.getElementById('ptp');
    if (!el) return;
    /* TWO independent reasons to appear, and the clock one is not gated on PTP.
     * No ptp/* keys at all = this host has no PTP (dsconf.tcl gates ptpconf on
     * /sys/class/ptp/ptp* existing), and such a host must not grow a
     * permanently-unknown chip -- but it CAN still have a broken clock, and that
     * is worth showing on its own. */
    if (!ptp.seen && !clk.error) { el.hidden = true; return; }
    el.hidden = false;

    const n = ptp.anchored, b = ptp.boxes;
    const count = (n != null && b != null) ? `${n}/${b}` : '—';
    const stale = Date.now() - ptp.at;
    /* Two sweeps plus slack. ptp/* is republished every ptp/period_s (300 s by
     * default), so anything approaching that is normal and only a missed sweep
     * is evidence. */
    const staleLimit = Math.max(ptp.periodS * 2500, 60000);

    let cls, txt, tip;
    if (clk.error) {
        /* Labelled "clock skew", not "PTP clock skew": it is a dserv fact, and
         * on a host with no PTP this is the only thing the chip is here to say. */
        cls = 'bad'; txt = 'clock skew'; tip = clk.error;
    } else if (ptp.error) {
        cls = 'bad'; txt = `PTP ${count} error`; tip = ptp.error;
    } else if (n != null && b != null && n < b) {
        cls = 'bad'; txt = `PTP ${count} anchored`;
        tip = `${b - n} live box(es) NOT anchored to dserv's timeline — they will refuse `
            + `scheduled (at_abs) actions. An anchor never survives a box reboot; ptpconf `
            + `re-pushes on connect and every ${ptp.periodS}s.`;
    } else if (stale > staleLimit) {
        cls = 'warn'; txt = `PTP ${count} stale`;
        tip = `last ptp/* update ${fmtAge(stale)} — sweep is every ${ptp.periodS}s. `
            + `These numbers are retained, so they stay plausible after the publisher stops.`;
    } else {
        cls = 'ok'; txt = `PTP ${count}`;
        /* D is tens of SECONDS (it is the offset between two unrelated epochs,
         * not an error term), so a fixed ms unit prints an unreadable -37000.0.
         * Same for skew, which is microseconds when healthy and hours when not. */
        tip = `${n} of ${b} live box(es) anchored to dserv's timeline`
            + (ptp.dUs    != null ? ` · D ${fmtUs(ptp.dUs)}` : '')
            + (clk.skewUs != null ? ` · clock ${fmtUs(clk.skewUs)} vs wall` : '')
            + ` · updated ${fmtAge(stale)}`;
    }
    if (el.className !== 'chip ' + cls) el.className = 'chip ' + cls;
    if (el.textContent !== txt) el.textContent = txt;
    if (el.title !== tip) el.title = tip;
}

/* refresh ages + liveness once a second even without updates */
setInterval(() => { for (const n of boxes.keys()) dirty.add(n); scheduleRender(); renderPtp(); }, 1000);

/* after the initial burst of one-shot gets settles, live presses start counting */
function markReadySoon() {
    setTimeout(() => { for (const b of boxes.values()) b.ready = true; }, 1500);
}

function setConn(ok, msg) {
    const el = document.getElementById('conn');
    el.className = ok === null ? '' : ok ? 'ok' : 'bad';
    document.getElementById('conn-msg').textContent = msg;
}

function initCfgBar() {
    document.getElementById('cfggo').addEventListener('click', () => {
        const n = document.getElementById('cfgsel').value;
        if (n) window.open(cfgHref(n), '_blank', 'noopener');
    });
    document.getElementById('cfgforget').addEventListener('click', () => {
        const n = document.getElementById('cfgsel').value;
        if (n) forgetBox(n);
    });
    document.getElementById('cfgsel').addEventListener('change', syncCfgForget);
}

/* `forget` beside the configure picker, shown only when the SELECTED box is
 * offline. Two reasons this belongs here as well as on the card:
 *
 * Configuring a box that is not talking is the one thing this bar cannot do --
 * the config page needs a live box to answer -- so for an offline selection the
 * space is otherwise dead, and "forget" is the only action that still means
 * anything.
 *
 * And it is FINDABLE. The per-card button is small, grey and inside a dimmed
 * card, which is exactly where the eye stops looking once a card reads as
 * dead. A control in the header is where someone goes when they want to act on
 * a box rather than read it. */
function syncCfgForget() {
    const btn = document.getElementById('cfgforget');
    if (!btn) return;
    const n = document.getElementById('cfgsel').value;
    const b = n ? boxes.get(n) : null;
    btn.hidden = !(b && Date.now() - b.lastSeen >= 4000);
}

async function init() {
    initCfgBar();
    /* ?host=<host[:port]> -> watch a different rig's dserv (default: the one
     * serving this page), ?ssl=1|0 when the page and dserv protocols differ --
     * the standard three lines (www/CLAUDE.md). ssl was missing here, so the
     * zero-deploy dev loop (http://localhost:8090 against a wss dserv) sat on
     * "connecting" forever while extio-config.html connected fine. */
    const qs = new URLSearchParams(location.search);
    const qsHost = qs.get('host'), qsSsl = qs.get('ssl');
    conn = new DservConnection({
        subprocess: 'ess',
        dservHost: qsHost || null,
        forceSecure: qsSsl !== null ? qsSsl === '1' : undefined,
        onStatus: (st, msg) => setConn(st === 'connected' ? true : st === 'connecting' ? null : false, st),
    });
    try {
        await conn.connect();
    } catch (e) {
        setConn(false, 'connection failed');
        return;
    }
    setConn(true, 'connected');

    dp = new DatapointManager(conn, { autoGetKeys: false });
    dp.subscribe('extio/*', onExtio);          /* live stream, all boxes */
    dp.subscribe('ptp/*', onPtp);              /* host-side PTP health (the chip) */
    /* Named exactly, not system/*: that tree carries a dozen unrelated keys
     * (hostname, version, os, webport, boot_stage...) this page has no use for. */
    dp.subscribe('system/clock_error',   onSystemClock);
    dp.subscribe('system/clock_skew_us', onSystemClock);
    /* Subscriptions fire on CHANGE only, and the discovery set changes rarely
     * once a rig is settled -- without seeding the retained value the panel
     * stays empty until a box appears or leaves, which on a stable rig could be
     * days. (Same trap as ess_app.js's requestInitialData touch list.) */
    dp.sendGet('extio/discovered');

    /* @keys is PUSHED by dserv on every key add/remove (set_key_dpoint), so this
     * fires live: seed retained values for new keys, and PRUNE boxes whose keys
     * were cleared (dservClear / cleanup) -- offline boxes keep their dim card
     * as long as their keys remain; cleared boxes disappear. */
    dp.on('keys:update', ({ keys }) => {
        const present = new Set();
        for (const k of keys) {
            /* ptp/* is seeded from @keys rather than a fixed sendGet list, and
             * that is what makes the chip self-gating: ptpconf sweeps every
             * 300 s, so a page opened between sweeps would otherwise sit blank
             * for five minutes -- while a host with no PTP has no ptp/* keys at
             * all, asks for nothing, and correctly never shows the chip. */
            if (k.startsWith('ptp/') || k.startsWith('system/clock_')) {
                if (!fetched.has(k)) { fetched.add(k); dp.sendGet(k); }
                continue;
            }
            /* host/ = extioconf's per-box voice (connect counter): seed it too,
             * else the count only appears after the NEXT live announce */
            const m = /^extio\/([^/]+)\/(?:state|host)\//.exec(k);
            if (!m) continue;
            present.add(m[1]);
            if (!fetched.has(k)) {
                fetched.add(k);
                dp.sendGet(k);
            }
        }
        for (const name of [...boxes.keys()])
            if (!present.has(name)) {
                boxes.delete(name);
                const el = document.getElementById('box-' + name);
                if (el) el.remove();
            }
        document.getElementById('empty').style.display = boxes.size ? 'none' : '';
        markReadySoon();
    });
    dp.refreshKeys();
}

init();
</script>
</body>
</html>
