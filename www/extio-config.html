<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extio setup</title>
<link rel="stylesheet" href="css/page_nav.css">
<style>
:root {
  --bg:#12141a; --panel:#1b1e26; --line:#2b3040; --ink:#dfe3ec; --dim:#8d95a8;
  --ok:#4ec97a; --warn:#e3b341; --bad:#e5534b; --accent:#5aa9e6;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font:14px/1.45 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px;
         border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
#conn { font-size:12px; color:var(--dim); }
#conn.up::before   { content:"● "; color:var(--ok); }
#conn.down::before { content:"● "; color:var(--bad); }

main { display:grid; grid-template-columns:300px 1fr; gap:0; height:calc(100vh - 45px); }
#fleet { border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); }
#panel { overflow-y:auto; padding:16px 20px; }

.box { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.box:hover { background:#222634; }
.box.sel  { background:#243049; box-shadow:inset 3px 0 0 var(--accent); }
.box .nm  { font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
.box .sub { font-size:12px; color:var(--dim); margin-top:2px; }
/* OFFLINE IS A VISUAL STATE, not a field you have to read. dserv retains every
   datapoint forever, so a dead box renders a complete and entirely current-
   looking card unless the UI says otherwise. */
.box.stale { opacity:.45; }
.pill { font-size:11px; padding:1px 7px; border-radius:9px; border:1px solid var(--line); }
.pill.ok   { color:var(--ok);   border-color:#2c5b3c; }
.pill.warn { color:var(--warn); border-color:#5b4a1e; }
.pill.bad  { color:var(--bad);  border-color:#5b2c29; }

h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
     margin:22px 0 8px; font-weight:600; }
h2:first-child { margin-top:0; }
table { border-collapse:collapse; width:100%; max-width:900px;
        /* TABULAR FIGURES. Live values re-render in place, and with
         * proportional digits every change re-measures the column --
         * the table visibly shimmers as a joystick moves. Fixed-width
         * digits make a value change cost no width change. */
        font-variant-numeric: tabular-nums; }
/* ...and reserve the width, so a value that loses a DIGIT (1000 -> 999)
 * cannot reflow the column either. */
span[data-ain-grp] { display:inline-block; min-width:14ch; }
td,th { padding:4px 10px 4px 0; text-align:left; vertical-align:top; font-size:13px; }
th { color:var(--dim); font-weight:500; }
tr.row:hover { background:#1e2230; }
.age { font-size:11px; color:var(--dim); }
.age.old { color:var(--warn); }
.age.dead { color:var(--bad); }
input,select { background:#141720; color:var(--ink); border:1px solid var(--line);
               border-radius:4px; padding:3px 6px; font:inherit; font-size:13px; }
input:focus,select:focus { outline:none; border-color:var(--accent); }
input.w4 { width:78px; } input.w8 { width:150px; }
button { background:#232838; color:var(--ink); border:1px solid var(--line);
         border-radius:5px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background:#1d4f7c; border-color:#2d6da6; }
button.danger  { background:#5b2c29; border-color:#7a3a36; }
#dirty { margin:14px 0; padding:9px 12px; border-radius:6px;
         background:#3a3115; border:1px solid #5b4a1e; color:var(--warn); font-size:13px; }
#dirty.hide { display:none; }
/* The server-clock banner is an ERROR, not a warning, and it sits ABOVE main
   rather than inside it. While it is up, every age and every liveness pill on
   this page is measured against the wrong zero and none of them can be
   believed -- so it displaces the layout on purpose. Being unmissable is the
   entire point: the failure it reports is otherwise indistinguishable from
   "the whole rig is offline". */
#clockwarn { margin:0; padding:10px 16px; font-size:13px; line-height:1.5;
             background:#4a1f1c; border-bottom:1px solid #7a3a36; color:#ffb3ab; }
#clockwarn.hide { display:none; }
#clockwarn b { color:#fff; }
#clockwarn code { background:#2c1210; color:#ffd9d4; }
.note { color:var(--dim); font-size:12px; margin:6px 0 0; max-width:760px; }
.empty { color:var(--dim); padding:40px 0; text-align:center; }
input.wo { border-style:dashed; color:var(--warn); }
input.wo::placeholder { color:#6b6350; font-style:italic; }
/* Commit lifecycle, on the CONTROL rather than in a banner: amber while the
   text differs from the box (typed, not applied), blue while a write awaits
   the box's readback, a green flash when the readback matches, red when the
   box answered with something else (refused / clamped / normalised). */
input.editing, select.editing   { border-color:var(--warn); }
input.pending, select.pending   { border-color:#2d6da6; }
input.mismatch, select.mismatch { border-color:var(--bad); }
@keyframes okflash { from { box-shadow:0 0 0 2px #2c5b3c; border-color:var(--ok); }
                     to   { box-shadow:none; } }
input.confirmed, select.confirmed { animation: okflash 1s ease-out; }
code { background:#141720; padding:1px 5px; border-radius:3px; font-size:12px; }
/* Save/Reboot ride the bottom of the viewport: the dirty banner lives at the
   top of a panel that got LONG (pins + two group tables), and a Save you have
   to scroll to find is a Save that does not happen before the next reboot. */
#actionbar { position:sticky; bottom:0; margin-top:22px; padding:12px 0 14px;
             display:flex; gap:10px; align-items:center;
             background:linear-gradient(to bottom, transparent, var(--bg) 26%); }
</style>
</head>
<body>
<header>
  <h1>extio setup</h1>
  <span id="conn" class="down">connecting…</span>
  <span style="flex:1"></span>
  <span class="age" id="hint">config applies live · Save persists it</span>
</header>

<div id="clockwarn" class="hide"></div>

<main>
  <div id="fleet"><div class="empty">looking for boxes…</div></div>
  <div id="panel"><div class="empty">select a box</div></div>
</main>

<script src="js/ws_manager.js"></script>
<script src="js/DatapointManager.js"></script>
<script src="js/PageNav.js"></script>
<script src="js/clock_skew.js"></script>
<script src="js/extio_silk.js"></script>
<script src="js/extio_ain.js"></script>
<script>
/* extio setup page -- fleet list + per-box configuration, over datapoints.
 *
 * SCOPE, deliberately: everything a box can be told once it is ALREADY talking
 * to dserv. Bringing an unconfigured box onto the network (serial, the UDP
 * beacon, its first address) stays with extio-setup, because none of it can be
 * done through a datapoint the box cannot yet receive. The one overlap is
 * dserv/ip: settable here, because a box that is connected can be re-pointed at
 * another dserv -- it just cannot be pointed at its first one.
 *
 * TWO RULES THIS PAGE EXISTS TO ENFORCE, both learned the hard way:
 *
 *   1. dserv RETAINS. Every value below is rendered WITH ITS AGE, and a box
 *      whose watchdog has stopped advancing goes visibly dim. A dead box
 *      otherwise serves its last values forever and every field reads healthy --
 *      that has produced wrong conclusions repeatedly, including a test harness
 *      that scored 8/8 while measuring nothing.
 *   2. LIVE IS NOT SAVED. Config applies immediately and is lost on reboot until
 *      cmd/save. The banner tracks exactly which leaves are dirty.
 *
 * AND ONE RENDERING DISCIPLINE, which is what keeps the page equally usable
 * from Safari and from Windows browsers: STRUCTURE and VALUES update on
 * separate paths. The DOM is rebuilt only when panelSignature() changes
 * (rows appearing, capabilities flipping) -- with focus, caret and half-typed
 * text restored -- while everything else flows into the standing DOM in
 * place: form controls through syncBinds (data-bind/data-ctl, plus the
 * pending-write ledger that turns a box's readback into a green flash or a
 * red refusal), display text through tickAges (data-val/-age/-up/-clk/-ota/
 * -clamp spans). Nothing is ever gated on where focus is -- that gate froze
 * the page on any OS that gives buttons click focus. */
let conn = null, dp = null;
const boxes = new Map();          /* name -> {leaf: {v, t}} */
let sel = null, fetched = new Set(), pendingSelect = null;

const now = () => Date.now() * 1000;   /* dserv timestamps are microseconds */

/* Server-clock check lives in js/clock_skew.js -- it is page-agnostic, and any
 * page that ages against msg.timestamp (as this one deliberately does) needs it.
 * See that file for why the estimator is a rolling minimum. */
const clockSkew = ClockSkew.create({ elementId: 'clockwarn' });
const noteServerClock = ts => clockSkew.note(ts);
const renderClockWarn = () => clockSkew.render();

function setConn(up, msg) {
  const el = document.getElementById('conn');
  el.className = up ? 'up' : 'down';
  el.textContent = msg;
}

/* ---- datapoint plumbing ----
 *
 * DatapointManager invokes callbacks with ONE OBJECT, not (name, value, ts).
 * Getting that wrong is silent: the regex below runs against an object, never
 * matches, every update is discarded, and the page sits on "no boxes seen"
 * while the socket is plainly connected. Signature copied from extio.html,
 * which is the working reference. */
function onExtio(msg) {
  /* Rename tombstone (extio/renamed = "<old> <new>"): the publisher purged
   * the old identity server-side, but deletions are never pushed -- without
   * this, every page EXCEPT the one that clicked Rename keeps a ghost card
   * and a frozen panel under the old name. Retained-value safe: deleting an
   * unknown name is a no-op, and selection only moves when it is actually
   * parked on the ghost. */
  if (msg.name === 'extio/renamed') {
    const v = String(msg.data !== undefined ? msg.data : msg.value || '').split('\x00')[0];
    const [old, neu] = v.trim().split(/\s+/);
    renamingTo = null;                    /* in-flight banner: the event answers it */
    if (old && boxes.delete(old)) {
      fleetHtml = null;
      if (sel === old) {
        if (neu && boxes.has(neu)) { selectBox(neu); }
        else { sel = null; panelSig = null; renderFleet(); renderPanel(); }
      } else {
        renderFleet();
      }
    }
    return;
  }
  const m = /^extio\/([^/]+)\/state\/(.+)$/.exec(msg.name);
  if (!m) return;
  const [, box, leaf] = m;
  let v = msg.data !== undefined ? msg.data : msg.value;
  /* Box string datapoints carry a trailing C NUL -- dserv_msg_string sends
   * strlen+1 -- so `pins/in` arrives as "0,1,4,12\0" and Number("12\0") is
   * NaN. Cut at the NUL before anything else touches the value. */
  if (typeof v === 'string') v = v.split('\x00')[0];
  if (!boxes.has(box)) boxes.set(box, {});
  /* dserv's timestamp is microseconds; fall back to arrival time so a value
   * without one still ages rather than appearing frozen at zero. */
  noteServerClock(msg.timestamp);
  boxes.get(box)[leaf] = { v, t: msg.timestamp || now() };
  if (pendingSelect && box === pendingSelect) { pendingSelect = null; selectBox(box); return; }
  renderFleet();
  if (box === sel) schedulePanel();
}

const get = (box, leaf, dflt = null) => {
  const b = boxes.get(box); if (!b || !(leaf in b)) return dflt;
  return b[leaf].v;
};
const ageOf = (box, leaf) => {
  const b = boxes.get(box); if (!b || !(leaf in b)) return null;
  return (now() - b[leaf].t) / 1e6;
};

/* A box is live if its WATCHDOG is advancing -- not if it has values. The
 * watchdog is published once a second for exactly this purpose, and it is the
 * only leaf whose staleness is unambiguous. */
function liveness(box) {
  const a = ageOf(box, 'watchdog');
  if (a === null) return { cls: 'bad', txt: 'no watchdog' };
  if (a > 10) return { cls: 'bad',  txt: 'offline ' + agePlain(box, 'watchdog') };
  if (a > 3)  return { cls: 'warn', txt: 'slow ' + agePlain(box, 'watchdog') };
  return { cls: 'ok', txt: 'live' };
}
function fmtAge(s) {
  if (s === null) return '—';
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + 'm';
  return Math.round(s / 3600) + 'h';
}
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* EVERYTHING THAT CHANGES ON ITS OWN IS AN EMPTY SPAN, filled in place.
 *
 * The panel's DOM is replaced only when its STRUCTURE changes (see
 * panelSignature). Anything else -- ages, live values, counters, streaming
 * blocks, the up-since line, OTA progress -- must therefore be a data-*
 * span that tickAges() fills, never inline text: inline text either forces
 * a structural rebuild for a cosmetic change, or (worse) silently goes
 * stale because nothing rebuilds. The same rule, from the other side, is
 * why every form control carries data-bind: syncBinds() keeps its value
 * current in place, so a rebuild is never needed just to show a readback.
 *
 * ageSpan always emits the span, even for a leaf not yet seen: the ticker
 * leaves it empty until data arrives. Presence decided at build time was a
 * quiet staleness bug (a leaf arriving later never got its age).
 *
 * data-age-plain marks spans inside styled parents (the liveness pill) whose
 * class must not be overwritten by the age bucket. */
function ageSpan(box, leaf) {
  return `<span class="age" data-age-box="${esc(box)}" data-age-leaf="${esc(leaf)}"></span>`;
}
function agePlain(box, leaf) {
  return `<span data-age-box="${esc(box)}" data-age-leaf="${esc(leaf)}" data-age-plain="1"></span>`;
}
function tickAges(root) {
  /* Composite cells first, plain values second, AGES LAST: the composite
   * fills inject fresh ageSpan markup each pass, and the age loop must see
   * those spans in the same tick or they render empty for a second. None of
   * these contain anything clickable (buttons stay OUTSIDE the spans), so
   * re-setting innerHTML at 1 Hz destroys nothing a pointer aims at. */
  for (const el of root.querySelectorAll('[data-up-box]')) {
    const u = upInfo(el.dataset.upBox);
    el.innerHTML = !u ? '<span class="age">unknown — no watchdog yet</span>'
      : `${esc(fmtBoot(u.boot))} · ${u.live ? 'up' : '<span class="age dead">was up</span>'} ${esc(fmtDur(u.upUs))}`;
  }
  for (const el of root.querySelectorAll('[data-clk-box]')) {
    const b = el.dataset.clkBox;
    /* Prefer the MANIFEST leaf, fall back to the telemetry one. Firmware
     * before the announce gained ain/clk_ppm still reports the applied value
     * under ain/dbg, and showing "—" for a box that is in fact calibrated
     * would be its own small lie. */
    const appliedLeaf = get(b, 'ain/clk_ppm', null) !== null ? 'ain/clk_ppm' : 'ain/dbg/clk_ppm';
    const applied = get(b, appliedLeaf, null);
    /* meas WITH ITS AGE, because clk_ppm_meas is a full-telemetry leaf and
     * dserv retains: at health it keeps rendering whatever the last full
     * session left, which reads as a live measurement and is not one. */
    const meas = get(b, 'ain/dbg/clk_ppm_meas', null);
    el.innerHTML = `${applied === null ? '—' : `<b>${esc(applied)}</b> ${ageSpan(b, appliedLeaf)}`} ${
      meas === null ? '<span class="age">measured: — (set telemetry=full)</span>'
                    : `<span class="age">measured: ${esc(meas)}</span> ${ageSpan(b, 'ain/dbg/clk_ppm_meas')}`}`;
  }
  for (const el of root.querySelectorAll('[data-ota-box]')) {
    const b = el.dataset.otaBox;
    const lc = get(b, 'ota/lifecycle', null);
    const prog = get(b, 'ota/progress', null);
    const busy = lc !== null && OTA_BUSY.includes(String(lc));
    el.innerHTML = lc === null ? '' :
      `<b>${esc(lc)}</b> ${ageSpan(b, 'ota/lifecycle')}${prog !== null && busy ? ` · ${esc(prog)}%` : ''}`;
  }
  /* The cap the FIRMWARE silently enforces, made visible: pre-+83 firmware
   * stores an over-cap batch and samples the clamp -- a config field that
   * lies, and this row is where it is caught. Recomputed here because it
   * depends on two VALUES (batch, chans), not on structure. */
  for (const el of root.querySelectorAll('[data-clamp-box]')) {
    const b = el.dataset.clampBox, gn = el.dataset.clampGrp;
    const nch = String(get(b, `ain/group/${gn}/chans`, '')).split(',').filter(x => x !== '').length;
    const cur = Number(get(b, `ain/group/${gn}/batch`, 0));
    const cap = nch ? Math.max(1, Math.floor(24 / nch)) : 0;
    const over = nch > 0 && cur > 0 && cur > cap;
    el.textContent = over ? `→ clamped to ${cap}` : '';
    el.title = over ? `batch × channels must be ≤ 24; the box will sample ${cap}` : '';
  }
  for (const el of root.querySelectorAll('[data-val-leaf]')) {
    const v = get(el.dataset.valBox, el.dataset.valLeaf, null);
    el.textContent = v === null ? (el.dataset.valDflt !== undefined ? el.dataset.valDflt : '—') : v;
  }
  for (const el of root.querySelectorAll('[data-ain-grp]')) {
    const bb = boxes.get(el.dataset.ainBox) || {};
    const raw = bb['ain/' + el.dataset.ainGrp];
    const blk = raw && Array.isArray(raw.v) ? ExtioAinBlock.decode(raw.v) : null;
    /* interval_us states the MODE (0 = on-change, else decimate*base_period);
     * count is the batch size and states nothing. Testing count>1 labelled a
     * continuous group with batch=1 as "on-change" -- see extio.html, same fix. */
    el.textContent = !blk ? '—'
      : blk.last.join(' ') + ' · ' + (blk.interval_us
          ? Math.round(1e6 / blk.interval_us) + ' Hz' +
            (blk.count > 1 ? ' ×' + blk.count : '') + (blk.avg ? ' avg' : '')
          : 'on-change');
  }
  for (const el of root.querySelectorAll('[data-grp]')) {
    const gb = el.dataset.grpBox, gg = el.dataset.grp;
    const val = get(gb, `group/${gg}`, null);
    const dec = decodeChord(gb, csvNums(get(gb, `group/${gg}/pins`)), val);
    el.innerHTML = (val === null ? '—' : esc(val)) + (dec ? ` <b>${esc(dec)}</b>` : '');
  }
  for (const el of root.querySelectorAll('[data-age-leaf]')) {
    const a = ageOf(el.dataset.ageBox, el.dataset.ageLeaf);
    if (a === null) continue;
    el.textContent = fmtAge(a);
    if (!('agePlain' in el.dataset)) {
      el.className = 'age ' + (a > 60 ? 'dead' : a > 10 ? 'old' : '');
    }
  }
}

/* ---- writes: named procs in the extio interp, never raw datapoint pokes ---- */
const dirtyText = () => dirty.size
  ? `${dirty.size} unsaved change(s): <code>${[...dirty].join('</code> <code>')}</code>` +
    ' — applied live, but lost on reboot until you Save.'
  : '';
const saveText = () => `Save to flash${dirty.size ? ` (${dirty.size})` : ''}`;

/* Update ONLY the dirty banner and the Save button, in place: dirty-ness is
 * page state, not box state, so no datapoint will ever arrive to refresh it
 * and no structural rebuild is owed for it. */
function updateDirtyUi() {
  const banner = document.getElementById('dirty');
  const btn = document.getElementById('savebtn');
  if (banner) { banner.innerHTML = dirtyText(); banner.className = dirty.size ? '' : 'hide'; }
  if (btn) { btn.textContent = saveText(); btn.disabled = dirty.size === 0; }
}

/* `el` is the control the edit came from (inline handlers pass `this`). A
 * BOUND control enters the pending ledger: it keeps showing the committed
 * value until the box's readback confirms it (green flash), or fails to
 * within PENDING_MS (red, titled with what the box actually reports). That
 * ledger -- not the control's transient DOM -- is the source of truth, so it
 * survives structural rebuilds: create a group and the confirmation lands on
 * the REAL row that replaces the creation row. Unbound controls (write-only
 * leaves, creation inputs) get no pending state: with no readback there is
 * nothing honest to confirm. */
async function cfgSet(box, leaf, value, el) {
  const bound = el && el.dataset &&
                (el.dataset.bind !== undefined || el.dataset.pinMode !== undefined);
  try {
    await conn.send(`extio_cfg_set ${box} ${leaf} {${value}}`, 'extio');
    if (bound) {
      pendingByCtl.set(el.dataset.ctl, { v: String(value), t: Date.now() });
      clearMismatch(el);
      el.classList.remove('editing');
      el.classList.add('pending');
    } else if (el && el.classList) {
      el.classList.remove('editing');
    }
    dirty.add(leaf);
    updateDirtyUi();
    renderPanel();
    askAnnounce(box);
  } catch (e) {
    /* the write never reached the box: drop the phantom and show its truth */
    if (bound) {
      pendingByCtl.delete(el.dataset.ctl);
      el.classList.remove('editing', 'pending');
      const cur = boundValue(el);
      if (cur !== null) setVal(el, cur);
    }
    alert(`set ${leaf} failed: ${e.message || e}`);
  }
}

/* DRIVE AN OUTPUT PIN, for bench work: loopback a DO into a DI, or find which
 * header pin is actually wired to the thing you are holding.
 *
 * Offered ONLY for pins whose mode is `out`, which is not merely cosmetic --
 * since 0.4.0+80 the firmware REFUSES cmd/do on a pin it does not consider an
 * output (dbg/do_refused counts them) rather than silently re-muxing the pad.
 * So a button on an input would do nothing, and showing it would be the same
 * lie this page exists to avoid.
 *
 * This writes the cmd/do datapoint directly rather than going through an
 * extio_* proc: cmd/do/<pin> is the box's documented wire contract and needs no
 * host-side support, so bench debugging keeps working against a dserv that has
 * not been updated. It is NOT config -- nothing is persisted and nothing is
 * marked dirty. */
async function doSet(box, pin, v) {
  try { await conn.send(`dservSet extio/${box}/cmd/do/${pin} ${v}`, 'extio'); }
  catch (e) { alert(`do ${pin}=${v} failed: ${e.message || e}`); }
}
/* The VALUE of cmd/do/<n>/pulse_us IS THE WIDTH, not a trigger -- send 1 and you
 * get a 1 µs pulse nobody will ever see. Use the pin's own configured pulse_us
 * so the button does what the row says, falling back to 100 ms: a bench default
 * you can watch on an LED, where an unset (0) width would simply be refused.
 * Looked up at CLICK time, not baked into the onclick at build time: rebuilds
 * are rare now, so a baked width would outlive a pulse_us edit. */
async function doPulse(box, pin) {
  const us = Number(sparse(get(box, 'pins/pulse_us')).get(pin)) || 100000;
  try { await conn.send(`dservSet extio/${box}/cmd/do/${pin}/pulse_us ${us}`, 'extio'); }
  catch (e) { alert(`pulse ${pin} failed: ${e.message || e}`); }
}

/* Batch input plus the firmware-clamp flag. ain_group_batch_eff() clamps
 * batch so batch*nchan <= AIN_BLOCK_MAX (24 int16s per block) without
 * refusing the write; the flag span is tick-filled (data-clamp-*) because it
 * depends on two VALUES and must track them without a rebuild. */
function batchCell(b, gn, i) {
  return field(b, `ain/group/${gn}/batch`, `ain/group/${i}/batch`) +
    ` <span class="age" style="color:#ffb4a8" data-clamp-box="${esc(b)}" data-clamp-grp="${esc(gn)}"></span>`;
}

/* ---- pacing / telemetry / clock-calibration controls ----
 *
 * These three are config leaves the box has had for a while with no UI, so they
 * were reachable only from the console or a raw datapoint write. A setting you
 * cannot see is the same problem as one that lies. */
const selOf = (b, leaf, wLeaf, dflt, opts) => {
  const cur = String(get(b, leaf, dflt));
  return `<select data-ctl="${esc(b)}|${wLeaf}" data-bind="${leaf}" data-bind-box="${esc(b)}"
            data-dflt="${dflt}" onchange="cfgSet('${esc(b)}','${wLeaf}',this.value,this)">` +
    opts.map(o => `<option ${o === cur ? 'selected' : ''}>${o}</option>`).join('') + '</select>';
};

const paceSel = (b) => selOf(b, 'ain/pace', 'ain/pace', 'auto', ['auto', 'polled', 'stream']);
const dbgLevelSel = (b) => selOf(b, 'dbg/level', 'dbg/level', 'health', ['health', 'full', 'off']);

/* APPLIED next to MEASURED, because the gap between them is the whole point:
 * they differ until someone calibrates, and that is the state worth seeing.
 * The values live in a tick-filled span (see tickAges) since both move on
 * their own; the button stays OUTSIDE the span so its DOM node is stable
 * under the pointer. */
function clkCell(b) {
  return `<span data-clk-box="${esc(b)}"></span>
    <button data-ctl="${esc(b)}|btn/calibrate"
            title="Adopt the measured value as this box's applied calibration. Needs a running stream and a settled estimate (~1-2 min); refuses otherwise."
            onclick="ainCalibrate('${esc(b)}')">Calibrate</button>`;
}

/* Calibration is a COMMAND, not config: it tells the box to adopt what it has
 * measured. The result still has to be Saved like any other config write --
 * the operator decides when a bench measurement becomes the box's constant. */
async function ainCalibrate(box) {
  try {
    await conn.send(`dservSet extio/${box}/cmd/ain/calibrate 1`, 'extio');
    askAnnounce(box);
    setTimeout(() => renderPanel(), 800);
  } catch (e) { alert(`calibrate failed: ${e.message || e}`); }
}

/* Ask the box to re-publish after an edit, DEBOUNCED.
 *
 * Only some config changes re-announce as a side effect; ain/rate, dserv/ip,
 * net/mode and pulse_us publish nothing at all, so without this the field you
 * just changed keeps showing the old value -- which looks exactly like the
 * write having failed, and would have people setting it twice.
 *
 * Debounced because a burst is ~40 frames: typing through four fields should
 * cost one re-announce, not four. 400 ms is longer than the gap between
 * keystroke-driven onchange events and far shorter than anyone waits before
 * deciding a UI is broken. */

    conn.send(`extio_cfg_announce ${box}`, 'extio').catch(() => {});
  }, 400);
}
let dirty = new Set();
let renamingTo = null;   /* {from, to} while a rename is in flight -- panel banner */

 * rebuilds and even across a group slot going from creation row to real row. */
const pendingByCtl = new Map();
const PENDING_MS = 6000;   /* announce debounce 400 ms + box round-trip, ×margin */
async function doSave(box) {
  await conn.send(`extio_cfg_save ${box}`, 'extio');
  dirty.clear(); updateDirtyUi(); renderPanel();
}
/* OTA. The lifecycle driver does the ordering, the retry-vs-fail decisions and
 * the deadlines (config/extioconf.tcl); the page is a window onto
 * state/ota/lifecycle, which is exactly why that roll-up key exists. Anything
 * cleverer here would be a second, divergent implementation of a state machine
 * that already has tests. */
async function otaUpdate(box) {
  /* channel read at CLICK time -- a baked onclick argument would outlive a
   * channel edit now that rebuilds are rare */
  const channel = String(get(box, 'channel', 'dev'));
  if (!confirm(`Update ${box} from the ${channel} shelf?\n\nThe box will reboot into a TRIAL boot and must be confirmed, or it reverts.`)) return;
  try { alert(await conn.send(`extio_ota_update ${box} ${channel}`, 'extio')); }
  catch (e) { alert('update failed to start: ' + (e.message || e)); }

}

async function otaConfirm(box) {
  try { alert(await conn.send(`extio_ota_confirm ${box}`, 'extio')); }
  catch (e) { alert('confirm failed: ' + (e.message || e)); }
}

async function doReboot(box) {
  if (dirty.size && !confirm(`${dirty.size} unsaved change(s) will be LOST. Reboot anyway?`)) return;
  await conn.send(`extio_cfg_reboot ${box}`, 'extio');
}

/* ---- fleet list ----
 *
 * MEMOISED, and that is a correctness fix rather than an optimisation. This
 * replaced #fleet wholesale on every datapoint update and every 1 Hz tick, and
 * a click needs mousedown and mouseup on the SAME element -- so a frame landing
 * mid-press destroyed the card and no click event fired at all. It presented as
 * "sometimes takes a few presses to select a box", which reads like a UI being
 * flaky rather than like the DOM being pulled out from under the pointer.
 *
 * The panel solved this by refusing to redraw while focus is inside it, but the
 * fleet list must keep ticking -- it is where liveness lives, and freezing it
 * would hide the one thing it exists to show. So instead: build the HTML, and
 * only touch the DOM when it actually DIFFERS. Card content changes when a
 * value or a liveness BUCKET changes, not with every tick, so the overwhelming
 * majority of renders now leave the DOM completely alone and a press always
 * lands. */
let fleetHtml = null;
function renderFleet() {
  const el = document.getElementById('fleet');
  const names = [...boxes.keys()].sort();
  if (!names.length) {
    const empty = '<div class="empty">no boxes seen</div>';
    if (fleetHtml !== empty) { el.innerHTML = fleetHtml = empty; }
    return;
  }
  const html = names.map(n => {
    const L = liveness(n);
    return `<div class="box ${n === sel ? 'sel' : ''} ${L.cls === 'bad' ? 'stale' : ''}"
                 onclick="selectBox('${n}')">
      <div class="nm"><span>${n}</span><span class="pill ${L.cls}">${L.txt}</span></div>
      <div class="sub">${get(n, 'ip', '—')} · ${get(n, 'board', '?')}</div>
      <div class="sub">v${get(n, 'fw_ver', get(n, 'fw', '?'))} · ain ${get(n, 'ain_en') == 1 ? 'on' : 'off'}</div>
    </div>`;
  }).join('');
  if (html !== fleetHtml) { el.innerHTML = fleetHtml = html; tickAges(el); }
}
function selectBox(n) {
  sel = n; dirty = new Set(); panelSig = null; renderFleet(); renderPanel(); refreshDirty(n);
  /* Opening a box asks it to describe itself: retained values may predate the
   * last edit made from a console, and there is no periodic re-announce. */
  if (conn) conn.send(`extio_cfg_announce ${n}`, 'extio').catch(() => {});
}

async function refreshDirty(box) {
  try {
    const r = String(await conn.send(`extio_cfg_dirty ${box}`, 'extio') || '');
    /* A Tcl-level error arrives as a RESOLVED "!TCL_ERROR ..." string, not a
     * rejection -- split blindly and the error MESSAGE becomes five fake
     * dirty leaves in the banner. No helper in the interp means no dirty
     * info, exactly like the catch below. */
    if (r.startsWith('!TCL_ERROR')) return;
    dirty = new Set(r.trim().split(/\s+/).filter(Boolean));
    updateDirtyUi(); renderPanel();
  } catch (e) { /* interp may predate the helper; the page still works read-only */ }
}

/* Rename is deliberately NOT a live-apply config field. Editing config/name
 * in place swaps the box's datapoint prefix under this page's feet: the
 * selection, dirty ledger, and every command target a name that no longer
 * answers, and a Save clicked afterwards is silently dropped by the box while
 * the ledger clears anyway -- the UI reports saved, and the next reboot
 * reverts the name. extio_rename (extioconf.tcl) runs the whole choreography
 * instead -- re-register, announce under the new name, save, purge the old
 * identity -- and this just follows along: the burst lands in `boxes` via our
 * ordinary subscription, at which point the ghost is dropped and the panel
 * switches. */
async function renameBox(box) {
  const to = prompt(`Rename ${box} to:`, box);
  if (to === null) return;
  const name = to.trim();
  if (!name || name === box) return;
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,14}$/.test(name)) {
    alert('Names are letters/digits/._- with a leading alphanumeric, at most 15 chars.');
    return;
  }
  let r;
  try { r = String(await conn.send(`extio_rename ${box} ${name}`, 'extio')); }
  catch (e) { alert(`rename refused: ${e.message}`); return; }
  if (r.startsWith('!TCL_ERROR')) { alert(`rename refused: ${r.slice(11).trim()}`); return; }
  /* Success is EVENT-DRIVEN from here: once the box is live + saved under the
   * new name, extio_rename publishes the extio/renamed tombstone and onExtio
   * reacts on THIS page exactly as on every bystander page -- ghost dropped,
   * selection follows. No initiator-only smarts. What IS page-local: the
   * in-flight banner (the box takes ~1-3 s to re-register, and a silent panel
   * under the old name reads as "nothing happened"), and the failure UX if
   * the tombstone never lands. */
  renamingTo = { from: box, to: name };
  panelSig = null; renderPanel();
  const t0 = Date.now();
  const tick = setInterval(() => {
    if (!boxes.has(box)) { clearInterval(tick); return; }   /* tombstone landed */
    if (Date.now() - t0 > 25000) {
      clearInterval(tick);
      renamingTo = null; panelSig = null; renderPanel();
      alert(`No rename event for '${name}' yet. On pre-+59 firmware the box HAS renamed live ` +
            `but cannot confirm: wait ~30 s, then Save from its panel -- or reboot it to revert.`);
    }
  }, 500);
}

/* ---- per-box panel ----
 *
 * Every editable control carries three data- attributes:
 *   data-ctl       "box|writeLeaf" -- its stable identity, used to key the
 *                  pending ledger and to restore focus across a rebuild.
 *   data-bind      the READ leaf syncBinds() keeps it current from (absent on
 *                  write-only and creation controls: nothing honest to show).
 *   data-bind-box  which box, so the sweep needs no context.
 * The read and write leaves genuinely differ on this box (announce publishes
 * label/<n>; you set pin/<n>/label) -- which is exactly why the binding must
 * name both, not guess one from the other. */
function field(box, leaf, cfgLeaf, opts = {}) {
  let v = get(box, leaf, null);
  if (v === null && opts.fallback !== undefined) v = opts.fallback;
  /* dserv serializes DSERV_INT unsigned, so the firmware's -1 "off" sentinel
   * (obs/sync pin) arrives as 4294967295 -- show what the grammar takes back */
  if (opts.i32 && v !== null && +v >= 0x80000000) v = +v - 0x100000000;
  const cls = opts.wide ? 'w8' : 'w4';
  /* esc(): labels/desc allow every printable except '/', so a quote in a
   * value would otherwise end the attribute and truncate the form */
  return `<input class="${cls}" value="${v === null ? '' : esc(v)}"
            data-ctl="${esc(box)}|${cfgLeaf}" data-bind="${leaf}" data-bind-box="${esc(box)}"${
            opts.i32 ? ' data-i32="1"' : ''}${
            opts.fallback !== undefined ? ` data-dflt="${esc(opts.fallback)}"` : ''}
            onchange="cfgSet('${box}','${cfgLeaf}',this.value,this)">`;
}

/* WRITE-ONLY field: the box accepts this config leaf but never publishes it
 * back, so there is nothing to show. An ordinary empty input would be a lie --
 * indistinguishable from "the value is empty" -- so it is marked, and left
 * blank on purpose. Everything here would stop being write-only the moment
 * box_announce_manifest() published it. */
/* The manifest sends per-pin scalars SPARSELY as "n:v,n:v" -- only pins that
 * differ from the default -- because one datapoint per pin would be ~72 extra
 * frames per announce into a 40-deep publish queue, which is the burst that
 * drops single-shot frames. Absent therefore means "default", not "unknown". */
const sparse = (str) => {
  const m = new Map();
  String(str || '').split(',').filter(Boolean).forEach(kv => {
    const [k, v] = kv.split(':'); if (k !== undefined && v !== undefined) m.set(+k, v);
  });
  return m;
};
const csvNums = (str) => String(str || '').split(',').filter(x => x !== '').map(Number);

function woField(box, cfgLeaf, wide) {
  return `<input class="${wide ? 'w8' : 'w4'} wo" placeholder="write-only" title="The box accepts this setting but does not report it, so its current value cannot be shown."
            data-ctl="${esc(box)}|${cfgLeaf}"
            onchange="if(this.value!==''){cfgSet('${box}','${cfgLeaf}',this.value,this)}">`;
}

/* Silkscreen name for a pin VALUE (obs/sync fields): annotation only, and only
 * when the value is actually a mapped pin number. */
function silkPin(sk, v) {
  const n = Number(v);
  const s = sk && Number.isInteger(n) ? sk.pin(n) : null;
  return s ? ` <span class="age">${s}</span>` : '';
}

/* ---- "up since": anchored on state/watchdog ----
 *
 * The watchdog VALUE is seconds-since-boot by firmware contract (extio-zephyr
 * main.c adds missed beats back in, precisely so this stays true across
 * stalls), so boot instant = the datapoint's own timestamp minus its value.
 * Older pico/BLE boxes publish uptime_us instead -- once, at announce -- so it
 * anchors the same way, just from an older instant. Neither page had this
 * right before: the fleet page read uptime_us (which the Zephyr boxes never
 * publish, and the pico ones freeze at announce), so "up" was either ? or a
 * small number that looked like a fresh reboot.
 *
 * A DEAD box freezes: we report what it last told us ("was up 3d"), because a
 * silent box's present uptime is unknowable from here. */
function upInfo(box) {
  const b = boxes.get(box);
  let anchorT = null, upUsAtAnchor = 0;
  if (b && 'watchdog' in b && b.watchdog.v !== '' && !isNaN(+b.watchdog.v)) {
    anchorT = b.watchdog.t; upUsAtAnchor = (+b.watchdog.v) * 1e6;
  } else if (b && 'uptime_us' in b && !isNaN(+b.uptime_us.v)) {
    anchorT = b.uptime_us.t; upUsAtAnchor = +b.uptime_us.v;
  } else {

  }

}
function fmtDur(us) {
  const s = Math.floor(us / 1e6);

  const m = Math.floor(s / 60);
  if (m < 120) return m + 'm';

}
function fmtBoot(d) {

                                hour: '2-digit', minute: '2-digit' });
}

/* ---- group helpers ----
 *
 * Chord decode, same label algebra as extio.html / extioconf.tcl
 * extio_group_decode: announced pins ascending IS the bit order. */
function decodeChord(box, pins, val) {
  if (!pins.length || val === null || val === '' || isNaN(+val)) return null;
  const on = [];
  pins.forEach((p, i) => {
    if ((+val >> i) & 1) on.push(get(box, `label/${p}`) || ('p' + p));
  });
  return on.length ? on.join('_') : 'center';
}

/* Free a group slot. The write is the box contract (`pins`/`off` -> mask 0);
 * the LOCAL forget is for firmware that does not yet tombstone freed names:
 * dserv retains the old group/<name>/* keys forever, so without dropping them

 * returns until the box's firmware learns to tombstone (or extio_clear purges
 * the box) -- this is the honest best available from the page side. */

  const b = boxes.get(box); if (!b) return;

async function clearGroup(box, idx, gname) {
  if (!confirm(`Free digital group slot ${idx}${gname ? ` (“${gname}”)` : ''}?`)) return;
  await cfgSet(box, `group/${idx}/pins`, 'off');
  forgetLocal(box, [`group/${gname}`]);
  panelSig = null; renderPanel();
}
async function clearAinGroup(box, idx, gname) {
  if (!confirm(`Free analog group slot ${idx}${gname ? ` (“${gname}”)` : ''}?`)) return;
  await cfgSet(box, `ain/group/${idx}/off`, '1');
  forgetLocal(box, [`ain/group/${gname}`, `ain/${gname}`]);
  panelSig = null; renderPanel();
}

/* NEVER GATE UPDATES ON FOCUS. This page used to defer ALL panel redraws
 * while document.activeElement was inside #panel, reasoning that a redraw
 * destroys the control being used. The reasoning was right; the gate was
 * wrong, because WHERE FOCUS LIVES IS A PLATFORM POLICY: Safari/macOS gives
 * click focus to almost nothing, so the gate rarely engaged and the page
 * looked fine -- while on Windows (Chrome, Edge, Firefox alike) EVERY
 * control takes click focus, so one click on any button or combo box parked
 * focus in the panel and froze every update until a stray click on empty
 * space. Clicking "Refresh from box" froze the very values it fetched. That
 * was the whole of the "have to manually refresh on Windows" complaint.
 *
 * The replacement protects exactly what needs protecting and nothing more:
 *   - VALUES flow into existing DOM in place (syncBinds/tickAges), skipping
 *     only the one control that is focused, plus pending-write logic -- so
 *     nothing is ever yanked from under a pointer or a caret, on any OS.
 *   - STRUCTURE is rebuilt only when panelSignature() changes, and the
 *     rebuild restores focus, caret and any half-typed text (rebuildPanel).
 * The only deferral left is the pointer flag below, and it defers only
 * STRUCTURAL rebuilds: a swap between mousedown and mouseup would still eat
 * the click (mouseup must land on the same node). */
let redrawPending = false;
let panelPtrAt = 0;
/* A POINTER-DOWN EXPIRES. The flag is cleared by pointerup/pointercancel, and
 * if either is lost, structural rebuilds would stall until the next press.
 * Not hypothetical: OTA actions open native modals, and in Firefox a modal
 * swallows the pending pointer sequence -- the window-level pointerup never
 * arrives. Bounding by TIME means the next such quirk costs two seconds of
 * deferral instead of a stalled panel. */
const PANEL_PTR_STALE_MS = 2000;
const ptrBusy = () => panelPtrAt && Date.now() - panelPtrAt < PANEL_PTR_STALE_MS;
/* Phases that mean "something is in flight" -- Abort is offered, Update is not. */
const OTA_BUSY = ['staging', 'verifying', 'arming', 'trial', 'confirming'];

/* ---- the value side: keep controls current without touching structure ---- */

/* What the box says this control should show, through the control's own
 * transform: sparse per-pin maps, CSV membership, u32->i32, declared
 * defaults, and the pin-mode derivation. Returns a STRING (or null when the
 * model has nothing), so comparisons happen in one type. */
function boundValue(el) {
  const box = el.dataset.bindBox;
  if (el.dataset.pinMode !== undefined) return modeOfPin(box, +el.dataset.pinMode);
  const leaf = el.dataset.bind;
  let v;
  if (el.dataset.sparseKey !== undefined) {
    v = sparse(get(box, leaf)).get(+el.dataset.sparseKey);
    v = v === undefined ? '' : v;
  } else if (el.dataset.csvKey !== undefined) {
    return csvNums(get(box, leaf)).includes(+el.dataset.csvKey) ? '1' : '0';
  } else {
    v = get(box, leaf, null);
    if (v === null) v = el.dataset.dflt !== undefined ? el.dataset.dflt : null;

}

  else { const s = v === null ? '' : v; if (el.value !== s) el.value = s; }
}
/* Numeric when both sides are numbers ("0250" vs "250" is the same rate), and

 * which must confirm a typed "0" rather than flag it as refused. */

  if (a === b) return true;
  if (a === null || b === null) return false;
  const na = +a, nb = +b;
  if (a !== '' && b !== '' && isFinite(na) && isFinite(nb)) return na === nb;
  if (a === '' && el && el.placeholder !== '' && isFinite(+b) && +b === +el.placeholder) return true;
  return false;
}
function flashOk(el) {

}
/* mismatch borrows el.title for its explanation; keep the control's own
 * title (quiet/batch have real ones) restorable */
function markMismatch(el, cur) {
  el.classList.remove('confirmed');
  el.classList.add('mismatch');
  if (!('origTitle' in el.dataset)) el.dataset.origTitle = el.title;
  el.title = `box reports ${cur === null || cur === '' ? '(nothing)' : cur} — write not confirmed`;
}
function clearMismatch(el) {

}

/* Sweep every bound control: resolve pending writes, then mirror the model.
 * The focused control is the ONE exception -- never write into a control the
 * user is in. Runs per datapoint and at 1 Hz; setVal/classList writes are
 * no-ops when nothing changed, so the DOM stays still. */
function syncBinds(root) {
  const act = document.activeElement;
  for (const el of root.querySelectorAll('[data-bind],[data-pin-mode]')) {
    const cur = boundValue(el);
    const p = el.dataset.ctl ? pendingByCtl.get(el.dataset.ctl) : undefined;
    if (p) {
      if (cur !== null && valEq(cur, p.v, el)) {
        /* confirmed -- including LATE, after the mismatch flag went up: a box
         * that answers slowly (or a tab the browser throttled) must still
         * resolve to green when the readback finally matches, not wear a
         * stale red flag forever. That is why expiry KEEPS the entry. */
        pendingByCtl.delete(el.dataset.ctl);
        el.classList.remove('pending');
        clearMismatch(el);
        if (el !== act) setVal(el, cur);
        flashOk(el);
      } else if (!p.expired && Date.now() - p.t < PENDING_MS) {
        el.classList.remove('confirmed');   /* stale flash (throttled tab) must not stack */
        el.classList.add('pending');
        if (el !== act) setVal(el, p.v);
      } else {
        /* not confirmed in time: show the box's truth, flag the control, and
         * keep the entry so a late readback can still confirm (above) and a
         * fresh edit can dismiss it (input handler) */
        p.expired = true;
        el.classList.remove('pending');
        markMismatch(el, cur);
        if (el !== act) setVal(el, cur);
      }
      continue;
    }
    if (el === act) continue;
    if (cur !== null || el.dataset.dflt !== undefined) setVal(el, cur);
  }
  /* expired entries whose control left the DOM or whose write will simply
   * never be confirmed: age them out eventually */
  if (pendingByCtl.size) {
    for (const [k, v] of pendingByCtl) {
      if (Date.now() - v.t > 300000) pendingByCtl.delete(k);
    }
  }
}

/* ---- the structure side: what forces a rebuild, and how one behaves ---- */

function modeOfPin(b, p) {
  if (csvNums(get(b, 'pins/reserved')).includes(p)) return 'reserved';
  if (csvNums(get(b, 'pins/ain')).includes(p))      return 'ain';
  if (csvNums(get(b, 'pins/pullup')).includes(p))   return 'in_pullup';
  if (csvNums(get(b, 'pins/in')).includes(p))       return 'in';
  if (csvNums(get(b, 'pins/out')).includes(p))      return 'out';

}
/* Announced groups are keyed BY NAME (group/<name>/pins) with group/<name>/idx

 * forever): treat it as an empty slot, not a group. */

}
