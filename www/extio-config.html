<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extio setup</title>
<link rel="stylesheet" href="css/page_nav.css">
<style>
:root {
  --bg:#12141a; --panel:#1b1e26; --line:#2b3040; --ink:#dfe3ec; --dim:#8d95a8;
  --ok:#4ec97a; --warn:#e3b341; --bad:#e5534b; --accent:#5aa9e6;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font:14px/1.45 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px;
         border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
#conn { font-size:12px; color:var(--dim); }
#conn.up::before   { content:"● "; color:var(--ok); }
#conn.down::before { content:"● "; color:var(--bad); }

main { display:grid; grid-template-columns:300px 1fr; gap:0; height:calc(100vh - 45px); }
#fleet { border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); }
#panel { overflow-y:auto; padding:16px 20px; }

.box { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.box:hover { background:#222634; }
.box.sel  { background:#243049; box-shadow:inset 3px 0 0 var(--accent); }
.box .nm  { font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
.box .sub { font-size:12px; color:var(--dim); margin-top:2px; }
/* OFFLINE IS A VISUAL STATE, not a field you have to read. dserv retains every
   datapoint forever, so a dead box renders a complete and entirely current-
   looking card unless the UI says otherwise. */
.box.stale { opacity:.45; }
.pill { font-size:11px; padding:1px 7px; border-radius:9px; border:1px solid var(--line); }
.pill.ok   { color:var(--ok);   border-color:#2c5b3c; }
.pill.warn { color:var(--warn); border-color:#5b4a1e; }
.pill.bad  { color:var(--bad);  border-color:#5b2c29; }

h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
     margin:22px 0 8px; font-weight:600; }
h2:first-child { margin-top:0; }
table { border-collapse:collapse; width:100%; max-width:900px; }
td,th { padding:4px 10px 4px 0; text-align:left; vertical-align:top; font-size:13px; }
th { color:var(--dim); font-weight:500; }
tr.row:hover { background:#1e2230; }
.age { font-size:11px; color:var(--dim); }
.age.old { color:var(--warn); }
.age.dead { color:var(--bad); }
input,select { background:#141720; color:var(--ink); border:1px solid var(--line);
               border-radius:4px; padding:3px 6px; font:inherit; font-size:13px; }
input:focus,select:focus { outline:none; border-color:var(--accent); }
input.w4 { width:78px; } input.w8 { width:150px; }
button { background:#232838; color:var(--ink); border:1px solid var(--line);
         border-radius:5px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background:#1d4f7c; border-color:#2d6da6; }
button.danger  { background:#5b2c29; border-color:#7a3a36; }
#dirty { margin:14px 0; padding:9px 12px; border-radius:6px;
         background:#3a3115; border:1px solid #5b4a1e; color:var(--warn); font-size:13px; }
#dirty.hide { display:none; }
.note { color:var(--dim); font-size:12px; margin:6px 0 0; max-width:760px; }
.empty { color:var(--dim); padding:40px 0; text-align:center; }
input.wo { border-style:dashed; color:var(--warn); }
input.wo::placeholder { color:#6b6350; font-style:italic; }
code { background:#141720; padding:1px 5px; border-radius:3px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>extio setup</h1>
  <span id="conn" class="down">connecting…</span>
  <span style="flex:1"></span>
  <span class="age" id="hint">config applies live · Save persists it</span>
</header>

<main>
  <div id="fleet"><div class="empty">looking for boxes…</div></div>
  <div id="panel"><div class="empty">select a box</div></div>
</main>

<script src="js/ws_manager.js"></script>
<script src="js/DatapointManager.js"></script>
<script src="js/PageNav.js"></script>
<script>
/* extio setup page -- fleet list + per-box configuration, over datapoints.
 *
 * SCOPE, deliberately: everything a box can be told once it is ALREADY talking
 * to dserv. Bringing an unconfigured box onto the network (serial, the UDP
 * beacon, its first address) stays with extio-setup, because none of it can be
 * done through a datapoint the box cannot yet receive. The one overlap is
 * dserv/ip: settable here, because a box that is connected can be re-pointed at
 * another dserv -- it just cannot be pointed at its first one.
 *
 * TWO RULES THIS PAGE EXISTS TO ENFORCE, both learned the hard way:
 *
 *   1. dserv RETAINS. Every value below is rendered WITH ITS AGE, and a box
 *      whose watchdog has stopped advancing goes visibly dim. A dead box
 *      otherwise serves its last values forever and every field reads healthy --
 *      that has produced wrong conclusions repeatedly, including a test harness
 *      that scored 8/8 while measuring nothing.
 *   2. LIVE IS NOT SAVED. Config applies immediately and is lost on reboot until
 *      cmd/save. The banner tracks exactly which leaves are dirty.
 */
let conn = null, dp = null;
const boxes = new Map();          /* name -> {leaf: {v, t}} */
let sel = null, fetched = new Set();

const now = () => Date.now() * 1000;   /* dserv timestamps are microseconds */

function setConn(up, msg) {
  const el = document.getElementById('conn');
  el.className = up ? 'up' : 'down';
  el.textContent = msg;
}

/* ---- datapoint plumbing ----
 *
 * DatapointManager invokes callbacks with ONE OBJECT, not (name, value, ts).
 * Getting that wrong is silent: the regex below runs against an object, never
 * matches, every update is discarded, and the page sits on "no boxes seen"
 * while the socket is plainly connected. Signature copied from extio.html,
 * which is the working reference. */
function onExtio(msg) {
  const m = /^extio\/([^/]+)\/state\/(.+)$/.exec(msg.name);
  if (!m) return;
  const [, box, leaf] = m;
  let v = msg.data !== undefined ? msg.data : msg.value;
  /* Box string datapoints carry a trailing C NUL -- dserv_msg_string sends
   * strlen+1 -- so `pins/in` arrives as "0,1,4,12\0" and Number("12\0") is
   * NaN. Cut at the NUL before anything else touches the value. */
  if (typeof v === 'string') v = v.split('\x00')[0];
  if (!boxes.has(box)) boxes.set(box, {});
  /* dserv's timestamp is microseconds; fall back to arrival time so a value
   * without one still ages rather than appearing frozen at zero. */
  boxes.get(box)[leaf] = { v, t: msg.timestamp || now() };
  renderFleet();
  if (box === sel) renderPanel();
}

const get = (box, leaf, dflt = null) => {
  const b = boxes.get(box); if (!b || !(leaf in b)) return dflt;
  return b[leaf].v;
};
const ageOf = (box, leaf) => {
  const b = boxes.get(box); if (!b || !(leaf in b)) return null;
  return (now() - b[leaf].t) / 1e6;
};

/* A box is live if its WATCHDOG is advancing -- not if it has values. The
 * watchdog is published once a second for exactly this purpose, and it is the
 * only leaf whose staleness is unambiguous. */
function liveness(box) {
  const a = ageOf(box, 'watchdog');
  if (a === null) return { cls: 'bad', txt: 'no watchdog' };
  if (a > 10) return { cls: 'bad',  txt: 'offline ' + fmtAge(a) };
  if (a > 3)  return { cls: 'warn', txt: 'slow ' + fmtAge(a) };
  return { cls: 'ok', txt: 'live' };
}
function fmtAge(s) {
  if (s === null) return '—';
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + 'm';
  return Math.round(s / 3600) + 'h';
}
function ageSpan(box, leaf) {
  const a = ageOf(box, leaf);
  if (a === null) return '';
  const cls = a > 60 ? 'dead' : a > 10 ? 'old' : '';
  return `<span class="age ${cls}">${fmtAge(a)}</span>`;
}

/* ---- writes: named procs in the extio interp, never raw datapoint pokes ---- */
async function cfgSet(box, leaf, value) {
  try {
    await conn.send(`extio_cfg_set ${box} ${leaf} {${value}}`, 'extio');
    dirty.add(leaf);
    renderPanel();
  } catch (e) { alert(`set ${leaf} failed: ${e.message || e}`); }
}
let dirty = new Set();
async function doSave(box) {
  await conn.send(`extio_cfg_save ${box}`, 'extio');
  dirty.clear(); renderPanel();
}
async function doReboot(box) {
  if (dirty.size && !confirm(`${dirty.size} unsaved change(s) will be LOST. Reboot anyway?`)) return;
  await conn.send(`extio_cfg_reboot ${box}`, 'extio');
}

/* ---- fleet list ---- */
function renderFleet() {
  const el = document.getElementById('fleet');
  const names = [...boxes.keys()].sort();
  if (!names.length) { el.innerHTML = '<div class="empty">no boxes seen</div>'; return; }
  el.innerHTML = names.map(n => {
    const L = liveness(n);
    return `<div class="box ${n === sel ? 'sel' : ''} ${L.cls === 'bad' ? 'stale' : ''}"
                 onclick="selectBox('${n}')">
      <div class="nm"><span>${n}</span><span class="pill ${L.cls}">${L.txt}</span></div>
      <div class="sub">${get(n, 'ip', '—')} · ${get(n, 'board', '?')}</div>
      <div class="sub">v${get(n, 'fw_ver', get(n, 'fw', '?'))} · ain ${get(n, 'ain_en') == 1 ? 'on' : 'off'}</div>
    </div>`;
  }).join('');
}
function selectBox(n) { sel = n; dirty = new Set(); renderFleet(); renderPanel(); refreshDirty(n); }

async function refreshDirty(box) {
  try {
    const r = await conn.send(`extio_cfg_dirty ${box}`, 'extio');
    dirty = new Set(String(r || '').trim().split(/\s+/).filter(Boolean));
    renderPanel();
  } catch (e) { /* interp may predate the helper; the page still works read-only */ }
}

/* ---- per-box panel ---- */
function field(box, leaf, cfgLeaf, opts = {}) {
  let v = get(box, leaf, null);
  if (v === null && opts.fallback !== undefined) v = opts.fallback;
  const cls = opts.wide ? 'w8' : 'w4';
  return `<input class="${cls}" value="${v === null ? '' : v}"
            onchange="cfgSet('${box}','${cfgLeaf}',this.value)">`;
}

/* WRITE-ONLY field: the box accepts this config leaf but never publishes it
 * back, so there is nothing to show. An ordinary empty input would be a lie --
 * indistinguishable from "the value is empty" -- so it is marked, and left
 * blank on purpose. Everything here would stop being write-only the moment
 * box_announce_manifest() published it. */
/* The manifest sends per-pin scalars SPARSELY as "n:v,n:v" -- only pins that
 * differ from the default -- because one datapoint per pin would be ~72 extra
 * frames per announce into a 40-deep publish queue, which is the burst that
 * drops single-shot frames. Absent therefore means "default", not "unknown". */
const sparse = (str) => {
  const m = new Map();
  String(str || '').split(',').filter(Boolean).forEach(kv => {
    const [k, v] = kv.split(':'); if (k !== undefined && v !== undefined) m.set(+k, v);
  });
  return m;
};
const csvNums = (str) => String(str || '').split(',').filter(x => x !== '').map(Number);

function woField(box, cfgLeaf, wide) {
  return `<input class="${wide ? 'w8' : 'w4'} wo" placeholder="write-only" title="The box accepts this setting but does not report it, so its current value cannot be shown."
            onchange="if(this.value!==''){cfgSet('${box}','${cfgLeaf}',this.value)}">`;
}

/* DO NOT REDRAW WHILE THE USER IS IN THE PANEL.
 *
 * renderPanel() replaces #panel wholesale (the house style here -- see
 * www/CLAUDE.md), and it is driven by every datapoint update PLUS a 1 Hz tick
 * so ages stay honest. Both of those destroy the element you are interacting
 * with: an open <select> closes the instant a frame arrives, and text you are
 * typing is reset to the box's value. The dropdowns looked present but
 * unusable, which is exactly what a 1 Hz DOM replace does to a menu.
 *
 * Skipping the redraw while focus is inside the panel costs a second of age
 * staleness, only while you are actively editing, and only on the panel -- the
 * fleet list keeps ticking. A `pending` flag makes sure the state you missed is
 * drawn as soon as focus leaves, rather than waiting for the next update. */
let redrawPending = false;
function panelBusy() {
  const a = document.activeElement;
  return a && a !== document.body && document.getElementById('panel')?.contains(a);
}
function renderPanel() {
  if (panelBusy()) { redrawPending = true; return; }
  redrawPending = false;
  const el = document.getElementById('panel');
  if (!sel || !boxes.has(sel)) { el.innerHTML = '<div class="empty">select a box</div>'; return; }
  const b = sel, L = liveness(b);

  /* PINS. Read from what the box ANNOUNCES, which is NOT the same namespace you
   * WRITE. The box publishes `label/<n>` and `di/<n>`; you set `pin/<n>/label`.
   * Building the read side out of the config names -- which is what this page
   * did first -- yields a full form of empty boxes that looks like a template.
   *
   * Driven by pins/in + pins/out rather than a per-board table: MCXN947, RW612
   * and Teensy differ in count and reserved set, and a hardcoded map renders
   * confidently wrong pins for the next board. Known gap: only ACTIVE pins are
   * announced, so a pin set to `off` is invisible and cannot be re-enabled from
   * here -- that needs pins/all in box_announce_manifest(). */
  const pinsIn  = csvNums(get(b, 'pins/in'));
  const pinsOut = csvNums(get(b, 'pins/out'));
  const pinsAin = csvNums(get(b, 'pins/ain'));
  const pinsPup = csvNums(get(b, 'pins/pullup'));   /* subset of pins/in */
  const rsv     = new Set(csvNums(get(b, 'pins/reserved')));
  const alo     = new Set(csvNums(get(b, 'pins/active_low')));
  const deb     = sparse(get(b, 'pins/debounce_ms'));
  const pul     = sparse(get(b, 'pins/pulse_us'));
  /* pins/all is the BOARD's pin set. Falling back to the active lists keeps the
   * page working against a box on older firmware -- it just cannot then show a
   * pin that is currently `off`, which is exactly the gap pins/all closes. */
  const all = csvNums(get(b, 'pins/all'));
  const pins = (all.length ? all
                : [...new Set([...pinsIn, ...pinsOut])]).sort((x, y) => x - y);
  const havePinsAll = all.length > 0;

  const modeOf = p => rsv.has(p) ? 'reserved'
                    : pinsAin.includes(p) ? 'ain'
                    : pinsPup.includes(p) ? 'in_pullup'
                    : pinsIn.includes(p)  ? 'in'
                    : pinsOut.includes(p) ? 'out' : 'off';

  const pinRows = pins.map(p => {
    const mode = modeOf(p), lvl = get(b, `di/${p}`, null), res = mode === 'reserved';
    const sel = ['off', 'in', 'in_pullup', 'out', 'ain'].map(o =>
      `<option ${o === mode ? 'selected' : ''}>${o}</option>`).join('');
    return `<tr class="row" ${res ? 'style="opacity:.5"' : ''}>
      <td><b>${p}</b></td>
      <td>${res ? '<span class="age">reserved</span>'
                : `<select onchange="cfgSet('${b}','pin/${p}/mode',this.value)">${sel}</select>`}</td>
      <td>${(mode === 'in' || mode === 'in_pullup') && lvl !== null ? `<b>${lvl}</b> ${ageSpan(b, 'di/' + p)}` : ''}</td>
      <td>${res ? '' : field(b, `label/${p}`, `pin/${p}/label`, { wide: 1 })}</td>
      <td>${res ? '' : `<input class="w4" value="${deb.get(p) ?? ''}" placeholder="0"
              onchange="cfgSet('${b}','pin/${p}/debounce_ms',this.value)">`}</td>
      <td>${res ? '' : `<input class="w4" value="${pul.get(p) ?? ''}" placeholder="0"
              onchange="cfgSet('${b}','pin/${p}/pulse_us',this.value)">`}</td>
      <td>${res ? '' : `<input type="checkbox" ${alo.has(p) ? 'checked' : ''}
              onchange="cfgSet('${b}','pin/${p}/active_low',this.checked?1:0)">`}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="age">no pins announced</td></tr>';

  /* GROUPS are announced BY NAME (group/<name>/pins) with group/<name>/idx
   * carrying the index -- writes are by index (config/group/<i>/pins). So the
   * name is discovered from the keys and the index comes from the box, rather
   * than assuming group N is at slot N. */
  const gnames = Object.keys(boxes.get(b) || {})
    .map(k => /^group\/([^/]+)\/idx$/.exec(k)).filter(Boolean).map(m => m[1]).sort();
  const groups = gnames.map(gn => {
    const gi = get(b, `group/${gn}/idx`);
    return `<tr class="row"><td><b>${gi}</b></td>
      <td>${field(b, `group/${gn}/label`, `group/${gi}/label`, { wide: 1, fallback: gn })}</td>
      <td>${field(b, `group/${gn}/pins`, `group/${gi}/pins`, { wide: 1 })}</td>
      <td>${field(b, `group/${gn}/settle_ms`, `group/${gi}/settle_ms`)}</td>
      <td>${get(b, `group/${gn}`, '—')} ${ageSpan(b, `group/${gn}`)}</td></tr>`;
  }).join('') || '<tr><td colspan="5" class="age">no groups announced</td></tr>';

  const ainOn = get(b, 'ain_en') == 1;
  const dbg = k => `${get(b, 'ain/dbg/' + k, '—')} ${ageSpan(b, 'ain/dbg/' + k)}`;

  el.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:12px">
      <h2 style="margin:0">${b}</h2>
      <span class="pill ${L.cls}">${L.txt}</span>
      <span class="age">watchdog ${ageSpan(b, 'watchdog')}</span>
    </div>

    <div id="dirty" class="${dirty.size ? '' : 'hide'}">
      ${dirty.size} unsaved change(s): <code>${[...dirty].join('</code> <code>')}</code>
      — applied live, but lost on reboot until you Save.
    </div>

    <h2>identity</h2>
    <table>
      <tr><th>name</th><td>${field(b, '\u0000none', 'name', { wide: 1, fallback: b })}</td>
          <th>board</th><td>${get(b, 'board', '?')}</td></tr>
      <tr><th>desc</th><td>${field(b, 'desc', 'desc', { wide: 1 })}</td>
          <th>build</th><td>${get(b, 'build', '?')}</td></tr>
      <tr><th>fw_ver</th><td>${get(b, 'fw_ver', '—')} ${ageSpan(b, 'fw_ver')}</td>
          <th>fw</th><td>${get(b, 'fw', '—')}</td></tr>
      <tr><th>boot</th><td>${get(b, 'boot', '?')}</td>
          <th>channel</th><td>${get(b, 'channel', '—')}</td></tr>
    </table>
    <p class="note"><code>fw_ver</code> is what MCUboot actually booted — the one to trust after an
       OTA. <code>fw</code> is compiled in and never changes, so it can look correct on a box running
       something else entirely. A <code>—</code> for <code>fw_ver</code> means the box has no MCUboot
       image manager (it is only announced under <code>CONFIG_MCUBOOT_IMG_MANAGER</code>), so it is
       not OTA-capable.</p>

    <h2>network</h2>
    <table>
      <tr><th>ip</th><td>${get(b, 'ip', '—')} ${ageSpan(b, 'ip')}</td>
          <th>transport</th><td>${get(b, 'transport', '—')}</td></tr>
      <tr><th>dserv ip</th><td>${field(b, 'dserv/ip', 'dserv/ip', { wide: 1 })} ${ageSpan(b, 'dserv/ip')}</td>
          <th>dserv port</th><td>${field(b, 'dserv/port', 'dserv/port')}</td></tr>
      <tr><th>net mode</th><td>${field(b, 'net/mode', 'net/mode', { wide: 1 })}</td><th></th><td></td></tr>
    </table>
    <p class="note">Re-pointing <code>dserv/ip</code> moves the box to another rig. It cannot be
       set here for a box that has never reached a dserv — that is extio-setup's job.</p>

    <h2>obs / sync</h2>
    <table>
      <tr><th>obs pin</th><td>${field(b, 'obs_pin', 'obs/pin')} ${ageSpan(b, 'obs_pin')}</td>
          <th>sync pin</th><td>${field(b, 'sync_pin', 'sync/pin')} ${ageSpan(b, 'sync_pin')}</td></tr>
    </table>

    <h2>pins</h2>
    <table><tr><th>pin</th><th>mode</th><th>level</th><th>label</th><th>debounce ms</th><th>pulse µs</th><th>act low</th></tr>${pinRows}</table>
    <p class="note">${havePinsAll
       ? 'Every pin the board maps, from <code>pins/all</code>; reserved pins are shown but refused by the box. Blank debounce/pulse means the default (0) — the manifest sends only pins that differ.'
       : 'This box predates <code>pins/all</code>, so only ACTIVE pins appear and a pin set to <code>off</code> cannot be shown or re-enabled. Update its firmware to configure the full map.'}</p>

    <h2>groups</h2>
    <table><tr><th>#</th><th>name</th><th>pins</th><th>settle ms</th><th>value</th></tr>${groups}</table>

    <h2>analog</h2>
    <table>
      <tr><th>enabled</th><td>
            <select onchange="cfgSet('${b}','ain/enable',this.value)">
              <option value="1" ${ainOn ? 'selected' : ''}>on</option>
              <option value="0" ${ainOn ? '' : 'selected'}>off</option>
            </select></td>
          <th>base rate Hz</th><td>${field(b, 'ain/rate', 'ain/rate')} ${ageSpan(b, 'ain/rate')}</td></tr>
      <tr><th>running</th><td>${dbg('running')}</td><th>powered</th><td>${dbg('powered')}</td></tr>
      <tr><th>sweeps</th><td>${dbg('sweeps')}</td><th>throttled</th><td>${dbg('throttled')}</td></tr>
    </table>
    <p class="note"><code>running</code> is what the box is DOING; <code>enabled</code> is what it was
       told. They differ legitimately — held during an OTA, no group defined, or no pin in
       <code>ain</code> mode. Any <code>throttled</code> at all means a group is publishing faster
       than the uplink can afford.</p>

    <h2>actions</h2>
    <div style="display:flex;gap:10px">
      <button class="primary" onclick="doSave('${b}')" ${dirty.size ? '' : 'disabled'}>
        Save to flash${dirty.size ? ` (${dirty.size})` : ''}</button>
      <button class="danger" onclick="doReboot('${b}')">Reboot</button>
    </div>
  `;
}

/* ---- boot ---- */
async function init() {
  /* THE UI LOOP MUST NOT DEPEND ON THE CONNECTION.
   *
   * This used to `return` when connect() failed, and everything below -- the
   * focusout catch-up AND the 1 Hz re-render -- was set up after that point. So
   * a dserv that was briefly unreachable at page load left a page that never
   * ticked again, even once autoReconnect restored the socket underneath it.
   * Ages froze, staleness stopped being visible, and the deferred redraw never
   * fired: precisely the "looks fine, is lying" failure this page exists to
   * prevent, reproduced in the page itself.
   *
   * Everything that is purely local is therefore started FIRST and
   * unconditionally. */
  document.getElementById('panel').addEventListener('focusout', () => {
    setTimeout(() => { if (redrawPending && !panelBusy()) renderPanel(); }, 0);
  });

  /* Re-render on a timer as well as on updates: AGE changes with the clock, not
   * with traffic, so a box going silent must become visibly stale on its own.
   * This is also the GUARANTEE behind the redraw deferral -- focusout only makes
   * the catch-up snappier; the tick is what makes it certain. */
  setInterval(() => { renderFleet(); if (sel) renderPanel(); }, 1000);

  /* ?host=<host[:port]> and ?ssl=1|0 -- the standard three lines every page here
   * needs (www/CLAUDE.md). ssl matters when the page and dserv disagree on
   * protocol, which is exactly the zero-deploy dev loop:
   *   python3 -m http.server 8090 --directory www
   *   http://localhost:8090/extio-config.html?host=rig:2565&ssl=1 */
  const qs = new URLSearchParams(location.search);
  const qsHost = qs.get('host'), qsSsl = qs.get('ssl');
  conn = new DservConnection({
    subprocess: 'extio',
    dservHost: qsHost || null,
    forceSecure: qsSsl !== null ? qsSsl === '1' : undefined,
    autoReconnect: true,
    onStatus: (st) => setConn(st === 'connected', st),
  });

  /* Subscribe REGARDLESS of whether this first attempt succeeds:
   * DatapointManager re-subscribes on reconnect, so a page opened before dserv
   * is up populates itself when dserv arrives instead of needing a reload. */
  dp = new DatapointManager(conn, { autoGetKeys: false });
  dp.subscribe('extio/*', onExtio);
  dp.on('keys:update', ({ keys }) => {
    for (const k of keys) {
      if (!/^extio\/[^/]+\/state\//.test(k)) continue;
      if (fetched.has(k)) continue;
      fetched.add(k); dp.sendGet(k);
    }
  });

  try { await conn.connect(); setConn(true, 'connected'); }
  catch (e) { setConn(false, 'connection failed — retrying'); }
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
