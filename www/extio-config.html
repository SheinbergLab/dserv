<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extio setup</title>
<link rel="stylesheet" href="css/page_nav.css">
<style>
:root {
  --bg:#12141a; --panel:#1b1e26; --line:#2b3040; --ink:#dfe3ec; --dim:#8d95a8;
  --ok:#4ec97a; --warn:#e3b341; --bad:#e5534b; --accent:#5aa9e6;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font:14px/1.45 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px;
         border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
#conn { font-size:12px; color:var(--dim); }
#conn.up::before   { content:"● "; color:var(--ok); }
#conn.down::before { content:"● "; color:var(--bad); }

main { display:grid; grid-template-columns:300px 1fr; gap:0; height:calc(100vh - 45px); }
#fleet { border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); }
#panel { overflow-y:auto; padding:16px 20px; }

.box { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.box:hover { background:#222634; }
.box.sel  { background:#243049; box-shadow:inset 3px 0 0 var(--accent); }
.box .nm  { font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
.box .sub { font-size:12px; color:var(--dim); margin-top:2px; }
/* OFFLINE IS A VISUAL STATE, not a field you have to read. dserv retains every
   datapoint forever, so a dead box renders a complete and entirely current-
   looking card unless the UI says otherwise. */
.box.stale { opacity:.45; }
.pill { font-size:11px; padding:1px 7px; border-radius:9px; border:1px solid var(--line); }
.pill.ok   { color:var(--ok);   border-color:#2c5b3c; }
.pill.warn { color:var(--warn); border-color:#5b4a1e; }
.pill.bad  { color:var(--bad);  border-color:#5b2c29; }

h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
     margin:22px 0 8px; font-weight:600; }
h2:first-child { margin-top:0; }
table { border-collapse:collapse; width:100%; max-width:900px; }
td,th { padding:4px 10px 4px 0; text-align:left; vertical-align:top; font-size:13px; }
th { color:var(--dim); font-weight:500; }
tr.row:hover { background:#1e2230; }
.age { font-size:11px; color:var(--dim); }
.age.old { color:var(--warn); }
.age.dead { color:var(--bad); }
input,select { background:#141720; color:var(--ink); border:1px solid var(--line);
               border-radius:4px; padding:3px 6px; font:inherit; font-size:13px; }
input:focus,select:focus { outline:none; border-color:var(--accent); }
input.w4 { width:78px; } input.w8 { width:150px; }
button { background:#232838; color:var(--ink); border:1px solid var(--line);
         border-radius:5px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background:#1d4f7c; border-color:#2d6da6; }
button.danger  { background:#5b2c29; border-color:#7a3a36; }
#dirty { margin:14px 0; padding:9px 12px; border-radius:6px;
         background:#3a3115; border:1px solid #5b4a1e; color:var(--warn); font-size:13px; }
#dirty.hide { display:none; }
/* The server-clock banner is an ERROR, not a warning, and it sits ABOVE main
   rather than inside it. While it is up, every age and every liveness pill on
   this page is measured against the wrong zero and none of them can be
   believed -- so it displaces the layout on purpose. Being unmissable is the
   entire point: the failure it reports is otherwise indistinguishable from
   "the whole rig is offline". */
#clockwarn { margin:0; padding:10px 16px; font-size:13px; line-height:1.5;
             background:#4a1f1c; border-bottom:1px solid #7a3a36; color:#ffb3ab; }
#clockwarn.hide { display:none; }
#clockwarn b { color:#fff; }
#clockwarn code { background:#2c1210; color:#ffd9d4; }
.note { color:var(--dim); font-size:12px; margin:6px 0 0; max-width:760px; }
.empty { color:var(--dim); padding:40px 0; text-align:center; }
input.wo { border-style:dashed; color:var(--warn); }
input.wo::placeholder { color:#6b6350; font-style:italic; }
code { background:#141720; padding:1px 5px; border-radius:3px; font-size:12px; }
/* Save/Reboot ride the bottom of the viewport: the dirty banner lives at the
   top of a panel that got LONG (pins + two group tables), and a Save you have
   to scroll to find is a Save that does not happen before the next reboot. */
#actionbar { position:sticky; bottom:0; margin-top:22px; padding:12px 0 14px;
             display:flex; gap:10px; align-items:center;
             background:linear-gradient(to bottom, transparent, var(--bg) 26%); }
</style>
</head>
<body>
<header>
  <h1>extio setup</h1>
  <span id="conn" class="down">connecting…</span>
  <span style="flex:1"></span>
  <span class="age" id="hint">config applies live · Save persists it</span>
</header>

<div id="clockwarn" class="hide"></div>

<main>
  <div id="fleet"><div class="empty">looking for boxes…</div></div>
  <div id="panel"><div class="empty">select a box</div></div>
</main>

<script src="js/ws_manager.js"></script>
<script src="js/DatapointManager.js"></script>
<script src="js/PageNav.js"></script>
<script src="js/extio_silk.js"></script>
<script src="js/extio_ain.js"></script>
<script>
/* extio setup page -- fleet list + per-box configuration, over datapoints.
 *
 * SCOPE, deliberately: everything a box can be told once it is ALREADY talking
 * to dserv. Bringing an unconfigured box onto the network (serial, the UDP
 * beacon, its first address) stays with extio-setup, because none of it can be
 * done through a datapoint the box cannot yet receive. The one overlap is
 * dserv/ip: settable here, because a box that is connected can be re-pointed at
 * another dserv -- it just cannot be pointed at its first one.
 *
 * TWO RULES THIS PAGE EXISTS TO ENFORCE, both learned the hard way:
 *
 *   1. dserv RETAINS. Every value below is rendered WITH ITS AGE, and a box
 *      whose watchdog has stopped advancing goes visibly dim. A dead box
 *      otherwise serves its last values forever and every field reads healthy --
 *      that has produced wrong conclusions repeatedly, including a test harness
 *      that scored 8/8 while measuring nothing.
 *   2. LIVE IS NOT SAVED. Config applies immediately and is lost on reboot until
 *      cmd/save. The banner tracks exactly which leaves are dirty.
 */
let conn = null, dp = null;
const boxes = new Map();          /* name -> {leaf: {v, t}} */
let sel = null, fetched = new Set(), pendingSelect = null;

const now = () => Date.now() * 1000;   /* dserv timestamps are microseconds */

/* ---- is dserv's clock the same clock as ours? ----
 *
 * EVERY AGE ON THIS PAGE IS A SUBTRACTION ACROSS TWO MACHINES: liveness() ages
 * a dserv timestamp against Date.now() in this browser. That is only meaningful
 * while the two clocks agree, and nothing here used to check.
 *
 * On 2026-08-09 the rig Pi was put into the PTP client role on a segment with
 * no real grandmaster, its system clock was dragged to 1970, and dserv -- which
 * captures its epoch constant ONCE at startup, by design -- ended up stamping
 * every datapoint ~29 h in the past. This page then reported every box as
 * "offline 29h" while the whole rig was healthy and the boxes were publishing
 * watchdogs at 1 Hz. The symptom pointed at the boxes and the network; the
 * fault was a clock. That hour is what this banner exists to give back.
 *
 * THE ESTIMATOR IS A MIN OVER A ROLLING WINDOW, and both halves are load-bearing.
 *   - MIN, not mean or latest: `now() - msg.timestamp` is (clock skew) +
 *     (how stale that datapoint already was) + (transport delay). Only the
 *     first term is wanted, and the other two are strictly non-negative, so the
 *     minimum over recent arrivals is the tightest available bound on the skew.
 *     A mean would be dragged arbitrarily by the retained backlog that lands on
 *     every subscribe -- dserv retains forever, so that backlog can be days old.
 *   - ROLLING, not all-time: an all-time minimum can never recover from a
 *     server clock that steps BACKWARD. The older, smaller sample would stand
 *     for the life of the page and the banner would stay silent through exactly
 *     the fault it is meant to catch. */
const SKEW_WINDOW_MS = 60000;
const SKEW_WARN_US   = 60 * 1e6;   /* same 60 s threshold as ptpconf's ptp/clock_error */
let skewSamples = [];

function noteServerClock(ts) {
  if (!ts) return;                 /* no server timestamp = nothing to compare */
  const at = Date.now();
  skewSamples.push({ at, d: at * 1000 - ts });
  const cutoff = at - SKEW_WINDOW_MS;
  while (skewSamples.length && skewSamples[0].at < cutoff) skewSamples.shift();
}

function serverSkewUs() {
  if (!skewSamples.length) return null;
  let m = Infinity;
  for (const s of skewSamples) if (s.d < m) m = s.d;
  return m;
}

function renderClockWarn() {
  const el = document.getElementById('clockwarn');
  const sk = serverSkewUs();
  if (sk === null || Math.abs(sk) < SKEW_WARN_US) { el.className = 'hide'; return; }
  el.className = '';
  /* sk > 0 means dserv's timestamps are OLDER than our clock, i.e. dserv is
     behind -- which is the direction that makes everything read as offline. */
  const dir = sk > 0 ? 'behind' : 'ahead of';
  const html =
    `<b>dserv's clock is ${fmtDur(Math.abs(sk))} ${dir} this browser's.</b> ` +
    `Every age and liveness state below is measured against it, so boxes may ` +
    `read <b>offline</b> while they are in fact healthy — check the watchdog ` +
    `counter itself, not the pill.<br>` +
    `Fix the host clock (its NTP daemon, and <code>dserv-ptp-setup status</code> — ` +
    `a PTP client following a grandmaster that was never set will do this), then ` +
    `<b>restart dserv</b>: its epoch anchor is captured once at startup and is ` +
    `never recomputed.`;
  if (el.innerHTML !== html) el.innerHTML = html;   /* memoized: this ticks at 1 Hz */
}

function setConn(up, msg) {
  const el = document.getElementById('conn');
  el.className = up ? 'up' : 'down';
  el.textContent = msg;
}

/* ---- datapoint plumbing ----
 *
 * DatapointManager invokes callbacks with ONE OBJECT, not (name, value, ts).
 * Getting that wrong is silent: the regex below runs against an object, never
 * matches, every update is discarded, and the page sits on "no boxes seen"
 * while the socket is plainly connected. Signature copied from extio.html,
 * which is the working reference. */
function onExtio(msg) {
  const m = /^extio\/([^/]+)\/state\/(.+)$/.exec(msg.name);
  if (!m) return;
  const [, box, leaf] = m;
  let v = msg.data !== undefined ? msg.data : msg.value;
  /* Box string datapoints carry a trailing C NUL -- dserv_msg_string sends
   * strlen+1 -- so `pins/in` arrives as "0,1,4,12\0" and Number("12\0") is
   * NaN. Cut at the NUL before anything else touches the value. */
  if (typeof v === 'string') v = v.split('\x00')[0];
  if (!boxes.has(box)) boxes.set(box, {});
  /* dserv's timestamp is microseconds; fall back to arrival time so a value
   * without one still ages rather than appearing frozen at zero. */
  noteServerClock(msg.timestamp);
  boxes.get(box)[leaf] = { v, t: msg.timestamp || now() };
  if (pendingSelect && box === pendingSelect) { pendingSelect = null; selectBox(box); return; }
  renderFleet();
  if (box === sel) renderPanel();
}

const get = (box, leaf, dflt = null) => {
  const b = boxes.get(box); if (!b || !(leaf in b)) return dflt;
  return b[leaf].v;
};
const ageOf = (box, leaf) => {
  const b = boxes.get(box); if (!b || !(leaf in b)) return null;
  return (now() - b[leaf].t) / 1e6;
};

/* A box is live if its WATCHDOG is advancing -- not if it has values. The
 * watchdog is published once a second for exactly this purpose, and it is the
 * only leaf whose staleness is unambiguous. */
function liveness(box) {
  const a = ageOf(box, 'watchdog');
  if (a === null) return { cls: 'bad', txt: 'no watchdog' };
  if (a > 10) return { cls: 'bad',  txt: 'offline ' + agePlain(box, 'watchdog') };
  if (a > 3)  return { cls: 'warn', txt: 'slow ' + agePlain(box, 'watchdog') };
  return { cls: 'ok', txt: 'live' };
}
function fmtAge(s) {
  if (s === null) return '—';
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + 'm';
  return Math.round(s / 3600) + 'h';
}
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* AGES ARE EMPTY SPANS IN THE MARKUP, filled in place by tickAges().
 *
 * The old ageSpan() baked the text ("3s") into the HTML string, so the 1 Hz
 * tick produced a DIFFERENT string every second, the innerHTML memo never
 * matched, and the panel was replaced wholesale once a second. That is what
 * made checkboxes "hard to click": a click needs mousedown and mouseup on the
 * SAME element, and on Safari clicking a checkbox never moves focus, so the
 * focus guard below never deferred the redraw -- the node was simply swapped
 * out mid-press. With the age TEXT out of the markup, the memo is stable
 * between REAL value changes, and updating a span's textContent in place
 * destroys nothing a pointer could be aiming at.
 *
 * data-age-plain marks spans inside styled parents (the liveness pill) whose
 * class must not be overwritten by the age bucket. */
function ageSpan(box, leaf) {
  if (ageOf(box, leaf) === null) return '';
  return `<span class="age" data-age-box="${esc(box)}" data-age-leaf="${esc(leaf)}"></span>`;
}
function agePlain(box, leaf) {
  return `<span data-age-box="${esc(box)}" data-age-leaf="${esc(leaf)}" data-age-plain="1"></span>`;
}
function tickAges(root) {
  for (const el of root.querySelectorAll('[data-age-leaf]')) {
    const a = ageOf(el.dataset.ageBox, el.dataset.ageLeaf);
    if (a === null) continue;
    el.textContent = fmtAge(a);
    if (!('agePlain' in el.dataset)) {
      el.className = 'age ' + (a > 60 ? 'dead' : a > 10 ? 'old' : '');
    }
  }
  /* Live VALUES get the same in-place treatment as ages, for the same reason:
   * anything that moves on its own (the ain/dbg counters advance every second,
   * a chatty on-change analog group streams blocks) would re-defeat the
   * innerHTML memo and put the panel right back to churning under the
   * pointer. Rendered as empty spans, filled here at 1 Hz -- a second of
   * display latency on diagnostic counters, in exchange for a DOM that only
   * moves when its STRUCTURE changes. */
  for (const el of root.querySelectorAll('[data-val-leaf]')) {
    const v = get(el.dataset.valBox, el.dataset.valLeaf, null);
    el.textContent = v === null ? '—' : v;
  }
  for (const el of root.querySelectorAll('[data-ain-grp]')) {
    const bb = boxes.get(el.dataset.ainBox) || {};
    const raw = bb['ain/' + el.dataset.ainGrp];
    const blk = raw && Array.isArray(raw.v) ? ExtioAinBlock.decode(raw.v) : null;
    /* interval_us states the MODE (0 = on-change, else decimate*base_period);
     * count is the batch size and states nothing. Testing count>1 labelled a
     * continuous group with batch=1 as "on-change" -- see extio.html, same fix. */
    el.textContent = !blk ? '—'
      : blk.last.join(' ') + ' · ' + (blk.interval_us
          ? Math.round(1e6 / blk.interval_us) + ' Hz' +
            (blk.count > 1 ? ' ×' + blk.count : '') + (blk.avg ? ' avg' : '')
          : 'on-change');
  }
  for (const el of root.querySelectorAll('[data-grp]')) {
    const gb = el.dataset.grpBox, gg = el.dataset.grp;
    const val = get(gb, `group/${gg}`, null);
    const dec = decodeChord(gb, csvNums(get(gb, `group/${gg}/pins`)), val);
    el.innerHTML = (val === null ? '—' : esc(val)) + (dec ? ` <b>${esc(dec)}</b>` : '');
  }
}

/* ---- writes: named procs in the extio interp, never raw datapoint pokes ---- */
const dirtyText = () => dirty.size
  ? `${dirty.size} unsaved change(s): <code>${[...dirty].join('</code> <code>')}</code>` +
    ' — applied live, but lost on reboot until you Save.'
  : '';
const saveText = () => `Save to flash${dirty.size ? ` (${dirty.size})` : ''}`;

/* Update ONLY the dirty banner and the Save button, without a redraw.
 *
 * An edit leaves focus inside the panel, so renderPanel() correctly defers --
 * redrawing would destroy the control just used. But the whole POINT of the
 * edit is that "unsaved changes" has become true, and deferring that until
 * focus happens to leave meant Save stayed greyed out while changes piled up.
 * The user reasonably read that as the change not registering.
 *
 * So: touch the two elements that reflect dirty state, in place, and leave the
 * rest of the DOM (and the focus) exactly where it is. Same principle as
 * everywhere else on these pages -- do not replace what someone is pointing at
 * -- applied to the one case where the state genuinely must update mid-edit. */
function updateDirtyUi() {
  const banner = document.getElementById('dirty');
  const btn = document.getElementById('savebtn');
  if (banner) { banner.innerHTML = dirtyText(); banner.className = dirty.size ? '' : 'hide'; }
  if (btn) { btn.textContent = saveText(); btn.disabled = dirty.size === 0; }
}

async function cfgSet(box, leaf, value) {
  try {
    await conn.send(`extio_cfg_set ${box} ${leaf} {${value}}`, 'extio');
    dirty.add(leaf);
    updateDirtyUi();      /* immediate: renderPanel() defers while focus is in the panel */
    renderPanel();
    askAnnounce(box);
  } catch (e) { alert(`set ${leaf} failed: ${e.message || e}`); }
}

/* Ask the box to re-publish after an edit, DEBOUNCED.
 *
 * Only some config changes re-announce as a side effect; ain/rate, dserv/ip,
 * net/mode and pulse_us publish nothing at all, so without this the field you
 * just changed keeps showing the old value -- which looks exactly like the
 * write having failed, and would have people setting it twice.
 *
 * Debounced because a burst is ~40 frames: typing through four fields should
 * cost one re-announce, not four. 400 ms is longer than the gap between
 * keystroke-driven onchange events and far shorter than anyone waits before
 * deciding a UI is broken. */
let announceTimer = null;
function askAnnounce(box) {
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => {
    conn.send(`extio_cfg_announce ${box}`, 'extio').catch(() => {});
  }, 400);
}
let dirty = new Set();
async function doSave(box) {
  await conn.send(`extio_cfg_save ${box}`, 'extio');
  dirty.clear(); updateDirtyUi(); renderPanel();
}
/* OTA. The lifecycle driver does the ordering, the retry-vs-fail decisions and
 * the deadlines (config/extioconf.tcl); the page is a window onto
 * state/ota/lifecycle, which is exactly why that roll-up key exists. Anything
 * cleverer here would be a second, divergent implementation of a state machine
 * that already has tests. */
async function otaUpdate(box, channel) {
  if (!confirm(`Update ${box} from the ${channel} shelf?\n\nThe box will reboot into a TRIAL boot and must be confirmed, or it reverts.`)) return;
  try { alert(await conn.send(`extio_ota_update ${box} ${channel}`, 'extio')); }
  catch (e) { alert('update failed to start: ' + (e.message || e)); }
  renderPanel();
}
async function otaAbort(box)   { try { await conn.send(`extio_ota_abort ${box}`, 'extio'); } catch (e) {} renderPanel(); }
async function otaConfirm(box) {
  try { alert(await conn.send(`extio_ota_confirm ${box}`, 'extio')); }
  catch (e) { alert('confirm failed: ' + (e.message || e)); }
}

async function doReboot(box) {
  if (dirty.size && !confirm(`${dirty.size} unsaved change(s) will be LOST. Reboot anyway?`)) return;
  await conn.send(`extio_cfg_reboot ${box}`, 'extio');
}

/* ---- fleet list ----
 *
 * MEMOISED, and that is a correctness fix rather than an optimisation. This
 * replaced #fleet wholesale on every datapoint update and every 1 Hz tick, and
 * a click needs mousedown and mouseup on the SAME element -- so a frame landing
 * mid-press destroyed the card and no click event fired at all. It presented as
 * "sometimes takes a few presses to select a box", which reads like a UI being
 * flaky rather than like the DOM being pulled out from under the pointer.
 *
 * The panel solved this by refusing to redraw while focus is inside it, but the
 * fleet list must keep ticking -- it is where liveness lives, and freezing it
 * would hide the one thing it exists to show. So instead: build the HTML, and
 * only touch the DOM when it actually DIFFERS. Card content changes when a
 * value or a liveness BUCKET changes, not with every tick, so the overwhelming
 * majority of renders now leave the DOM completely alone and a press always
 * lands. */
let fleetHtml = null;
function renderFleet() {
  const el = document.getElementById('fleet');
  const names = [...boxes.keys()].sort();
  if (!names.length) {
    const empty = '<div class="empty">no boxes seen</div>';
    if (fleetHtml !== empty) { el.innerHTML = fleetHtml = empty; }
    return;
  }
  const html = names.map(n => {
    const L = liveness(n);
    return `<div class="box ${n === sel ? 'sel' : ''} ${L.cls === 'bad' ? 'stale' : ''}"
                 onclick="selectBox('${n}')">
      <div class="nm"><span>${n}</span><span class="pill ${L.cls}">${L.txt}</span></div>
      <div class="sub">${get(n, 'ip', '—')} · ${get(n, 'board', '?')}</div>
      <div class="sub">v${get(n, 'fw_ver', get(n, 'fw', '?'))} · ain ${get(n, 'ain_en') == 1 ? 'on' : 'off'}</div>
    </div>`;
  }).join('');
  if (html !== fleetHtml) { el.innerHTML = fleetHtml = html; tickAges(el); }
}
function selectBox(n) {
  sel = n; dirty = new Set(); panelHtml = null; renderFleet(); renderPanel(); refreshDirty(n);
  /* Opening a box asks it to describe itself: retained values may predate the
   * last edit made from a console, and there is no periodic re-announce. */
  if (conn) conn.send(`extio_cfg_announce ${n}`, 'extio').catch(() => {});
}

async function refreshDirty(box) {
  try {
    const r = String(await conn.send(`extio_cfg_dirty ${box}`, 'extio') || '');
    /* A Tcl-level error arrives as a RESOLVED "!TCL_ERROR ..." string, not a
     * rejection -- split blindly and the error MESSAGE becomes five fake
     * dirty leaves in the banner. No helper in the interp means no dirty
     * info, exactly like the catch below. */
    if (r.startsWith('!TCL_ERROR')) return;
    dirty = new Set(r.trim().split(/\s+/).filter(Boolean));
    updateDirtyUi(); renderPanel();
  } catch (e) { /* interp may predate the helper; the page still works read-only */ }
}

/* ---- per-box panel ---- */
function field(box, leaf, cfgLeaf, opts = {}) {
  let v = get(box, leaf, null);
  if (v === null && opts.fallback !== undefined) v = opts.fallback;
  /* dserv serializes DSERV_INT unsigned, so the firmware's -1 "off" sentinel
   * (obs/sync pin) arrives as 4294967295 -- show what the grammar takes back */
  if (opts.i32 && v !== null && +v >= 0x80000000) v = +v - 0x100000000;
  const cls = opts.wide ? 'w8' : 'w4';
  /* esc(): labels/desc allow every printable except '/', so a quote in a
   * value would otherwise end the attribute and truncate the form */
  return `<input class="${cls}" value="${v === null ? '' : esc(v)}"
            onchange="cfgSet('${box}','${cfgLeaf}',this.value)">`;
}

/* WRITE-ONLY field: the box accepts this config leaf but never publishes it
 * back, so there is nothing to show. An ordinary empty input would be a lie --
 * indistinguishable from "the value is empty" -- so it is marked, and left
 * blank on purpose. Everything here would stop being write-only the moment
 * box_announce_manifest() published it. */
/* The manifest sends per-pin scalars SPARSELY as "n:v,n:v" -- only pins that
 * differ from the default -- because one datapoint per pin would be ~72 extra
 * frames per announce into a 40-deep publish queue, which is the burst that
 * drops single-shot frames. Absent therefore means "default", not "unknown". */
const sparse = (str) => {
  const m = new Map();
  String(str || '').split(',').filter(Boolean).forEach(kv => {
    const [k, v] = kv.split(':'); if (k !== undefined && v !== undefined) m.set(+k, v);
  });
  return m;
};
const csvNums = (str) => String(str || '').split(',').filter(x => x !== '').map(Number);

function woField(box, cfgLeaf, wide) {
  return `<input class="${wide ? 'w8' : 'w4'} wo" placeholder="write-only" title="The box accepts this setting but does not report it, so its current value cannot be shown."
            onchange="if(this.value!==''){cfgSet('${box}','${cfgLeaf}',this.value)}">`;
}

/* Silkscreen name for a pin VALUE (obs/sync fields): annotation only, and only
 * when the value is actually a mapped pin number. */
function silkPin(sk, v) {
  const n = Number(v);
  const s = sk && Number.isInteger(n) ? sk.pin(n) : null;
  return s ? ` <span class="age">${s}</span>` : '';
}

/* ---- "up since": anchored on state/watchdog ----
 *
 * The watchdog VALUE is seconds-since-boot by firmware contract (extio-zephyr
 * main.c adds missed beats back in, precisely so this stays true across
 * stalls), so boot instant = the datapoint's own timestamp minus its value.
 * Older pico/BLE boxes publish uptime_us instead -- once, at announce -- so it
 * anchors the same way, just from an older instant. Neither page had this
 * right before: the fleet page read uptime_us (which the Zephyr boxes never
 * publish, and the pico ones freeze at announce), so "up" was either ? or a
 * small number that looked like a fresh reboot.
 *
 * A DEAD box freezes: we report what it last told us ("was up 3d"), because a
 * silent box's present uptime is unknowable from here. */
function upInfo(box) {
  const b = boxes.get(box);
  let anchorT = null, upUsAtAnchor = 0;
  if (b && 'watchdog' in b && b.watchdog.v !== '' && !isNaN(+b.watchdog.v)) {
    anchorT = b.watchdog.t; upUsAtAnchor = (+b.watchdog.v) * 1e6;
  } else if (b && 'uptime_us' in b && !isNaN(+b.uptime_us.v)) {
    anchorT = b.uptime_us.t; upUsAtAnchor = +b.uptime_us.v;
  } else {
    return null;
  }
  const live = liveness(box).cls !== 'bad';
  const upUs = upUsAtAnchor + (live ? (now() - anchorT) : 0);
  return { boot: new Date((anchorT - upUsAtAnchor) / 1000), upUs, live };
}
function fmtDur(us) {
  const s = Math.floor(us / 1e6);
  if (s < 90) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 120) return m + 'm';
  const h = Math.floor(m / 60);
  return h < 48 ? h + 'h' : Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function fmtBoot(d) {
  return d.toLocaleString([], { month: 'short', day: 'numeric',
                                hour: '2-digit', minute: '2-digit' });
}

/* ---- group helpers ----
 *
 * Chord decode, same label algebra as extio.html / extioconf.tcl
 * extio_group_decode: announced pins ascending IS the bit order. */
function decodeChord(box, pins, val) {
  if (!pins.length || val === null || val === '' || isNaN(+val)) return null;
  const on = [];
  pins.forEach((p, i) => {
    if ((+val >> i) & 1) on.push(get(box, `label/${p}`) || ('p' + p));
  });
  return on.length ? on.join('_') : 'center';
}

/* Free a group slot. The write is the box contract (`pins`/`off` -> mask 0);
 * the LOCAL forget is for firmware that does not yet tombstone freed names:
 * dserv retains the old group/<name>/* keys forever, so without dropping them
 * from our model the row would re-render as a ghost. On reload the ghost
 * returns until the box's firmware learns to tombstone (or extio_clear purges
 * the box) -- this is the honest best available from the page side. */
function forgetLocal(box, prefixes) {
  const b = boxes.get(box); if (!b) return;
  for (const k of Object.keys(b)) {
    if (prefixes.some(p => k === p || k.startsWith(p + '/'))) delete b[k];
  }
}
async function clearGroup(box, idx, gname) {
  if (!confirm(`Free digital group slot ${idx}${gname ? ` (“${gname}”)` : ''}?`)) return;
  await cfgSet(box, `group/${idx}/pins`, 'off');
  forgetLocal(box, [`group/${gname}`]);
  panelHtml = null; renderPanel();
}
async function clearAinGroup(box, idx, gname) {
  if (!confirm(`Free analog group slot ${idx}${gname ? ` (“${gname}”)` : ''}?`)) return;
  await cfgSet(box, `ain/group/${idx}/off`, '1');
  forgetLocal(box, [`ain/group/${gname}`, `ain/${gname}`]);
  panelHtml = null; renderPanel();
}

/* DO NOT REDRAW WHILE THE USER IS IN THE PANEL.
 *
 * renderPanel() replaces #panel wholesale (the house style here -- see
 * www/CLAUDE.md), and it is driven by every datapoint update PLUS a 1 Hz tick
 * so ages stay honest. Both of those destroy the element you are interacting
 * with: an open <select> closes the instant a frame arrives, and text you are
 * typing is reset to the box's value. The dropdowns looked present but
 * unusable, which is exactly what a 1 Hz DOM replace does to a menu.
 *
 * Skipping the redraw while focus is inside the panel costs a second of age
 * staleness, only while you are actively editing, and only on the panel -- the
 * fleet list keeps ticking. A `pending` flag makes sure the state you missed is
 * drawn as soon as focus leaves, rather than waiting for the next update. */
let redrawPending = false;
/* Focus is NOT enough to detect "the user is interacting": Safari never
 * focuses a checkbox, radio or (sometimes) select on click, so activeElement
 * stays <body> through the whole press and the focus check alone lets a
 * datapoint-driven redraw yank the control mid-click. The pointer flag covers
 * the press itself: down inside the panel defers redraws until the pointer is
 * released, wherever it is released (window-level up/cancel, so a drag out of
 * the panel cannot wedge the flag). */
let panelPtrDown = false;
function panelBusy() {
  if (panelPtrDown) return true;
  const a = document.activeElement;
  return a && a !== document.body && document.getElementById('panel')?.contains(a);
}
/* Phases that mean "something is in flight" -- Abort is offered, Update is not. */
const OTA_BUSY = ['staging', 'verifying', 'arming', 'trial', 'confirming'];

function fwSection(b) {
  const lc   = get(b, 'ota/lifecycle', null);
  const msg  = get(b, 'ota/lifecycle_msg', '');
  const prog = get(b, 'ota/progress', null);
  const trial = get(b, 'ota/trial') == 1;
  const ch   = get(b, 'channel', 'dev');
  const busy = lc !== null && OTA_BUSY.includes(String(lc));
  const dead = liveness(b).cls === 'bad';

  /* THE TRIAL STATE IS THE DANGEROUS ONE and gets the loudest treatment on the
   * page: between arm and confirm, ANY reset reverts. That is the safety
   * property working as designed, but it is also the state in which a box
   * quietly loses an update nobody realises was pending. */
  const trialBanner = trial ? `<div id="dirty" style="background:#3a1f15;border-color:#7a3a36;color:#ffb4a8">
      <b>TRIAL BOOT — not yet permanent.</b> ${get(b, 'fw_ver', '?')} is running unconfirmed.
      Any reset reverts it to the previous image.
      <button class="primary" style="margin-left:10px" onclick="otaConfirm('${b}')">Confirm</button>
      <span class="age" style="margin-left:8px">to reject: do not confirm — power cycle</span>
    </div>` : '';

  /* lifecycle is published only by extio_ota_update. A box driven by hand has
   * none, so say so rather than rendering an empty progress line that looks
   * like a stalled transfer. */
  const lcRow = lc === null
    ? `<tr><th>lifecycle</th><td colspan="3" class="age">no run recorded — updates driven by hand do not publish it</td></tr>`
    : `<tr><th>lifecycle</th><td><b>${lc}</b> ${ageSpan(b, 'ota/lifecycle')}${
         prog !== null && busy ? ` · ${prog}%` : ''}</td>
       <td colspan="2" class="age">${msg}</td></tr>`;

  return `
    <h2>firmware</h2>
    ${trialBanner}
    <table>
      <tr><th>running</th><td>${get(b, 'fw_ver', '—')} ${ageSpan(b, 'fw_ver')}</td>
          <th>channel</th><td>${ch}</td></tr>
      <tr><th>staged</th><td>${get(b, 'ota/staged_ver', '—')}</td>
          <th>history</th><td class="age">${get(b, 'ota/updates', 0)} updates ·
              ${get(b, 'ota/reverts', 0)} reverts · ${get(b, 'ota/rejects', 0)} rejects</td></tr>
      ${lcRow}
    </table>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button ${busy || dead ? 'disabled' : ''} onclick="otaUpdate('${b}','${ch}')">
        Update from ${ch} shelf</button>
      <button class="danger" ${busy ? '' : 'disabled'} onclick="otaAbort('${b}')">Abort</button>
    </div>
    <p class="note">${dead ? 'Box is offline — an update cannot be started.' :
      'Stage → verify → arm → trial boot → confirm, driven by <code>extio_ota_update</code>. ' +
      'A box will refuse an image it is already running, so the shelf version must differ.'}</p>`;
}

let panelHtml = null;
function renderPanel() {
  if (panelBusy()) { redrawPending = true; return; }
  redrawPending = false;
  const el = document.getElementById('panel');
  if (!sel || !boxes.has(sel)) {
    const empty = '<div class="empty">select a box</div>';
    if (panelHtml !== empty) { el.innerHTML = panelHtml = empty; }
    return;
  }
  const b = sel, L = liveness(b);
  /* Silkscreen names for this board, or null -- annotation beside the numeric
   * ids, never a replacement for them (the number is the wire contract). */
  /* announced silk wins over the host-side table; see extio_silk.js */
  const sk = ExtioSilk.fromBox(get(b, 'board'), get(b, 'pins/silk'), get(b, 'ain/silk'));

  /* PINS. Read from what the box ANNOUNCES, which is NOT the same namespace you
   * WRITE. The box publishes `label/<n>` and `di/<n>`; you set `pin/<n>/label`.
   * Building the read side out of the config names -- which is what this page
   * did first -- yields a full form of empty boxes that looks like a template.
   *
   * Driven by pins/in + pins/out rather than a per-board table: MCXN947, RW612
   * and Teensy differ in count and reserved set, and a hardcoded map renders
   * confidently wrong pins for the next board. Known gap: only ACTIVE pins are
   * announced, so a pin set to `off` is invisible and cannot be re-enabled from
   * here -- that needs pins/all in box_announce_manifest(). */
  const pinsIn  = csvNums(get(b, 'pins/in'));
  const pinsOut = csvNums(get(b, 'pins/out'));
  const pinsAin = csvNums(get(b, 'pins/ain'));
  const pinsPup = csvNums(get(b, 'pins/pullup'));   /* subset of pins/in */
  const rsv     = new Set(csvNums(get(b, 'pins/reserved')));
  const alo     = new Set(csvNums(get(b, 'pins/active_low')));
  const deb     = sparse(get(b, 'pins/debounce_ms'));
  const pul     = sparse(get(b, 'pins/pulse_us'));
  /* pins/all is the BOARD's pin set. Falling back to the active lists keeps the
   * page working against a box on older firmware -- it just cannot then show a
   * pin that is currently `off`, which is exactly the gap pins/all closes. */
  const all = csvNums(get(b, 'pins/all'));
  const pins = (all.length ? all
                : [...new Set([...pinsIn, ...pinsOut])]).sort((x, y) => x - y);
  const havePinsAll = all.length > 0;

  const modeOf = p => rsv.has(p) ? 'reserved'
                    : pinsAin.includes(p) ? 'ain'
                    : pinsPup.includes(p) ? 'in_pullup'
                    : pinsIn.includes(p)  ? 'in'
                    : pinsOut.includes(p) ? 'out' : 'off';

  /* PINS THE OBS/SYNC ROLES ALREADY OWN.
   *
   * These are NOT in pins/reserved: box_gpio_reserved() covers only pins the
   * board does not map plus the DT box-reserved list (the PHY's MDIO). So the
   * firmware will cheerfully accept `pin <obspin> mode in` while the obs mirror
   * is also driving that pad -- two owners, no complaint, and the symptom is a
   * pin that will not follow either one. Ghost them here so the conflict is not
   * offered in the first place; clearing obs/sync pin hands the pad back.
   *
   * A UI GUARD, NOT ENFORCEMENT -- the box would still take the write from any
   * other client. Making box_gpio_reserved() include the obs/sync pins is the
   * real fix and belongs in firmware. */
  /* unset reads back as -1 from obs_pin but as 4294967295 from sync_pin (u32),
   * so normalise rather than leaning on "no pin is ever that big" */
  const claimed = v => { const n = Number(v); return (n >= 0 && n < 64) ? n : -1; };
  const obsPin  = claimed(get(b, 'obs_pin', -1));
  const syncPin = claimed(get(b, 'sync_pin', -1));
  const obsMode = String(get(b, 'obs/mode', 'mirror'));
  const ownedBy = p => (p >= 0 && p === obsPin)  ? `obs (${obsMode})`
                     : (p >= 0 && p === syncPin) ? 'sync in' : null;

  const pinRows = pins.map(p => {
    const mode = modeOf(p), lvl = get(b, `di/${p}`, null), res = mode === 'reserved';
    const own = res ? null : ownedBy(p);
    const sel = ['off', 'in', 'in_pullup', 'out', 'ain'].map(o =>
      `<option ${o === mode ? 'selected' : ''}>${o}</option>`).join('');
    return `<tr class="row" ${(res || own) ? 'style="opacity:.5"' : ''}>
      <td><b>${p}</b>${sk && sk.pin(p) ? ` <span class="age">${sk.pin(p)}</span>` : ''}</td>
      <td>${res ? '<span class="age">reserved</span>'
                : own ? `<span class="age" title="claimed by the obs/sync role — clear it above to free this pin">${own}</span>`
                : `<select onchange="cfgSet('${b}','pin/${p}/mode',this.value)">${sel}</select>`}</td>
      <td>${(mode === 'in' || mode === 'in_pullup') && lvl !== null
            ? `<b><span data-val-box="${esc(b)}" data-val-leaf="di/${p}"></span></b> ${ageSpan(b, 'di/' + p)}` : ''}</td>
      <td>${(res || own) ? '' : field(b, `label/${p}`, `pin/${p}/label`, { wide: 1 })}</td>
      <td>${(res || own) ? '' : `<input class="w4" value="${deb.get(p) ?? ''}" placeholder="0"
              onchange="cfgSet('${b}','pin/${p}/debounce_ms',this.value)">`}</td>
      <td>${(res || own) ? '' : `<input class="w4" value="${pul.get(p) ?? ''}" placeholder="0"
              onchange="cfgSet('${b}','pin/${p}/pulse_us',this.value)">`}</td>
      <td>${(res || own) ? '' : `<input type="checkbox" ${alo.has(p) ? 'checked' : ''}
              onchange="cfgSet('${b}','pin/${p}/active_low',this.checked?1:0)">`}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="age">no pins announced</td></tr>';

  /* GROUPS, one row per SLOT -- the announced ones filled in, the rest
   * CREATABLE. Only rendering announced groups is what made creation
   * impossible from this page: an unconfigured slot announces nothing, so
   * there was nothing to click. The box has a fixed number of slots
   * (BOX_NGROUPS; announced as groups/max by newer firmware, 4 on everything
   * current), so render them all and let typing a pin list bring one up.
   *
   * Announced groups are keyed BY NAME (group/<name>/pins) with
   * group/<name>/idx carrying the slot -- writes are by INDEX
   * (config/group/<i>/pins). A group whose announced pins are EMPTY is a
   * tombstone (newer firmware frees the name that way, because dserv retains
   * keys forever): treat it as an empty slot, not a group. */
  const bx = boxes.get(b) || {};
  const gmax = Number(get(b, 'groups/max')) || 4;
  const gslot = new Map();
  for (const k of Object.keys(bx)) {
    const m = /^group\/([^/]+)\/idx$/.exec(k);
    if (!m) continue;
    if (String(get(b, `group/${m[1]}/pins`, '')) === '') continue;   /* tombstone */
    gslot.set(+get(b, `group/${m[1]}/idx`), m[1]);
  }
  const groups = Array.from({ length: gmax }, (_, i) => {
    const gn = gslot.get(i);
    if (gn === undefined) {
      return `<tr class="row"><td><b>${i}</b></td>
        <td><input class="w8" placeholder="label (optional)"
             onchange="cfgSet('${b}','group/${i}/label',this.value)"></td>
        <td><input class="w8" placeholder="pins e.g. 2,3,4"
             onchange="if(this.value!=='')cfgSet('${b}','group/${i}/pins',this.value)"></td>
        <td><input class="w4" placeholder="0"
             onchange="cfgSet('${b}','group/${i}/settle_ms',this.value)"></td>
        <td><input type="checkbox"
             onchange="cfgSet('${b}','group/${i}/quiet',this.checked?1:0)"></td>
        <td class="age" colspan="2">unused — type a pin list to create</td></tr>`;
    }
    return `<tr class="row"><td><b>${i}</b></td>
      <td>${field(b, `group/${gn}/label`, `group/${i}/label`, { wide: 1, fallback: gn })}</td>
      <td>${field(b, `group/${gn}/pins`, `group/${i}/pins`, { wide: 1 })}</td>
      <td>${field(b, `group/${gn}/settle_ms`, `group/${i}/settle_ms`)}</td>
      <td><input type="checkbox" ${get(b, `group/${gn}/quiet`) == 1 ? 'checked' : ''}
           title="suppress members' per-pin di publishes"
           onchange="cfgSet('${b}','group/${i}/quiet',this.checked?1:0)"></td>
      <td><span data-grp-box="${esc(b)}" data-grp="${esc(gn)}"></span> ${ageSpan(b, `group/${gn}`)}</td>
      <td><button class="danger" title="free this slot (pins → off)"
           onclick="clearGroup('${b}',${i},'${esc(gn)}')">✕</button></td></tr>`;
  }).join('');

  /* ANALOG GROUPS, same slot treatment. Two firmware vintages exist:
   *   - announcing firmware publishes ain/group/<name>/{chans,mode,deadband,
   *     decimate,batch,avg,idx} in the manifest (chans == "" is a tombstone),
   *     so rows are readable exactly like the digital ones;
   *   - older firmware announces NOTHING about analog groups (only ain/rate +
   *     ain_en) even though it accepts every config/ain/group/<i>/* write and
   *     may well be RUNNING groups (the compiled-in default is a "joystick"
   *     group on ch0/1). For those, the config surface is honest-write-only
   *     (dashed, the woField idiom) and any group actually PUBLISHING betrays
   *     itself through its state/ain/<label> data blocks -- shown as
   *     slot-unknown rows above the writable ones. */
  const agmax = Number(get(b, 'ain/groups/max')) || 4;
  const agslot = new Map();
  let agAnnounced = false;
  for (const k of Object.keys(bx)) {
    const m = /^ain\/group\/([^/]+)\/idx$/.exec(k);
    if (!m) continue;
    agAnnounced = true;
    if (String(get(b, `ain/group/${m[1]}/chans`, '')) === '') continue;  /* tombstone */
    agslot.set(+get(b, `ain/group/${m[1]}/idx`), m[1]);
  }
  /* newest block values, tick-filled (a chatty on-change group would
   * otherwise churn the panel with every publish) */
  const lastCell = gn =>
    `<span data-ain-box="${esc(b)}" data-ain-grp="${esc(gn)}"></span> ${ageSpan(b, `ain/${gn}`)}`;
  const agModeSel = (i, cur) => `<select onchange="cfgSet('${b}','ain/group/${i}/mode',this.value)">` +
    ['onchange', 'continuous'].map(o =>
      `<option ${o === String(cur) ? 'selected' : ''}>${o}</option>`).join('') + '</select>';
  const blobOnly = [];
  for (const k of Object.keys(bx)) {
    const m = /^ain\/([^/]+)$/.exec(k);
    if (!m || !Array.isArray(bx[k].v) || m[1] === 'dbg' || m[1] === 'group') continue;
    if ([...agslot.values()].includes(m[1])) continue;         /* has a real row */
    if (String(get(b, `ain/group/${m[1]}/chans`, null)) === '') continue;  /* tombstoned ghost */
    blobOnly.push(m[1]);
  }
  const aingroups =
    blobOnly.sort().map(gn => `<tr class="row"><td class="age">?</td>
      <td><b>${esc(gn)}</b></td>
      <td colspan="6" class="age">publishing, but this firmware does not announce its slot/config</td>
      <td>${lastCell(gn)}</td><td></td></tr>`).join('') +
    Array.from({ length: agmax }, (_, i) => {
      const gn = agslot.get(i);
      if (gn === undefined) {
        const wo = agAnnounced ? '' : ' wo';
        const t = agAnnounced ? ''
          : ' title="This firmware does not report analog groups, so the current value cannot be shown. Writing still configures the box."';
        return `<tr class="row"><td><b>${i}</b></td>
          <td><input class="w8${wo}"${t} placeholder="label (optional)"
               onchange="cfgSet('${b}','ain/group/${i}/label',this.value)"></td>
          <td><input class="w4${wo}"${t} placeholder="chans e.g. 0,1"
               onchange="if(this.value!=='')cfgSet('${b}','ain/group/${i}/channels',this.value)"></td>
          <td>${agModeSel(i, 'onchange')}</td>
          <td><input class="w4${wo}"${t} placeholder="8"
               onchange="cfgSet('${b}','ain/group/${i}/deadband',this.value)"></td>
          <td><input class="w4${wo}"${t} placeholder="1"
               onchange="cfgSet('${b}','ain/group/${i}/decimate',this.value)"></td>
          <td><input class="w4${wo}"${t} placeholder="1"
               onchange="cfgSet('${b}','ain/group/${i}/batch',this.value)"></td>
          <td><input type="checkbox"
               onchange="cfgSet('${b}','ain/group/${i}/average',this.checked?1:0)"></td>
          <td class="age" colspan="2">unused — type channels to create</td></tr>`;
      }
      return `<tr class="row"><td><b>${i}</b></td>
        <td>${field(b, `ain/group/${gn}/label`, `ain/group/${i}/label`, { wide: 1, fallback: gn })}</td>
        <td>${field(b, `ain/group/${gn}/chans`, `ain/group/${i}/channels`)}</td>
        <td>${agModeSel(i, get(b, `ain/group/${gn}/mode`, 'onchange'))}</td>
        <td>${field(b, `ain/group/${gn}/deadband`, `ain/group/${i}/deadband`)}</td>
        <td>${field(b, `ain/group/${gn}/decimate`, `ain/group/${i}/decimate`)}</td>
        <td>${field(b, `ain/group/${gn}/batch`, `ain/group/${i}/batch`)}</td>
        <td><input type="checkbox" ${get(b, `ain/group/${gn}/avg`) == 1 ? 'checked' : ''}
             onchange="cfgSet('${b}','ain/group/${i}/average',this.checked?1:0)"></td>
        <td>${lastCell(gn)}</td>
        <td><button class="danger" title="free this slot"
             onclick="clearAinGroup('${b}',${i},'${esc(gn)}')">✕</button></td></tr>`;
    }).join('');

  const ainOn = get(b, 'ain_en') == 1;
  /* tick-filled spans, not inline text: these counters advance every second */
  const dbg = k => `<span data-val-box="${esc(b)}" data-val-leaf="ain/dbg/${k}"></span> ${ageSpan(b, 'ain/dbg/' + k)}`;

  /* ain CHANNEL MAP -- rendered only for boards with silkscreen names. The
   * channel COUNT comes from the box (ain/dbg/chans) when it has said; the
   * map itself is the board's published contract (extio-zephyr/PINMAP.md).
   * This page cannot tell firmware vintage apart, so the note owns the one
   * way the labels can lie: a pre-A0/A1 image samples ch0-2 on J8. */
  let ainMap = '';
  if (sk && sk.ain) {
    const nch = Number(get(b, 'ain/dbg/chans')) || 6;
    const rows = Array.from({ length: nch }, (_, k) => {
      const gate = sk.ainPin(k);
      const state = gate === null
        ? '<span class="age">dedicated pad — always analog</span>'
        : pinsAin.includes(gate)
          ? `pin ${gate} — <b>ain</b>`
          : `pin ${gate} — <span class="age">digital now (set pin ${gate} to ain to sample)</span>`;
      return `<tr class="row"><td><b>${k}</b></td><td><b>${sk.ain(k) ?? '—'}</b></td><td>${state}</td></tr>`;
    }).join('');
    ainMap = `<table style="margin-top:10px">
      <tr><th>ain ch</th><th>header</th><th>pad</th></tr>${rows}</table>
    <p class="note">ain channel <i>k</i> is Arduino A<i>k</i>. ch0/1 are dedicated pads and always
       analog; ch2–5 sample only while their pin is in <code>ain</code> mode (the group mask shrinks
       honestly meanwhile). A4 reaches the header through solder jumper SJ8; A5 shares SW2 — pressing
       the button grounds the net — so allocate it last. Labels assume the current Arduino-strip map:
       a box on a pre-A0/A1 image samples ch0–2 on J8-20/24/28 instead — update it before trusting
       them.</p>`;
  }

  const html = `
    <div style="display:flex;align-items:baseline;gap:12px">
      <h2 style="margin:0">${b}</h2>
      <span class="pill ${L.cls}">${L.txt}</span>
      <span class="age">watchdog ${ageSpan(b, 'watchdog')}</span>
    </div>

    <div id="dirty" class="${dirty.size ? '' : 'hide'}">${dirtyText()}</div>

    <h2>identity</h2>
    <table>
      <tr><th>name</th><td>${field(b, '\u0000none', 'name', { wide: 1, fallback: b })}</td>
          <th>board</th><td>${get(b, 'board', '?')}</td></tr>
      <tr><th>desc</th><td>${field(b, 'desc', 'desc', { wide: 1 })}</td>
          <th>build</th><td>${get(b, 'build', '?')}</td></tr>
      <tr><th>fw_ver</th><td>${get(b, 'fw_ver', '—')} ${ageSpan(b, 'fw_ver')}</td>
          <th>fw</th><td>${get(b, 'fw', '—')}</td></tr>
      <tr><th>boot</th><td>${get(b, 'boot', '?')}</td>
          <th>channel</th><td>${get(b, 'channel', '—')}</td></tr>
      <tr><th>up since</th><td colspan="3">${(() => {
            const u = upInfo(b);
            if (!u) return '<span class="age">unknown — no watchdog yet</span>';
            return `${fmtBoot(u.boot)} · ${u.live ? 'up' : '<span class="age dead">was up</span>'} ${fmtDur(u.upUs)}`;
          })()}</td></tr>
    </table>
    <p class="note"><code>fw_ver</code> is what MCUboot actually booted — the one to trust after an
       OTA. <code>fw</code> is compiled in and never changes, so it can look correct on a box running
       something else entirely. A <code>—</code> for <code>fw_ver</code> means the box has no MCUboot
       image manager (it is only announced under <code>CONFIG_MCUBOOT_IMG_MANAGER</code>), so it is
       not OTA-capable.</p>

    <h2>network</h2>
    <table>
      <tr><th>ip</th><td>${get(b, 'ip', '—')} ${ageSpan(b, 'ip')}</td>
          <th>transport</th><td>${get(b, 'transport', '—')}</td></tr>
      <tr><th>dserv ip</th><td>${field(b, 'dserv/ip', 'dserv/ip', { wide: 1 })} ${ageSpan(b, 'dserv/ip')}</td>
          <th>dserv port</th><td>${field(b, 'dserv/port', 'dserv/port')}</td></tr>
      <tr><th>net mode</th><td>${field(b, 'net/mode', 'net/mode', { wide: 1 })}</td><th></th><td></td></tr>
    </table>
    <p class="note">Re-pointing <code>dserv/ip</code> moves the box to another rig. It cannot be
       set here for a box that has never reached a dserv — that is extio-setup's job.</p>

    <h2>obs / sync</h2>
    <table>
      <tr><th>obs pin</th><td>${field(b, 'obs_pin', 'obs/pin', { i32: 1 })}${silkPin(sk, get(b, 'obs_pin'))} ${ageSpan(b, 'obs_pin')}</td>
          <th>sync pin</th><td>${field(b, 'sync_pin', 'sync/pin', { i32: 1 })}${silkPin(sk, get(b, 'sync_pin'))} ${ageSpan(b, 'sync_pin')}</td></tr>
      <tr><th>obs mode</th><td>${(() => {
            const m = String(get(b, 'obs/mode', 'mirror'));
            return `<select onchange="cfgSet('${b}','obs/mode',this.value)">` +
              ['mirror', 'leader'].map(o =>
                `<option${o === m ? ' selected' : ''}>${o}</option>`).join('') +
              `</select>`;
          })()} ${get(b, 'obs_leader', 0) == 1
            ? '<span class="ok">announced obs leader</span>' : ''}</td>
          <th></th><td></td></tr>
    </table>
    <p class="note"><b>mirror</b> follows the host's <code>ess/in_obs</code> (the classic LED/scope
       trace). <b>leader</b> makes this box the obs authority: an <code>at_abs</code> on the obs pin
       is a scheduled onset — the box asserts the line at T, stamps the actual instant into
       <code>state/in_obs</code>, and mirror-following is suppressed so the line moves only at
       scheduled instants. A persisted leader (<code>cmd/save</code>) is announced, and
       <code>::ess::obs_schedule_bind auto auto</code> finds it. The sync pin is the complementary
       follower role: boxes wired to the leader's line hardware-stamp the same edge.</p>

    <h2>pins</h2>
    <table><tr><th>pin</th><th>mode</th><th>level</th><th>label</th><th>debounce ms</th><th>pulse µs</th><th>act low</th></tr>${pinRows}</table>
    <p class="note">${havePinsAll
       ? 'Every pin the board maps, from <code>pins/all</code>; reserved pins are shown but refused by the box. Blank debounce/pulse means the default (0) — the manifest sends only pins that differ.'
       : 'This box predates <code>pins/all</code>, so only ACTIVE pins appear and a pin set to <code>off</code> cannot be shown or re-enabled. Update its firmware to configure the full map.'}${
       (sk && !sk.announced) ? ' Pin numbers ARE the silkscreen: box pin <i>n</i> is Arduino D<i>n</i>, and pins 14–17 are the A2–A5 positions.'
       : sk ? ' The grey name beside each pin is what is printed on the board, announced by the box itself — box pin numbers are an internal index and need not match it.' : ''}</p>

    <h2>digital groups</h2>
    <table><tr><th>#</th><th>label</th><th>pins</th><th>settle ms</th><th>quiet</th><th>value</th><th></th></tr>${groups}</table>
    <p class="note">A group publishes its member pins as ONE atomic bitmask event
       (<code>state/group/&lt;label&gt;</code>, bit <i>i</i> = <i>i</i>-th lowest pin), settled over
       <code>settle ms</code> so a rolling chord (joystick diagonal) arrives as one event stamped at
       the first edge. <code>quiet</code> suppresses the members' per-pin <code>di/&lt;n&gt;</code>
       publishes. Type a pin list into a free slot to create a group; ✕ frees the slot.</p>

    <h2>analog groups</h2>
    <table><tr><th>#</th><th>label</th><th>chans</th><th>mode</th><th>deadband</th><th>decimate</th><th>batch</th><th>avg</th><th>last</th><th></th></tr>${aingroups}</table>
    <p class="note">An analog group publishes a named set of ADC channels together as
       self-describing blocks on <code>state/ain/&lt;label&gt;</code>. <code>onchange</code> emits when a
       member moves more than <code>deadband</code> counts (joystick); <code>continuous</code> takes every
       <code>decimate</code>-th base scan (boxcar-averaged if <code>avg</code>), batching
       <code>batch</code> takes per block. The base scan rate is <code>ain/rate</code> below, and
       sampling runs only while analog is enabled and a member channel is available.${
       agAnnounced ? '' : ' <b>This firmware does not announce analog group config</b> — dashed fields are write-only (a write still configures the box); update the firmware for full readback.'}</p>

    <h2>analog</h2>
    <table>
      <tr><th>enabled</th><td>
            <select onchange="cfgSet('${b}','ain/enable',this.value)">
              <option value="1" ${ainOn ? 'selected' : ''}>on</option>
              <option value="0" ${ainOn ? '' : 'selected'}>off</option>
            </select></td>
          <th>base rate Hz</th><td>${field(b, 'ain/rate', 'ain/rate')} ${ageSpan(b, 'ain/rate')}</td></tr>
      <tr><th>running</th><td>${dbg('running')}</td><th>powered</th><td>${dbg('powered')}</td></tr>
      <tr><th>sweeps</th><td>${dbg('sweeps')}</td><th>throttled</th><td>${dbg('throttled')}</td></tr>
    </table>
    <p class="note"><code>running</code> is what the box is DOING; <code>enabled</code> is what it was
       told. They differ legitimately — held during an OTA, no group defined, or no pin in
       <code>ain</code> mode. Any <code>throttled</code> at all means a group is publishing faster
       than the uplink can afford.</p>
    ${ainMap}

    ${fwSection(b)}

    <div id="actionbar">
      <button id="savebtn" class="primary" onclick="doSave('${b}')" ${dirty.size ? '' : 'disabled'}>
        ${saveText()}</button>
      <button class="danger" onclick="doReboot('${b}')">Reboot</button>
      <button onclick="conn.send('extio_cfg_announce ${b}','extio')" title="Ask the box to re-publish everything now">Refresh from box</button>
    </div>
  `;
  if (html !== panelHtml) { el.innerHTML = panelHtml = html; tickAges(el); }
}

/* ---- boot ---- */
async function init() {
  /* THE UI LOOP MUST NOT DEPEND ON THE CONNECTION.
   *
   * This used to `return` when connect() failed, and everything below -- the
   * focusout catch-up AND the 1 Hz re-render -- was set up after that point. So
   * a dserv that was briefly unreachable at page load left a page that never
   * ticked again, even once autoReconnect restored the socket underneath it.
   * Ages froze, staleness stopped being visible, and the deferred redraw never
   * fired: precisely the "looks fine, is lying" failure this page exists to
   * prevent, reproduced in the page itself.
   *
   * Everything that is purely local is therefore started FIRST and
   * unconditionally. */
  document.getElementById('panel').addEventListener('focusout', () => {
    setTimeout(() => { if (redrawPending && !panelBusy()) renderPanel(); }, 0);
  });
  /* the pointer half of panelBusy() -- see its comment (Safari checkboxes) */
  document.getElementById('panel').addEventListener('pointerdown',
    () => { panelPtrDown = true; }, true);
  const ptrDone = () => {
    panelPtrDown = false;
    setTimeout(() => { if (redrawPending && !panelBusy()) renderPanel(); }, 0);
  };
  window.addEventListener('pointerup', ptrDone, true);
  window.addEventListener('pointercancel', ptrDone, true);

  /* Re-render on a timer as well as on updates: AGE changes with the clock, not
   * with traffic, so a box going silent must become visibly stale on its own.
   * This is also the GUARANTEE behind the redraw deferral -- focusout only makes
   * the catch-up snappier; the tick is what makes it certain.
   *
   * tickAges runs FIRST and unconditionally: it fills the age spans in place
   * (no DOM replacement, so it is safe even mid-click), which keeps ages
   * honest even while renderPanel() is deferring because the user is in the
   * panel -- staleness must stay visible exactly then. The render calls after
   * it only touch the DOM when a VALUE or liveness bucket changed. */
  setInterval(() => { tickAges(document); renderClockWarn(); renderFleet();
                      if (sel) renderPanel(); }, 1000);

  /* ?host=<host[:port]> and ?ssl=1|0 -- the standard three lines every page here
   * needs (www/CLAUDE.md). ssl matters when the page and dserv disagree on
   * protocol, which is exactly the zero-deploy dev loop:
   *   python3 -m http.server 8090 --directory www
   *   http://localhost:8090/extio-config.html?host=rig:2565&ssl=1 */
  const qs = new URLSearchParams(location.search);
  const qsHost = qs.get('host'), qsSsl = qs.get('ssl');
  conn = new DservConnection({
    subprocess: 'extio',
    dservHost: qsHost || null,
    forceSecure: qsSsl !== null ? qsSsl === '1' : undefined,
    autoReconnect: true,
    onStatus: (st) => setConn(st === 'connected', st),
  });

  /* Subscribe REGARDLESS of whether this first attempt succeeds:
   * DatapointManager re-subscribes on reconnect, so a page opened before dserv
   * is up populates itself when dserv arrives instead of needing a reload. */
  dp = new DatapointManager(conn, { autoGetKeys: false });
  dp.subscribe('extio/*', onExtio);

  /* SEED FROM THE RETAINED VALUES, or the page shows only what happens to be
   * published after it loads.
   *
   * A subscription delivers CHANGES. Almost everything this page renders --
   * board, build, fw_ver, pins/*, dserv/ip, the whole manifest -- is published
   * once in the announce burst when a box connects, and there is no periodic
   * re-announce. So a page opened at any other moment saw a handful of live
   * leaves (di, watchdog) and nothing else, and looked "partly filled" in a way
   * that varied with when you opened it.
   *
   * refreshKeys() subscribes to @keys AND requests it once, so we learn the
   * keys that already exist and can sendGet each one. Called AFTER connect
   * because the request needs a socket, and again on every reconnect -- with
   * `fetched` cleared, since a box that reconnected in the meantime has values
   * we never asked for. */
  dp.on('keys:update', ({ keys }) => {
    for (const k of keys) {
      if (!/^extio\/[^/]+\/state\//.test(k)) continue;
      if (fetched.has(k)) continue;
      fetched.add(k); dp.sendGet(k);
    }
  });

  /* ?box=<name> -- arriving from extio.html's per-card `configure` link. The
   * box will not exist in `boxes` yet (nothing has been received), so remember
   * it and select on first sight rather than selecting nothing and looking
   * like the link was ignored. */
  const wantBox = qs.get('box');
  if (wantBox) pendingSelect = wantBox;

  const seed = () => { fetched = new Set(); dp.refreshKeys(); };

  try {
    await conn.connect();
    setConn(true, 'connected');
    seed();
  } catch (e) {
    setConn(false, 'connection failed — retrying');
  }

  /* autoReconnect brings the socket back without reloading the page; the values
   * do not come back with it unless we ask again. */
  if (conn.on) conn.on('connected', seed);
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
