<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Viewer</title>
    <link rel="stylesheet" href="css/page_nav.css">
    <link rel="stylesheet" href="css/trial_viewer.css?v=20261017o">
</head>
<body>
    <header class="tv-bar">
        <h1>Trial Viewer</h1>
        <span id="status-dot" class="tv-dot"></span>
        <span id="status-text">Connecting...</span>
        <div class="tv-spacer"></div>
        <div id="page-nav-container"></div>
    </header>

    <main class="tv-main">
        <div class="tv-filters">
            <label>Subject
                <select id="subject"></select>
            </label>
            <label>System
                <select id="system"></select>
            </label>
            <label>Protocol
                <select id="protocol"></select>
            </label>
            <label>Block
                <select id="block"></select>
            </label>
            <label>Trial
                <div class="tv-trial-wrap">
                    <select id="trial" class="tv-trial-native" tabindex="-1" aria-hidden="true"></select>
                    <button id="trial-button" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>trial</button>
                    <div id="trial-menu" class="tv-trial-menu" role="listbox" hidden></div>
                </div>
            </label>
            <div class="tv-layers-wrap">
                <span class="tv-layers-caption">Layers</span>
                <button id="layers-button" type="button" aria-expanded="false" aria-haspopup="true">None</button>
                <div id="layers-menu" class="tv-layers-menu" hidden></div>
            </div>
            <button id="action" type="button" data-mode="create" disabled>Create</button>
        </div>
        <div class="tv-stage">
            <div class="tv-screen">
                <video id="player"></video>
                <div id="touch-layer" class="tv-touch-layer"></div>
                <div id="mask" class="tv-mask"></div>
            </div>
            <input id="scrub" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Frame">
            <div class="tv-times">
                <span id="playback">frame —</span>
                <span id="playback-end">frame —</span>
            </div>
            <div class="tv-download">
                <a id="download" aria-disabled="true">Download</a>
            </div>
        </div>
        <p id="message"></p>
    </main>

    <div id="modal" class="tv-modal" hidden>
        <div class="tv-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-text">
            <p id="modal-text"></p>
            <div class="tv-modal-actions">
                <button id="modal-cancel" type="button">Cancel</button>
                <button id="modal-ok" type="button">OK</button>
            </div>
        </div>
    </div>

    <script src="js/ws_manager.js"></script>
    <script src="js/DatapointManager.js"></script>
    <script src="js/PageNav.js"></script>
    <script src="js/trial_viewer.js?v=20261017p"></script>
</body>
</html>
