<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>input devices</title>
<link rel="stylesheet" href="css/page_nav.css">
<style>
  /* Same palette as extio.html so the pages read as one family. The
     LAYOUT deliberately differs: extio is a grid of homogeneous box cards
     you scan, this is master/detail, because the job here is a workflow
     (pick a device, configure it, watch it work, save it) on at most a
     handful of heterogeneous devices — and the trace surface, which is the
     whole point, needs room a 330px card cannot give it. */
  :root {
    --bg: #16181d; --card: #21252c; --card-edge: #2e343d; --ink: #e8eaed;
    --muted: #9aa3af; --faint: #6b7280; --green: #4ade80; --blue: #60a5fa;
    --amber: #fbbf24; --red: #f87171; --off: #3a4048;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 22px;
           border-bottom: 1px solid var(--card-edge); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               background: var(--off); margin-right: 6px; }
  #conn.ok .dot { background: var(--green); }
  #conn.bad .dot { background: var(--red); }

  #wrap { display: grid; grid-template-columns: minmax(300px, 380px) 1fr;
          gap: 18px; padding: 18px 22px; align-items: start; }
  @media (max-width: 860px) { #wrap { grid-template-columns: 1fr; } }

  .panel { background: var(--card); border: 1px solid var(--card-edge);
           border-radius: 10px; padding: 14px 16px; }
  .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase;
              letter-spacing: .06em; color: var(--faint); margin: 0 0 10px; }
  .sect + .sect { margin-top: 18px; }

  .row { display: flex; align-items: center; gap: 9px; padding: 7px 9px;
         border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .row:hover { background: #262b33; }
  .row.sel { background: #262b33; border-color: #3d4653; }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off);
              flex: 0 0 auto; }
  .row.live .dot { background: var(--green); }
  .row.idle .dot { background: var(--amber); }
  .row.gone .dot { background: var(--red); }
  .row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .row .cls { font-size: 11px; color: var(--faint); flex: 0 0 auto; }
  .row.dim .nm { color: var(--faint); }

  .chip { display: inline-block; font-size: 11px; padding: 1px 8px;
          border-radius: 6px; background: var(--off); color: var(--muted); }
  .chip.on { background: #14351f; color: var(--green); }
  .chip.warn { background: #3a2c10; color: var(--amber); }
  .chip.bad { background: #3f1d1d; color: var(--red); }

  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px;
        font-size: 13px; margin-bottom: 14px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; font-family: ui-monospace, Menlo, monospace;
           overflow-wrap: anywhere; }

  /* The trace. This is the reassurance: numbers changing prove a datapoint
     is moving, a dot that follows your hand proves the whole chain — device,
     driver, classification, reader thread, coordinate mapping — is right. */
  /* Capped as well as ratio'd: on a wide pane 16/10 pushes the save and
     release buttons below the fold, and a control you have to scroll to
     find on a page whose whole job is "adopt this, then save it" is a
     control people will not find. */
  /* Width/height are set from the device's extent in renderLive; these
     are only the pre-first-paint fallback. margin:auto centres the box
     once it is narrower than the panel (a tall extent hitting the cap). */
  #trace { width: 100%; aspect-ratio: 16 / 10; max-height: 46vh;
           margin: 0 auto; background: #12141a;
           border: 1px solid var(--card-edge);
           border-radius: 8px; display: block; }
  #tracehint { font-size: 12px; color: var(--faint); margin-top: 6px; }

  form.cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
             gap: 10px 14px; margin: 14px 0; }
  form.cfg label { font-size: 12px; color: var(--faint); display: block; }
  form.cfg input, form.cfg select {
      width: 100%; background: #141720; color: var(--ink); border: 1px solid #38405a;
      border-radius: 5px; padding: 4px 7px; font: inherit; font-size: 13px; }
  .checkline { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .checkline input { width: auto; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  button { background: #141720; color: var(--ink); border: 1px solid #38405a;
           border-radius: 6px; padding: 5px 13px; font: inherit; font-size: 13px;
           cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--blue); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { border-color: #2f6d43; background: #16301f; color: var(--green); }
  button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }

  #msg { font-size: 13px; margin-top: 10px; min-height: 19px; }
  #msg.err { color: var(--red); }
  #msg.ok { color: var(--green); }
  .hint { font-size: 12px; color: var(--faint); margin: 8px 0 0; }
  .empty { color: var(--faint); font-size: 13px; padding: 6px 9px; }
  code { font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>input devices</h1>
  <div id="page-nav-container"></div>
  <span id="conn"><span class="dot"></span><span id="conn-msg">connecting</span></span>
</header>

<div id="wrap">
  <div class="panel" id="left">
    <div class="sect">
      <h2>adopted</h2>
      <div id="adopted"></div>
    </div>
    <div class="sect">
      <h2>available</h2>
      <div id="available"></div>
    </div>
    <div class="sect">
      <h2>saved for this rig</h2>
      <div id="saved"></div>
    </div>
  </div>

  <div class="panel" id="right">
    <div id="detail"><div class="empty">select a device on the left</div></div>
  </div>
</div>

<script src="js/ws_manager.js"></script>
<script src="js/DatapointManager.js"></script>
<script src="js/PageNav.js"></script>
<script>
'use strict';

PageNav.init('page-nav-container', 'input');

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let conn = null, dp = null;
let state = { classes: [], devices: [], probe: [], saved: [] };
let sel = null;          // {kind:'adopted'|'available'|'saved', key}
let subscribed = new Set();

/* Live coordinates per datapoint, plus a short trail for the trace.

   Pruned by TIME, not by point count. A count cap makes the trace mean
   something different on every device: at 30 reports/s a 240-point trail
   is eight seconds of history and draws a tangled scribble, while at
   1000/s the same cap is a quarter of a second and draws a short clean
   stroke. Two devices then look nothing alike for reasons that have
   nothing to do with either one. A fixed time window makes them
   comparable, and lets a slow device look honestly sparse.

   TRAIL_MAX survives only as a memory guard for the 1 kHz case. */
const TRAIL_SECONDS = 2.5;
const TRAIL_MAX = 4000;
const live = new Map();  // datapoint -> {x,y,ev,at,count,trail:[],range:[0,w,0,h]}

/* Events arrive far faster than anyone can see — up to ~1000/s from a
   1 kHz mouse in motion. Coalesce to animation frames: the model updates
   on every event (so the counter and the trail are complete), but the DOM
   and canvas are touched once per frame. */
let rafPending = false;
function scheduleRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; renderLive(); });
}

function liveFor(name) {
    let l = live.get(name);
    if (!l) { l = { x: 0, y: 0, ev: -1, at: 0, count: 0, trail: [], range: null };
              live.set(name, l); }
    return l;
}

/* A multi-element datapoint arrives from DatapointManager as a real JS
   ARRAY ([1627, 132, 3]), not the space-separated text `dservctl get`
   prints. Accept both: String() on an array yields "1627,132,3", which a
   whitespace split turns into a single token and silently drops every
   event — which is precisely what happened before this was tested against
   a live rig. */
function nums(d) {
    const raw = d.data ?? d.value;
    if (Array.isArray(raw)) return raw.map(Number);
    return String(raw ?? '').trim().split(/[\s,]+/).filter(s => s !== '').map(Number);
}

/* Drop trail points older than the window. Also called from the redraw
   so a device that goes quiet fades out instead of leaving its last
   stroke frozen on screen looking live. */
function pruneTrail(l) {
    const cut = Date.now() - TRAIL_SECONDS * 1000;
    let i = 0;
    while (i < l.trail.length && l.trail[i].at < cut) i++;
    if (i) l.trail.splice(0, i);
    if (l.trail.length > TRAIL_MAX) l.trail.splice(0, l.trail.length - TRAIL_MAX);
}

function onEvent(name, d) {
    /* uint16[3] = (x, y, event_type), same shape for every class. */
    const v = nums(d);
    if (v.length < 3 || v.some(isNaN)) return;
    const l = liveFor(name);
    l.x = v[0]; l.y = v[1]; l.ev = v[2]; l.at = Date.now(); l.count++;
    /* Two clocks, on purpose. `at` is browser arrival, used only for the
       "how long since I saw anything" readout and for trail ageing.
       `ts` is the datapoint's OWN timestamp — the kernel's URB-completion
       time — and is what every rate and gap figure is computed from.
       Measuring intervals from arrival time would fold WebSocket and
       browser scheduling jitter into a number people will read as a
       property of the device. */
    l.ts = (typeof d.timestamp === 'number') ? d.timestamp / 1000 : null;  /* us -> ms */
    l.trail.push({ x: v[0], y: v[1], down: v[2] !== 2 && v[2] !== 3,
                   at: l.at, ts: l.ts });
    pruneTrail(l);

    /* Peak-hold over a 0.5 s window. The rolling rate below averages the
       whole trail, so it is dragged down by every pause between strokes
       and answers "how hard is this being used" rather than "what is this
       device capable of". Comparing two devices needs the latter: an
       optical mouse and a Magic Trackpad measured 31/s and 30/s on
       12-second averages, which says they are equivalent, while their
       peaks are 96 Hz and 81 Hz — the honest comparison, and near this
       mouse's 100 Hz low-speed ceiling. */
    /* All timing figures below come from device timestamps (see above);
       skip them entirely rather than silently fall back to arrival time
       for a producer that publishes without one. */
    if (l.trail.length > 2 && l.ts != null && l.trail[l.trail.length - 2].ts != null) {
        const now = l.ts;
        let i = l.trail.length - 1;
        while (i > 0 && l.trail[i - 1].ts != null && now - l.trail[i - 1].ts <= 500) i--;
        const span = (now - l.trail[i].ts) / 1000;
        const n = l.trail.length - 1 - i;
        if (span > 0.15 && n > 1) l.peak = Math.max(l.peak || 0, Math.round(n / span));

        /* Worst inter-sample gap that represents DROPPED SAMPLES rather
           than a still hand. This, not the mean rate, is what predicts
           visible stepping when input drives a stimulus: a device
           averaging 81 Hz still misses a frame wherever one gap exceeds
           the frame period.

           Nothing here can observe the hand, so "device stuttered" vs
           "user stopped" is an INFERENCE, and it rests on one assumption:
           that we were already sampling at a normal cadence and real
           displacement occurred across the gap. A resume-after-pause has
           a long gap and large displacement, but no preceding cadence, so
           it is correctly ignored; a stutter mid-stroke has all three.
           A device that stalls from the very first sample of a stroke is
           the case this cannot catch. */
        const p1 = l.trail[l.trail.length - 2];
        const p2 = l.trail[l.trail.length - 3];
        if (p1 && p2 && p1.ts != null && p2.ts != null) {
            const gap = now - p1.ts;
            const wasStreaming = (p1.ts - p2.ts) < 30;      /* ms — normal cadence */
            const moved = Math.hypot(v[0] - p1.x, v[1] - p1.y) > 1;
            if (gap > 0 && wasStreaming && moved) {
                l.maxGap = Math.max(l.maxGap || 0, gap);
            }
        }
    }
    scheduleRender();
}

function onRange(name, d) {
    const v = nums(d);
    if (v.length < 4 || v.some(isNaN)) return;
    liveFor(name).range = v;   // [min_x, max_x, min_y, max_y]
    scheduleRender();
}

function subscribeClasses() {
    for (const c of state.classes) {
        const dpt = c.datapoint;
        if (subscribed.has(dpt)) continue;
        subscribed.add(dpt);
        dp.subscribe(dpt, d => onEvent(dpt, d));
        dp.subscribe(dpt + '/range', d => onRange(dpt, d));
        /* subscriptions fire on CHANGE only — seed whatever is retained,
           so a page opened mid-session shows the last known position and
           the declared range rather than an empty box. */
        dp.sendGet(dpt);
        dp.sendGet(dpt + '/range');
    }
}

/* ---------------------------------------------------------------- data */

async function refresh() {
    let raw;
    try {
        raw = await conn.evalAsync('send input {inputStatusJson}');
    } catch (e) { return setMsg('status query failed: ' + e.message, 'err'); }
    /* `send` reports a cross-interp error as a SUCCESSFUL result string
       prefixed "!TCL_ERROR " rather than rejecting — check for it. */
    if (typeof raw === 'string' && raw.startsWith('!TCL_ERROR')) {
        return setMsg(raw.replace(/^!TCL_ERROR\s*/, ''), 'err');
    }
    try { state = JSON.parse(raw); }
    catch (e) { return setMsg('could not parse status: ' + e.message, 'err'); }
    subscribeClasses();
    renderAll();
}

async function inputCmd(script) {
    const r = await conn.evalAsync(`send input {${script}}`);
    if (typeof r === 'string' && r.startsWith('!TCL_ERROR')) {
        throw new Error(r.replace(/^!TCL_ERROR\s*/, ''));
    }
    return r;
}

function setMsg(text, cls) {
    const m = $('msg');
    if (!m) return;
    m.textContent = text || '';
    m.className = cls || '';
}

/* --------------------------------------------------------------- lists */

/* Tcl glob -> regex. inputKnownDevice patterns are Tcl globs, so the page
   has to match them the same way the module will, or it would offer
   settings for an entry that will not actually apply at next boot. */
function globMatch(str, pat) {
    const rx = '^' + String(pat)
        .replace(/[.+^${}()|[\]\\]/g, '\\$&')
        .replace(/\*/g, '.*')
        .replace(/\?/g, '.') + '$';
    try { return new RegExp(rx).test(String(str)); } catch (e) { return false; }
}

/* The saved entry this device would be adopted under at next boot, if
   any. Used to pre-fill the adopt form: having saved an extent once,
   nobody should have to retype it to bring the same device back. */
function savedFor(p) {
    return state.saved.find(s => s.class === p.class &&
        ((p.by_id && globMatch(p.by_id, s.pattern)) ||
         (p.name  && globMatch(p.name,  s.pattern))));
}

const deviceByClass = c => state.devices.find(d => d.class === c);
const classNames = () => state.classes.map(c => c.name);
const dpForClass = c => (state.classes.find(x => x.name === c) || {}).datapoint;

function liveness(d) {
    /* connected===0 means the hardware is gone and the reader is waiting
       for it to reappear. That is a different state from "adopted but
       nobody has touched it", and must not read as merely idle. */
    if (d.connected !== undefined && !Number(d.connected)) return 'gone';
    const l = live.get(d.datapoint);
    if (!l || !l.at) return d.events > 0 ? 'idle' : '';
    return (Date.now() - l.at) < 2000 ? 'live' : 'idle';
}

function renderAdopted() {
    const el = $('adopted');
    if (!state.devices.length) {
        el.innerHTML = '<div class="empty">none</div>';
        return;
    }
    el.innerHTML = state.devices.map(d => `
      <div class="row ${liveness(d)} ${sel && sel.kind === 'adopted' && sel.key === d.class ? 'sel' : ''}"
           data-kind="adopted" data-key="${esc(d.class)}">
        <span class="dot"></span>
        <span class="nm">${esc(d.by_id || d.path)}</span>
        <span class="cls">${esc(d.class)}</span>
      </div>`).join('');
}

function renderAvailable() {
    const el = $('available');
    const free = state.probe.filter(p => !p.adopted);
    if (!free.length) {
        el.innerHTML = '<div class="empty">nothing unclaimed</div>';
        return;
    }
    el.innerHTML = free.map(p => {
        const known = classNames().includes(p.class);
        return `
      <div class="row ${known ? '' : 'dim'} ${sel && sel.kind === 'available' && sel.key === p.path ? 'sel' : ''}"
           data-kind="available" data-key="${esc(p.path)}">
        <span class="dot"></span>
        <span class="nm">${esc(p.by_id || p.name || p.path)}</span>
        <span class="cls">${esc(p.class)}</span>
      </div>`;
    }).join('');
}

function renderSaved() {
    const el = $('saved');
    if (!state.saved.length) {
        el.innerHTML = '<div class="empty">none saved</div>';
        return;
    }
    el.innerHTML = state.saved.map((s, i) => `
      <div class="row ${sel && sel.kind === 'saved' && sel.key === i ? 'sel' : ''}"
           data-kind="saved" data-key="${i}">
        <span class="dot"></span>
        <span class="nm">${esc(s.pattern)}</span>
        <span class="cls">${esc(s.class)}</span>
      </div>`).join('');
}

/* -------------------------------------------------------------- detail */

function fieldsFor(cls, vals) {
    vals = vals || {};
    const num = (id, label, v, step) =>
        `<div><label for="${id}">${label}</label>
         <input id="${id}" type="number" ${step ? `step="${step}"` : ''}
                value="${v === undefined || v === '' ? '' : esc(v)}"></div>`;
    let f = '';
    if (cls === 'mouse' || cls === 'touchscreen') {
        f += num('f_screen_w', 'screen width (px)', vals.screen_w);
        f += num('f_screen_h', 'screen height (px)', vals.screen_h);
    }
    if (cls === 'mouse') {
        f += num('f_gain', 'gain (counts → px)', vals.gain !== undefined ? vals.gain : 1, '0.05');
        f += num('f_move_every', 'publish every Nth move',
                 vals.move_every !== undefined ? vals.move_every : 1);
    }
    if (cls === 'touchscreen') {
        f += `<div><label for="f_rotation">rotation</label>
              <select id="f_rotation">
                ${[['', 'auto (HDMI)'], ['0', '0'], ['90', '90'], ['180', '180'], ['270', '270']]
                  .map(([v, t]) => `<option value="${v}" ${String(vals.rotation ?? '') === v ? 'selected' : ''}>${t}</option>`).join('')}
              </select></div>`;
    }
    /* Offered for EVERY class, not just mouse. A trackpad used as subject
       input wants to be hidden from the desktop exactly as much as a
       mouse does — that is what the LIBINPUT_IGNORE_DEVICE udev rule in
       the trackpad onboarding recipe has been doing by hand. The module
       has always applied -grab per device regardless of class; only this
       form was restricting it. */
    f += `<div class="checkline" style="align-self:end">
            <input id="f_grab" type="checkbox" ${Number(vals.grab) ? 'checked' : ''}>
            <label for="f_grab" style="margin:0">grab (hide from desktop)</label>
          </div>`;
    return f;
}

function readFields(cls) {
    const g = id => { const e = $(id); return e ? e.value.trim() : ''; };
    const opts = {};
    if (cls === 'mouse' || cls === 'touchscreen') {
        if (g('f_screen_w')) opts.screen_w = g('f_screen_w');
        if (g('f_screen_h')) opts.screen_h = g('f_screen_h');
    }
    if (cls === 'mouse' && g('f_gain')) opts.gain = g('f_gain');
    if (cls === 'mouse' && g('f_move_every')) opts.move_every = g('f_move_every');
    if (cls === 'touchscreen' && g('f_rotation')) opts.rotation = g('f_rotation');
    opts.grab = $('f_grab') && $('f_grab').checked ? '1' : '0';
    return opts;
}

const optsToArgs = o => Object.entries(o).map(([k, v]) => `-${k} ${v}`).join(' ');

/* The glob a save should propose. An adopted device already pinned to a
   pattern keeps it; otherwise fall back to the by-id name, WILDCARDED —
   the same form the adopt path builds, so a device saved from here and
   one adopted from "available" are identified the same way rather than
   one being a bare literal.
   It is only a proposal: the field is editable, because by-id names for
   some devices (Apple trackpads among them) carry a unit serial, and
   whether to pin that tightly is the operator's call, not a default. */
/* Host HID polling, shown on every adopted device because it applies to
   ALL of them and silently determines the ceiling. Without this on
   screen, a rig measuring 62.5 Hz off a 1 kHz mouse reads as slow
   hardware — which is how this rig was misread before the setting was
   found. Reporting the number is the point; the warning is secondary. */
function hostPollRow() {
    const mp = state.host && state.host.mousepoll;
    if (mp === undefined || mp === null) return '';
    if (Number(mp) === 0) {
        return `<dt>host polling</dt><dd>per-device <span class="chip on">bInterval</span></dd>`;
    }
    const n = Number(mp);
    /* 1 ms is the fastest possible override and caps nothing in practice.
       Anything larger forces a slower interval on every pointing device;
       an out-of-range value is not a rate at all. */
    const sane = n >= 1 && n <= 255;
    const cls = (n === 1) ? 'on' : 'warn';
    const detail = sane
        ? `forced ${n}ms (max ${Math.round(1000 / n)} Hz for every mouse)`
        : `value ${n} is out of range — every pointing device is capped`;
    return `<dt>host polling</dt><dd><span class="chip ${sane && n === 1 ? 'on' : (sane ? 'warn' : 'bad')}">` +
           `usbhid.mousepoll</span> ${esc(detail)}</dd>`;
}

function savePattern(d) {
    if (d.pattern) return d.pattern;
    if (d.by_id) return `*${d.by_id}*`;
    return d.class && d.path ? '' : '';
}

/* Structural identity of the detail pane.
 *
 * The pane is rebuilt by innerHTML, which destroys its <input> elements --
 * so rebuilding on the 5 s poll wiped whatever was half-typed into the
 * adopt form. You had five seconds to type a screen width.
 *
 * So rebuild ONLY when the structure changes, never on a timer. Everything
 * that legitimately changes often -- the event counter, the trace, the age
 * readout -- is written into the standing DOM by renderLive instead, and
 * is deliberately absent from this signature. Config values (extent, gain,
 * grab, decimation) ARE included: they change rarely, and when they do the
 * form genuinely should be rebuilt to show them.
 *
 * Note this does NOT gate on focus. Where click focus lands is platform
 * policy -- Safari focuses almost nothing, Chrome focuses everything -- so
 * a focus gate is invisible on one machine and freezes the panel on
 * another. Structure is the honest thing to key on.
 */
function detailSignature() {
    if (!sel) return 'none';
    if (sel.kind === 'adopted') {
        const d = deviceByClass(sel.key);
        if (!d) return 'adopted:missing';
        return ['adopted', d.class, d.path, d.by_id, d.pattern, d.connected,
                d.grab, d.kernel_ts, d.screen_w, d.screen_h, d.gain,
                d.move_every].join('|');
    }
    if (sel.kind === 'available') {
        const p = state.probe.find(x => x.path === sel.key);
        if (!p) return 'available:missing';
        const sv = savedFor(p);
        return ['available', p.path, p.class, p.adopted,
                !!deviceByClass(p.class), sv ? sv.pattern : ''].join('|');
    }
    if (sel.kind === 'saved') {
        const sv = state.saved[sel.key];
        return ['saved', sel.key, sv ? sv.pattern : '', sv ? sv.class : ''].join('|');
    }
    return 'unknown';
}

let lastDetailSig = null;

function renderDetail(force) {
    const el = $('detail');
    const sig = detailSignature();
    if (!force && sig === lastDetailSig && el.dataset.built === '1') return;
    lastDetailSig = sig;
    el.dataset.built = '1';

    if (!sel) { el.innerHTML = '<div class="empty">select a device on the left</div>'; return; }

    if (sel.kind === 'adopted') {
        const d = deviceByClass(sel.key);
        if (!d) { sel = null; return renderDetail(); }
        el.innerHTML = `
          <h2>${esc(d.class)} — adopted</h2>
          <dl class="kv">
            <dt>datapoint</dt><dd>${esc(d.datapoint)}</dd>
            <dt>by-id</dt><dd>${esc(d.by_id || '—')}</dd>
            <dt>node</dt><dd>${esc(d.path)}</dd>
            <dt>pinned to</dt><dd>${esc(d.pattern || 'class only')}</dd>
            ${(() => {
              /* A mouse has a DECLARED extent; a trackpad has a
                 DISCOVERED surface range and no extent at all. Showing
                 "— × —" for the latter reads as missing config rather
                 than as not-applicable. */
              if (d.screen_w > 0 && d.screen_h > 0) {
                  return `<dt>extent</dt><dd>${d.screen_w} × ${d.screen_h}</dd>`;
              }
              const lr = (live.get(d.datapoint) || {}).range;
              return lr
                ? `<dt>surface</dt><dd>${lr[1] - lr[0] + 1} × ${lr[3] - lr[2] + 1}` +
                  ` <span class="chip">from device</span></dd>`
                : `<dt>surface</dt><dd>waiting for range</dd>`;
            })()}
            ${d.gain !== undefined ? `<dt>gain</dt><dd>${esc(d.gain)}</dd>` : ''}
            ${d.move_every > 1 ? `<dt>decimation</dt><dd>1 of every ${esc(d.move_every)} moves` +
               ` <span class="chip">clicks undecimated</span></dd>` : ''}
            <dt>flags</dt><dd>
              ${d.connected !== undefined && !Number(d.connected)
                ? '<span class="chip bad">unplugged — waiting for it to return</span>' : ''}
              <span class="chip ${Number(d.grab) ? 'on' : ''}">${Number(d.grab) ? 'grabbed' : 'not grabbed'}</span>
              <span class="chip ${Number(d.kernel_ts) ? 'on' : 'warn'}">${Number(d.kernel_ts) ? 'kernel timestamps' : 'publish-time stamps'}</span>
            </dd>
            <dt>events</dt><dd id="evcount">${esc(d.events)}</dd>
            ${hostPollRow()}
          </dl>
          <canvas id="trace"></canvas>
          <p id="tracehint">move the device — the dot should follow.</p>
          <form class="cfg" onsubmit="return false" style="grid-template-columns:1fr">
            <div>
              <label for="f_pattern">match at next boot</label>
              <input id="f_pattern" type="text" value="${esc(savePattern(d))}">
            </div>
          </form>
          <div class="btns">
            <button id="bsave" class="primary" type="button">save for this rig</button>
            <button id="brelease" class="danger" type="button">release</button>
          </div>
          <p class="hint">saving writes <code>local/input_devices.tcl</code>, which is
             re-applied at every dserv start. Releasing drops the grab immediately.
             ${/[0-9A-Z]{8,}/.test(savePattern(d))
               ? '<br><strong>Note:</strong> this pattern contains what looks like a unit ' +
                 'serial, so it will match only this exact device. Widen it if you want ' +
                 'any device of the same model to match.' : ''}</p>
          <div id="msg"></div>`;
        $('brelease').onclick = () => act($('brelease'), async (say) => {
            await inputCmd(`inputClose ${d.class}`);
            sel = null;
            say('released', 'ok');
        });
        $('bsave').onclick = () => act($('bsave'), async (say) => {
            const pattern = ($('f_pattern') ? $('f_pattern').value : '').trim();
            if (!pattern) throw new Error(
                'no pattern to match on. A device with no by-id name needs one typed ' +
                'here — without it, nothing identifies this device at next boot');
            const o = {};
            if (d.screen_w) o.screen_w = d.screen_w;
            if (d.screen_h) o.screen_h = d.screen_h;
            if (d.gain !== undefined) o.gain = d.gain;
            if (d.move_every > 1) o.move_every = d.move_every;
            o.grab = Number(d.grab) ? 1 : 0;
            await inputCmd(`inputSaveDevice ${d.class} {${pattern}} ${optsToArgs(o)}`);
            say('saved — this device will be adopted at next start', 'ok');
        });
        renderLive();
        return;
    }

    if (sel.kind === 'available') {
        const p = state.probe.find(x => x.path === sel.key);
        if (!p) { sel = null; return renderDetail(); }
        const known = classNames().includes(p.class);
        const occupied = known && !!deviceByClass(p.class);
        const sv = savedFor(p);
        const caps = Object.entries(p.caps || {}).filter(([, v]) => v).map(([k]) => k);
        const axes = Object.entries(p.axes || {})
              .map(([k, v]) => `${k} ${v[0]}..${v[1]}`).join('   ');
        el.innerHTML = `
          <h2>${esc(p.by_id || p.name || p.path)}</h2>
          <dl class="kv">
            <dt>node</dt><dd>${esc(p.path)}</dd>
            <dt>name</dt><dd>${esc(p.name || '—')}</dd>
            <dt>by-id</dt><dd>${esc(p.by_id || '—')}</dd>
            <dt>classified</dt><dd>${esc(p.class)}</dd>
            <dt>capabilities</dt><dd>${caps.length ? esc(caps.join(', ')) : '—'}</dd>
            ${axes ? `<dt>axes</dt><dd>${esc(axes)}</dd>` : ''}
          </dl>
          ${!known ? `<p class="hint">This device does not match any registered
             class, so there is nothing to adopt. The capability list above is
             what classification is testing against.</p>`
          : `
          ${sv ? `<p class="hint">Settings below come from this rig's saved entry
             <code>${esc(sv.pattern)}</code> — the one that would adopt this device
             at next start.</p>` : ''}
          <form class="cfg" onsubmit="return false">${fieldsFor(p.class, sv ? sv.opts : {})}</form>
          <div class="btns">
            <button id="badopt" class="primary" type="button" ${occupied ? 'disabled' : ''}>adopt now</button>
          </div>
          <p class="hint">${occupied
             ? `The <code>${esc(p.class)}</code> class already has a device. Release it first.`
             : 'Adopts for this session only — nothing is written until you save.'}</p>`}
          <div id="msg"></div>`;
        if (known && !occupied) {
            $('badopt').onclick = () => act($('badopt'), async (say) => {
                const opts = readFields(p.class);
                /* Reuse the saved entry's pattern when one matches, rather
                   than deriving a fresh one — otherwise a later Save adds a
                   SECOND entry identifying the same device a different way,
                   and the rig ends up with two rules for one mouse.
                   Failing that, pin to the by-id name: it survives reboots
                   and replugs, which /dev/input/eventN does not. */
                const pat = sv ? sv.pattern
                          : p.by_id ? `*${p.by_id}*`
                          : p.name  ? `*${p.name}*` : '';
                const patArg = pat ? ` -pattern {${pat}}` : '';
                await inputCmd(`inputOpen ${p.class} ${p.path} ${optsToArgs(opts)}${patArg}`);
                sel = { kind: 'adopted', key: p.class };
                say('adopted — move it and watch the trace', 'ok');
            });
        }
        return;
    }

    if (sel.kind === 'saved') {
        const s = state.saved[sel.key];
        if (!s) { sel = null; return renderDetail(); }
        el.innerHTML = `
          <h2>${esc(s.class)} — saved</h2>
          <dl class="kv">
            <dt>pattern</dt><dd>${esc(s.pattern)}</dd>
            <dt>options</dt><dd>${esc(Object.entries(s.opts || {})
                 .map(([k, v]) => `-${k} ${v}`).join(' ') || '—')}</dd>
          </dl>
          <p class="hint">Applied at every dserv start, from
             <code>local/input_devices.tcl</code>. Forgetting does not release a
             running device — it just stops it coming back.</p>
          <div class="btns">
            <button id="bforget" class="danger" type="button">forget</button>
          </div>
          <div id="msg"></div>`;
        $('bforget').onclick = () => act($('bforget'), async (say) => {
            await inputCmd(`inputForgetDevice ${s.class} {${s.pattern}}`);
            sel = null;
            say('forgotten', 'ok');
        });
        return;
    }
}

async function act(btn, fn) {
    btn.disabled = true;
    setMsg('');
    /* An action usually changes the structure, so the refresh below
       rebuilds the pane and takes #msg with it -- which is why the
       "adopted" confirmation never appeared. Carry the message across the
       rebuild and re-apply it after. */
    let pending = null, cls = 'ok';
    const capture = (m, c) => { pending = m; cls = c || 'ok'; };
    try {
        await fn(capture);
        await refresh();
    } catch (e) {
        pending = e.message; cls = 'err';
    } finally {
        btn.disabled = false;
        if (pending !== null) setMsg(pending, cls);
    }
}

/* --------------------------------------------------------------- trace */

function renderLive() {
    renderAdopted();   /* liveness dots */
    if (!sel || sel.kind !== 'adopted') return;
    const d = deviceByClass(sel.key);
    if (!d) return;
    const l = live.get(d.datapoint);
    const c = $('trace');
    if (!c) return;

    const ec = $('evcount');
    if (ec) ec.textContent = String(Number(d.events) + (l ? l.count : 0));

    /* Prefer the published range; fall back to the configured extent. A
       mouse always has one, a trackpad publishes its surface range. */
    const r = (l && l.range) ? l.range
            : [0, Math.max(1, d.screen_w - 1), 0, Math.max(1, d.screen_h - 1)];
    const spanX = Math.max(1, r[1] - r[0]), spanY = Math.max(1, r[3] - r[2]);

    /* Shape the box to the extent, so a 16:9 screen or a 4:3 trackpad
       surface is drawn in its own proportions and the dot's motion is
       geometrically faithful to the hand's.
       Sized explicitly rather than with CSS aspect-ratio: with
       `width:100%` and a `max-height` cap, the cap wins on height while
       the width holds, so the element silently renders at the wrong
       ratio (observed 1.74 for a 1.33 surface). Computing both edges
       here gives an exactly-shaped, centred box with no dead bars.
       Only written when it changes — assigning every frame would reflow
       on every input event. */
    const availW = c.parentElement ? c.parentElement.clientWidth : 0;
    const maxH = Math.round((window.innerHeight || 700) * 0.46);
    if (availW > 0) {
        let cw = availW, ch = Math.round(cw * spanY / spanX);
        if (ch > maxH) { ch = maxH; cw = Math.round(ch * spanX / spanY); }
        const key = cw + 'x' + ch;
        if (c.dataset.box !== key) {
            c.dataset.box = key;
            c.style.width = cw + 'px';
            c.style.height = ch + 'px';
        }
    }

    /* Backing store at device pixels so the dot is not a blurry blob on a
       HiDPI rig, which is most of them. */
    const ratio = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * ratio) || c.height !== Math.round(h * ratio)) {
        c.width = Math.round(w * ratio); c.height = Math.round(h * ratio);
    }
    const g = c.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, w, h);

    /* Letterbox the extent inside whatever box CSS actually gave us. The
       aspect-ratio above normally makes this a no-op, but max-height can
       still clamp the element (a tall extent, a short window) — and a
       clamped box would otherwise stretch the trace on one axis, which is
       the exact distortion this is meant to prevent. Belt and braces
       because a distorted trace is silently wrong rather than obviously
       broken. */
    const PAD = 1;
    let rw = w - 2 * PAD, rh = rw * spanY / spanX;
    if (rh > h - 2 * PAD) { rh = h - 2 * PAD; rw = rh * spanX / spanY; }
    const rx = (w - rw) / 2, ry = (h - rh) / 2;

    const sx = v => rx + ((v - r[0]) / spanX) * rw;
    const sy = v => ry + ((v - r[2]) / spanY) * rh;

    /* The border is the EXTENT, not the canvas: it is the clamp boundary,
       so seeing the dot pinned against it is meaningful. */
    g.strokeStyle = '#2e343d'; g.lineWidth = 1;
    g.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);

    if (l) pruneTrail(l);   /* so a device going quiet fades out */

    if (!l || !l.trail.length) {
        g.fillStyle = '#6b7280'; g.font = '13px -apple-system, sans-serif';
        g.textAlign = 'center';
        /* "no events yet" is only true if there have never been any.
           A device that has gone quiet is a different statement. */
        g.fillText(Number(d.events) || (l && l.count)
                   ? 'quiet — move the device' : 'no events yet', w / 2, h / 2);
        return;
    }

    /* Trail fades oldest-first so direction of travel is readable. */
    for (let i = 1; i < l.trail.length; i++) {
        const a = l.trail[i - 1], b = l.trail[i];
        g.strokeStyle = `rgba(96,165,250,${0.06 + 0.5 * (i / l.trail.length)})`;
        g.lineWidth = 2;
        g.beginPath(); g.moveTo(sx(a.x), sy(a.y)); g.lineTo(sx(b.x), sy(b.y)); g.stroke();
    }
    const last = l.trail[l.trail.length - 1];
    g.beginPath(); g.arc(sx(last.x), sy(last.y), last.down ? 7 : 4, 0, Math.PI * 2);
    g.fillStyle = last.down ? '#4ade80' : '#60a5fa';
    g.fill();

    const age = l.at ? Math.round((Date.now() - l.at) / 100) / 10 : null;
    const hint = $('tracehint');
    if (hint) {
        const evName = ['press', 'drag', 'release', 'move'][l.ev] || '?';
        /* Report rate over the trail's own span rather than assuming the
           window is full — otherwise a device that just started reads
           artificially slow. This is the number that answers "is this
           device quick enough", and it is only meaningful while the thing
           is actually being moved. */
        let rate = '';
        if (l.trail.length > 1) {
            const span = (l.trail[l.trail.length - 1].at - l.trail[0].at) / 1000;
            if (span > 0.2) rate = `  ·  ~${Math.round((l.trail.length - 1) / span)}/s`;
        }
        if (l.peak) rate += `  ·  peak ${l.peak}/s`;
        /* Stated in frames, because that is the decision it informs: a
           worst gap under one frame period means every frame gets a fresh
           sample, and anything over it means visible stepping somewhere. */
        if (l.maxGap) {
            const f60 = (l.maxGap / (1000 / 60)).toFixed(1);
            rate += `  ·  worst gap ${Math.round(l.maxGap)}ms (${f60} frames @60Hz)`;
        }
        hint.textContent = `${l.x}, ${l.y}  ·  ${evName}` +
            (age !== null ? `  ·  ${age < 1 ? 'now' : age + 's ago'}` : '') + rate;
    }
}

/* ----------------------------------------------------------------- init */

function renderAll() { renderAdopted(); renderAvailable(); renderSaved(); renderDetail(); }

document.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    const kind = row.dataset.kind;
    sel = { kind, key: kind === 'saved' ? Number(row.dataset.key) : row.dataset.key };
    renderAll();
});

function setConn(ok, msg) {
    $('conn').className = ok === true ? 'ok' : ok === false ? 'bad' : '';
    $('conn-msg').textContent = msg;
}

async function init() {
    /* Paint the empty shell before touching the network. With dserv down,
       a page showing "none / nothing unclaimed / none saved" reads as
       working-but-empty; bare section headings read as broken. */
    renderAll();

    const qs = new URLSearchParams(location.search);
    const qsHost = qs.get('host'), qsSsl = qs.get('ssl');
    conn = new DservConnection({
        subprocess: 'input',
        dservHost: qsHost || null,
        forceSecure: qsSsl !== null ? qsSsl === '1' : undefined,
        onStatus: st => {
            setConn(st === 'connected' ? true : st === 'connecting' ? null : false, st);
            /* Re-read on every (re)connect, not just the first. dserv
               restarts are routine on a rig — after one, every device is
               freshly autodiscovered and the page must not be showing the
               previous generation's list. */
            if (st === 'connected') { subscribed.clear(); refresh(); }
        },
    });

    dp = new DatapointManager(conn, { autoGetKeys: false });

    try { await conn.connect(); }
    catch (e) { setConn(false, 'not connected — retrying'); }

    /* Started regardless of whether the first connect succeeded: refresh
       fails quietly while down and starts working when dserv returns. */
    setInterval(() => { if (conn && conn.connected) refresh(); }, 5000);
    /* Repaint on a timer as well as on events, so the age readout and the
       liveness dots decay when a device goes quiet. */
    setInterval(scheduleRender, 1000);
    window.addEventListener('resize', scheduleRender);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
