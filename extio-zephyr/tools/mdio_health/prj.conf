# Bring the ENET block up exactly as the failing case does (clocks, pinctrl),
# then scan the MDIO bus ourselves instead of trusting one hardcoded address.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y
CONFIG_MDIO=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_MAIN_STACK_SIZE=4096
