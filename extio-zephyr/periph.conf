# The BLE PERIPHERAL variant of a board (build with -DEXTRA_CONF_FILE=periph.conf).
#
# Kept OUT of any board .conf so both images stay buildable from one board file:
# the plain box is what you bring a new board up as, and it is the thing you fall
# back to when the radio is the suspect.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="extio"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n

# One whole 128-byte dserv_msg per ATT PDU -- the frozen contract. 131 is
# DSERV_BLE_MTU_MIN (128 + the 3-byte ATT header); both ends verify after the
# automatic exchange and refuse the pipe below it rather than fragmenting.
CONFIG_BT_L2CAP_TX_MTU=131
CONFIG_BT_BUF_ACL_RX_SIZE=135
CONFIG_BT_BUF_ACL_TX_SIZE=135
CONFIG_BT_ATT_PREPARE_COUNT=0
CONFIG_BT_GATT_CLIENT=n

# The role itself (src/platform/box_ble_periph.c, and the raw-source-time stamp).
CONFIG_BOX_BLE_PERIPHERAL=y

# ---- THE CENTRAL OWNS CONNECTION TIMING. Do not let this end renegotiate. ----
#
# Zephyr peripherals default to BT_GAP_AUTO_UPDATE_CONN_PARAMS=y with a
# preference of 24-40 units (30-50 ms), and request it shortly after connect.
# That silently overrides whatever the central chose: MEASURED on the first
# connection of this port, `conn_int=45.00 ms` on a central that had pinned 7.5.
#
# It is not a cosmetic difference. The echo midpoint bias is (leg2-leg1)/2 with
# leg2 interval-quantised, so it scales with the interval -- +1.12 ms at 7.5 ms
# and +5.39 ms at 15 ms, both measured against a hardware ground truth. At 45 ms
# the tier would miss its ~1 ms target by roughly an order of magnitude, and
# nothing on either console would have said so before the negotiated interval
# was reported (it is what caught this).
#
# BLE.md already assigns this: "the central dictates connection parameters, so
# the RECEIVER owns this" -- it is the end running the estimator and the
# latency manager. So the peripheral accepts what it is given.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Kept consistent anyway, because these are also published in the GAP PPCP
# characteristic: a DIFFERENT central reading our preference should be told
# 7.5 ms, not Zephyr's generic default. Timeout 400 (4 s) matches the central's
# and leaves room for peripheral latency; the stock 42 (420 ms) does not.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
