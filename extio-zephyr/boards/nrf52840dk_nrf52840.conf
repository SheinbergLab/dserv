# Nordic nRF52840 DK -- the USB-FS box, and the intended BLE peripheral target.
#
# SCOUT PORT, 2026-08-22: build-only, never flashed. Written to price the port
# and to find the per-driver disagreements BEFORE hardware, which on this tree
# is where analog bugs have always come from (PORTING.md, "three drivers, three
# different answers").
#
# What this board is FOR, and it is not power: at 140 KB of app the nRF52840's
# 1 MB flash carries MCUboot plus TWO 472 KB slots with 3x headroom, its 256 KB
# RAM swallows our ~144 KB, and the part is the one Nordic ships BLE on. The
# wired tiers stay where they are -- there is no Ethernet MAC here and never
# will be (wiznet-io/NORDIC.md S2).
#
# NOT ENABLED HERE, on purpose:
#   * networking -- no MAC. This is a USB-only build, exactly like the teensy40.
#   * CONFIG_BT -- box_ble.c is a BLE CENTRAL (the hub role, built for the
#     RW612). The peripheral role this part is wanted for does not exist yet.
#     Turning BT on before that code exists would build a hub on a chip we
#     intend as a peripheral, which is worse than an honest gap.
#   * the OTA Kconfig triple -- that lives in sysbuild/extio-zephyr.conf and is
#     board-independent, so --sysbuild gets it here for free. See the long note
#     in that file for why it must NOT be in a board conf.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Persistence needs no partition of ours: nrf52840_partition.dtsi (pulled in by
# the board DTS) already carves boot/slot0/slot1/storage, which is why this
# board needs no boards/<board>_partitions.dtsi and sysbuild.cmake's EXISTS test
# correctly skips it. The FRDM boards are in the same position; only the PJRC
# boards carve their own.
#
#   boot_partition     @0x000000    48 KB
#   slot0_partition    @0x00c000   472 KB   <- app runs here (140 KB used)
#   slot1_partition    @0x082000   472 KB   <- OTA writes here
#   storage_partition  @0x0f8000    32 KB   <- NVS, OUTSIDE both slots
#
# 32 KB = eight 4096-byte sectors, which is exactly BOX_NVS_SECTORS -- the same
# geometry the teensy40 ended up with, and it lands nowhere near the top of the
# part, so the erase-refusing-last-sector trap that cost that board its
# persistence cannot apply here (PORTING.md 2026-08-21).

# 12288, matching both Teensys and for the same reason: the deepest chain in
# this firmware is inbound dispatch -> full manifest announce, which came within
# ~1 KB of an 8 KB main stack on the RT1062 and wedged USB when +90 added 1216
# bytes of main() locals. The nRF52840 has hardware stack protection, but the
# MPU guard is 32 bytes and JUMPABLE -- margin is the protection, not the guard.
# 256 KB of RAM makes this free.
CONFIG_MAIN_STACK_SIZE=12288

# Analog: the on-chip SAADC. Pulls box_adc.c + box_ain.c into the build
# (BOX_HAVE_ADC); the overlay declares WHICH inputs exist.
#
# TWO AUDIT RESULTS, both found by reading drivers/adc/adc_nrfx_saadc.c and both
# recorded in box_adc.c next to the oversample menu:
#   1. the SAADC driver SELECTS ADC_CONFIGURABLE_INPUTS, so `reg` is a logical
#      channel index and `zephyr,input-positive` picks the pad -- the LPADC
#      model, not the RT1062's "reg IS the hardware input". box_adc_input_of()
#      already handles both.
#   2. oversampling is refused with -EINVAL whenever more than one channel is
#      active in the sequence (get_oversampling(), line 385). Our sweep is
#      multi-channel by construction, so the audited menu is 1x ONLY.
CONFIG_ADC=y

# ---- THE BOX CLOCK: SysTick, not the nRF RTC. Read this before "optimising" it.
#
# box_gpio.c's now_us() is k_cyc_to_us_floor64(k_cycle_get_64()), and
# k_cycle_get_64() is only implemented when CONFIG_TIMER_HAS_64BIT_CYCLE_COUNTER
# is set. That symbol is y on the MCXN947 and both Teensys because their timer
# drivers select it. The nRF default system timer -- NRF_RTC_TIMER -- never
# does, so on this board now_us() RETURNED 0 FOREVER.
#
# Measured on hardware 2026-08-22, and it is worth knowing what that looked like,
# because neither symptom names its cause:
#   * console `now` said `box 0.000000 s` on a box minutes into a run;
#   * every DI event carried an IDENTICAL timestamp -- box_clock_stamp() is
#     box_us + off + corr, so with box_us pinned at 0 it returns the sync
#     anchor every time. That is WORSE than the unsynced 0, which honestly
#     means "dserv, arrival-stamp this"; a constant looks like a real time;
#   * pins with debounce > 0 published NOTHING, while debounce-0 pins worked.
#     box_gpio_poll_di() sets di_use_fifo[i] = (debounce_ms[i] == 0): FIFO pins
#     publish directly, debounced pins wait on a window measured against a clock
#     that never advances. Four DK buttons, two of each, 90 s of pressing: 42
#     events from the FIFO pair, zero from the debounced pair.
#
# THE OBVIOUS FIX WAS TRIED ON HARDWARE AND DOES NOT WORK. Recorded here so
# nobody spends the afternoon again (full autopsy in PORTING.md 2026-08-22):
#
#     &systick { status = "okay"; };        (nrf52840.dtsi disables it)
#     CONFIG_NRF_RTC_TIMER=n
#     CONFIG_CORTEX_M_SYSTICK=y
#     CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=64000000
#
# That combination BUILDS, and it really does produce
# CONFIG_TIMER_HAS_64BIT_CYCLE_COUNTER=y -- and the box then never boots. Zephyr
# prints its banner, the kernel schedules normally (halted PC sits in
# arch_cpu_idle <- idle, IPSR=000, exactly like a healthy box), and main blocks
# forever in box_uplink_init() -- USB -- which runs BEFORE box_console_init(),
# so not one line of app output ever appears. Silent for 50 s+, 100% of resets.
# On this part USB needs the HFCLK path the RTC participates in: the nRF RTC is
# not a swappable system timer, it is load-bearing platform infrastructure.
#
# Two smaller traps inside that attempt, both of which produce a build that
# LOOKS fixed: enabling the systick DT node without NRF_RTC_TIMER=n changes
# nothing, and NRF_RTC_TIMER=n without the DT node leaves no system timer at all
# (`undefined reference to sys_clock_cycle_get_32`). And the board defconfig
# hardcodes SYS_CLOCK_HW_CYCLES_PER_SEC=32768 with nothing recomputing it when
# the timer changes -- at 32768 the 64-bit counter stays off, because
# CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER is `default y if ... > 60000000`.
#
# SO THE CLOCK IS STILL BROKEN ON THIS BOARD, deliberately and visibly, rather
# than papered over. The real fix keeps the RTC as system timer and adds a
# free-running nRF TIMER at 1 MHz behind a board-specific now_us() -- which also
# happens to be the only option that preserves low-power idle, i.e. the ONLY one
# compatible with the coin-cell peripheral NORDIC.md wants this silicon for.
# The RTC gives 30.5 us granularity even when working, so on this part low power
# and timestamp resolution are in direct tension; the RP2350 and MCXN boxes
# never had to choose. Decide that before nRF is committed to anything that
# timestamps behaviour.
