# FRDM-MCXN947 -- the analog box: Ethernet+PTP AND an on-chip analog front end.
#
# Why this board: the RW612 gave us a tri-radio part whose radios we never used,
# and no analog worth the name. The MCXN947 keeps everything the port actually
# leans on (Ethernet with an IEEE-1588 clock, USB HS, MCUboot A/B partitions,
# a storage partition) and adds lpadc0 / dac0 / opamp0 on the die.
#
# READ THIS BEFORE TRUSTING ANY NUMBER: the MAC here is ENET_QOS (Synopsys
# DWMAC-derived), a DIFFERENT IP from the RW612's ENET, with a different PTP
# clock driver. Every latency, jitter and sync figure recorded for the RW612 or
# the Teensy has to be MEASURED AGAIN on this board. Nothing transfers by
# inheritance -- see the "measurement audit" section of PORTING.md for what
# happens when it is assumed.
#
# NAME GOTCHA: this file must carry the board QUALIFIERS
# (frdm_mcxn947_mcxn947_cpu0.conf). A bare frdm_mcxn947.conf is silently
# ignored -- see the header of the matching .overlay.

# ---- Ethernet + the 1588 hardware clock ----
# The board devicetree already enables enet / enet_mac / enet_mdio / phy /
# enet_ptp_clock, and every NXP driver behind them is `default y` on its DT
# node, so ETH_NXP_ENET_QOS, ETH_NXP_ENET_QOS_MAC, MDIO_NXP_ENET_QOS and
# PTP_CLOCK_NXP_ENET_QOS all come on by themselves. What is listed here is the
# stack, not the drivers.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
# Deterministic boot: send the first DHCPDISCOVER after a fixed 1 s instead of
# RFC 2131's random 1-9 s. Kconfig's range floor of 2 collapses Zephyr's
# `entropy % (MAX - 1) + 1` to exactly 1. Same reasoning as the RW612 -- a rig
# with a handful of boxes on its own switch is not the flood this protects
# against, and boot-to-registration wandering by 2 s across identical reboots
# is worth more to us than staggered DISCOVERs.
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_TCP=y
# TCP keepalive -- for the connect-back slot (box_net_eth.c srv_conn) only.
# WITHOUT THIS the SO_KEEPALIVE setsockopt is not merely ineffective: Zephyr
# gates the entire option on this Kconfig and otherwise falls through to
# ENOPROTOOPT, which is precisely how the beacon's SO_BROADCAST silently did
# nothing for a whole release. Checked in sockets_inet.c before relying on it.
CONFIG_NET_TCP_KEEPALIVE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y

# Network contexts. Carried over from the RW612 as a PROTOCOL-level lesson, not
# a silicon one: at the default 6, sockets silently fail to open, the box's
# %match registrations are never accepted, and it ends up PUBLISHING BUT DEAF --
# state/* flows while cmd/* never arrives, which looks like a healthy box.
# Simultaneously in use: the dserv frame connection, the config-server listener
# on 5010, dserv's accepted connect-back, each short-lived registration
# connection, and (with CONFIG_PTP) the two PTP UDP sockets, 319 and 320.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16

# ---- RX buffer geometry vs the OTA blast ----
# CONFIG_NET_BUF_DATA_SIZE defaults to 128 and the driver derives its DMA
# buffer size from it, so a full-size 1514 B TCP segment spans TWELVE of the
# sixteen RX descriptors -- and with hardware timestamping on (the ENET_QOS
# PTP clock driver sets TSENALL, so EVERY frame is stamped) each frame appends
# a context descriptor on top: 13 ring slots and 12 frag allocations per
# segment. An OTA push is ~3300 datapoint frames that TCP coalesces into
# exactly such segments back-to-back, which is how the frag pool drains and
# frames start dropping MID-FRAME. That regime is what exposed the write-back
# recycling bug (Fatal bus error: RX:4, RX engine dead until SWD reset) fixed
# in patches/enet-qos-rx-fixes.patch.
#
# THE DRIVER PATCH IS THE FIX; this is margin. At 512 a full frame needs 3
# data descriptors (+1 context): 4x fewer ring slots and pool allocations per
# frame, for +27 KB across the two 36-buf pools (RAM was ~10% used before).
# The 16-descriptor ring is deliberately untouched: the ring permanently pins
# one RX frag per descriptor out of NET_BUF_RX_COUNT, so raising the ring
# without raising the pool starves the stack.
#
# MEASURED FOLLOW-UP 2026-08-01: the default pool (36 = 16 pinned + 20
# floating) SURVIVES the blast but is BIMODAL. Interleaved A/B on box02,
# five cold blasts per arm, drops read from the driver's own counter
# (extio_rxts[7], see the patch) over SWD:
#   36 bufs: 2/5 runs cascaded -- ~140 drops and the blast wall time
#            DOUBLING (7.9 s -> 15.4 s, TCP falling into retransmit
#            backoff); the other 3/5 dropped ~0.
#   52 bufs: 0/5 cascaded; worst run 16 drops, wall pinned at 7.9-8.2 s.
# The cascade is also the console flood: every drop is a synchronous
# LOG_WRN("No new RX buf available") on the 115200 UART -- ~2.6 ms of
# blocking per line INSIDE the cooperative RX path, so the logging
# amplifies the congestion it reports (the CDC-ACM logging lesson again).
# 52 keeps the same 16 pinned and grows only the floating share to 36,
# for +8 KB on a board using ~10% of RAM. The ring stays 16 -- the
# pinned:floating reasoning above is unchanged. (Ring since raised: the
# 2026-08-02 block below moves in step with that rule.) The driver log
# line is left at WRN on purpose: at single-digit drops per blast it is
# signal again, and silencing it would just re-blind the next person.
CONFIG_NET_BUF_DATA_SIZE=512

# ---- v0.4.0+28 (2026-08-02): the soak's 2 ms tail, traced to this ring ----
#
# The frozen-gate soak on box02 (Ethernet+PTP) failed the events variant in
# a steady minority of cycles with ONE signature: a single trial, DI edges
# 10/12, sched ledger acc==fired==sent, |at err| ~2.1 ms. Commands arrived
# ~2 ms LATE as a burst; past-due slots fired ASAP and a 2 ms pair merged.
# The box console printed "W: RX buffer underrun" in the same runs (caught
# live watching the UART). Chain: RX ring exhausts -> frame dropped -> TCP
# recovers by retransmit -> the whole at-train lands ~2 ms late. NOTHING
# was lost -- TCP redelivered and the gates caught the lateness, which is
# the data-preservation doctrine holding; this block closes the tail.
#
# Two causes, two knobs:
#
#  1. PRIORITY. The driver RX thread defaults to preemptive 3, which sat
#     below main until the +22 lattice demoted main to 3 -- making RX
#     recycling main's EQUAL, and equal preemptive priorities do not
#     preempt. A long service pass (loop_max_us measured 10.7 ms during
#     multi-pulse storms) therefore blocked descriptor recycling for its
#     whole duration, and a 16-slot ring is sub-ms of headroom at line
#     rate. RX now holds a deliberate lattice seat at 2 (see prj.conf):
#     arrival is creation-adjacent -- it carries the commands and the PTP
#     timestamps -- below the sampling path, above service and publishing.
#
#  2. GEOMETRY. Ring 16 -> 32, and per the pinned-frag rule above the pool
#     grows in step: 104 = 32 pinned + 72 floating (the floating share
#     doubles too), with net_pkt structs 14 -> 28 to match. The same
#     generous-buffers doctrine that ended the USB 8-frame cliff (+21),
#     Ethernet edition. Build reports RAM 83.2% of 320 KB after this
#     change; SRAMX (96 KB) remains entirely free if geometry must grow
#     again.
CONFIG_ETH_NXP_ENET_QOS_RX_THREAD_PRIORITY=2
CONFIG_ETH_NXP_ENET_QOS_RX_BUFFER_DESCRIPTORS=32
CONFIG_NET_PKT_RX_COUNT=28
CONFIG_NET_BUF_RX_COUNT=104

# The IEEE-1588 PROTOCOL stack, as distinct from CONFIG_PTP_CLOCK above (which
# only instantiates the free-running counter). Needs a grandmaster to mean
# anything: ptp4l via systemd/dserv-ptp4l@<iface>.service.
CONFIG_PTP=y

# ---- PTP transport: the Zephyr DEFAULT (UDP/IPv4). Do not change it. ----
#
# There is no CONFIG_PTP_*_PROTOCOL line here on purpose, and this comment exists
# so nobody re-adds one.
#
# For part of 2026-07-29 this board ran CONFIG_PTP_IEEE_802_3_PROTOCOL=y because
# UDP/IPv4 "never got an RX timestamp" while L2 synced. THAT DIAGNOSIS WAS WRONG.
# The real bug was a race in the ENET_QOS driver's RX context-descriptor handling
# (now folded into patches/enet-qos-rx-fixes.patch): whether the timestamp survived
# depended on instruction timing, so it was BUILD-DETERMINISTIC -- one binary synced
# 8/8 boots, another failed 4/4, and a 64-byte unrelated code change flipped it.
# Every A/B comparison that day rebuilt the binary, INCLUDING L2-vs-UDP, so L2 was
# credited for what was really a lucky layout.
#
# With the patch applied, UDP/IPv4 converges 8/8 boots at 6-10 s with analog running
# at 1 kHz -- measured, not assumed. So the default is correct and switching
# transports buys nothing.
#
# Two reasons this matters beyond tidiness:
#   - The transport MUST match on the host (ptp4l -2 or not) and a mismatch is
#     SILENT: total silence rather than dropped Syncs, which is harder to diagnose
#     than the original bug.
#   - RW612 boxes do not override the transport, so they are UDP. Keeping this board
#     on UDP too means ONE ptp4l serves the whole fleet.
#
# THE PATCH IS THE PREREQUISITE. Without it, expect
# "drops Sync without valid RX timestamp" and a free-running 1588 counter on some
# builds and not others.

# ---- PTP diagnostics: ON, deliberately ----
#
# The stack defaults to PTP_LOG_LEVEL=0 -- it says NOTHING -- and that blindness is
# why a 56-years-wrong clock survived a whole evening: every proxy read healthy
# (sync/source=ptp, ptp/anchored=1, a 42 ns host PHC window, rig_check 11/11, and a
# scheduled fire that "fired"). At INF this is the ONLY channel that tells the
# truth, and on a HEALTHY boot it costs just two lines:
#
#   W: Clock offset exceeds 1 second (t1=... t2=7.142554780 delay=4612ns ...)
#   W: Set clock time: 1785368658.371375357
#
# That is POSITIVE CONFIRMATION OF SYNC, and it is worth more than silence: t2 is
# the box's RX hardware timestamp, so those lines prove the receive path produced a
# real stamp and the servo stepped the counter to master time. A FAILING link
# instead prints "drops Sync without valid RX timestamp" once per second, which is
# loud rather than silent. Both outcomes are legible, which is the whole point.
#
# RESOLVED: for a while it looked as though logging itself mattered -- 2/2 boots
# converged with it on, 0/2 with it off -- and I nearly wrote that down as a
# finding. It was not. Both images differed in LAYOUT, and the RX
# context-descriptor race was decided by instruction timing, so the logging build
# simply happened to win it. The fix is the patch; logging is kept for visibility
# alone. The general lesson, which cost most of an evening: on this board a
# rebuild is a CHANGED VARIABLE, so A/B-ing config options proves nothing unless
# each arm is measured across several boots.
#
# CONFIG_NET_LOG IS THE GATE and forgetting it fails almost silently: every
# per-module level under subsys/net (PTP_LOG_LEVEL_*, NET_L2_ETHERNET_LOG_LEVEL_*)
# lives in Kconfig.template.log_config.net behind `depends on NET_LOG`, so without
# it the choice has no selection and the assignment is DROPPED. The only tell is a
# build warning -- "the choice symbol X was selected (set =y), but no symbol ended
# up as the choice selection" -- which scrolls past unless you grep for it, while
# CONFIG_PTP_LOG_LEVEL stays 0 and the .conf plainly says otherwise. PROOF IT
# MATTERS: CONFIG_NET_L2_ETHERNET_LOG_LEVEL_WRN=y below (and the identical line in
# frdm_rw612.conf) has NEVER been in effect for exactly this reason.
#
# Output is LOG_MODE_MINIMAL, i.e. SYNCHRONOUS and interleaved with our own printk
# -- the mechanism that shredded the boot log when CONFIG_SHELL was on. INF is
# low-rate and tolerable; do NOT reach for DBG on this UART.
CONFIG_NET_LOG=y
CONFIG_PTP_LOG_LEVEL_INF=y

# ---- persistent settings: NVS ----
# NOTE THE FLASH TOPOLOGY, it is better than either previous board's. The app
# XIPs from INTERNAL flash (slot0_partition on the fmu controller) while
# storage_partition is the whole 8 MB of the EXTERNAL W25Q64 on FlexSPI. So NVS
# writes a device the CPU is not fetching instructions from -- neither the
# Teensy's XIP-write hazard nor the RW612's "erase a region that is not blank"
# problem applies by construction. Verify on silicon anyway.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# main() brings up net + USB + the box service loop. The shared prj.conf value
# of 4096 is what overflowed on the RW612 and (silently, as an MPU fault with
# no console) on the Teensy SD path. RAM here is 320 KB with ~40 KB in use, so
# this costs nothing and removes a whole class of first-boot mystery.
CONFIG_MAIN_STACK_SIZE=16384

# ---- boot log + diagnostics on the board UART ----
# flexcomm4_lpuart4 is the MCU-Link VCOM and is already zephyr,console. The box
# CLI owns the USB console CDC, so the two never contend.
#
# This is not optional on a networked board: the PHY driver is what tells you
# "entering autonegotiation" / "PHY is up, 100 Mb", and with logging off an
# interface that never came up is indistinguishable from a bad cable.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# ERRORS ONLY BY DEFAULT -- load-bearing, not tidiness. LOG_MODE_MINIMAL is
# SYNCHRONOUS: it formats and writes inline to a 115200 baud UART. At the
# default INFO level, usbd_cdc_acm.c logs inside cdc_acm_irq_tx_enable(), i.e.
# ON EVERY FRAME WE SEND -- measured on the RW612 as ~12 ms per frame on the RT
# service loop, and invisible from outside because the watchdog still ticks.
# Raise individual modules explicitly instead, as PHY is raised here.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_PHY_LOG_LEVEL_INF=y
CONFIG_ETHERNET_LOG_LEVEL_WRN=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_WRN=y

# NO ZEPHYR SHELL ON THIS BOARD -- it CORRUPTS the boot log. Measured on
# silicon 2026-07-28, first bring-up.
#
# The RW612 conf runs CONFIG_SHELL on its board UART for `net iface` /
# `ptp_clock get`. Copied here, it did two bad things at once:
#   1. The shell never accepted input at all -- no echo, no prompt on demand.
#      Only the boot-time prompt ever appeared, so it was useless as a
#      diagnostic even before the damage below.
#   2. Shell output and LOG_MODE_MINIMAL output INTERLEAVE on the same UART with
#      no mutual exclusion, and shred each other. The tell is characters missing
#      scattered mid-line, which does NOT look like UART overrun:
#
#        with shell:  `Y0) Lnk speed 10 Mb,ulldpe`
#        without:     `I: PHY (0) Link speed 100 Mb, full duplex`
#
# That is not cosmetic. Read literally, the corrupted line says the rig
# negotiated a 10 Mb link -- a wrong fact, arriving through the one channel we
# use to establish facts, and one that would have quietly poisoned every timing
# measurement taken afterwards. A boot log that lies is worse than no shell.
#
# If the shell is ever wanted here, route logs THROUGH it
# (CONFIG_SHELL_LOG_BACKEND) rather than letting both own the UART -- and fix
# the input path first, or it buys nothing.
# CONFIG_SHELL=y
# CONFIG_SHELL_BACKEND_SERIAL=y
# CONFIG_NET_SHELL=y
# CONFIG_DEVICE_SHELL=y
# CONFIG_PTP_CLOCK_SHELL=y

# Per-packet latency accounting through the stack (driver -> net_pkt -> RX
# thread -> socket). A/B'd as free on the Teensy; RE-VERIFY here rather than
# assuming, since this is a different MAC driver.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_PKT_RXTIME_STATS=y
CONFIG_NET_PKT_TXTIME_STATS=y
CONFIG_NET_PKT_RXTIME_STATS_DETAIL=y
CONFIG_NET_PKT_TXTIME_STATS_DETAIL=y

# ---- OTA: the arm/confirm lifecycle over MCUboot ----
# Only meaningful under --sysbuild (CMake gates box_ota_flash.c on
# BOX_HAVE_OTA_SLOT, which needs CONFIG_BOOTLOADER_MCUBOOT). Harmless otherwise.
#
# MCUBOOT_IMG_MANAGER lives under the IMG_MANAGER menuconfig, which requires
# STREAM_FLASH. Setting it alone is SILENTLY IGNORED -- the build succeeds and
# every arm/confirm path compiles out, so the feature simply is not there. Check
# .config after building rather than assuming (the RW612 learned this).
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# ---- analog input: the ON-CHIP LPADC ----
# ADC_MCUX_LPADC is `default y` on the lpadc0 DT node and selects
# ADC_CONFIGURABLE_INPUTS (which is what makes `zephyr,input-positive` reach the
# driver), REGULATOR and PINCTRL. So this one line brings the whole path.
#
# No SPI, no chip select, no Click board -- the analog front end is on the die.
# That deletes, by construction, every failure the MCP3204 hit on the RW612.
CONFIG_ADC=y

# ---- device PM: not enabled, on cost/benefit ----
#
# CONFIG_PM_DEVICE was added on 2026-07-30 so box_adc_suspend() could power the
# LPADC down, and removed the same day. The reason is simply that it is not
# worth much here: it buys ONLY the converter's own current. Everything that
# actually costs this box something -- the sampling thread's wakeups, the
# publishes competing with the service loop, contention during an OTA -- is
# fixed by the SAMPLER stopping, which is app code and needs no Kconfig. It
# would not even have released the pads: PM_DEVICE_ACTION_SUSPEND applies
# PINCTRL_STATE_SLEEP, which this overlay does not define. Milliamps on a
# mains-powered rig box is a thin return for a global Kconfig.
#
# A RETRACTION, RECORDED HERE BECAUSE THIS COMMENT ONCE ASSERTED THE OPPOSITE.
# It previously stated, with a table ("0/8 synced with POWER_DOMAIN=y, 13/17
# with it off, reproducible in both directions"), that
# CONFIG_PM_DEVICE_POWER_DOMAIN breaks ENET_QOS RX hardware timestamping. THAT
# WAS WRONG. Every arm of that comparison rebuilt the binary, so every arm was
# confounded; an A/A control -- the untouched baseline image scoring 4/4 in the
# morning and 0/6 in the afternoon -- is what exposed it. The real cause of the
# PTP failures was the RX descriptor hand-back defect now fixed in
# patches/enet-qos-rx-fixes.patch. PM_DEVICE was never shown to affect PTP
# either way. See PORTING.md 2026-07-30.
#
# box_adc_suspend()/resume() remain and return -ENOTSUP here. box_ain handles
# that already -- exactly as it does for the RW612's mcp320x -- so `ain enable
# 0` still stops the sampler live, and `ain/dbg/powered` honestly stays 1
# rather than claiming a power-down that did not happen.
#
# IF IT IS EVER WANTED: CONFIG_PM_DEVICE=y, and re-run the boot loop several
# times rather than trusting one good boot on this board.

# The on-chip DAC, for the `adccal` console command (box_console.c): DAC0_OUT is
# P4_2 / J1-4, so one jumper to an analog input measures the ADC's REAL full
# scale and PROVES which pad a box ain channel is. Both are questions no amount
# of source reading can settle -- a wrong devicetree map reports confidently.
CONFIG_DAC=y

# ---- scheduler resolution ----
# k_timer timeouts are expressed in TICKS, so cmd/do/<pin>/at_abs can only fire
# on a tick boundary, and two boxes told to fire at the same absolute instant
# each round to their own unrelated tick phase. On the RW612 the default 100 us
# tick threw away ~300x of hard-won PTP sync (scope-measured +/-100 us skew
# against +/-352 ns clock error); 10 us brought it to +/-37 us, median 11.4.
#
# 10 us is carried over as the starting point. TWO THINGS ARE UNKNOWN HERE:
#   * the RW612 could not go below 10 us -- at a 1 us tick its main loop was
#     STARVED (watchdog stopped after 2 ticks while ICMP still answered). That
#     was a consequence of its 1 MHz OS timer; this board's kernel timer is a
#     different peripheral, so the limit has to be found again, carefully, and
#     by watching state/watchdog advance for a full minute rather than by a
#     bring-up check.
#   * the ~30 us skew FLOOR the RW612 hit below the tick was never explained.
#     Re-measure before assuming this board shares it.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000
