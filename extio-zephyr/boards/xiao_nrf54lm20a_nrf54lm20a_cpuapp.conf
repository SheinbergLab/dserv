# Seeed XIAO nRF54LM20A -- SCOUT PORT #2, 2026-08-22. Build-only, never flashed.
#
# Why this board got a scout the same day as the nRF52840: it is the same
# Zephyr-native Nordic path, in a 21x17.5 mm module, and it fixes the one thing
# the 52840 gives up -- USB. The nRF54LM20's controller is `nordic,nrf-usbhs-
# nrf54l` + `snps,dwc2`, i.e. HIGH-SPEED, driven by Zephyr's udc_dwc2. So this
# part is USB-HS *and* BLE *and* battery-class, which no other board in this
# tree is.
#
# The analog block is the SAME COMPATIBLE as the nRF52840 (`nordic,nrf-saadc`),
# so the audit entry in box_adc.c -- including the multi-channel oversampling
# refusal -- applies here unchanged. That is the reuse that makes this a cheap
# second port rather than a second port.
#
# Partitions come from the SoC (nrf54lm20a_cpuapp_partition.dtsi): boot 62 KB,
# slot0 920 KB, slot1 920 KB, storage 36 KB. Our app is ~124 KB signed = 13% of
# a slot. No board partitions file needed, same as the FRDM boards and the
# nRF52840 DK.
#
# NOT enabled, same reasoning as the nRF52840 conf: no CONFIG_BT (box_ble.c is
# the CENTRAL/hub role; the peripheral role does not exist yet), and the OTA
# Kconfig triple lives in sysbuild/extio-zephyr.conf.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_ADC=y

# NOT OPTIONAL, and not obvious: the nRF54L's USB-HS PHY has its own VBUS
# regulator (`usbhs_wrapper` carries `regulator = <&vregusb>`), so
# NRF_USBHS_WRAPPER depends on REGULATOR. Without this, UDC_DWC2 y-selects the
# wrapper against unmet dependencies and the build dies at Kconfig:
#
#   warning: NRF_USBHS_WRAPPER ... has direct dependencies
#            DT_HAS_NORDIC_NRF_USBHS_WRAPPER_ENABLED && REGULATOR with value n,
#            but is currently being y-selected by UDC_DWC2
#   error: Aborting due to Kconfig warnings
#
# Worth noting the failure MODE as much as the fix: on this board Zephyr treats
# Kconfig warnings as fatal, which is how the stray NXP symbol in prj.conf was
# caught too. The NXP and RT boards are more forgiving and would have carried
# both problems silently.
CONFIG_REGULATOR=y
