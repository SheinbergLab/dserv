# Teensy 4.1 (i.MX RT1062) -- the WIRED test system.
#
# Ethernet + hardware PTP through the SAME Zephyr drivers as the RW612
# (`nxp,enet` + `nxp,enet-ptp-clock`); the board DTS already enables ENET with a
# ti,dp83825 PHY over RMII -- add a magjack. This is the direct comparison
# against the W6300+Pico2 box: native IP stack vs hardware TCP offload.
#
# No radio on Teensy -> no CONFIG_BT (block #6's BLE ingress is compiled out).

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_PTP_CLOCK=y
CONFIG_PTP_CLOCK_NXP_ENET=y
CONFIG_NET_PKT_TIMESTAMP=y

# Phase-0 instrumentation: the stack's own packet-residence measurement, i.e.
# the segment wake_us/recv_us/disp_us cannot see. RXTIME = net_pkt alloc (in
# the ENET RX thread, just after the ISR) -> the moment zsock_recv hands the
# payload to the app. TXTIME = alloc in the sender -> driver TX complete; with
# NET_TC_TX_COUNT=1 that INCLUDES the TX-thread queue wait, which dbg/send_us
# (wall time of the enqueueing zsock_send) structurally cannot include. DETAIL
# adds per-stage means: TC-fifo enqueue / stack entry / socket-fifo put / recv.
# Read via net_mgmt NET_REQUEST_STATS_GET_ALL (box_net_eth_stack_stats),
# published once a second as dbg/rxstack_* / dbg/txstack_*. Per-packet cost is
# a cycle-counter read + accounting -- noise against what it measures.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_PKT_RXTIME_STATS=y
CONFIG_NET_PKT_RXTIME_STATS_DETAIL=y
CONFIG_NET_PKT_TXTIME_STATS=y
CONFIG_NET_PKT_TXTIME_STATS_DETAIL=y

# TX off the caller's stack. The default (NET_TC_TX_COUNT=0) runs the ENTIRE send
# path -- net_pkt alloc, TCP header, checksum, L2, driver DMA setup -- inline in
# whichever thread called zsock_send(). For this box that thread is the single
# service loop, i.e. the RT path, so every publish blocked it for the full stack
# traversal. Measured on hardware 2026-07-24: two frames the box emitted
# microseconds apart (state/do echo and state/di from the same jumper) arrived at
# dserv ~680 us apart -- MORE than the entire USB round trip on the same host.
# One TX traffic class gives the send its own thread: zsock_send enqueues and
# returns, and the loop stops serializing behind the network stack.
CONFIG_NET_TC_TX_COUNT=1

# TESTED AND REVERTED 2026-07-24: ETH_NXP_ENET_TX_BUFFERS defaults to 1 (range
# 1..16), so a send cannot reach the hardware until the previous frame finishes
# DMA. Raising it to 8 changed NOTHING (send_max 864 -> 814 us, loop_max 11876 ->
# 11757 us, both within noise) at a cost of 11 KB RAM, so it is left at the
# default. That is a useful NEGATIVE result: more descriptors would have relieved
# a hardware bottleneck, so the ~275-864 us a publish costs is CPU inside the
# Zephyr stack, NOT waiting on DMA.
#
# NOT touching ETH_NXP_ENET_USE_DTCM_FOR_DMA_BUFFER either: it is `default n if
# CPU_CORTEX_M7` because of errata ERR050396 (ENET writes to TCM need CACHE_ENET
# cleared; ENET_1G can corrupt data on M7). DMA buffers therefore live in
# cacheable memory and every TX pays cache maintenance -- a real cost, but not a
# safe knob. Checksum offload (ETH_NXP_ENET_HW_ACCELERATION) is already on.

# Persistence: NVS on the on-board QSPI flash -- NO SD CARD REQUIRED.
# Both backends were validated on hardware 2026-07-23 (see PORTING.md); NVS is
# the default because it needs no card, works on teensy40 too, and exercises the
# SAME box_flash.c the RW612 will use -- bench-testing the target's code path
# rather than a Teensy-only variant. CMake picks NVS over SD (if(CONFIG_NVS) ...
# elseif(CONFIG_FILE_SYSTEM)), and boards/teensy41.overlay carves the
# storage_partition NVS needs. The SD backend (box_flash_sd.c) stays in the tree;
# to use it instead, drop CONFIG_NVS and enable CONFIG_DISK_ACCESS +
# CONFIG_DISK_DRIVERS (BOTH -- Kconfig.sdmmc is sourced inside `if DISK_DRIVERS`,
# so DISK_DRIVER_SDMMC alone is inert) + SDHC + SDMMC_STACK + FILE_SYSTEM +
# FAT_FILESYSTEM_ELM.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Zephyr's fatal-error handler prints through LOG_ERR, so WITHOUT logging a hard
# fault produces NOTHING on the console -- which is why the original crash was
# invisible. Minimal mode keeps it usable during early boot.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# ERRORS ONLY. LOG_MODE_MINIMAL is SYNCHRONOUS -- each line blocks the calling
# thread until it is out of lpuart6 at 115200. At the default INFO level the
# CDC-ACM driver logs every UART operation (~86 KB / 55 s = ~7.5 s of solid UART
# time), which visibly stalls the box and the console. Level 1 keeps the E: fault
# dumps (the whole point) with no traffic when nothing is wrong; the CDC-ACM
# class is silenced outright since it is the chatty one.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# THE "SD hard-fault" WAS OURS, not a Teensy/Zephyr driver bug: with the boot log
# visible it is a plain MAIN-THREAD STACK OVERFLOW (MPU fault, pc/xpsr full of
# Zephyr's 0xaa stack-fill sentinel). box_flash_init() mounts FATFS from main(),
# and the FATFS + disk + SDMMC path puts sector buffers and filesystem structs on
# the caller's stack -- far more than the common 4096 default.
CONFIG_MAIN_STACK_SIZE=8192
