# FRDM-RW612 -- the universal hub: Ethernet+PTP AND the BLE fleet radio.

# block #5: Ethernet + hardware PTP. The board wires ENET + a KSZ8081 PHY (RMII)
# and the MAC carries the 1588 clock, so this is stack + transport only.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_PTP_CLOCK=y
CONFIG_PTP_CLOCK_NXP_ENET=y   # instantiate the ENET 1588 clock device
CONFIG_NET_PKT_TIMESTAMP=y

# block #6: multi-peripheral BLE central (frozen d5e7000x pipe). RW612 tri-radio.
# NOTE: needs `west blobs fetch hal_nxp` (accept NXP's controller firmware
# license) or the build fails on the missing signed cpu2/NBU image.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_TX_MTU=131
CONFIG_BT_BUF_ACL_RX_SIZE=135
CONFIG_BT_BUF_ACL_TX_SIZE=135
CONFIG_BT_DATA_LEN_UPDATE=y

# persistent settings: NVS on the RW612's storage_partition (box_flash). The
# RW612 does not XIP from a flash we write here the way the Teensy does, so the
# FlexSPI/flash driver is safe. (Untested until an FRDM-RW612 is on the bench.)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# main() on this board initialises BT + net + USB; the shared prj.conf value
# (4096) overflows on entry. Sized empirically 2026-07-25.
CONFIG_MAIN_STACK_SIZE=16384

# `cmd/save` failed on this board with nvs_mount -> -45. That is EDEADLK, NOT
# ENOTSUP: nvs_startup's "all sectors are closed, this is not a nvs fs or
# irreparably corrupted" branch. The 64 MB FlexSPI part ships with non-blank
# content at the storage partition (0x620000), so NVS sees no valid filesystem
# and refuses to clobber a region it does not recognise. Nothing to do with the
# FlexSPI driver or XIP.
#
# This lets NVS erase and initialise such a region once. Verified on silicon
# 2026-07-25 with stock samples/subsys/kvss/nvs (mounts, writes, survives reboot).
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y

# Zephyr LOG on the board UART (flexcomm3 / the J-Link VCOM), separate from the
# box console on USB CDC. This is the "boot-log channel" PORTING.md describes,
# and it is not optional on a networked board: the KSZ8081 driver announces
# "PHY (2) is entering autonegotiation sequence" / "PHY 2 is up ... 100 Mb", and
# with logging off an interface that never came up is indistinguishable from a
# bad cable. That cost most of an evening on 2026-07-25.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# ERRORS ONLY BY DEFAULT -- this line is load-bearing, not tidiness.
# LOG_MODE_MINIMAL is SYNCHRONOUS: it formats and writes inline, to a 115200
# baud UART. Zephyr's default level is INFO, and usbd_cdc_acm.c does
#     LOG_INF("tx_en: trigger irq_cb_work")
# inside cdc_acm_irq_tx_enable() -- i.e. ON EVERY FRAME WE SEND. With the
# default level that cost ~12 ms per frame on the box's RT service loop
# (dbg/usb_send_us 112 us -> 12,044 us; loopback 1 ms -> 86 ms), and it is
# invisible from outside: the watchdog still ticks at 1 Hz.
# Raise individual modules explicitly instead, as PHY is raised below.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_PHY_LOG_LEVEL_INF=y
CONFIG_ETHERNET_LOG_LEVEL_WRN=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_WRN=y

# ENET TX descriptors. The driver defaults to ONE, so a send can stall waiting
# for the previous descriptor to free -- and our publishes are blocking sends on
# the single service loop, so that stall lands directly on the RT path.
# Measured before this change: dbg/send_us median 142, max 412 us.
# 6 matches ETH_NXP_ENET_RX_BUFFERS; the driver allows 1..16.
CONFIG_ETH_NXP_ENET_TX_BUFFERS=6

# --- diagnostic channel: Zephyr shell + net stack instrumentation ---
# The box CLI owns the USB CDC console; this is Zephyr's OWN shell on the board
# UART (flexcomm3 = the J-Link VCOM), so the two never contend. Gives `net
# stats`, `net iface`, `device list`, `ptp_clock get` -- the tools that isolated
# the PTP and link bugs -- without disturbing the box console.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_PTP_CLOCK_SHELL=y

# Per-packet latency accounting THROUGH the stack (driver -> net_pkt -> RX
# thread -> socket). This is how you see where recv_us actually goes instead of
# guessing at Kconfig knobs. PORTING.md A/B'd this as free on the Teensy;
# re-verify on this board rather than assuming.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_PKT_RXTIME_STATS=y
CONFIG_NET_PKT_TXTIME_STATS=y
CONFIG_NET_PKT_RXTIME_STATS_DETAIL=y
CONFIG_NET_PKT_TXTIME_STATS_DETAIL=y
