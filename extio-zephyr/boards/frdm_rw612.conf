# FRDM-RW612 -- the universal hub: Ethernet+PTP AND the BLE fleet radio.

# block #5: Ethernet + hardware PTP. The board wires ENET + a KSZ8081 PHY (RMII)
# and the MAC carries the 1588 clock, so this is stack + transport only.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_PTP_CLOCK=y
CONFIG_PTP_CLOCK_NXP_ENET=y   # instantiate the ENET 1588 clock device
CONFIG_NET_PKT_TIMESTAMP=y

# block #6: multi-peripheral BLE central (frozen d5e7000x pipe). RW612 tri-radio.
# NOTE: needs `west blobs fetch hal_nxp` (accept NXP's controller firmware
# license) or the build fails on the missing signed cpu2/NBU image.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_TX_MTU=131
CONFIG_BT_BUF_ACL_RX_SIZE=135
CONFIG_BT_BUF_ACL_TX_SIZE=135
CONFIG_BT_DATA_LEN_UPDATE=y

# persistent settings: NVS on the RW612's storage_partition (box_flash). The
# RW612 does not XIP from a flash we write here the way the Teensy does, so the
# FlexSPI/flash driver is safe. (Untested until an FRDM-RW612 is on the bench.)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# main() on this board initialises BT + net + USB; the shared prj.conf value
# (4096) overflows on entry. Sized empirically 2026-07-25.
CONFIG_MAIN_STACK_SIZE=16384

# `cmd/save` failed on this board with nvs_mount -> -45. That is EDEADLK, NOT
# ENOTSUP: nvs_startup's "all sectors are closed, this is not a nvs fs or
# irreparably corrupted" branch. The 64 MB FlexSPI part ships with non-blank
# content at the storage partition (0x620000), so NVS sees no valid filesystem
# and refuses to clobber a region it does not recognise. Nothing to do with the
# FlexSPI driver or XIP.
#
# This lets NVS erase and initialise such a region once. Verified on silicon
# 2026-07-25 with stock samples/subsys/kvss/nvs (mounts, writes, survives reboot).
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y

# Zephyr LOG on the board UART (flexcomm3 / the J-Link VCOM), separate from the
# box console on USB CDC. This is the "boot-log channel" PORTING.md describes,
# and it is not optional on a networked board: the KSZ8081 driver announces
# "PHY (2) is entering autonegotiation sequence" / "PHY 2 is up ... 100 Mb", and
# with logging off an interface that never came up is indistinguishable from a
# bad cable. That cost most of an evening on 2026-07-25.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# ERRORS ONLY BY DEFAULT -- this line is load-bearing, not tidiness.
# LOG_MODE_MINIMAL is SYNCHRONOUS: it formats and writes inline, to a 115200
# baud UART. Zephyr's default level is INFO, and usbd_cdc_acm.c does
#     LOG_INF("tx_en: trigger irq_cb_work")
# inside cdc_acm_irq_tx_enable() -- i.e. ON EVERY FRAME WE SEND. With the
# default level that cost ~12 ms per frame on the box's RT service loop
# (dbg/usb_send_us 112 us -> 12,044 us; loopback 1 ms -> 86 ms), and it is
# invisible from outside: the watchdog still ticks at 1 Hz.
# Raise individual modules explicitly instead, as PHY is raised below.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_PHY_LOG_LEVEL_INF=y
CONFIG_ETHERNET_LOG_LEVEL_WRN=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_WRN=y

# ENET TX descriptors. The driver defaults to ONE, so a send can stall waiting
# for the previous descriptor to free -- and our publishes are blocking sends on
# the single service loop, so that stall lands directly on the RT path.
# Measured before this change: dbg/send_us median 142, max 412 us.
# 6 matches ETH_NXP_ENET_RX_BUFFERS; the driver allows 1..16.
CONFIG_ETH_NXP_ENET_TX_BUFFERS=6

# --- diagnostic channel: Zephyr shell + net stack instrumentation ---
# The box CLI owns the USB CDC console; this is Zephyr's OWN shell on the board
# UART (flexcomm3 = the J-Link VCOM), so the two never contend. Gives `net
# stats`, `net iface`, `device list`, `ptp_clock get` -- the tools that isolated
# the PTP and link bugs -- without disturbing the box console.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_PTP_CLOCK_SHELL=y

# Per-packet latency accounting THROUGH the stack (driver -> net_pkt -> RX
# thread -> socket). This is how you see where recv_us actually goes instead of
# guessing at Kconfig knobs. PORTING.md A/B'd this as free on the Teensy;
# re-verify on this board rather than assuming.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_PKT_RXTIME_STATS=y
CONFIG_NET_PKT_TXTIME_STATS=y
CONFIG_NET_PKT_RXTIME_STATS_DETAIL=y
CONFIG_NET_PKT_TXTIME_STATS_DETAIL=y

# --- IEEE-1588 PTP protocol stack (step 1 of PTP integration) ---
# CONFIG_PTP_CLOCK above only instantiates the ENET 1588 hardware counter and
# lets box_ptp.c read it free-running. CONFIG_PTP is the PROTOCOL: it makes the
# box a real PTP port that can discipline that counter to a grandmaster.
#
# Paired with ptp4l on the Pi (hardware timestamping both ends, direct cable so
# there is no switch asymmetry -- the thing that ruins PTP accuracy).
#
# NOTE this does NOT by itself put box events on dserv's timeline: dserv stamps
# from steady_clock + a fixed epoch offset, while PTP disciplines to the NIC's
# PHC, a DIFFERENT oscillator. Bridging PHC <-> dserv clock is host-side work
# (PTP_SYS_OFFSET_PRECISE), tracked separately.
CONFIG_PTP=y
CONFIG_NET_PKT_TIMESTAMP=y

# Network contexts. The default 6 is NOT enough once CONFIG_PTP is on, and the
# way it fails is nasty: sockets silently fail to open, so the box's %match
# registration lines are never accepted and it ends up PUBLISHING BUT DEAF --
# state/* keeps flowing while cmd/* never arrives, which looks like a healthy
# box. `%getmatch <box-ip> 5010` against dserv showed 1 of 3 matches landing,
# then 0 of 3, purely with timing.
#
# In use simultaneously: the dserv frame connection, the config-server listener
# on 5010, dserv's accepted connect-back, each short-lived registration
# connection, and PTP's two UDP sockets (event 319 / general 320).
# Verified 2026-07-26: at 16, all three matches register on a fresh boot and the
# downlink works.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16

# --- scheduler resolution: the limit on cross-box simultaneity ---
# k_timer timeouts are expressed in TICKS, so cmd/do/<pin>/at_abs can only fire
# on a tick boundary. At the 10000 default (100 us) each box rounds T to its own
# tick, and the two boards' tick phases are unrelated -- so two boxes told to
# fire at the SAME absolute instant land up to 100 us apart, with random sign.
#
# MEASURED on a Digilent scope, two boxes, pin 18, 40 shots: skew jumped over
# roughly +/-100 us in both directions. That is the tick, not the clocks -- PTP
# was holding +/-352 ns at the time, so ~300x of hard-won sync was being thrown
# away in the last step. A single early reading of ~7 us looked fine and was
# pure luck; only the distribution showed it.
#
# The board's OS timer counts at 1 MHz (CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC), so
# 1 us is the hardware floor. DO NOT USE IT. Tried twice; the second attempt
# pinned the mechanism:
#
#   box1  watchdog=2   (stalled 2 s after boot)   cmds_rx=0   still answers ping
#   box2  watchdog=43  (stalled 43 s after boot)  cmds_rx=1   stopped answering
#
# The watchdog publish is the 1 Hz heartbeat of the MAIN SERVICE LOOP, and it
# stopped after two ticks -- while ICMP kept working, because that is answered by
# the net stack's own threads. So the box is not crashing: its main loop is being
# STARVED, which is what a 1 MHz tick does when every K_MSEC in the stack becomes
# a 1000x larger tick count. It presents as a healthy-looking box that has quietly
# stopped doing its job, which is the worst failure shape this project has.
#
# Note it can still BOOT and register at 1 us (both boxes did, and anchored) --
# it dies seconds later. So a bring-up check alone will not catch this; watch
# state/watchdog advance for a minute.
#
# That also means the ~30 us floor below CANNOT be chased by lowering the tick on
# this platform. Isolate it with ONE box against the Pi's kernel-stamped GPIO
# input instead -- that needs no second box and no finer tick.
#
# 10 us is the value in use. It helps, but NOT by the factor the arithmetic
# suggests, and the honest numbers matter here because an eyeballed reading said
# otherwise first.
#
# Measured with host/scope_skew.py, 100 shots, 0 skipped:
#     100 us tick : +/-100 us          (tick-dominated)
#      10 us tick : +/-37 us, median |skew| 11.4 us, p90 23.8 us
# A 10x tick reduction bought ~2.7x, not 10x.
#
# And the SHAPE says the tick is no longer the mechanism at all. Pure
# quantisation would be TRIANGULAR -- each box's rounding error uniform on
# [0,tick), independent, so the difference peaks hard at zero and cuts off at
# 10 us, median |skew| ~2.9 us. What we measure is roughly FLAT out to ~21 us
# with the 0-3 us bin nearly EMPTY. That is the opposite shape.
#
# So there is a ~30 us floor from something else, and it dominates at this tick.
# The clocks are not it: PTP held box1 -196 ns / box2 +547 ns during that run,
# ~40x tighter than the skew. Suspect the fire path -- abs_fire() writes the pin
# from timer expiry, and a flat (not tailed) spread suggests it contends with
# the Ethernet RX thread on EVERY shot rather than occasionally.
#
# Do not drop the tick further expecting a win until that floor is understood;
# the cheap test is to run scope_skew.py again at 1 us and see if anything moves.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# OTA step 4: the arm/confirm lifecycle (boot_request_upgrade,
# boot_write_img_confirmed, boot_is_img_confirmed). Depends on FLASH_MAP, which
# is set above. Only meaningful under MCUboot; the code using it is additionally
# gated on BOX_HAVE_OTA_SLOT, which CMake only defines for an MCUboot build.
# MCUBOOT_IMG_MANAGER lives under the IMG_MANAGER menuconfig, which requires
# STREAM_FLASH. Setting it alone is SILENTLY IGNORED -- the build succeeds and
# every arm/confirm path compiles out, so the feature simply is not there.
# Verified present in .config after building, not assumed.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
