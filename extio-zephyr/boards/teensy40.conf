# Teensy 4.0 (i.MX RT1062) -- the USB-ONLY test system.
#
# No Ethernet PHY and no radio on this board, so neither the networking stack
# (block #5) nor BLE (block #6) is enabled: the uplink arbiter falls back to
# USB, which is the point. RT1062 USB is High-Speed, making this a clean A/B
# against the Pico 2's USB Full-Speed transport (480 Mbps vs 12 Mbps).
#
# Persistence: NVS on the on-board QSPI flash (boards/teensy40.overlay carves the
# storage_partition). Same backend the RW612 will use, so the bench exercises the
# target's code path.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# NOT OPTIONAL with NVS: box_flash_init() mounts from main(), and 4096 is exactly
# what overflowed the main stack on the teensy41 -- an MPU fault that read as
# "immature Teensy peripheral support" for a long time. See PORTING.md.
#
# 12288, was 8192 (2026-08-20): 8 KB was ALREADY within ~1 KB of the deepest
# service-loop path (inbound dispatch -> full manifest announce) once main's
# frame reached 4544 bytes, and +90's smoke scratch pushed it to 5760 -- a
# SILENT overflow that presented as every USB config write killing the box's
# CDC TX mid-frame (PORTING.md 2026-08-20, "the USB write-wedge"). The scratch
# now pops with boot_codec_smoke()'s frame, which is the fix; this margin is
# the belt. NOTE the MPU stack guard (on in this build) did NOT catch it and
# cannot be trusted to: the guard is 32 bytes, and any frame bigger than that
# steps straight over it -- the overflowing chain's sub-sp landed past the
# guard and its writes never touched the guarded bytes. Margin is the real
# protection. The MCXN947 runs 16 KB.
CONFIG_MAIN_STACK_SIZE=12288

# Analog: the RT1062's on-chip 12-bit SAR (adc1). Turning this on is what pulls
# box_adc.c + box_ain.c into the build (BOX_HAVE_ADC, see CMakeLists) -- the
# board declares WHICH inputs exist in teensy40.overlay.
CONFIG_ADC=y
