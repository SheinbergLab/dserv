# Seeed XIAO nRF52840 -- the intended Zephyr BLE PERIPHERAL, in its plain
# USB-box form first (BLE_PERIPHERAL.md's phase 0: bring the board up as an
# ordinary box, then add the role).
#
# WHY THIS PART AND NOT AN L-SERIES, settled by measurement 2026-08-31 rather
# than by argument. The nRF52840's system timer (NRF_RTC_TIMER) does not select
# CONFIG_TIMER_HAS_64BIT_CYCLE_COUNTER, so box_gpio.c's now_us() takes its
# k_uptime_ticks() fallback: 30.5 us granularity, where an nRF54L's GRTC would
# give a real cycle counter. That was an open question until the BLE tier's
# actual error budget was measured end to end against a hardware ground truth:
# median +1.12 ms, IQR 0.55 ms, and dominated entirely by the radio. 30.5 us is
# ~5% of that -- the peripheral's tick is not what limits this tier, so the
# XIAO already on the bench is the right board to develop the role on.
#
# NOT ENABLED HERE, on purpose:
#   * networking -- no MAC, USB-only, exactly like the teensy40.
#   * CONFIG_BT -- box_ble.c is the CENTRAL (the hub role). The PERIPHERAL role
#     this part is wanted for does not exist yet, and turning BT on before that
#     code exists would build a hub on a chip we intend as a peripheral, which
#     is worse than an honest gap. Turn it on with box_ble_periph.c, not before.
#   * the OTA Kconfig triple -- see the note below; it cannot work on this
#     board's stock layout at all.

# ---- TURN OFF ZEPHYR'S OWN USB SERIAL BACKEND. Load-bearing on this board. ----
#
# xiao_ble's Kconfig.defconfig sets BOARD_REQUIRES_SERIAL_BACKEND_CDC_ACM, which
# drags in CDC_ACM_SERIAL_INITIALIZE_AT_BOOT -- and that stands up a SECOND,
# INDEPENDENT usbd context at boot, with its own descriptors ("Zephyr Project" /
# "CDC ACM serial backend", VID 0x2fe3), competing with box_usbd.c's box_ctx for
# the one USB peripheral. Its own Kconfig help says what it is for:
#
#   "intended for use with cdc-acm-snippet or as a default serial backend ONLY
#    in applications where no other USB features are required, configured, and
#    enabled."
#
# We are the other case. Symptom when left on, measured 2026-08-31: the module
# enumerates ONE cu.usbmodem node instead of two, so the box console answers but
# the 128-byte frame pipe -- instance 1, the whole point of the USB uplink --
# never appears to the host, and `ioreg` shows no "extio USB box" at all. The
# box reports `active uplink: usb` throughout, because from its side nothing is
# wrong. The DKs never hit this: they do not include cdc_acm_serial.dtsi and so
# never set the board symbol.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# PERSISTENCE WORKS; OTA DOES NOT. The board pulls
# nrf52840_partition_uf2_sdv7.dtsi -- the Adafruit UF2 bootloader layout:
#
#   SoftDevice (reserved)  @0x000000   156 KB
#   code_partition         @0x027000   788 KB   <- app runs here
#   storage_partition      @0x0ec000    32 KB   <- NVS, and comfortably clear
#   UF2 bootloader         @0x0f4000    48 KB
#
# 32 KB is eight 4096-byte sectors = BOX_NVS_SECTORS exactly, and it is not the
# last sector of the part, so the erase-refusing-last-sector trap that cost the
# teensy40 its persistence cannot apply.
#
# But there is NO slot0/slot1 PAIR here, so BOX_HAVE_OTA_SLOT is unreachable and
# `cmd/ota/*` cannot work -- --sysbuild would need a boards/xiao_ble_partitions.dtsi
# and MCUboot flashed at 0x0 IN PLACE OF the Adafruit bootloader, which trades
# UF2 drag-and-drop for SWD-only recovery. Do not do that for a prototype. The
# real update path for a SEALED peripheral is SMP/MCUmgr-over-BLE (DFU), which
# is a different mechanism from the wired boxes' framed OTA and which
# BLE_PERIPHERAL.md leaves open on purpose.

# 12288, matching both Teensys and the nRF52840 DK: the deepest chain here is
# inbound dispatch -> full manifest announce, which came within ~1 KB of an 8 KB
# main stack on the RT1062. 256 KB of RAM makes the margin free.
CONFIG_MAIN_STACK_SIZE=12288

# Analog: the on-chip SAADC (six channels on D0-D5; the overlay maps which pad
# is which, because the analog order is NOT the pin order on this module).
# Oversampling is 1x only -- the driver refuses it for any multi-channel
# sequence, and our sweep is multi-channel by construction.
CONFIG_ADC=y

# ---- DO NOT TRY TO SWAP THE SYSTEM TIMER FOR BETTER RESOLUTION ----
# Tried on the nRF52840 DK 2026-08-22 and it BRICKS THE BOOT: &systick okay +
# CONFIG_NRF_RTC_TIMER=n + CORTEX_M_SYSTICK + 64 MHz builds, really does set
# TIMER_HAS_64BIT_CYCLE_COUNTER, and the box then never boots -- Zephyr's banner
# prints, the kernel idles normally, and main blocks forever in
# box_uplink_init() because on this part USB needs the HFCLK path the RTC
# participates in. The RTC is load-bearing platform infrastructure here, not a
# swappable timer. If 30.5 us ever does become the limit (it is not today, see
# above), the answer is a free-running nRF TIMER at 1 MHz behind a
# board-specific now_us() -- which is also the only option that preserves
# low-power idle, and therefore the only one compatible with a coin cell.
