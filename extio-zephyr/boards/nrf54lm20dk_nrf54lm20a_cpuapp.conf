# Nordic nRF54LM20 DK — the L-series bring-up board. SCOUT, hardware on order.
#
# Written 2026-08-22 BEFORE the board arrived, so that it is flash-and-go rather
# than a day of board-file archaeology when it lands. Everything here is derived
# from Zephyr's own board files; nothing has been run.
#
# WHY THIS BOARD AND NOT THE XIAO. Same SoC (nRF54LM20A), so every SoC-level fact
# this tree has learned carries over -- USB-HS via snps,dwc2, the SAADC
# compatible shared with the nRF52840, and GRTC selecting
# TIMER_HAS_64BIT_CYCLE_COUNTER so the nRF52840's dead-clock bug CANNOT occur
# here. But the DK adds the two things bring-up actually needs and a XIAO lacks:
# an on-board debugger with a VCOM, and buttons/LEDs to drive DI and the obs
# mirror without soldering anything.
#
# AND IT IS BETTER BEHAVED THAN THE XIAO, which is worth stating because the two
# boards are the same silicon and it would be reasonable to expect the same
# potholes. Checked in the Zephyr board files, all four are absent here:
#   * gpio0..gpio3 are ALL status=okay        (the XIAO leaves gpio3 disabled
#                                              while its own connector map uses it)
#   * &vregusb AND &usbhs_wrapper are enabled (the XIAO enables only &usbhs, so
#                                              USB cannot come up there at all)
#   * &adc is enabled
#   * NO nPM1300 PMIC                         (the XIAO's PMIC is what stopped
#                                              MCUboot linking until
#                                              sysbuild/mcuboot_xiao_nrf54lm20a.conf)
# So this board needs no sysbuild/mcuboot_*.conf of its own. If MCUboot fails to
# link anyway, check for a driver the bootloader is building against
# MULTITHREADING=n before assuming it is the same cause.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_ADC=y

# The nRF54L USB-HS PHY has its own VBUS regulator (`usbhs_wrapper` carries
# `regulator = <&vregusb>`), so NRF_USBHS_WRAPPER depends on REGULATOR. Set
# explicitly rather than relied on: this is the symbol whose absence killed the
# XIAO build at Kconfig, and an explicit =y costs nothing and cannot regress.
CONFIG_REGULATOR=y

# Partitions come from the SoC (nrf54lm20a_cpuapp_partition.dtsi): boot 62 KB,
# slot0 920 KB, slot1 920 KB, storage 36 KB. Our signed app is ~141 KB = 15% of
# a slot, so no board partitions file is needed and sysbuild.cmake's EXISTS test
# correctly skips this board.
