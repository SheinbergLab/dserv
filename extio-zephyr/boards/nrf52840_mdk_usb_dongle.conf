# makerdiary nRF52840 MDK USB Dongle -- the BLE CENTRAL for a USB-only host.
#
# The plain box is what this file builds. The radio role is a BUILD choice and
# lives in central.conf:
#
#   west build -b nrf52840_mdk_usb_dongle . -- -DEXTRA_CONF_FILE=central.conf
#
# Bring a new board up WITHOUT it first (BLE_PERIPHERAL.md's phase 0, which
# worked on the XIAO): a plain USB box exercises the console, the frame pipe,
# persistence and the announce, so when the radio is added there is only one new
# thing that can be wrong. It is also what you fall back to when the radio IS
# the suspect.
#
# Same silicon as boards/xiao_ble.* at the other end of the pipe, so everything
# that file records about the nRF52840 applies here too -- in particular the
# 30.5 us now_us() granularity (NRF_RTC_TIMER does not select
# TIMER_HAS_64BIT_CYCLE_COUNTER) and the warning NOT to swap the system timer
# for a finer one, which bricks the boot because USB needs the HFCLK path the
# RTC participates in. On a central that 30.5 us sits in the same place in the
# error budget as it does on the peripheral -- ~5% of the tier's measured
# 0.55 ms IQR -- but it is now on BOTH ends of the estimator.

# ---- TURN OFF ZEPHYR'S OWN USB SERIAL BACKEND. Load-bearing, same as the XIAO.
#
# This board's Kconfig.defconfig sources Kconfig.cdc_acm_serial.defconfig, which
# drags in CDC_ACM_SERIAL_INITIALIZE_AT_BOOT and stands up a SECOND, INDEPENDENT
# usbd context at boot ("Zephyr Project", VID 0x2fe3) competing with
# box_usbd.c's box_ctx for the one USB peripheral.
#
# SYMPTOM, measured on the XIAO 2026-08-31 and identical here by construction:
# the dongle enumerates ONE cu.usbmodem node instead of two, so the console
# answers but the 128-byte frame pipe -- the whole point of the USB uplink --
# never appears to the host, while the box cheerfully reports `active uplink:
# usb` because from its side nothing is wrong. Check the node COUNT, not the
# box. The .overlay carries the other half of this fix (deleting
# board_cdc_acm_uart so our console takes DT instance 0); both are required.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# NOT ENABLED, on purpose:
#   * networking -- no MAC, USB-only, like the teensy40 and the XIAO.
#   * CONFIG_ADC -- no analog pads are declared for this board and none have
#     been confirmed against a silkscreen. box_adc.c degrades to stubs without a
#     box_adc node anyway, but leaving ADC off keeps `analog:` off the boot
#     banner rather than reporting a converter with nothing wired to it.
#   * CONFIG_BT -- comes from central.conf. A board file that hard-wires the
#     role cannot also be the plain-box fallback.

# 12288, matching both Teensys, the nRF52840 DK and the XIAO: the deepest chain
# in this firmware is inbound dispatch -> full manifest announce, which came
# within ~1 KB of an 8 KB main stack on the RT1062. 256 KB of RAM makes the
# margin free.
CONFIG_MAIN_STACK_SIZE=12288

# ---- OTA IS REACHABLE ON THIS BOARD, UNLIKE THE XIAO -- but not turned on yet.
#
# fstab-stock.dtsi gives a REAL A/B pair, which the XIAO's Adafruit UF2 layout
# does not have at all:
#
#   boot_partition    @0x001000   "mcuboot"
#   slot0_partition   @0x010000   "image-0"
#   slot1_partition   @0x06e000   "image-1"
#   storage_partition @0x0cc000   <- NVS lives here
#   scratch_partition @0x0d0000   "image-scratch"
#
# So BOX_HAVE_OTA_SLOT (CMakeLists: CONFIG_BOOTLOADER_MCUBOOT AND
# CONFIG_FLASH_MAP) is achievable with --sysbuild, and the shelf/OTA path that
# every wired box uses would work on this dongle.
#
# NOT DONE HERE because it is a real trade, not a flag: the stock layout is the
# one the factory nRF5 bootloader expects, and MCUboot would be flashed IN PLACE
# OF it -- exchanging USB DFU drag-and-drop recovery for SWD-only recovery on a
# board with no debugger. Bring the dongle up on the stock bootloader first,
# confirm the radio role works, and only then decide whether over-the-air
# updates are worth giving up the recovery path. (2026-09-01 is the day the
# value of a wire-flash rescue got demonstrated: box3 sat wedged with a failed
# OTA and the way out was a J-Link.)
#
# When that day comes it also needs a buildall `-ota` sibling, like every other
# OTA target has.
