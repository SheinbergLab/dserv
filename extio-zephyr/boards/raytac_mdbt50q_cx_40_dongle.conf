# Raytac nRF52840 USB dongle -- a SECOND BLE central, so two sets of
# peripherals can be kept apart (BLE_AFFINITY.md). Bench unit is an MDBT50Q-RX
# against Zephyr's MDBT50Q-CX-40 target; see the .overlay on what that does and
# does not put at risk.
#
# The plain box is what this file builds. The radio role is a BUILD choice:
#
#   west build -b raytac_mdbt50q_cx_40_dongle . -- -DEXTRA_CONF_FILE=central.conf
#
# Bring a new board up WITHOUT it first -- a plain USB box exercises the
# console, the frame pipe, persistence and the announce, so when the radio is
# added there is exactly one new thing that can be wrong. That order is what
# made the XIAO and the MDK dongle quick; skipping it is what makes a bring-up
# a guessing game.
#
# Everything boards/xiao_ble.conf records about the nRF52840 applies here too --
# in particular the 30.5 us now_us() granularity (NRF_RTC_TIMER does not select
# TIMER_HAS_64BIT_CYCLE_COUNTER) and the warning NOT to swap the system timer
# for a finer one, which bricks the boot because USB needs the HFCLK path the
# RTC participates in.
#
# UNLIKE the MDK dongle, this board's LF clock is not a guess: its doc states
# two external oscillators, so the 32.768 kHz crystal is real. That matters for
# the echo estimator (central.conf), where sleep-clock accuracy sets how far a
# connection event can drift between anchors.

# ---- TURN OFF ZEPHYR'S OWN USB SERIAL BACKEND. Load-bearing, third board running.
#
# Kconfig.defconfig sources Kconfig.cdc_acm_serial.defconfig, which drags in
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT and stands up a SECOND, INDEPENDENT usbd
# context at boot ("Zephyr Project", VID 0x2fe3) competing with box_usbd.c's
# box_ctx for the one USB peripheral.
#
# SYMPTOM, measured twice now (XIAO 2026-08-31, and identical here by
# construction): the dongle enumerates ONE cu.usbmodem node instead of two, so
# the console answers but the 128-byte frame pipe never appears to the host,
# while the box cheerfully reports `active uplink: usb` because from its side
# nothing is wrong. CHECK THE NODE COUNT, NOT THE BOX. The .overlay carries the
# other half (deleting board_cdc_acm_uart so our console takes DT instance 0);
# both are required.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# NOT ENABLED, on purpose:
#   * networking -- no MAC, USB-only.
#   * CONFIG_ADC -- no analog pads confirmed on this SKU. box_adc.c degrades to
#     stubs anyway, but leaving ADC off keeps `analog:` off the boot banner
#     rather than reporting a converter with nothing wired to it.
#   * CONFIG_BT -- comes from central.conf. A board file that hard-wires the
#     role cannot also be the plain-box fallback.

# 12288, matching every other board here: the deepest chain in this firmware is
# inbound dispatch -> full manifest announce, which came within ~1 KB of an 8 KB
# main stack on the RT1062. 256 KB of RAM makes the margin free.
CONFIG_MAIN_STACK_SIZE=12288

# ---- OTA IS REACHABLE, and not turned on yet ----
#
# fstab-stock.dtsi gives a real A/B pair -- boot_partition@0 "mcuboot",
# slot0@0x10000, slot1@0x76000, storage@0xdc000 -- so BOX_HAVE_OTA_SLOT is
# achievable with --sysbuild and the shelf path would work.
#
# NOT DONE HERE for the MDK dongle's reason: the stock layout is what the
# factory bootloader expects, and MCUboot would replace it, trading
# recover-over-USB for SWD-only. Bring the dongle up on its factory bootloader,
# confirm the central role, and only then decide. When that day comes it needs a
# buildall `-ota` sibling like every other OTA target.
#
# ---- THE BOOTLOADER IS UF2, NOT the Nordic Open Bootloader ----
#
# Raytac's doc says "Supports Open Bootloader", and this file said so too until
# the unit was plugged in and mounted MDBT50QBOOT:
#
#     UF2 Bootloader 0.8.0 ... lib/uf2
#     Model: Raytac MDBT50Q-RX          <- and it names the SKU, settling that
#     Board-ID: nRF52840-MDBT50Q_RX-verD
#     SoftDevice: S140 6.1.1
#
# So it IS an Adafruit-style UF2 loader, and cmd/bootsel applies -- this board
# is in the BOX_HAVE_UF2_BOOTLOADER list in CMakeLists.txt.
#
# ITS FAMILY ID IS 0x239a010b, NOT the 0xADA52840 the XIAO and MDK dongle use.
# Family ids are per-BOARD (this one is the dongle's own VID/PID), not per-SoC,
# so a .uf2 built with another board's number is the wrong file:
#
#     uf2conv.py <build>/zephyr/zephyr.hex -c -f 0x239a010b -o raytac.uf2
#
# The app links at 0x1000 (CONFIG_FLASH_LOAD_OFFSET via BOARD_HAS_NRF5_BOOTLOADER),
# which is exactly where this bootloader boots from -- checked against
# CURRENT.UF2's first target address rather than assumed. The DTS code-partition
# at 0x10000 is the MCUboot layout and is not in play, because
# USE_DT_CODE_PARTITION is not set.
#
# The SoftDevice line is what the bootloader was BUILT against; no SoftDevice
# occupies flash, or the app could not live at 0x1000.
