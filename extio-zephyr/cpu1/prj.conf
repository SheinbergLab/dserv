# cpu1 heartbeat image: as close to nothing as a Zephyr app gets.
#
# XIP=n is the load-bearing line: the image links into zephyr,sram (SRAMG,
# 0x20050000) with its vector table at the base -- which is exactly the
# address cpu0 writes into SYSCON->CPBOOT before releasing the core. Flash
# never enters cpu1's world at all.
CONFIG_XIP=n

# No console, no shell, no UART: cpu1's only output channel is the heartbeat
# block in SRAMH (box_ipc.h). The board dts routes cpu1's console to lpuart2
# on header pins nothing is connected to, so a console would be silence with
# a driver attached to it.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# The board dts enables GPIO/LED nodes for cpu1; the heartbeat needs none of
# them, and every driver dropped is SRAM the future processing image gets.
CONFIG_GPIO=n
CONFIG_PINCTRL=n

# THE CLOCK TREE IS cpu0's PROPERTY. board_early_init_hook() begins with
# CLOCK_AttachClk(kFRO12M_to_MAIN_CLK) -- a whole-chip switch to 12 MHz --
# then re-runs the full PLL/peripheral clock setup. The upstream dual-core
# flow survives that only because it releases cpu1 at PRE_KERNEL_2, before
# cpu0 has configured anything. We release LATE, into a running system, and
# letting cpu1 re-run board init killed Ethernet + the 1588 clock on a live
# box (TSU frozen at 0, dserv registration gone, console still up -- found
# on box02, 2026-08-01). cpu1 inherits a fully configured clock tree; it
# must only ever RIDE it.
CONFIG_BOARD_EARLY_INIT_HOOK=n

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=320
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
