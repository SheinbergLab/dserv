# extio-zephyr -- COMMON config for every supported board.
# Board-specific subsystems live in boards/<board>.conf (auto-merged by Zephyr):
#   frdm_rw612 -> Ethernet+PTP + BLE      (the universal hub)
#   teensy41   -> Ethernet+PTP, no radio  (wired test system)
#   teensy40   -> USB only                (USB-HS test system)

CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n

# block #3: box_gpio -- DO/DI via the box-gpio-port alias (set per board).
# Box-timed pulses + scheduled events ride k_timer (100 us tick, see
# CONFIG_SYS_CLOCK_TICKS_PER_SEC) -- NOT the counter API; the mcux GPT counter
# driver fires stale alarms instantly (PORTING.md).
CONFIG_REBOOT=y          # cmd/reboot -> warm reset (portable)
CONFIG_GPIO=y

# block #4: USB-HS CDC transport. device_next stack (High-Speed on both the
# RW612 and the RT1062), CDC-ACM frame pipe + console, irq-driven UART + DTR.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y
CONFIG_HWINFO=y            # USB serial number derived from the device HWID
# UDC request-buffer pool. The upstream defaults (16 buffers / 1024 BYTES
# total) leave a High-Speed device ~two 512 B bulk buffers for EVERY endpoint
# of both CDC interfaces combined. Measured consequences on the MCXN947
# (extio_test campaign, 2026-08-02): any host->box burst past ~8 of our 128 B
# frames died at the controller ("Failed to allocate slab" / "UDC error
# event"), and TX contended for the same starved pool (usb_send_max_us hit
# 45 ms), which is the stall window behind swallowed DI pulses and analog
# sweep underruns. 64 buffers / 16 KB gives the pipe real headroom for ~15 KB
# more RAM (board sits at ~58% RAM with plenty free).
CONFIG_UDC_BUF_COUNT=64
CONFIG_UDC_BUF_POOL_SIZE=16384
# ...and the one that actually gated the burst cliff: the NXP UDC driver's
# INTERNAL EVENT SLAB (udc_mcux_ehci.c udc_event_slab). Every USB completion
# posts one event from the ISR; the work queue drains them. At the 4-block
# default, any packet burst deeper than the slab loses completions outright
# ("Failed to allocate slab") -- measured as exactly ~8 of 20 back-to-back
# 128 B frames surviving, unchanged by the buf-pool bump above. 16 is the
# Kconfig range maximum; if bursts ever outrun it, patch the range
# (patches/ convention) rather than re-tuning around it.
CONFIG_UDC_NXP_EVENT_COUNT=16
# NOTE: the CDC-ACM "echo mitigation" first-TX delay (USBD_CDC_ACM_TX_DELAY_MS)
# is left at its upstream 100 ms default ON PURPOSE -- see the app Kconfig for
# why zeroing it produced a host-echo feedback storm on the console CDC.
# (Tried CONFIG_USBD_CDC_ACM_WORKQUEUE=y for data-vs-console contention -- did not
# fix it, so not enabled.)

# Management console = a small interrupt-driven CLI over the console CDC
# (src/platform/box_console.c): own RX/TX ring buffers, drained in the service
# loop, so it is single-threaded with the rest of the box -- no cfg locking, no
# extra thread.
#
# We briefly used Zephyr's Shell subsystem here. It is nicer (tab-completion,
# history) but it cost ~0.25 ms of MEDIAN round-trip latency -- measured, and
# independent of both the backend transport and the shell thread priority (see
# PORTING.md "RTT re-measured"). This is a timing box and the console is a
# one-off convenience, so the trade is not worth it.
#
# NOTE the original reason for abandoning this console was WRONG: the byte
# shredding was dserv's extio subprocess opening the console port (bad USB
# product string + inverted CDC order), not this code. Both are fixed.

# headroom for the net stack where it is enabled; harmless otherwise
CONFIG_MAIN_STACK_SIZE=4096

# ---- make thread death LOUD and stack sizing MEASURED ----
# Context: the eth RX-wake thread died silently twice (dbg/wake_us frozen,
# box otherwise healthy), and the first postmortem guessed "stack overflow"
# and doubled the stack. That guess was untestable precisely because nothing
# here made death visible. Two facts, established 2026-08-01 and worth not
# re-deriving: (1) every supported board ALREADY runs hardware stack
# protection (PSPLIM on the Cortex-M33s via BUILTIN_STACK_GUARD, MPU guards
# on the RT10xx Teensys) -- an overflow is a loud fatal, and the default
# fatal handler HALTS the box, so "one thread quietly gone while the rest
# runs" is proof it was NEVER an overflow; (2) with THREAD_NAME off, the
# k_thread_name_set() calls this codebase already makes were no-ops and any
# fault dump says "unknown" -- worth a few bytes per thread to fix.
# INIT_STACKS watermarks stacks (0xAA fill at create) so
# k_thread_stack_space_get() reports REAL headroom -- published 1 Hz as
# dbg/ethrx_stack_free, so the next "raise the stack" starts from a
# measurement. Cost: a one-time memset per thread creation, nothing per-pass.
# (The RW612 build already carried both -- pulled in by its shell config, not
# stated anywhere -- so only the Teensys and the MCXN947 actually change.)
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y

# Persistent settings (box_flash, NVS) are enabled PER BOARD, not here: on the
# Teensy the app XIP-executes from its only flash, and enabling the FlexSPI NOR
# driver re-inits that controller and hard-faults at boot. So NVS lives in
# boards/frdm_rw612.conf (separate storage, no XIP conflict). A Teensy build
# runs without persistence until a working XIP-safe recipe is found.

# CONFIG_ADC=y             # block #7: GAU GPADC vs external MCP3204
# CONFIG_SETTINGS=y        # persistence backend for box_persist
