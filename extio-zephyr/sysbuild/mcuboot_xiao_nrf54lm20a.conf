# MCUboot Kconfig for the XIAO nRF54LM20A ONLY (applied by sysbuild.cmake).
#
# WHY THIS FILE EXISTS: without it the MCUboot image for this board does not
# LINK, and the app image's success hides it -- our zephyr.signed.bin builds and
# signs fine, so a casual `west build --sysbuild` looks like it worked right up
# until you read the log:
#
#   drivers/mfd/mfd_npm13xx.c: undefined reference to `k_work_submit'
#   drivers/mfd/mfd_npm13xx.c: undefined reference to `z_impl_k_mutex_init'
#   drivers/regulator/regulator_fixed.c: undefined reference to `z_impl_k_usleep'
#
# THE CAUSE IS THE BOARD BEING WELL EQUIPPED, not anything wrong with it. The
# XIAO nRF54LM20A carries an nPM1300 PMIC (`nordic,npm1300` -- charger plus
# regulators, which is exactly what makes it a good LiPo box) and a fixed
# `power_en` regulator, both enabled in its board DTS. Zephyr's REGULATOR and
# MFD symbols are `default y` when their devicetree nodes are enabled, and that
# default applies to EVERY image built for the board -- including MCUboot, which
# builds with CONFIG_MULTITHREADING=n and therefore has no k_work, no k_mutex
# and no k_usleep for those drivers to call.
#
# A bootloader on this board needs none of it: it reads internal RRAM, checks a
# signature and jumps. The PMIC comes up under the application, where the kernel
# it needs actually exists.
#
# NOT set in a board conf: boards/<board>.conf reaches the APPLICATION image
# only. MCUboot is a separate Zephyr application (bootloader/mcuboot/boot/zephyr)
# and never sees this app's board files -- which is why the app-side
# CONFIG_REGULATOR=y we DO need (for the USB-HS PHY's VBUS regulator) neither
# caused this nor could fix it.
CONFIG_REGULATOR=n
CONFIG_MFD=n
