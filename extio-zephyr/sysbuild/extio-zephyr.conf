# sysbuild/extio-zephyr.conf -- app-image Kconfig that applies ONLY under
# --sysbuild, i.e. only when MCUboot is actually in front of us.
#
# Sysbuild applies ${APP_DIR}/sysbuild/<image>.conf to that image; the app image
# is named for the application directory, hence "extio-zephyr". A plain
# `west build -b teensy40 .` never reads this file, which is the entire point.
#
# ---- OTA: the arm/confirm lifecycle over MCUboot ----
#
# ALL THREE ARE REQUIRED, and the discovery order matters more than the line
# order: MCUBOOT_IMG_MANAGER lives under the IMG_MANAGER menuconfig, which
# requires STREAM_FLASH. Setting MCUBOOT_IMG_MANAGER alone is SILENTLY IGNORED
# -- the build succeeds and every arm/confirm path compiles out, so the feature
# simply is not there. The RW612 learned this once; the teensy40 demonstrated it
# again on 2026-08-21, when its first MCUboot image booted with no
# state/fw_ver at all.
#
# What they buy: the box can read its own image header. Without them there is no
# fw_ver, no staged_ver, and no boot_write_img_confirmed() -- so an OTA
# transfers, verifies, boots... and REVERTS on the next reset, which presents as
# "the update did not stick" rather than as a missing Kconfig.
#
# CHECK .config AFTER BUILDING rather than assuming:
#   grep -E 'CONFIG_(STREAM_FLASH|IMG_MANAGER|MCUBOOT_IMG_MANAGER)=' \
#        build-*/extio-zephyr/zephyr/.config
#
# WHY THIS FILE AND NOT boards/<board>.conf. It was in the board conf first, and
# a board conf cannot be conditional -- so the PLAIN build got the image manager
# too. That is not merely wasteful: box_boot.c does
#
#     on_trial = boot_is_img_confirmed() ? 0 : 1;
#
# under #if CONFIG_MCUBOOT_IMG_MANAGER, and with no bootloader in front of it
# that reads an MCUboot trailer from a slot0 that holds nothing. It returns
# false, so a bootloader-less box reports state/ota/trial=1 and img_ver
# "unreadable" -- claiming it is running an unconfirmed trial image when there
# is no bootloader at all. A field reporting memory instead of reality, which is
# the failure shape this tree keeps meeting. Scoping the Kconfig to sysbuild
# fixes it at the source and needs no #if changes at the nine call sites.
#
# The MCXN947 still sets these in its board conf and has the same latent issue
# in a non-sysbuild build; it is always built --sysbuild, so it has never been
# bitten. Worth folding into this file when someone touches that board next.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
