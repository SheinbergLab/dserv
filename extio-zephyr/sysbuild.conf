# Sysbuild config -- builds MCUboot alongside the app.
#
#   west build -b frdm_rw612 --sysbuild <this-dir> -d build-rw612-mcuboot
#
# This file is INERT unless --sysbuild is passed, so the Teensy builds
# (west build -b teensy41 ...) are unaffected and keep linking at flash base.
#
# Why MCUboot at all: it is step 1 of the OTA port (wiznet-io/OTA.md). On the
# RP2350 the bootrom provided the A/B slots, the try-before-you-buy flag and the
# revert-on-reset; here MCUboot provides all three, plus image signing, which
# was the one open question in the RP2350 design.
#
# The flash layout it needs is ALREADY in the board's devicetree and was already
# correct -- we simply were not using it:
#
#   boot_partition   (mcuboot)  @0x000000   128 KB
#   slot0_partition  (image-0)  @0x020000     3 MB   <- app runs here
#   slot1_partition  (image-1)  @0x320000     3 MB   <- OTA writes here
#   storage_partition           @0x620000   ~58 MB   <- NVS, OUTSIDE both slots
#
# storage_partition sitting outside both slots is what makes "config survives an
# update" a property of the layout rather than something we have to engineer.
#
# Turning this on MOVES THE APP: without it CONFIG_FLASH_LOAD_OFFSET=0 and the
# app links at the flash base 0x18000000, spanning boot_partition into slot0.
# CONFIG_BOOTLOADER_MCUBOOT selects USE_DT_CODE_PARTITION, so the app relinks to
# 0x18020000 and grows an MCUboot image header. That is a one-time layout
# migration and needs one SWD flash of BOTH images -- exactly parallel to the
# Pico needing one BOOTSEL flash before OTA can take over.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
