# Sysbuild config -- builds MCUboot alongside the app.
#
#   west build -b frdm_mcxn947/mcxn947/cpu0 --sysbuild <this-dir> -d build-mcxn-ota
#   west build -b teensy40                  --sysbuild <this-dir> -d build-teensy40-ota
#
# This file is INERT unless --sysbuild is passed, so a plain `west build -b
# teensy40 .` is unaffected and keeps linking at flash base.
#
# THE REFERENCE CONFIGURATION IS THE MCXN947 (build-mcxn-ota). It is the one that
# has actually been exercised in the field; the RW612 path builds and booted but
# has had far less use, so copy geometry and swap mode from the MCXN947 when
# bringing up a new board, not from the RW612.
#
# Swap mode is left at sysbuild's default, which resolves here to
# SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET with EQUAL-sized slots -- what
# build-mcxn-ota ships (boot 80 KB, slot0 = slot1 = 984 KB). Stated because it is
# load-bearing and invisible: swap modes disagree about whether the secondary
# slot may differ in size, so a board whose slots are not equal has changed the
# algorithm's assumptions without saying so.
#
# Why MCUboot at all: it is step 1 of the OTA port (wiznet-io/OTA.md). On the
# RP2350 the bootrom provided the A/B slots, the try-before-you-buy flag and the
# revert-on-reset; here MCUboot provides all three, plus image signing, which
# was the one open question in the RP2350 design.
#
# On the FRDM boards the flash layout it needs is ALREADY in the board's
# devicetree and was already correct -- we simply were not using it (RW612):
#
#   boot_partition   (mcuboot)  @0x000000   128 KB
#   slot0_partition  (image-0)  @0x020000     3 MB   <- app runs here
#   slot1_partition  (image-1)  @0x320000     3 MB   <- OTA writes here
#   storage_partition           @0x620000   ~58 MB   <- NVS, OUTSIDE both slots
#
# The TEENSY40 defines none of that -- the PJRC board DTS has no partitions and no
# zephyr,code-partition -- so boards/teensy40.overlay carves the whole layout and
# names the code partition itself. See the long note there, in particular why
# nothing may extend past 0x1FF000: the last sector of that 2 MB part accepts an
# erase and silently ignores it, and MCUboot puts an image trailer at the END of a
# slot, so a slot running to the top of flash would fail mid-swap.
#
# storage_partition sitting outside both slots is what makes "config survives an
# update" a property of the layout rather than something we have to engineer.
#
# Turning this on MOVES THE APP: without it CONFIG_FLASH_LOAD_OFFSET=0 and the
# app links at the flash base, spanning boot_partition into slot0.
# CONFIG_BOOTLOADER_MCUBOOT selects USE_DT_CODE_PARTITION, so the app relinks to
# slot0 and grows an MCUboot image header. That is a one-time layout migration
# and needs one flash of BOTH images -- SWD on the FRDM boards, one HalfKay
# button press on a Teensy, exactly parallel to the Pico needing one BOOTSEL
# flash before OTA can take over.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
