# The BLE CENTRAL variant of a board (build with -DEXTRA_CONF_FILE=central.conf).
#
# The mirror of periph.conf, and kept out of any board .conf for the same
# reason: the plain box is what you bring a new board up as, and it is what you
# fall back to when the radio is the suspect. A board file that hard-wires the
# radio role cannot do either.
#
# WHY THIS EXISTS SEPARATELY FROM boards/frdm_rw612.conf, which carries the same
# settings inline: the RW612 is only ever a central -- it is the Ethernet/PTP
# hub, and a board with a wired uplink has no business being a battery
# peripheral. An nRF52840 is the opposite: the SAME silicon is the peripheral
# (XIAO, boards/xiao_ble.*) and, on a dongle, a plausible USB-only central. So
# on that family the role has to be a build choice, exactly as the peripheral's
# already is, or one board file would have to pick for both.
#
#   west build -b <dongle> . -- -DEXTRA_CONF_FILE=central.conf
#
# VERIFIED TO FIT on nrf52840dk/nrf52840 (same SoC as every candidate dongle),
# 2026-09-01: 239,228 B flash of 1 MB (23%), 172,788 B RAM of 256 KB (66%). The
# RAM number is the one to watch when raising BT_MAX_CONN -- the connection
# pool and its buffers are what grow.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y

# Fleet ceiling. box_ble.c walks 0..CONFIG_BT_MAX_CONN-1 and stops scanning
# while full, so this is the real "how many handhelds in one room" number.
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_SMP=y

# The frozen contract (src/core/dserv_ble.h): one whole 128-byte dserv_msg per
# ATT PDU, no fragmentation layer. 131 = DSERV_BLE_MTU_MIN (128 + the 3-byte
# ATT header). Both ends verify this after the automatic exchange and refuse
# the pipe below it rather than silently halving the frame.
CONFIG_BT_L2CAP_TX_MTU=131
CONFIG_BT_BUF_ACL_RX_SIZE=135
CONFIG_BT_BUF_ACL_TX_SIZE=135
CONFIG_BT_DATA_LEN_UPDATE=y

# NOTE FOR AN nRF52840 CENTRAL, and it is a real difference from the RW612
# rather than a footnote: this SoC's NRF_RTC_TIMER does not select
# TIMER_HAS_64BIT_CYCLE_COUNTER, so box_gpio_now_us() takes the
# k_uptime_ticks() fallback at 30.5 us granularity. On the PERIPHERAL that was
# measured at ~5% of the tier's 0.55 ms IQR and is not the limit
# (BLE_PERIPHERAL.md). On a central it lands in the same place in the budget,
# but it is now on BOTH ends of the estimator rather than one.
#
# The larger difference is that a USB dongle has NO PTP. box3 disciplines its
# clock to dserv over Ethernet 1588; a dongle anchors on the obs edge
# (BOX_SYNC_DP, ess/in_obs) like every other USB box, and EVERY peripheral's
# timestamp is mapped through the central's clock. That is consistent with
# BLE.md's tiering -- Ethernet rigs are time-critical, USB behavioural rigs are
# the BLE home -- but it does mean a dongle fleet should not be expected to
# reproduce box3's numbers.
