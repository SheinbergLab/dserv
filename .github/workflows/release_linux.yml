name: Release for Linux

on:
  push:
    tags:
      - '*'

jobs:

  # Gate the upload jobs on the release existing. The release is created in exactly
  # ONE place -- create_release.yml -- to avoid the concurrent-create race that used
  # to produce duplicate releases for a single tag (see that file). This job used to
  # create the release itself; now it only WAITS for the single writer, so the
  # `needs: create-release` gate on every upload job below still means "release ready".
  create-release:

    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Wait for the release for this tag to exist.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}     # no checkout in this job -> gh needs the repo explicitly
        run: |
          for i in $(seq 1 60); do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "Release ${{ github.ref_name }} is present."
              exit 0
            fi
            echo "Waiting for release ${{ github.ref_name }} to be created ($i/60)..."
            sleep 5
          done
          echo "::error::Release ${{ github.ref_name }} did not appear within 5 minutes (create_release.yml failed?)."
          exit 1

  release-dserv:

    needs: create-release

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
      
    steps:

      - name: Check out our dserv code for the current tag.
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up a build environment.
        run: |
          sudo apt update
          sudo apt install -y git wget ca-certificates build-essential cmake zip unzip
          sudo apt install -y libevdev-dev zlib1g-dev libssl-dev libfluidsynth-dev pkg-config

      - name: Install TCL 9 to the build environment.
        run: |
          cd deps/tcl/unix/
          ./configure
          make
          sudo make install

      - name: Install Jansson to the build environment.
        run: |
          cd deps/jansson/
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -B build
          cmake --build build
          sudo cmake --install build

      - name: Build dserv itself and package it for release.
        run: |
          cmake -D PROJECT_VERSION=${{ github.ref_name }} -B build
          cmake --build build --verbose
          cpack -G DEB --config build/CPackConfig.cmake

      # Pure asset upload to the release the create-release job already made.
      # At this fan-out, every job calling ncipollo create-or-update raced and
      # 422'd on already_exists; gh release upload only pushes assets, so there
      # is nothing to race on. The create-release job owns notes/body/prerelease.
      - name: Upload the dserv package to the release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" ./*.deb --clobber

  release-dserv-agent:

    needs: create-release

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            goarch: amd64
          - os: ubuntu-22.04-arm
            goarch: arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:

      - name: Check out our dserv code for the current tag.
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build dserv-agent
        run: |
          cd dserv-agent
          # -X main.version stamps the release tag; without it every agent in
          # the fleet reports the fallback literal and /api/status cannot tell
          # you which build a box is on. Requires main.version to be a var.
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dserv-agent_linux_${{ matrix.goarch }} .

      - name: Upload dserv-agent binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dserv-agent/dserv-agent_linux_${{ matrix.goarch }} --clobber

  release-dservctl:

    needs: create-release

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            goarch: amd64
          - os: ubuntu-22.04-arm
            goarch: arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:

      - name: Check out our dserv code for the current tag.
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build dservctl
        run: |
          cd tools/dservctl
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o dservctl_linux_${{ matrix.goarch }} .

      - name: Upload dservctl binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" tools/dservctl/dservctl_linux_${{ matrix.goarch }} --clobber

  release-extio-setup:

    needs: create-release

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            goarch: amd64
          - os: ubuntu-22.04-arm
            goarch: arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:

      - name: Check out our dserv code for the current tag.
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the required Go from go.mod (extio-setup needs 1.22+ for the
          # http routing/FileServerFS it uses) rather than pinning a version.
          go-version-file: tools/extio-setup/go.mod

      - name: Build extio-setup
        run: |
          cd tools/extio-setup
          # Linux enumerator is pure-Go sysfs, so CGO_ENABLED=0 -> a static
          # binary, same as dservctl (macOS needs cgo for IOKit; the .pkg
          # covers macOS).
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o extio-setup_linux_${{ matrix.goarch }} .

      - name: Upload extio-setup binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" tools/extio-setup/extio-setup_linux_${{ matrix.goarch }} --clobber

  # Raspberry Pi camera deb, built INSIDE the target OS: Debian trixie plus
  # the raspberrypi.com archive, whose libcamera (pisp + vc4) is what the rigs
  # actually run. libcamera breaks ABI every minor release (soname tracks the
  # version), so a module built against an upstream source tree of some other
  # version can never load on the rigs — that mismatch is why this deb used to
  # be dead on arrival and camera installs fell back to on-target source
  # builds. Linking the distro package and depending on the exact soname
  # package (libcamera0.7 today, computed below) makes the deb installable
  # with no build tools on the target, and apt refuses it cleanly on any
  # system whose libcamera cannot work.
  release-camera-rpi:

    needs: create-release

    runs-on: ubuntu-22.04-arm
    container: debian:trixie

    permissions:
      contents: write

    steps:

      - name: Add the Raspberry Pi package archive
        run: |
          apt-get update
          apt-get install -y wget gnupg ca-certificates git
          wget -qO- https://archive.raspberrypi.com/debian/raspberrypi.gpg.key \
            | gpg --dearmor > /usr/share/keyrings/raspberrypi.gpg
          echo "deb [signed-by=/usr/share/keyrings/raspberrypi.gpg] https://archive.raspberrypi.com/debian trixie main" \
            > /etc/apt/sources.list.d/raspberrypi.list
          apt-get update

      - name: Install build dependencies (same set scripts/setup-camera.sh uses)
        run: apt-get install -y --no-install-recommends cmake g++ pkg-config tcl9.0-dev libcamera-dev libjpeg-dev gh

      - name: Check out our dserv code for the current tag.
        uses: actions/checkout@v4

      - name: Build camera module only
        run: |
          cd modules
          cmake -DBUILD_CAMERA=ON -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build --target camera_capture
          ldd build/dserv_camera.so | grep -q 'not found' && exit 1 || true

      - name: Package camera module
        run: |
          mkdir -p camera-pkg/usr/local/dserv/modules
          cp modules/build/dserv_camera.so camera-pkg/usr/local/dserv/modules/

          # Depend on the exact libcamera runtime package we linked against.
          LIBCAMERA_PKG=$(dpkg-query -S "$(readlink -f /usr/lib/aarch64-linux-gnu/libcamera.so)" | cut -d: -f1)
          LIBCAMERA_VER=$(dpkg-query -W -f='${Version}' libcamera-dev | cut -d+ -f1)

          mkdir -p camera-pkg/DEBIAN
          cat > camera-pkg/DEBIAN/control << EOF
          Package: dserv-camera-rpi
          Version: ${{ github.ref_name }}
          Architecture: $(dpkg --print-architecture)
          Depends: dserv (>= ${{ github.ref_name }}), ${LIBCAMERA_PKG} (>= ${LIBCAMERA_VER}), libjpeg62-turbo
          Description: Camera module for dserv (Raspberry Pi OS trixie, ${LIBCAMERA_PKG})
          Maintainer: SheinbergLab
          EOF

          cat > camera-pkg/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          # First install on a box: give the camera subprocess its local config.
          # Never overwritten on upgrade — rigs tune rotation/exposure in it.
          if [ ! -f /usr/local/dserv/local/camera.tcl ] \
             && [ -f /usr/local/dserv/local/camera.tcl.EXAMPLE ]; then
            cp /usr/local/dserv/local/camera.tcl.EXAMPLE /usr/local/dserv/local/camera.tcl
          fi
          # dsconf starts the camera subprocess when the module is present, so
          # a running dserv picks it up on restart. --no-block matters: when
          # the install itself runs under dserv's interp (essctrl exec dpkg),
          # a blocking restart deadlocks — dserv's stop joins the worker that
          # is waiting on dpkg, which is waiting on this very systemctl —
          # until systemd's stop timeout SIGKILLs it (seen 2026-08-15).
          if command -v systemctl >/dev/null 2>&1; then
            systemctl try-restart --no-block dserv 2>/dev/null || true
          fi
          # Advice only, never a config.txt edit: overlay selection is boot
          # configuration and needs a reboot to act — a human decision. But an
          # attached clone/Arducam camera whose overlay is missing binds no
          # sensor, and saying so here beats a silent gap.
          if ! cat /sys/bus/i2c/devices/*/name 2>/dev/null | grep -qiE '^(imx|ov|arducam)'; then
            echo "dserv-camera: no camera sensor bound on this box."
            echo "dserv-camera: if a camera IS attached (Arducam/clone modules especially),"
            echo "dserv-camera: it may need 'dtoverlay=<sensor>' (e.g. imx708) in"
            echo "dserv-camera: /boot/firmware/config.txt and a reboot."
            echo "dserv-camera: check with: rpicam-hello --list-cameras"
          fi
          EOF
          chmod 755 camera-pkg/DEBIAN/postinst

          dpkg-deb --root-owner-group --build camera-pkg dserv-camera-rpi_${{ github.ref_name }}_$(dpkg --print-architecture).deb

      - name: Upload camera package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dserv-camera-rpi_*.deb --clobber

  # Generic-linux camera debs for non-Pi machines; these still build a pinned
  # upstream libcamera from source and are unrelated to the rig fleet.
  release-camera:

    needs: create-release

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            libcamera_version: "0.4.0"
          - os: ubuntu-22.04-arm
            target: linux
            libcamera_version: "0.4.0"

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:

      - name: Check out our dserv code for the current tag.
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up a build environment.
        run: |
          sudo apt update
          sudo apt install -y git wget ca-certificates build-essential cmake zip unzip
          sudo apt install -y libevdev-dev zlib1g-dev libssl-dev libfluidsynth-dev pkg-config libjpeg-dev
          
          # Check what JPEG libraries are available for packaging
          echo "Available JPEG packages:"
          apt list --installed | grep jpeg || echo "No JPEG packages found"
          apt-cache search libjpeg | grep -E "libjpeg[0-9]+" || echo "No libjpeg runtime packages found"

      - name: Set architecture-specific paths
        run: |
          if [ "$(dpkg --print-architecture)" = "arm64" ]; then
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          else
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          fi

      - name: Install pinned libcamera from source
        run: |
          sudo apt install -y ninja-build python3-pip python3-yaml python3-ply python3-jinja2
          sudo pip3 install meson
          git clone https://gitlab.freedesktop.org/camera/libcamera.git
          cd libcamera
          git checkout v${{ matrix.libcamera_version }}
          meson setup build --prefix=/usr/local -Dpipelines=rpi/vc4,vimc -Dipas=rpi/vc4 -Dtest=false -Ddocumentation=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build JPEG library with PIC for static linking
        run: |
          wget http://www.ijg.org/files/jpegsrc.v9e.tar.gz
          tar xzf jpegsrc.v9e.tar.gz
          cd jpeg-9e
          ./configure --prefix=/usr/local --enable-static --disable-shared CFLAGS="-fPIC"
          make
          sudo make install

      - name: Install TCL 9 (needed for camera module)
        run: |
          cd deps/tcl/unix/
          ./configure
          make
          sudo make install

      - name: Install Jansson (needed for camera module)
        run: |
          cd deps/jansson/
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -B build
          cmake --build build
          sudo cmake --install build

      - name: Build camera module only
        run: |
          cd modules
          cmake -DBUILD_CAMERA=ON -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build --target camera_capture

      - name: Package camera module
        run: |
          mkdir -p camera-pkg/usr/local/dserv/modules
          cp modules/build/dserv_camera.so camera-pkg/usr/local/dserv/modules/
          
          # Create package metadata
          mkdir -p camera-pkg/DEBIAN
          LIBCAMERA_DEP="libcamera0.4 (>= 0.4.0)"

          cat > camera-pkg/DEBIAN/control << EOF
          Package: dserv-camera-${{ matrix.target }}
          Version: ${{ github.ref_name }}
          Architecture: $(dpkg --print-architecture)
          Depends: dserv (>= ${{ github.ref_name }}), ${LIBCAMERA_DEP}
          Description: Camera module for dserv
          Maintainer: SheinbergLab
          EOF
          
          dpkg-deb --build camera-pkg dserv-camera-${{ matrix.target }}_${{ github.ref_name }}_$(dpkg --print-architecture).deb

      - name: Upload camera package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dserv-camera-*.deb --clobber

  check-dserv:

    needs: release-dserv

    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:

      - name: Install the dserv package we just released.
        run: |
          sudo apt update
          wget ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/dserv_${{ github.ref_name }}_$(dpkg --print-architecture).deb
          sudo apt install --yes ./dserv_${{ github.ref_name }}_$(dpkg --print-architecture).deb

      - name: Install dlsh packages.
        run: |
          DLSH_VERSION=$(curl -s https://api.github.com/repos/SheinbergLab/dlsh/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          wget https://github.com/SheinbergLab/dlsh/releases/download/${DLSH_VERSION}/dlsh-${DLSH_VERSION}.zip -O dlsh.zip
          sudo mkdir -p /usr/local/dlsh
          sudo cp dlsh.zip /usr/local/dlsh

      - name: Sanity check the installed dserv.
        run: |
          ls -alth /usr/local/bin
          ls -alth /usr/local/dserv/db
          /usr/local/dserv/dserv --help
