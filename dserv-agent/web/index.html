	 openPanel(nodeId) {
             const node = this.nodes.get(nodeId);
             if (!node) return;
             this.openPanelForNode(node);
	 }
	 
	 openLocalPanel() {
             const localNode = {
		 id: 'local',
		 name: 'Local System',
		 isLocal: true,
		 ip: 'localhost'
             };
             this.openPanelForNode(localNode);
	 }
	 
	 openPanelForNode(node) {
             this.panelNode = node;
             this.panelOpen = true;
             this.panelStatus = null;
             this.panelComponents = [];
             this.installWorkflow = null;
             this.el.panelTitle.textContent = node.name || node.id;
             this.el.panelOverlay.classList.add('open');
             this.el.agentPanel.classList.add('open');
             this.el.panelContent.innerHTML = '<div class="panel-not-connected"><div class="empty-state-icon">⏳</div><h3>Connecting...</h3></div>';
             this.connectAgent(node);
	 }
	 
	 closePanel() {
             // In solo mode there is no directory to fall back to -- closing the
             // panel means closing the window. window.close() only works on a
             // script-opened window, so leave the panel up if it refuses.
             if (this.solo) { window.close(); return; }
             this.panelOpen = false;
             this.panelNode = null;
             this.installWorkflow = null;
             this.el.panelOverlay.classList.remove('open');
             this.el.agentPanel.classList.remove('open');
             this.el.agentPanel.classList.remove('expanded');
             if (this.panelWs && !this.panelUsingMainWs) {
		 this.panelWs.close();
             }
             this.panelWs = null;
             this.panelUsingMainWs = false;
             // A closed panel cannot show the outcome; stop the watcher rather
             // than let it time out into an error toast on a box that is fine.
             this.retypeTarget = null;
             this.retypeFailed = null;
	 }
	 
	 connectAgent(node) {
             // Kept for reattach: a retype restarts the agent, and a remote
             // panel socket does not reconnect by itself (see retypeWatch).
             this.panelNode = node;
             const isSameHost = node.isLocal ||
				node.ipAddress === location.hostname ||
				location.hostname === 'localhost' ||
				location.hostname === '127.0.0.1';
             
             if (isSameHost && this.ws && this.connected) {
		 this.panelWs = this.ws;
		 this.panelUsingMainWs = true;
		 this.ws.send(JSON.stringify({type:'status'}));
		 this.ws.send(JSON.stringify({type:'components'}));
		 this.ws.send(JSON.stringify({type:'time_status'}));
		 return;
             }
             
             this.panelUsingMainWs = false;
             let host = node.ip || node.ipAddress || (node.id.toLowerCase() + '.local');
             try {
		 this.panelWs = new WebSocket(`ws://${host}:${CONFIG.agentPort}/ws`);
		 this.panelWs.onopen = () => {
                     this.panelWs.send(JSON.stringify({type:'status'}));
                     this.panelWs.send(JSON.stringify({type:'components'}));
                     this.panelWs.send(JSON.stringify({type:'time_status'}));
		 };
		 this.panelWs.onmessage = e => this.handlePanelMsg(JSON.parse(e.data));
		 this.panelWs.onerror = () => this.showPanelError('Connection error');
		 this.panelWs.onclose = () => {};
		 setTimeout(() => { if (this.panelWs?.readyState === WebSocket.CONNECTING) { this.panelWs.close(); this.showPanelError('Timeout'); } }, 5000);
             } catch(e) { this.showPanelError(e.message); }
	 }
	 
	 showPanelError(err) {
             this.el.panelContent.innerHTML = `<div class="panel-not-connected"><div class="empty-state-icon">⚠️</div><h3>Agent not available</h3><p>${err}</p><p style="margin-top:12px;font-size:12px;">Make sure dserv-agent is running.</p></div>`;
	 }
	 
	 handlePanelMsg(msg) {
             if (msg.type === 'status' || msg.type === 'status_response') { 
		 if (msg.data) { this.panelStatus = msg.data; this.renderPanel(); } 
             }
             else if (msg.type === 'components_response') { 
		 if (msg.data) { this.panelComponents = msg.data; this.renderPanel(); } 
             }
             else if (msg.type === 'logs_response') { 
		 if (msg.data) { this.displayLogs(msg.data.logs); } 
		 else if (msg.error) { this.displayLogs('Error: ' + msg.error); } 
             }
             else if (msg.type === 'dserv_response') { 
		 this.showToast(msg.success ? 'Command sent' : msg.error, msg.success ? 'success' : 'error'); 
		 if (msg.success) this.panelWs?.send(JSON.stringify({type:'status'})); 
             }
             else if (msg.type === 'service_response') {
		 // Handle per-component service control responses
		 this.showToast(msg.success ? `${msg.service}: ${msg.action}` : msg.error, msg.success ? 'success' : 'error');
		 if (msg.success) {
                     this.panelWs?.send(JSON.stringify({type:'status'}));
                     this.panelWs?.send(JSON.stringify({type:'components'}));
		 }
             }
             else if (msg.type === 'time_status_response') {
		 if (msg.data) {
                     this.panelTime = msg.data;
                     // Don't clobber an open Set-role form with a background refresh.
                     if (!this.timeForm) {
			 const el = document.getElementById('panel-time');
			 if (el) el.innerHTML = this.renderTime(this.panelTime);
                     }
		 }
             }
             else if (msg.type === 'time_candidates_response') {
		 if (msg.error) { this.showToast('Time: ' + msg.error, 'error'); }
		 else if (msg.data) { this.timeChoices(msg.data); }
             }
             else if (msg.type === 'time_role_response') {
		 if (msg.error) { this.showToast('Time role: ' + msg.error, 'error'); }
		 else if (msg.data?.output !== undefined) { this.displayLogs(msg.data.output); }
		 else {
                     this.showToast('Time role change started…', 'success');
                     const el = document.getElementById('panel-time');
                     if (el) { this.timeForm = false; el.innerHTML = '<div style="color:#fbbf24">applying… (output lands in Service Logs)</div>'; }
		 }
             }
             else if (msg.type === 'time_role_result') {
		 const out = msg.data?.output || msg.error || '(no output)';
		 this.displayLogs(out);
		 this.showToast(msg.success ? `Time role: ${msg.data?.label || 'done'}` : 'Time role failed — see Service Logs', msg.success ? 'success' : 'error');
		 this.loadTimeStatus();
             }
             else if (msg.type === 'retype_profiles_response') {
		 if (msg.error) { this.showToast('Retype: ' + msg.error, 'error'); }
		 else if (msg.data) { this.retypeChoices(msg.data); }
             }
             else if (msg.type === 'retype_response') {
		 this.retypeStarted(msg);
             }
             else if (msg.type === 'install_progress') {
		 this.updateInstallWorkflow(msg.data);
             }
             else if (msg.type === 'install_complete') { 
		 this.completeInstallWorkflow();
		 this.showToast('Install complete!', 'success'); 
		 this.panelWs?.send(JSON.stringify({type:'components'})); 
		 this.panelWs?.send(JSON.stringify({type:'status'})); 
             }
             else if (msg.type === 'install_error') { 
		 this.failInstallWorkflow(msg.error);
		 this.showToast('Install failed: ' + msg.error, 'error'); 
             }
	 }
	 
	 // Build dependency graph from components
	 buildDependencyGraph() {
             const graph = { dependents: {}, dependencies: {} };
             this.panelComponents.forEach(comp => {
		 const c = comp.component || comp;
		 const id = c.id;
		 graph.dependencies[id] = c.depends || [];
		 (c.depends || []).forEach(dep => {
                     if (!graph.dependents[dep]) graph.dependents[dep] = [];
                     if (!graph.dependents[dep].includes(id)) graph.dependents[dep].push(id);
		 });
             });
             return graph;
	 }
	 
	 // Get services that need to be stopped before updating a component
	 getServicesToStop(componentId) {
             const graph = this.buildDependencyGraph();
             const services = new Set();
             
             // Get all dependents (things that depend on this component)
             const dependents = graph.dependents[componentId] || [];
             dependents.forEach(depId => {
		 const comp = this.panelComponents.find(c => (c.component || c).id === depId);
		 if (comp && (comp.component || comp).service) {
                     services.add((comp.component || comp).service);
		 }
             });
             
             // Also check if this component itself has a service
             const thisComp = this.panelComponents.find(c => (c.component || c).id === componentId);
             if (thisComp && (thisComp.component || thisComp).service) {
		 services.add((thisComp.component || thisComp).service);
             }
             
             return Array.from(services);
	 }
	 
	 // Display order is the intended update order: shared runtime first,
	 // then the packages that depend on it. Unknown IDs fall to the end.
	 // Existing boxes may still have the old components.json order until
	 // reprovisioned, so this sort is the source of truth for the panel.
	 sortComponentsForDisplay(comps) {
             const order = ['dlsh', 'dserv', 'stim2', 'dserv-agent'];
             return [...comps].sort((a, b) => {
		 const idA = (a.component || a).id;
		 const idB = (b.component || b).id;
		 const iA = order.indexOf(idA);
		 const iB = order.indexOf(idB);
		 return (iA === -1 ? order.length : iA) - (iB === -1 ? order.length : iB);
             });
	 }

	 renderPanel() {
             const s = this.panelStatus || {};
             const d = s.dserv || {};
             const sys = s.system || {};
             const agent = s.agent || {};
             const comps = this.sortComponentsForDisplay(this.panelComponents || []);
             const services = s.services || {}; // Per-component service statuses
             
             this.el.panelContent.innerHTML = `
		 <div class="panel-section">
                     <div class="panel-section-title">System</div>
                     <div class="panel-info-grid">
			 <div class="panel-info-item"><div class="label">Hostname</div><div class="value">${sys.hostname||'—'}</div></div>
			 <div class="panel-info-item"><div class="label">Arch</div><div class="value">${sys.arch||'—'}</div></div>
			 <div class="panel-info-item"><div class="label">Uptime</div><div class="value">${sys.uptime||'—'}</div></div>
			 <div class="panel-info-item"><div class="label">Load</div><div class="value">${sys.loadAvg||'—'}</div></div>
			 <div class="panel-info-item"><div class="label">Profile</div><div class="value" id="profile-cell">${this.renderProfile(s.box)}</div></div>
			 ${this.renderDservRunning(d, comps)}
                     </div>
		 </div>
		 <div class="panel-section">
                     <div class="panel-section-title">
			 <span>Software</span>
			 <button class="component-btn" onclick="app.refreshComps()">Refresh</button>
                     </div>
                     <div class="update-order-note"><strong>Update order:</strong> when updates are available, apply them in this order: <strong>dlsh → dserv → stim</strong>.</div>
                     <div id="panel-comps">${comps.length ? comps.map(c => this.renderComp(c, services)).join('') : '<div style="color:#71767b">Loading...</div>'}</div>
		 </div>
		 <div class="panel-section">
                     <div class="panel-section-title">
			 <span>Time</span>
			 <button class="component-btn" onclick="app.loadTimeStatus()">Refresh</button>
                     </div>
                     <div id="panel-time">${this.renderTime(this.panelTime)}</div>
		 </div>
		 <div class="panel-section">
                     <div class="panel-section-title">
			 <span>Service Logs</span>
			 <button class="component-btn" onclick="app.loadLogs()">Refresh</button>
                     </div>
                     <div class="logs-header">
			 <input type="text" id="logs-search" placeholder="Search logs..." oninput="app.filterLogs(this.value)" style="flex:1;background:#1a2634;border:1px solid #2f3336;border-radius:4px;padding:6px 10px;color:#e7e9ea;font-size:12px;">
			 <span id="logs-match-count" style="font-size:11px;color:#71767b;margin-left:8px;"></span>
                     </div>
                     <div class="logs-container" id="panel-logs"><div style="color:#71767b">Click Refresh to load logs...</div></div>
		 </div>
		 <div class="panel-section">
                     <div class="panel-section-title">System Actions</div>
                     <div class="panel-btn-group">
			 <button class="panel-btn warning" onclick="app.reboot()">Reboot System</button>
			 <button class="panel-btn secondary" onclick="app.restartAgent()">Restart Agent</button>
			 <button class="panel-btn secondary" onclick="app.refreshPanel()">Refresh</button>
                     </div>
		 </div>
		 <div class="panel-section" style="opacity:0.7"><div class="panel-section-title">Agent</div><div style="font-size:12px;color:#71767b">v${agent.version||'?'} · ${agent.uptime||'—'}</div></div>
             `;
	 }
	 
	 // The Software section shows the version of the INSTALLED package. This
	 // is the version actually running, which the agent already collects. They
	 // diverge whenever a package lands without a service restart, and that is
	 // exactly the "did my update take effect?" case.
	 renderDservRunning(d, comps) {
             if (!d.version && !d.pid) return '';
             const norm = v => String(v||'').trim().replace(/^v/, '');
             const installed = comps.find(c => (c.component||c).id === 'dserv')?.currentVersion;
             const stale = installed && d.version && norm(installed) !== norm(d.version);
             const pid = d.pid ? ` <span style="color:#71767b">pid ${d.pid}</span>` : '';
             const warn = stale
			? `<div style="color:#fbbf24;font-size:11px;margin-top:4px">${this.esc(installed)} is installed — restart dserv to run it</div>`
			: '';
             return `<div class="panel-info-item" style="grid-column:1/-1">
                 <div class="label">dserv (running)</div>
                 <div class="value">${this.esc(d.version)||'—'}${pid}</div>${warn}
             </div>`;
	 }

	 // The declared identity from /etc/dserv-agent/box.conf, written by the
	 // bootstrap. Boxes provisioned before identities were recorded have no
	 // file and show "unrecorded" -- the nudge that a bootstrap re-run with
	 // the intended ?profile= both records one and converges the services
	 // (retiring what the profile excludes) to match.
	 renderProfile(box) {
             // Mid-retype the recorded profile still says the OLD class until
             // the bootstrap's step_record_identity lands; show the journey,
             // not the stale value. retypeWatch clears retypeTarget when the
             // new declaration arrives (or gives up and says so).
             if (this.retypeTarget && box?.profile !== this.retypeTarget) {
		 return `<span style="color:#fbbf24">retyping to ${this.esc(this.retypeTarget)}…</span>
                     <button class="component-btn" style="margin-left:8px" onclick="app.loadLogs('dserv-retype')">Log</button>`;
             }
             const retypeBtn = `<button class="component-btn" style="margin-left:8px" onclick="app.retypeOpen()">Retype…</button>`;
             // A failed retype outlives its toast: the box still reports the
             // OLD profile, which on its own reads as "nothing happened".
             if (this.retypeFailed) {
		 return `<span style="color:#f87171">retype to ${this.esc(this.retypeFailed)} failed</span>
                     <button class="component-btn" style="margin-left:8px" onclick="app.loadLogs('dserv-retype')">Log</button>${retypeBtn}`;
             }
             if (!box || !box.profile) {
		 return `<span style="color:#71767b" title="No /etc/dserv-agent/box.conf — this box was provisioned before identities were recorded. Retype (or re-run the bootstrap) to record one and converge services to it.">unrecorded</span>${retypeBtn}`;
             }
             // Role inline, not tooltip-only: "which machine is the grandmaster"
             // is exactly the question a panel gets opened to answer.
             const mode = box.stimMode === 'windowed' ? ' · windowed' : '';
             const role = box.role ? ` · <span style="color:#fbbf24">${this.esc(box.role)}</span>` : '';
             const title = ['Declared in /etc/dserv-agent/box.conf',
			    box.provisioned ? `provisioned ${box.provisioned}` : '']
		   .filter(Boolean).join(' · ');
             return `<span title="${this.esc(title)}">${this.esc(box.profile)}${mode}${role}</span>${retypeBtn}`;
	 }

	 retypeOpen() {
             this.panelWs?.send(JSON.stringify({type:'retype_profiles'}));
	 }

	 // Swap the Profile cell for a selector built from what the registry
	 // actually serves — the same list /setup/profiles prints, so the panel
	 // can never offer a profile the registry would not resolve.
	 retypeChoices(data) {
             const cell = document.getElementById('profile-cell');
             if (!cell) return;
             this.retypeRegistry = data.registry;
             const cur = this.panelStatus?.box?.profile || '';
             const opts = (data.profiles || []).map(p =>
		 `<option value="${this.esc(p.name)}" ${p.name === cur ? 'selected' : ''} title="${this.esc(p.description || '')}">${this.esc(p.name)}</option>`).join('');
             // The time role rides along because for some boxes it is the ONLY
             // channel: the panel reaches a box over a direct socket, so one
             // behind NAT at another site can be provisioned by URL and never
             // driven from here. Blank keeps whatever box.conf declares --
             // that is what a retype has always meant.
             cell.innerHTML = `<select id="retype-select" class="component-select">${opts}</select>
		 <input id="retype-timerole" class="component-select" style="width:170px"
			placeholder="time role (optional)"
			title="Blank keeps the current declaration. Otherwise: grandmaster IFACE · client IFACE · ntp-client SERVER · none to clear.">
		 <button class="component-btn update" onclick="app.retypeApply()">Apply</button>
		 <button class="component-btn" onclick="app.renderPanel()">Cancel</button>`;
	 }

	 retypeApply() {
             const p = document.getElementById('retype-select')?.value;
             if (!p) return;
             const tr = (document.getElementById('retype-timerole')?.value || '').trim();
             if (tr && !/^(none|(grandmaster|client|ntp-client) [A-Za-z0-9._:-]+)$/.test(tr)) {
		 this.showToast('Time role must be "grandmaster IFACE", "client IFACE", "ntp-client SERVER", or "none"', 'error');
		 return;
             }
             const trLine = tr
		   ? `\n• time role re-declared as "${tr}" and applied`
		   : '\n• the declared time role is kept as-is';
             if (!confirm(`Retype this box to profile "${p}"?\n\nThis re-runs the provisioner from ${this.retypeRegistry}:\n• services the profile excludes are disabled\n• missing components are installed, outdated ones updated${trLine}\n• the agent restarts (this panel reconnects on its own)\n\nLocal ESS scripts are kept (script sync is opt-in).`)) {
		 this.renderPanel();
		 return;
             }
             this.panelWs?.send(JSON.stringify({type:'retype', profile: p, timeRole: tr}));
	 }

	 retypeStarted(msg) {
             if (!msg.success) {
		 this.showToast('Retype: ' + (msg.error || 'failed to start'), 'error');
		 this.renderPanel();
		 return;
             }
             this.retypeTarget = msg.data.profile;
             this.retypeFailed = null; // a new attempt clears the last one's verdict
             this.showToast(`Retype to ${msg.data.profile} started`, 'success');
             this.renderPanel();
             this.retypeWatch(0);
	 }

	 // Poll until box.conf reports the new profile. The bootstrap restarts
	 // the agent near its end: the borrowed main socket reconnects on its
	 // own and only needs rebinding; a remote panel socket stays dead
	 // (onclose is deliberately inert), so reattach it here.
	 retypeWatch(n) {
             if (!this.retypeTarget) return;
             if (n > 80) { // ~4 min — the unit never failed outright, so it is stuck
		 this.showToast('Retype not recorded yet — check its log (dserv-retype)', 'error');
		 this.retypeFailed = this.retypeTarget;
		 this.retypeTarget = null;
		 this.renderPanel();
		 return;
             }
             setTimeout(() => {
		 if (!this.retypeTarget) return;
		 if (this.panelStatus?.box?.profile === this.retypeTarget) {
                     this.showToast(`Retyped to ${this.retypeTarget}`, 'success');
                     this.retypeTarget = null;
                     this.renderPanel();
                     this.panelWs?.send(JSON.stringify({type:'components'}));
                     return;
		 }
		 // A run that died in its first second used to be
		 // indistinguishable from a slow one until the give-up timer ran
		 // out. The agent now reports the unit, so say so at once and
		 // leave the Log button pointing at the reason.
		 const rt = this.panelStatus?.retype;
		 if (rt?.failed) {
                     const why = [rt.result, rt.code && `exit ${rt.code}`].filter(Boolean).join(', ');
                     this.showToast(`Retype to ${this.retypeTarget} failed${why ? ` (${why})` : ''} — see its log`, 'error');
                     this.retypeFailed = this.retypeTarget;
                     this.retypeTarget = null;
                     this.renderPanel();
                     return;
		 }
		 if (this.panelUsingMainWs) {
                     if (this.ws && this.connected) this.panelWs = this.ws;
		 } else if (this.panelNode && (!this.panelWs || this.panelWs.readyState > 1)) {
                     this.connectAgent(this.panelNode);
		 }
		 try { this.panelWs?.send(JSON.stringify({type:'status'})); } catch (e) {}
		 this.retypeWatch(n + 1);
             }, 3000);
	 }

	 // The Time section: reads computed by the agent from the unit-name
	 // contract, every action a verbatim run of dserv-ptp-setup -- the panel
	 // is a remote hand on the tool, never a second implementation of it.
	 renderTime(ts) {
             if (!ts) return '<div style="color:#71767b">Loading…</div>';
             const us = v => (v * 1e6).toFixed(0);
             let line;
             if (ts.role === 'grandmaster') {
		 line = `<span style="color:#34d399">PTP grandmaster</span> on ${this.esc(ts.iface||'?')}` +
                     (ts.ntpDaemon ? ` · wall clock via ${this.esc(ts.ntpDaemon)}` :
                      ' · <span style="color:#f87171">no NTP daemon steering the wall clock</span>');
             } else if (ts.role === 'client') {
		 line = `<span style="color:#34d399">PTP client</span> on ${this.esc(ts.iface||'?')}`;
             } else if (ts.role === 'ntp-client') {
		 line = `<span style="color:#34d399">chrony</span> → ${this.esc(ts.server||'?')}` +
                     (ts.tracking ? ` · offset ${us(ts.tracking.offset)} µs · rms ${us(ts.tracking.rms)} µs` : '');
             } else if (ts.freeRunning) {
		 line = '<span style="color:#f87171">free-running — nothing steers this clock ⚠</span>';
             } else {
		 line = `NTP (${this.esc(ts.ntpDaemon||'?')}) — no dserv time role`;
             }
             // The declared-vs-observed loop: box.conf's time_role against
             // what is actually running. Matching = quiet check; mismatch =
             // amber with the converge button; running-but-undeclared = the
             // nudge that records exist for a reason.
             let declaredLine = '';
             if (ts.declared) {
		 const sp = ts.declared.indexOf(' ');
		 const dr = sp > 0 ? ts.declared.slice(0, sp) : ts.declared;
		 const da = sp > 0 ? ts.declared.slice(sp + 1).trim() : '';
		 const applied = dr === ts.role && (da === ts.iface || da === ts.server);
		 declaredLine = applied
                     ? `<div style="font-size:11px;color:#71767b;margin-bottom:6px">declared: ${this.esc(ts.declared)} <span style="color:#34d399">✓</span></div>`
                     : `<div style="font-size:11px;color:#fbbf24;margin-bottom:6px">declared: ${this.esc(ts.declared)} — not what's running<button class="component-btn update" style="margin-left:8px" onclick="app.timeApplyDeclared()">Apply declared</button></div>`;
             } else if (ts.role !== 'none') {
		 declaredLine = '<div style="font-size:11px;color:#71767b;margin-bottom:6px">running role not declared in box.conf — panel changes record themselves; a retype with --time-role also records it</div>';
             }
             // Skip 'inactive': a retired role's disabled pair is correct
             // history, not an alarm, and red-inactive rows read as trouble.
             // failed/activating stay red -- those ARE trouble. Full status
             // keeps the complete picture.
             const units = Object.entries(ts.units || {}).filter(([, s]) => s !== 'inactive').map(([u, s]) =>
		 `<div style="font-family:'SF Mono',Monaco,monospace;font-size:11px;color:${s==='active'?'#8b98a5':'#f87171'}">${this.esc(u)} · ${this.esc(s)}</div>`).join('');
             const toolNote = ts.toolInstalled ? '' :
		 `<div style="font-size:11px;color:#71767b;margin-top:6px">time tooling not installed${ts.registry?` — Set role fetches it from ${this.esc(ts.registry)}`:''}</div>`;
             const hasRole = ts.role !== 'none';
             return `
		 <div style="font-size:13px;color:#e7e9ea;margin-bottom:8px">${line}</div>
		 ${declaredLine}
		 ${units}
		 <div style="display:flex;gap:8px;margin-top:10px">
                     <button class="component-btn" onclick="app.timeSetOpen()">Set role…</button>
                     ${hasRole ? '<button class="component-btn" onclick="app.timeDisable()">Disable</button>' : ''}
                     ${ts.toolInstalled ? '<button class="component-btn" onclick="app.timeFullStatus()">Full status</button>' : ''}
		 </div>
		 ${toolNote}`;
	 }

	 loadTimeStatus() { this.timeForm = false; this.panelWs?.send(JSON.stringify({type:'time_status'})); }

	 timeSetOpen() { this.panelWs?.send(JSON.stringify({type:'time_candidates'})); }

	 timeChoices(data) {
             const el = document.getElementById('panel-time');
             if (!el) return;
             this.timeForm = true;
             const ifs = (data.ifaces || []).map(i => `<option>${this.esc(i)}</option>`).join('');
             el.innerHTML = `
		 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                     <select id="time-role-sel" class="component-select" onchange="app.timeRoleSwap()">
			 <option value="client">client — follow the site grandmaster (PTP)</option>
			 <option value="ntp-client">ntp-client — follow a server over NTP</option>
			 <option value="grandmaster">grandmaster — define the site's time</option>
                     </select>
                     <select id="time-arg-iface" class="component-select">${ifs}</select>
                     <input id="time-arg-server" class="component-select" style="display:none;min-width:200px" placeholder="server address (e.g. 192.168.88.29)">
                     <button class="component-btn update" onclick="app.timeApply()">Apply</button>
                     <button class="component-btn" onclick="app.loadTimeStatus()">Cancel</button>
		 </div>
		 ${data.candidates ? `<pre style="font-size:11px;color:#8b98a5;margin-top:8px;white-space:pre-wrap">${this.esc(data.candidates)}</pre>` : ''}`;
	 }

	 timeRoleSwap() {
             const r = document.getElementById('time-role-sel')?.value;
             const iff = document.getElementById('time-arg-iface'), srv = document.getElementById('time-arg-server');
             if (iff && srv) { const ntp = (r === 'ntp-client'); iff.style.display = ntp ? 'none' : ''; srv.style.display = ntp ? '' : 'none'; }
	 }

	 timeApply() {
             const role = document.getElementById('time-role-sel')?.value;
             const arg = role === 'ntp-client'
		   ? document.getElementById('time-arg-server')?.value?.trim()
		   : document.getElementById('time-arg-iface')?.value;
             if (!role || !arg) { this.showToast('Pick a role and its ' + (role === 'ntp-client' ? 'server' : 'interface'), 'error'); return; }
             this.timeConfirmAndApply(role, arg);
	 }

	 // One confirm + send path for the form and for "Apply declared". The
	 // confirms echo the tool's own warnings; the tool still gets the final
	 // word at apply time (its refusals come back verbatim).
	 timeConfirmAndApply(role, arg) {
             const warn = role === 'grandmaster'
		   ? `Make this host the PTP GRANDMASTER on ${arg}?\n\nThis DEFINES the site's time. Exactly ONE host per site/segment runs this role — a second grandmaster joins the election and can re-base every box's timeline.`
		   : role === 'client'
		   ? `Make this host a PTP client on ${arg}?\n\nIt follows the site's grandmaster (found by BMCA, no address needed). Any NTP daemon steering the clock will be stopped.`
		   : `Follow ${arg} over NTP (chrony)?\n\nchrony is installed if missing (displacing systemd-timesyncd) and pinned to this server with prefer+trust. Expect tens of microseconds on a wired LAN.`;
             if (!confirm(warn)) return;
             this.panelWs?.send(JSON.stringify({type:'time_role', action:'apply', role, arg}));
	 }

	 timeApplyDeclared() {
             const d = this.panelTime?.declared || '';
             const sp = d.indexOf(' ');
             if (sp <= 0) { this.showToast('Declared time role has no argument', 'error'); return; }
             this.timeConfirmAndApply(d.slice(0, sp), d.slice(sp + 1).trim());
	 }

	 timeDisable() {
             if (!confirm('Stop and disable every dserv time role on this box?\n\nAn NTP daemon is revived afterwards so the clock is not left orphaned.')) return;
             this.panelWs?.send(JSON.stringify({type:'time_role', action:'disable'}));
	 }

	 timeFullStatus() { this.panelWs?.send(JSON.stringify({type:'time_role', action:'status'})); }

	 renderComp(comp, services = {}) {
             const c = comp.component || comp;
             const hasUpd = comp.updateAvailable;
             // A component that FOLLOWS another (the agent rides the deferred
             // migration dserv's postinst schedules) must not offer an Update
             // of its own while the leader's -- which will drag it along -- is
             // pending. The button returns when the leader is current and this
             // one still lags: that is the migration-failed case the button
             // repairs. A box without the leader installed (a display box's
             // agent) is unaffected and updates itself as before.
             const leaderStatus = c.followsComponent
		   ? (this.panelComponents || []).find(x => (x.component || x).id === c.followsComponent)
		   : null;
             // comp.migrating covers the window the leader-pending test cannot:
             // right after the leader's install completes, the leader reads
             // current while the follower still lags -- but the deferred
             // migration is armed (the agent checked its timer), so the button
             // must stay away rather than invite a click that races it.
             const migrating = !!comp.migrating;
             const followsPending = migrating || !!(hasUpd && leaderStatus && leaderStatus.installed && leaderStatus.updateAvailable);
             const leaderName = leaderStatus ? ((leaderStatus.component || leaderStatus).name || c.followsComponent) : (c.followsComponent || '');
             const inst = comp.installed;
             const hasService = !!c.service;
             const serviceStatus = services[c.service] || 'unknown';
             const deps = c.depends || [];
             const graph = this.buildDependencyGraph();
             const dependents = graph.dependents[c.id] || [];
             const isSharedDep = dependents.length > 0;
             
             let ver = !inst 
		     ? '<span style="color:#71767b">Not installed</span>' 
		     : hasUpd 
                     ? `${comp.currentVersion} → <span class="latest">${comp.latestVersion}</span>` 
                     : `${comp.currentVersion||'?'}${comp.latestVersion?' <span style="color:#34d399">✓</span>':''}`;
             
             const assets = comp.assets?.length 
			  ? `<select class="component-select" id="asset-${c.id}">${comp.assets.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>` 
																       : '';
             
             const btn = hasUpd ? 'Update' : inst ? 'Reinstall' : 'Install';
             
             // Dependency badges
             let depBadges = '';
             if (isSharedDep) {
		 depBadges += `<span class="dep-badge shared" title="Used by: ${dependents.join(', ')}">shared</span>`;
             }
             if (deps.length) {
		 depBadges += `<span class="dep-badge" title="Requires: ${deps.join(', ')}">→${deps.join(',')}</span>`;
             }
             // Optional add-ons: the box's own hardware probe turns the generic
             // badge into a nudge ("hardware detected") or a caution ("no
             // hardware detected") — the Install button works either way.
             if (c.optional) {
		 if (comp.hardwareDetected === true && !inst) {
		     depBadges += `<span class="dep-badge" style="background:#14351f;color:#34d399" title="This box's hardware matches this add-on">hardware detected</span>`;
		 } else if (comp.hardwareDetected === false && !inst) {
		     depBadges += `<span class="dep-badge" title="No matching sensor bound on this box. A physically attached camera can still show this when its overlay is missing — clone/Arducam modules may need dtoverlay=<sensor> (e.g. imx708) in /boot/firmware/config.txt and a reboot. Triage: rpicam-hello --list-cameras">no hardware detected</span>`;
		 } else {
		     depBadges += `<span class="dep-badge" title="Opt-in add-on; not part of any profile">optional</span>`;
		 }
             }
             
             // Service control row (only for components with services)
             let serviceHtml = '';
             if (hasService) {
		 const isActive = serviceStatus === 'active';
		 serviceHtml = `
                     <div class="component-service">
			 <div class="service-info">
                             <span class="service-label">Service</span>
                             <span class="service-badge ${serviceStatus}">
				 <span class="dot"></span>
				 ${serviceStatus}
                             </span>
			 </div>
			 <div class="service-controls">
                             <button class="svc-btn start" onclick="app.serviceCmd('${c.service}', 'start')" ${isActive?'disabled':''}>Start</button>
                             <button class="svc-btn stop" onclick="app.serviceCmd('${c.service}', 'stop')" ${!isActive?'disabled':''}>Stop</button>
                             <button class="svc-btn restart" onclick="app.serviceCmd('${c.service}', 'restart')">Restart</button>
			 </div>
                     </div>
		 `;
             }
             
             return `
            <div class="component-row" data-component-id="${c.id}">
                <div class="component-main">
                    <div class="component-info">
                        <div class="component-name">
                            ${c.name}
                            ${depBadges}
                        </div>
                        ${c.description ? `<div class="component-desc">${c.description}</div>` : ''}
                        <div class="component-version">${ver}</div>
                    </div>
                    <div class="component-actions">
                        ${followsPending
			  ? (migrating
			     ? `<span class="follows-note" style="color:#fbbf24" title="The deferred agent migration is scheduled and fires ~20s after the ${this.esc(leaderName)} install; the agent restarts and this panel reconnects on its own. Pressing Update now would race it for the dpkg lock.">updating with ${this.esc(leaderName)} now…</span>`
			     : `<span class="follows-note" title="A ${this.esc(leaderName)} install schedules the agent migration moments later; this package updates on its own. Update ${this.esc(leaderName)} and this follows.">updates with ${this.esc(leaderName)}</span>`)
			  : `${assets}
                        <button class="component-btn ${hasUpd?'update':''}" onclick="app.install('${c.id}')" ${!comp.assets?.length?'disabled':''}>${btn}</button>`}
                    </div>
                </div>
                ${serviceHtml}
                ${this.renderInstallWorkflow(c.id)}
            </div>
			`;
	 }
	 
	 renderInstallWorkflow(componentId) {
             if (!this.installWorkflow) return '';
             if (componentId && this.installWorkflow.componentId !== componentId) return '';
             
             const wf = this.installWorkflow;
             const stepsHtml = wf.steps.map((step, i) => {
		 let status = 'pending';
		 let icon = '○';
		 if (i < wf.currentStep) { status = 'done'; icon = '✓'; }
		 else if (i === wf.currentStep) { 
                     status = wf.error ? 'error' : 'active'; 
                     icon = wf.error ? '✗' : '◉'; 
		 }
		 return `<div class="workflow-step ${status}"><span class="step-icon">${icon}</span><span>${step}</span></div>`;
             }).join('');
             
             return `
            <div class="install-workflow">
                <div class="workflow-title">Installing ${wf.component}...</div>
                <div class="workflow-steps">${stepsHtml}</div>
            </div>
             `;
	 }
	 
	 // Service control for individual components
	 serviceCmd(service, action) {
             this.panelWs?.send(JSON.stringify({
		 type: 'service',
		 service: service,
		 action: action
             }));
             this.showToast(`${action}ing ${service}...`);
	 }

	 // Legacy dserv service control (for backward compatibility)
	 panelCmd(action) {
             this.panelWs?.send(JSON.stringify({type:'dserv',action}));
             this.showToast(`Sending ${action}...`);
	 }
	 
	 // svc overrides the default (dserv) unit — the retype flow uses this to
	 // pull journalctl -u dserv-retype into the same logs panel.
	 loadLogs(svc) { this.panelWs?.send(JSON.stringify(svc ? {type:'logs', action: svc} : {type:'logs'})); }
	 
	 togglePanelExpand() {
             const panel = this.el.agentPanel;
             const btn = document.getElementById('expand-btn');
             panel.classList.toggle('expanded');
             if (btn) btn.textContent = panel.classList.contains('expanded') ? '⤡' : '⤢';
	 }
	 
	 displayLogs(logs) {
             this.currentLogs = logs || '';
             const el = document.getElementById('panel-logs');
             if (el) {
		 el.textContent = this.currentLogs || 'No logs available';
		 el.scrollTop = el.scrollHeight;
             }
             const searchEl = document.getElementById('logs-search');
             if (searchEl) searchEl.value = '';
             const countEl = document.getElementById('logs-match-count');
             if (countEl) countEl.textContent = '';
	 }
	 
	 filterLogs(query) {
             const el = document.getElementById('panel-logs');
             const countEl = document.getElementById('logs-match-count');
             if (!el || !this.currentLogs) return;
             
             if (!query) {
		 el.textContent = this.currentLogs;
		 if (countEl) countEl.textContent = '';
		 return;
             }
             
             const lines = this.currentLogs.split('\n');
             const q = query.toLowerCase();
             const matches = lines.filter(l => l.toLowerCase().includes(q));
             
             el.textContent = matches.length ? matches.join('\n') : 'No matches found';
             if (countEl) countEl.textContent = `${matches.length} match${matches.length !== 1 ? 'es' : ''}`;
	 }
	 
	 reboot() {
             if (!confirm('Reboot this system?')) return;
             const h = this.panelNode?.isLocal ? 'localhost' : this.panelNode?.ip; 
             fetch(`http://${h}:${CONFIG.agentPort}/api/system/reboot`,{method:'POST'})
		 .then(()=>{this.showToast('Reboot scheduled','success');this.closePanel();})
		 .catch(()=>this.showToast('Reboot failed','error')); 
	 }
	 
	 restartAgent() { 
             if (!confirm('Restart dserv-agent? The panel will disconnect briefly.')) return; 
             this.panelWs?.send(JSON.stringify({type:'agent_restart'})); 
             this.showToast('Agent restarting...', 'success'); 
             setTimeout(() => this.closePanel(), 1000);
	 }
	 
	 refreshPanel() { 
             this.panelWs?.send(JSON.stringify({type:'status'})); 
             this.panelWs?.send(JSON.stringify({type:'components'})); 
	 }
	 
	 refreshComps() { this.panelWs?.send(JSON.stringify({type:'components'})); }
	 
	 install(id) { 
             const sel = document.getElementById('asset-'+id); 
             const a = sel?.value; 
             if (!a) { this.showToast('Select an asset','error'); return; }
             
             // Updating the agent is not like updating anything else: the agent
             // hands the install to systemd and is restarted BY it, so we must
             // not ask it to stop its own unit first (that would kill the
             // install) and must not promise a "Restart services" step we will
             // not be alive to report on.
             const isSelf = (id === 'dserv-agent');
             const servicesToStop = isSelf ? [] : this.getServicesToStop(id);
             const comp = this.panelComponents.find(c => (c.component || c).id === id);
             const compName = comp ? (comp.component || comp).name : id;

             let confirmMsg = `Install ${a}?`;
             if (isSelf) {
		 confirmMsg = `Install ${a}?\n\nThis updates the management agent itself. It will restart and this panel will reconnect on its own.`;
             } else if (servicesToStop.length > 0) {
		 confirmMsg = `Install ${a}?\n\nThis will temporarily stop: ${servicesToStop.join(', ')}`;
             }

             if (!confirm(confirmMsg)) return;

             // Initialize workflow UI
             const steps = [];
             if (servicesToStop.length > 0) {
		 steps.push(`Stop services (${servicesToStop.join(', ')})`);
             }
             steps.push('Download update');
             steps.push('Install package');
             if (isSelf) {
		 steps.push('Agent restarts — reconnecting');
             } else if (servicesToStop.length > 0) {
		 steps.push(`Restart services`);
             }
             
             this.installWorkflow = {
		 componentId: id,
		 component: compName,
		 steps: steps,
		 currentStep: 0,
		 error: null
             };
             this.renderPanel();
             
             // Send install request with dependency info
             this.panelWs?.send(JSON.stringify({
		 type: 'install',
		 component: id,
		 asset: a,
		 stopServices: servicesToStop
             }));
	 }
	 
	 updateInstallWorkflow(data) {
             if (!this.installWorkflow) return;
             
             const stageMap = {
		 'stopping': 0,
		 'downloading': this.installWorkflow.steps.findIndex(s => s.includes('Download')),
		 'installing': this.installWorkflow.steps.findIndex(s => s.includes('Install')),
		 // The agent has handed its own install to systemd and is about to
		 // be restarted by it. This is the last word we get -- the socket
		 // drops next -- so land on the final step rather than leaving the
		 // workflow parked on "Download update" while the panel reconnects.
		 'self-update': this.installWorkflow.steps.length - 1,
		 'starting': this.installWorkflow.steps.length - 1
             };
             
             if (data.stage && stageMap[data.stage] !== undefined) {
		 this.installWorkflow.currentStep = stageMap[data.stage];
             }
             
             this.renderPanel();
	 }
	 
	 completeInstallWorkflow() {
             if (this.installWorkflow) {
		 this.installWorkflow.currentStep = this.installWorkflow.steps.length;
             }
             setTimeout(() => {
		 this.installWorkflow = null;
		 this.renderPanel();
             }, 2000);
	 }
	 
	 failInstallWorkflow(error) {
             if (this.installWorkflow) {
		 this.installWorkflow.error = error;
             }
             setTimeout(() => {
		 this.installWorkflow = null;
		 this.renderPanel();
             }, 3000);
	 }
	 
	 showToast(msg, type='') {
             this.el.toast.textContent = msg; 
             this.el.toast.className = 'toast show ' + type; 
             clearTimeout(this.toastTimeout); 
             this.toastTimeout = setTimeout(() => this.el.toast.className = 'toast', 3000); 
	 }
	 
	 esc(t) { const d = document.createElement('div'); d.textContent = t||''; return d.innerHTML; }
     }

     let app;
     document.addEventListener('DOMContentLoaded', () => { app = new LabMeshApp(); });

     // Safari bfcache: page restored from cache won't re-fire DOMContentLoaded,
     // so the WebSocket stays connected to the previous host. Reinitialize.
     window.addEventListener('pageshow', (e) => {
         if (e.persisted) {
             if (app?.ws) { try { app.ws.close(); } catch(_) {} }
             app = new LabMeshApp();
         }
     });

     // Close app menu on outside click
     document.addEventListener('click', e => {
         const menu = document.getElementById('app-menu');
         if (menu && !menu.parentElement.contains(e.target)) {
             menu.classList.remove('open');
         }
     });
    </script>
</body>
</html>
