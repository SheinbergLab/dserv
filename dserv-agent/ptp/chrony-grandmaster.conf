# chrony tuning for the site PTP GRANDMASTER.
#
# This host's CLOCK_REALTIME is not private: dserv-phc2sys@ steers the eth0 PHC
# FROM it, and every extio box plus the rpi5 client follows that PHC. So the
# figure of merit here is NOT absolute accuracy -- it is SHORT-TERM STABILITY.
# A wrong-but-smooth clock costs nothing; a right-but-jumpy one is pushed into
# every box on the rig.
#
# WHY CHRONY REPLACED systemd-timesyncd (measured 2026-08-08, 120 samples of the
# GM's own phc2sys):
#
#   timesyncd, NTP over WiFi   sd 53,042 ns   |max| 374 us   freq span 483,766 ppb
#   no NTP, free-running       sd     77 ns   |max| 120 ns
#
# ~690x worse WITH network time than without it. timesyncd is a minimal SNTP
# client with no filtering, so ~15-30 ms of ordinary path variation became
# hundreds of ppm of frequency thrash. Merely pinning a better server (stratum 1
# instead of 2, 30 ms instead of 326 ms) did NOT help -- the server was never the
# mechanism. Restarting timesyncd alone put a 207 ms step through the fleet.
#
# NOTE on syntax: maxdelay / maxdelaydevratio / minpoll / maxpoll are PER-SOURCE
# options and belong on the server lines. As standalone directives chronyd exits
# with "Invalid directive" and the service fails to start.

# Stratum-1, lowest measured delay from this host (30.4 ms, spread 15.1 ms).
# Four of them so chrony's selection algorithm has a real majority to work with;
# outlier rejection needs more than two sources to mean anything. The Debian pool
# in the main chrony.conf is left in place as additional candidates.
#
# Per-source: minpoll 6 / maxpoll 10 averages over longer intervals (smoother
# beats responsive here), and maxdelay / maxdelaydevratio discard samples whose
# round trip is an outlier instead of feeding them to the servo -- that filtering
# is the whole reason for moving off timesyncd on a jittery WiFi path.
server time1.google.com iburst minpoll 6 maxpoll 10 maxdelay 0.3 maxdelaydevratio 2
server time2.google.com iburst minpoll 6 maxpoll 10 maxdelay 0.3 maxdelaydevratio 2
server time3.google.com iburst minpoll 6 maxpoll 10 maxdelay 0.3 maxdelaydevratio 2
server time4.google.com iburst minpoll 6 maxpoll 10 maxdelay 0.3 maxdelaydevratio 2

# STEP ONLY AT STARTUP. After the first few updates, corrections are always
# slewed. A step on a grandmaster is not a local event -- it propagates to every
# box in the same instant, which is exactly the 207 ms excursion timesyncd caused.
makestep 1.0 3

# Cap how fast a correction is applied. A steady slew is harmless to the fleet
# (everything follows the PHC, so relative sync is preserved); what hurt before
# was the per-poll thrash, not the rate. This bounds the worst case anyway.
maxslewrate 100

driftfile /var/lib/chrony/chrony.drift
rtcsync
