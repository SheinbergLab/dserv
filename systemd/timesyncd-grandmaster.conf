# This host is the site PTP GRANDMASTER, so its system clock is not just its own:
# dserv-phc2sys@ steers the eth0 PHC *from* CLOCK_REALTIME, and every extio box and
# the rpi5 client then follow that PHC. Whatever timesyncd does here reaches the
# whole rig.
#
# WHY THIS FILE EXISTS. Stock Debian sets no NTP= at all -- only a FallbackNTP=
# list -- and FallbackNTP is consulted precisely when NTP= is unset, so timesyncd
# walked down it to ntp.aliyun.com. Measured from this host 2026-08-08, six
# probes each:
#
#   time.google.com   stratum 1   delay  30.4 ms   spread  15.1 ms
#   us.pool.ntp.org   stratum 2   delay  94.9 ms   spread 267.1 ms
#   ntp.aliyun.com    stratum 2   delay 326.2 ms   spread 159.2 ms   <-- was in use
#
# A timesyncd step off that server put a 3.4 ms excursion through this host's own
# phc2sys and 3.96 ms through the Pi's ptp4l, and swung the NTP frequency estimate
# from +129 ppm to -40 ppm within minutes.
#
# NOTE the reachability constraint: the rig LAN (192.168.88.0/24) has no internet
# route and no local NTP server, so NTP only works over mlan0 (WiFi). Neither
# 192.168.88.1 nor 192.168.0.1 answers NTP, and no ntp/time*.brown.edu resolves.
#
# KNOWN LIMIT: systemd-timesyncd is a minimal SNTP client with no filtering or
# outlier rejection, which is why a jittery server produces steps rather than
# smooth slewing. Pinning a better server reduces the input jitter but does not
# fix that; chrony is the right daemon for a host that defines site time.
[Time]
NTP=time1.google.com time2.google.com time3.google.com time4.google.com
FallbackNTP=us.pool.ntp.org 0.debian.pool.ntp.org 1.debian.pool.ntp.org
