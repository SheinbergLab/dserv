# NetworkManager drop-in: install as
#
#   sudo cp wifi-powersave-off.conf /etc/NetworkManager/conf.d/
#   sudo systemctl reload NetworkManager    # applies to NEW associations
#   sudo iw dev wlan0 set power_save off    # applies to the CURRENT one now
#
# Why: Wi-Fi power save naps the radio between packets. On brcmfmac (every
# Pi's onboard Wi-Fi) that is a KNOWN cause of associations that go deaf or
# drop entirely after hours -- worst at low signal, which an in-cage machine
# behind metal is guaranteed to have. It also adds multi-ms wake bubbles to
# every ssh/browser round-trip on management links. Found ON by default on
# rpi500 (2026-08-02).
#
# This is NM-LEVEL config, which is the point: connection profiles on
# netplan-managed hosts are regenerated from netplan and a per-profile
# `nmcli modify` gets silently reverted; a conf.d default survives.
#
# [connection] keys here are DEFAULTS -- they apply to every profile that
# does not explicitly set the property itself.

[connection]
# 2 = disable (3 = enable, 1 = ignore, 0 = use driver default)
wifi.powersave = 2

# Never give up re-associating. NM's default is 4 retries and then it BLOCKS
# the profile until reboot/manual poke -- on a headless cage machine that
# converts one bad AP moment into "offline until someone walks over". 0 =
# retry forever.
connection.autoconnect-retries = 0

# If a cage machine still drops after the above, the next knob to try is MAC
# randomization during scans -- some driver/AP combinations handle it badly.
# Uncomment to pin scans to the hardware MAC:
# [device]
# wifi.scan-rand-mac-address = no
